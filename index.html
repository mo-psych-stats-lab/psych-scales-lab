سلوكية قابلة للقياس.<\/li><li><b>العلماء:<\/b> <b>كلارك وواطسون (1995)<\/b>؛ <b>هينكين (1995، 1998)<\/b>؛ <b>نيتماير وبيردن وشارما (2003)<\/b>. ويحذّر الأدب المنهجي من <b>مغالطة التشابه الاسمي<\/b> (اسم واحد لبناءين مختلفين) و<b>مغالطة جانجل<\/b> (اسمان لبناء واحد) — والتسميتان ترجعان إلى ثورندايك (1904) وكيلي (1927).<div class=\"en\" dir=\"ltr\">Clark &amp; Watson · Hinkin (1995, 1998) · Netemeyer, Bearden &amp; Sharma · Jingle · Jangle · Thorndike · Kelley<\/div><\/li><li><b>في بحث «الأداء التفاضلي لنوع الطالب على مقياس الاتزان الانفعالي»:<\/b> «الاتزان الانفعالي: سمة مزاجية يتميز صاحبها بالهدوء والتروي…» (مفاهيميًا)، و«الدرجة التي يحصل عليها الطالب على المقياس» (إجرائيًا) (ص 363، 367).<\/li><li><b>أخطاء شائعة:<\/b> التعريف الإجرائي الدائري («الدرجة على المقياس» وحدها دون تحديد المؤشرات)؛ خلط السمة بمفاهيم مجاورة.<\/li><\/ul><aside class=\"box opinion\"><div class=\"bt\">رأي الباحث<\/div><p>التعريف الإجرائي «هو الدرجة التي يحصل عليها الفرد على المقياس» — الشائع جدًا في الرسائل العربية، ومنها البحثان — صحيح شكليًا لكنه <b>ناقص<\/b>؛ والأقوى أن يُضاف إليه: «…على المقياس المكوّن من (ن) عبارة موزعة على الأبعاد (أ، ب، ج)، حيث تدل الدرجة المرتفعة على…». بهذا يصبح التعريف قابلًا للفحص.<\/p><\/aside><h4><b>الخطوة 3 — تحديد الأبعاد وجدول المواصفات<\/b><\/h4><p>Blueprint<\/p><ul><li><b>ما يُنجز:<\/b> تحديد أبعاد السمة ووزن كل بُعد وعدد العبارات المستهدف لكل بُعد.<\/li><li><b>العلماء:<\/b> <b>لوفينجر (1957)<\/b>؛ <b>ويلسون (2005)<\/b> — «خريطة البناء» التي ترتب مستويات السمة من الأدنى للأعلى؛ وفي كتاب «الاختبارات النفسية»: جدول المواصفات وتوزيع البنود «وفق الأهداف والمحتوى والأهمية النسبية» (ص 7–12).<div class=\"en\" dir=\"ltr\">Construct Map · Loevinger · Wilson<\/div><\/li><li><b>قاعدة متداولة:<\/b> يُولَّد في البداية عدد من العبارات يقارب <b>ضعف إلى أربعة أضعاف<\/b> العدد النهائي المستهدف، لأن جزءًا كبيرًا سيُحذف (ديفيليس؛ بواتينج وآخرون، 2018).<div class=\"en\" dir=\"ltr\">DeVellis · Boateng et al., 2018<\/div><\/li><li><b>أخطاء شائعة:<\/b> بُعد بعبارتين فقط (لا يكفي لتقدير بنية عاملية مستقرة؛ يُوصى عادة بثلاث عبارات على الأقل لكل عامل).<\/li><\/ul><h4><b>الخطوة 4 — توليد العبارات<\/b><\/h4><ul><li><b>ما يُنجز:<\/b> جمع مجمّع كبير (بنك المفردات) من مصدرين:<div class=\"en\" dir=\"ltr\">Item Pool<\/div><\/li><li><b>استنباطي:<\/b> من النظرية والتعريفات والمقاييس السابقة.<div class=\"en\" dir=\"ltr\">Deductive<\/div><\/li><li><b>استقرائي:<\/b> من مقابلات ومجموعات تركيز وأسئلة مفتوحة يجيب عنها أفراد من الفئة المستهدفة.<div class=\"en\" dir=\"ltr\">Inductive<\/div><\/li><li><b>العلماء:<\/b> <b>هينكين (1995)<\/b> فصّل المدخلين؛ <b>بواتينج وآخرون (2018)<\/b>؛ <b>مورجادو وآخرون (2017)<\/b> عدّوا إغفال المرحلة الكيفية في توليد البنود من «القيود العشرة» الشائعة في دراسات بناء المقاييس.<div class=\"en\" dir=\"ltr\">Hinkin · Boateng et al · Morgado et al<\/div><\/li><li><b>في بحث «الأداء التفاضلي لنوع الطالب على مقياس الاتزان الانفعالي»:<\/b> مدخل استنباطي فقط — مراجعة مقاييس كاتل وكومري وديرمن وآخرون والعوامل الخمس ومؤشر مايرز-بريجز للأنماط واستخبار الحالات الثمانية «دليلًا في بناء المفردات» (ص 376).<div class=\"en\" dir=\"ltr\">Cattell · Comrey · Dermen et al · MBTI<\/div><\/li><li><b>أخطاء شائعة:<\/b> مجمّع ضيق؛ نسخ عبارات مقاييس محمية دون إذن.<\/li><\/ul><h4><b>الخطوة 5 — اختيار صيغة الاستجابة وطريقة التصحيح<\/b><\/h4><ul><li><b>الطرائق التأسيسية:<\/b><\/li><\/ul><div class=\"tw\"><table><tr><th><div class=\"cp\"><b>الطريقة<\/b><\/div><\/th><th><div class=\"cp\"><b>صاحبها<\/b><\/div><\/th><th><div class=\"cp\"><b>الفكرة<\/b><\/div><\/th><\/tr><tr><td><div class=\"cp\">الفواصل المتساوية الظهور<\/div><\/td><td><div class=\"cp\"><b>ثرستون (1928)<\/b><\/div><div class=\"en\" dir=\"ltr\">Thurstone (1928)<\/div><\/td><td><div class=\"cp\">قضاة يحددون قيمة كل عبارة على متصل؛ يوافق المفحوص على ما يقبله<\/div><\/td><\/tr><tr><td><div class=\"cp\">التقديرات التجميعية<\/div><\/td><td><div class=\"cp\"><b>ليكرت (1932)<\/b><\/div><div class=\"en\" dir=\"ltr\">Likert (1932)<\/div><\/td><td><div class=\"cp\">تدريج موافقة لكل عبارة وجمع الدرجات<\/div><\/td><\/tr><tr><td><div class=\"cp\">المقياس التراكمي<\/div><\/td><td><div class=\"cp\"><b>جتمان (1944)<\/b><\/div><div class=\"en\" dir=\"ltr\">Guttman (1944)<\/div><\/td><td><div class=\"cp\">عبارات مرتبة؛ من يوافق على الأصعب يوافق على الأسهل<\/div><\/td><\/tr><tr><td><div class=\"cp\">التمايز الدلالي<\/div><\/td><td><div class=\"cp\"><b>أوسجود وسوسي وتاننباوم (1957)<\/b><\/div><div class=\"en\" dir=\"ltr\">Osgood, Suci &amp; Tannenbaum (1957)<\/div><\/td><td><div class=\"cp\">أزواج صفات متضادة على متصل<\/div><\/td><\/tr><tr><td><div class=\"cp\">الاختيار الإجباري<\/div><\/td><td><div class=\"cp\">(إدواردز وغيره)<\/div><div class=\"en\" dir=\"ltr\">Edwards<\/div><\/td><td><div class=\"cp\">الاختيار بين عبارتين متكافئتين في المرغوبية<\/div><\/td><\/tr><\/table><\/div><ul><li><b>عدد الفئات:<\/b> الشائع 5–7 فئات؛ وتدل دراسات مقارنة عدد الفئات على أن الثبات يتحسن حتى نحو 5–7 ثم يستقر.<div class=\"en\" dir=\"ltr\">Lozano, García-Cueto &amp; Muñiz, 2008<\/div><\/li><li><b>أخطاء شائعة:<\/b> معاملة بيانات رتبية كأنها فئوية دون تبرير؛ إغفال العبارات السالبة في التصحيح.<\/li><li><b>في البحثين:<\/b> ليكرت خماسي (لا تنطبق أبدًا ← دائمًا) في مقياس الاتزان؛ وتدريج سباعي يُصحَّح ثنائيًا (6–7 = 1، و1–5 = صفر) في قائمة باولهس المتوازنة للاستجابة المرغوبة اجتماعيًا (ص 411–412).<div class=\"en\" dir=\"ltr\">BIDR<\/div><\/li><\/ul><h4><b>الخطوة 6 — صياغة العبارات ومراجعتها<\/b><\/h4><ul><li><b>القواعد:<\/b> فكرة واحدة لكل عبارة، لغة بسيطة، تجنب النفي المزدوج، تجنب العبارات مزدوجة الموضوع، تجنب الإيحاء والمرغوبية الاجتماعية، ملاءمة لغوية للفئة.<div class=\"en\" dir=\"ltr\">Double-barreled<\/div><\/li><li><b>العلماء:<\/b> <b>ديفيليس<\/b>؛ <b>كلارك وواطسون (1995)<\/b>؛ <b>هينكين (1998)<\/b>؛ وفي كتاب «الاختبارات النفسية»: قواعد البساطة والطول والصياغة الموحية (ص 12–21) — انظر 2.4.<div class=\"en\" dir=\"ltr\">DeVellis · Clark &amp; Watson · Hinkin<\/div><\/li><li><b>في كتاب «الاختبارات النفسية» أيضًا:<\/b> الحساسية لألفاظ المذكر والمؤنث (ص 13–22) — وهو ما يتصل مباشرة بـ الأداء التفاضلي للمفردة للنوع.<div class=\"en\" dir=\"ltr\">DIF<\/div><\/li><\/ul><h4><b>الخطوة 7 — صدق المحتوى بتحكيم الخبراء (والصدق الظاهري)<\/b><\/h4><ul><li><b>ما يُنجز:<\/b> عرض العبارات على خبراء لتقدير صلتها بالبناء ووضوحها، وتكميم اتفاقهم.<\/li><\/ul><div class=\"tw\"><table><tr><th><div class=\"cp\"><b>المؤشر<\/b><\/div><\/th><th><div class=\"cp\"><b>صاحبه<\/b><\/div><\/th><th><div class=\"cp\"><b>الصيغة / القاعدة<\/b><\/div><\/th><\/tr><tr><td><div class=\"cp\"><b>نسبة صدق المحتوى<\/b><\/div><div class=\"en\" dir=\"ltr\">CVR<\/div><\/td><td><div class=\"cp\"><b>لوشي (1975)<\/b><\/div><div class=\"en\" dir=\"ltr\">Lawshe (1975)<\/div><\/td><td><div class=\"cp\">CVR = (Ne − N/2) ÷ (N/2)؛ Ne = عدد من قالوا «أساسية»، N = عدد المحكمين؛ وللقيمة الحرجة جدول يتغير بعدد المحكمين (أعاد حسابه آير وسكالي، 2014)<\/div><div class=\"en\" dir=\"ltr\">Ayre &amp; Scally, 2014<\/div><\/td><\/tr><tr><td><div class=\"cp\"><b>مؤشر صدق المحتوى<\/b><\/div><div class=\"en\" dir=\"ltr\">CVI<\/div><\/td><td><div class=\"cp\"><b>Lynn (1986)<\/b>؛ <b>Polit &amp; Beck (2006)<\/b>؛ <b>Polit, Beck &amp; Owen (2007)<\/b><\/div><\/td><td><div class=\"cp\">مؤشر صدق المحتوى للمفردة لكل عبارة (نسبة من قيّموها 3 أو 4 على مقياس رباعي)؛ والقاعدة المتداولة مؤشر صدق المحتوى للمفردة ≥ 0.78 مع 6 محكمين فأكثر، ومتوسط مؤشر صدق المحتوى للمقياس ≥ 0.90<\/div><div class=\"en\" dir=\"ltr\">I-CVI · S-CVI/Ave<\/div><\/td><\/tr><tr><td><div class=\"cp\"><b>معامل V<\/b><\/div><\/td><td><div class=\"cp\"><b>أيكن (1985)<\/b><\/div><div class=\"en\" dir=\"ltr\">Aiken (1985)<\/div><\/td><td><div class=\"cp\">معامل لاتفاق تقديرات المحكمين على تدريج متعدد الدرجات مع اختبار دلالته<\/div><\/td><\/tr><\/table><\/div><ul><li><b>في بحث «الأداء التفاضلي لنوع الطالب على مقياس الاتزان الانفعالي»:<\/b> 20 محكمًا من ست جامعات، وصيغة نسبة صدق المحتوى <b>معدّلة<\/b> تعطي «المتوسطة» نصف وزن: CVR = [Ne + Ni/2 − N/2] ÷ (N/2)، والقيمة الحرجة 0.42 عند 0.05، ومؤشر صدق المحتوى للمقياس = 0.839 (ص 376–378).<div class=\"en\" dir=\"ltr\">CVR · CVI<\/div><\/li><li><b>الصدق الظاهري:<\/b> ما يبدو للمفحوصين أن المقياس يقيسه؛ ليس دليل صدق كافيًا لكنه يؤثر في التعاون.<div class=\"en\" dir=\"ltr\">Face Validity<\/div><\/li><li><b>أخطاء شائعة:<\/b> الاكتفاء بنسبة اتفاق خام؛ عدد محكمين غير كافٍ؛ خلط الصدق الظاهري بصدق المحتوى.<\/li><\/ul><aside class=\"box critical\"><div class=\"bt\">ملاحظة نقدية<\/div><p>الصيغة المعدلة لـ نسبة صدق المحتوى في بحث الاتزان الانفعالي تختلف عن صيغة لوشي الأصلية (التي لا تحتسب تقدير «متوسطة»)، ولم يبرر البحث التعديل؛ كما أن متوسط قيم نسبة صدق المحتوى في الجدول (≈ 0.816 بحسب قراءة الجدول) لا يطابق مؤشر صدق المحتوى المعلن (0.839).<\/p><div class=\"en\" dir=\"ltr\">CVR · CVI<\/div><\/aside><h4><b>الخطوة 8 — المقابلات المعرفية والتجريب القبلي<\/b><\/h4><p>Pretesting<\/p><ul><li><b>ما يُنجز:<\/b> تطبيق العبارات على عدد صغير من الفئة المستهدفة مع طلب التفكير بصوت عالٍ (التفكير بصوت مرتفع) أو أسئلة استقصائية (الاستقصاء) لاكتشاف سوء الفهم.<div class=\"en\" dir=\"ltr\">Think-aloud · Probing<\/div><\/li><li><b>العلماء:<\/b> <b>ويليس (2005)<\/b> — المقابلة المعرفية؛ <b>تورانجو وريبس وراسينسكي (2000)<\/b> — نموذج مراحل الاستجابة الأربع: الفهم، الاسترجاع، الحكم، اختيار الاستجابة.<div class=\"en\" dir=\"ltr\">Willis · Cognitive Interviewing · Tourangeau, Rips &amp; Rasinski<\/div><\/li><li><b>في كتاب «الاختبارات النفسية»:<\/b> «لماذا لا يكفي التحكيم النظري للبنود؟ لأن الاستجابة الفعلية قد تكشف فهمًا مختلفًا عما يتوقعه الخبير».<\/li><li><b>أخطاء شائعة:<\/b> تخطي الخطوة؛ الاكتفاء بالمحكمين الأكاديميين.<\/li><\/ul><h4><b>الخطوة 9 — التطبيق الاستطلاعي وتحليل العبارات<\/b><\/h4><ul><li><b>ما يُنجز:<\/b> تطبيق على عينة استطلاعية ثم حساب: متوسط كل عبارة وانحرافها، ارتباط العبارة بالدرجة الكلية المصححة، تمييز المجموعتين الطرفيتين (27%)، ألفا عند حذف العبارة، وتحليل راش/نظرية الاستجابة للمفردة عند الحاجة (المطابقة مؤشرا المطابقة الداخلية/الخارجية، العتبات).<div class=\"en\" dir=\"ltr\">IRT · Infit/Outfit<\/div><\/li><li><b>قواعد متداولة:<\/b> ارتباط العبارة بالكلي المصحح ≥ 0.30 (نانلي وبيرنشتاين, 1994؛ فيلد)؛ في راش: متوسط مربعات المطابقة الداخلية/الخارجية بين نحو 0.5 و1.5 للقياس المنتج (ليناكر).<div class=\"en\" dir=\"ltr\">Linacre · Nunnally &amp; Bernstein, 1994 · Field · Infit/Outfit MNSQ<\/div><\/li><li><b>العلماء:<\/b> <b>كيلي (1939)<\/b> — اقتراح نسبة 27% للمجموعتين الطرفيتين؛ <b>نانلي وبيرنشتاين (1994)<\/b>؛ <b>راش (1960)<\/b>؛ <b>أندريتش (1978)<\/b> — نموذج سلم التقدير؛ <b>رايت وماسترز (1982)<\/b>؛ <b>إمبرتسون وريس (2000)<\/b>.<div class=\"en\" dir=\"ltr\">Kelley · Nunnally &amp; Bernstein · Rasch · Andrich · Wright &amp; Masters · Embretson &amp; Reise<\/div><\/li><li><b>في كتاب «الاختبارات النفسية»:<\/b> معامل التمييز (ع − د)/ن ومثال الـ100 فرد (ص 23–26) — انظر 2.5.<\/li><li><b>أخطاء شائعة:<\/b> حذف العبارات بناءً على ألفا وحدها مع إهمال المحتوى؛ تحسين المؤشرات على حساب شمول المجال (وهو تحذير الكتاب نفسه).<\/li><\/ul><h4><b>الخطوة 10 — البنية العاملية (الصدق البنائي)<\/b><\/h4><ul><li><b>التحليل العاملي الاستكشافي:<\/b><div class=\"en\" dir=\"ltr\">EFA<\/div><\/li><li>ملاءمة البيانات: <b>مؤشر كايزر–ماير–أولكن<\/b> (كايزر, 1974) ≥ 0.60 (ويصفه كايزر بـ«رائع» عند ≥ 0.90)، واختبار <b>بارتلت<\/b> للكروية دال.<div class=\"en\" dir=\"ltr\">Kaiser, 1974 · KMO · Bartlett<\/div><\/li><li>عدد العوامل: محك <b>الجذر الكامن &gt; 1<\/b> (كايزر, 1960) — لا يُعتمد وحده؛ <b>منحنى المنحدر<\/b> (كاتل, 1966)؛ <b>التحليل الموازي<\/b> (هورن, 1965) وهو الأدق.<div class=\"en\" dir=\"ltr\">Kaiser, 1960 · Cattell, 1966 · Horn, 1965<\/div><\/li><li>التشبع المقبول: ≥ 0.30 أو 0.40؛ تجنب التشبعات المتقاطعة.<\/li><li>دليل الممارسة: <b>كوستيلو وأوزبورن (2005)<\/b>.<div class=\"en\" dir=\"ltr\">Costello &amp; Osborne<\/div><\/li><li><b>التحليل العاملي التوكيدي:<\/b> مؤشرات المطابقة ومحكاتها المتداولة عند <b>هو وبنتلر (1999)<\/b>: مؤشر المطابقة المقارن ومؤشر تاكر–لويس ≥ 0.95 (وتقبل 0.90 في ممارسات كثيرة)، جذر متوسط مربع خطأ الاقتراب ≤ 0.06 (وحتى 0.08 مقبول)، جذر متوسط مربعات البواقي المعياري ≤ 0.08؛ مع تحذير مؤلفيها أنفسهم وغيرهم من تطبيقها آليًا.<div class=\"en\" dir=\"ltr\">CFA · Hu &amp; Bentler · CFI · TLI · RMSEA · SRMR<\/div><\/li><li><b>الصدق التقاربي والتمييزي:<\/b> <b>كامبل وفيسك (1959)<\/b> — مصفوفة السمات المتعددة والطرق المتعددة (مصفوفة السمات المتعددة-الطرق المتعددة)؛ وحديثًا <b>فورنل ولاركر (1981)<\/b> (متوسط التباين المستخلص) و<b>نسبة السمات المتغايرة-الأحادية<\/b>.<div class=\"en\" dir=\"ltr\">MTMM · Campbell &amp; Fiske · Fornell &amp; Larcker · AVE · HTMT<\/div><\/li><li><b>صدق المجموعات المتضادة والصدق المحكي:<\/b> مقارنة مجموعات معروفة الاختلاف؛ ارتباط بمحك خارجي.<\/li><li><b>في البحثين:<\/b> التحليل العاملي الاستكشافي بالمكونات الأساسية وتدوير فاريماكس؛ مؤشر كايزر–ماير–أولكن = 0.934؛ جذر أول 6.705 (35.29%) وثانٍ 1.322، ونسبتهما 5.07 &gt; 2 دليل أحادية البعد؛ تشبعات 0.310–0.744 (ص 380–382). وفي القائمة المتوازنة للاستجابة المرغوبة اجتماعيًا: التحليل العاملي التوكيدي بـ برنامج أموس 23 وحذف 11 عبارة؛ جذر متوسط مربع خطأ الاقتراب = 0.021، مؤشر المطابقة المقارن = 0.688، مؤشر تاكر–لويس = 0.659، النسبة كا²/درجات الحرية = 1.776 (ص 413–414).<div class=\"en\" dir=\"ltr\">EFA · KMO · BIDR: CFA · Amos 23 · RMSEA · CFI · TLI · CMIN/DF<\/div><\/li><li><b>أخطاء شائعة:<\/b> إجراء التحليل العاملي الاستكشافي والتحليل العاملي التوكيدي على العينة نفسها؛ الاعتماد على محك كايزر وحده؛ استخدام المكونات الأساسية (تحليل المكونات الرئيسة) على أنها تحليل عاملي؛ قبول مؤشر المطابقة المقارن منخفض لأن «قيمه تنحصر بين 0 و1».<div class=\"en\" dir=\"ltr\">PCA · EFA · CFA · CFI<\/div><\/li><\/ul><aside class=\"box critical\"><div class=\"bt\">ملاحظة نقدية: ملاحظة نقدية على التحليل العاملي التوكيدي في بحث المرغوبية<\/div><div class=\"en\" dir=\"ltr\">CFA<\/div><p>قيم مؤشر المطابقة المقارن = 0.688 ومؤشر تاكر–لويس = 0.659 أدنى بكثير من المحكات المتداولة (≥ 0.90/0.95)، والقول بأن المقبول «بين 0 و1» وصف لمدى المؤشر لا لمحك قبوله. وانخفاض جذر متوسط مربع خطأ الاقتراب مع انخفاض مؤشر المطابقة المقارن يحدث عادة حين تكون الارتباطات بين العبارات ضعيفة (نموذج المقارنة الصفري نفسه قريب من المطابقة).<\/p><div class=\"en\" dir=\"ltr\">CFI · TLI · RMSEA<\/div><\/aside><h4><b>الخطوة 11 — الثبات والعدالة<\/b><\/h4><div class=\"tw\"><table><tr><th><div class=\"cp\"><b>نوع الثبات<\/b><\/div><\/th><th><div class=\"cp\"><b>صاحبه<\/b><\/div><\/th><th><div class=\"cp\"><b>ملاحظات<\/b><\/div><\/th><\/tr><tr><td><div class=\"cp\">ألفا كرونباخ (الاتساق الداخلي)<\/div><\/td><td><div class=\"cp\"><b>كرونباخ (1951)<\/b><\/div><div class=\"en\" dir=\"ltr\">Cronbach (1951)<\/div><\/td><td><div class=\"cp\">الشائع ≥ 0.70 للبحث (يُنسب إلى نانلي)، وأعلى (≥ 0.90) للقرارات الفردية؛ ألفا ليست دليلًا على أحادية البعد، وارتفاعها الشديد قد يعني تكرار العبارات<\/div><div class=\"en\" dir=\"ltr\">Nunnally<\/div><\/td><\/tr><tr><td><div class=\"cp\">أوميغا ماكدونالد<\/div><\/td><td><div class=\"cp\"><b>ماكدونالد (1999)<\/b>؛ ودعوات <b>ماكنيش (2018)<\/b> و<b>فلورا (2020)<\/b><\/div><div class=\"en\" dir=\"ltr\">McDonald · McNeish · Flora<\/div><\/td><td><div class=\"cp\">أدق من ألفا عند عدم تساوي التشبعات<\/div><\/td><\/tr><tr><td><div class=\"cp\">كودر–ريتشاردسون 20 و21<\/div><\/td><td><div class=\"cp\"><b>كيودر وريتشاردسون (1937)<\/b><\/div><div class=\"en\" dir=\"ltr\">Kuder &amp; Richardson (1937)<\/div><\/td><td><div class=\"cp\">للعبارات الثنائية<\/div><\/td><\/tr><tr><td><div class=\"cp\">التجزئة النصفية + تصحيح سبيرمان–براون<\/div><\/td><td><div class=\"cp\"><b>سبيرمان (1910)؛ براون (1910)<\/b><\/div><div class=\"en\" dir=\"ltr\">Spearman · Brown<\/div><\/td><td><div class=\"cp\">—<\/div><\/td><\/tr><tr><td><div class=\"cp\">إعادة التطبيق (الاستقرار)<\/div><\/td><td><div class=\"cp\">—<\/div><\/td><td><div class=\"cp\">فاصل زمني مناسب (أسبوعان تقريبًا شائع)<\/div><\/td><\/tr><tr><td><div class=\"cp\">اتفاق المقدّرين<\/div><\/td><td><div class=\"cp\"><b>كوهين (1960)<\/b> كابا؛ <b>شروت وفليس (1979)<\/b> معامل الارتباط داخل الفئة؛ إرشادات <b>كو ولي (2016)<\/b><\/div><div class=\"en\" dir=\"ltr\">Cohen · Shrout &amp; Fleiss · ICC · Koo &amp; Li<\/div><\/td><td><div class=\"cp\">لمقاييس التقدير والملاحظة<\/div><\/td><\/tr><tr><td><div class=\"cp\">ثبات الأفراد والمفردات ومعامل الفصل<\/div><\/td><td><div class=\"cp\"><b>رايت وماسترز (1982)<\/b><\/div><div class=\"en\" dir=\"ltr\">Wright &amp; Masters (1982)<\/div><\/td><td><div class=\"cp\">في نموذج راش؛ معامل فصل &gt; 2 كافٍ<\/div><\/td><\/tr><\/table><\/div><ul><li><b>العدالة:<\/b> فحص <b>الأداء التفاضلي للمفردة<\/b> بطريقة مانتل–هانزل (<b>مانتل وهانزل, 1959؛ هولاند وثاير, 1988<\/b>)، أو الانحدار اللوجستي (<b>سواميناثان وروجرز, 1990؛ زومبو, 1999<\/b>)، أو طرق نظرية الاستجابة للمفردة (<b>لورد, 1980؛ راجو, 1988<\/b>)؛ وفحص <b>التكافؤ القياسي <\/b> بمستوياته: الشكلي، المتري، القياسي، الصارم (<b>ميريديث, 1993<\/b>؛ محك Δفرق مؤشر المطابقة المقارن ≤ 0.01 عند <b>تشيونج ورينسفولد, 2002<\/b>؛ مراجعة <b>بوتنيك وبورنشتاين, 2016<\/b>).<div class=\"en\" dir=\"ltr\">DIF · Measurement Invariance · Mantel &amp; Haenszel, 1959 · Holland &amp; Thayer, 1988 · Swaminathan &amp; Rogers, 1990 · Zumbo, 1999 · IRT · Lord, 1980 · Raju, 1988 · Meredith, 1993 · CFI · Cheung &amp; Rensvold, 2002 · Putnick &amp; Bornstein, 2016<\/div><\/li><li><b>في البحثين:<\/b> ثبات الأفراد 0.89 (فصل 2.91)، المفردات 0.98 (فصل 7.07)؛ الأداء التفاضلي للمفردة في 3 من 19 عبارة (ص 379، 386). وفي القائمة المتوازنة للاستجابة المرغوبة اجتماعيًا: α = 0.76 للكلي، 0.61 وَ0.69 للبعدين؛ وفي مقياس الذكاء العاطفي α = 0.86 والأبعاد 0.53–0.71 (ص 415، 417).<div class=\"en\" dir=\"ltr\">DIF · BIDR: α<\/div><\/li><\/ul><h4><b>الخطوة 12 — التقنين والمعايير ونقاط القطع والدليل والتحقق المستمر<\/b><\/h4><ul><li><b>حجم العينة:<\/b> قواعد متفاوتة: 5–10 أفراد لكل عبارة، أو 200–300 فأكثر للتحليل العاملي (كومري ولي؛ كوستيلو وأوسبورن)، مع أن الحجم المطلوب يتوقف فعليًا على قوة التشبعات وعدد العبارات لكل عامل.<div class=\"en\" dir=\"ltr\">Comrey &amp; Lee · Costello &amp; Osborne<\/div><\/li><li><b>المعايير:<\/b> درجات زائية وتائية ورتب مئينية؛ معايير منفصلة للمجموعات الفرعية عند الحاجة (انظر 2.2–2.3).<\/li><li><b>نقاط القطع:<\/b> منحنى خصائص التشغيل ومجموعات متضادة أو حدّية بمحك مستقل (انظر 2.11).<div class=\"en\" dir=\"ltr\">ROC<\/div><\/li><li><b>الترجمة والتكييف (إن كان المقياس مترجمًا):<\/b> الترجمة العكسية (<b>بريزلين, 1970<\/b>)؛ خطوات التكييف الست (<b>بيتون وآخرون، 2000<\/b>: ترجمة أمامية، توليف، ترجمة عكسية، لجنة خبراء، تجريب الصورة، توثيق)؛ <b>إرشادات الهيئة الدولية للاختبارات اللجنة الدولية للاختبارات (2017/2018)<\/b>.<div class=\"en\" dir=\"ltr\">Brislin, 1970 · Beaton et al., 2000 · ITC (2017/2018)<\/div><\/li><li><b>الإطار الشامل للصدق:<\/b> <b>ميسيك (1995)<\/b> — الصدق مفهوم موحد بستة جوانب: المحتوى، الجوهري (العمليات)، البنائي (البنية)، التعميم، الخارجي، العواقب؛ و<b>كين (2013)<\/b> — الصدق حجة تُبنى على تفسير الدرجة واستخدامها؛ و<b>الجمعية الأمريكية للبحث التربوي/الجمعية الأمريكية لعلم النفس/المجلس القومي للقياس في التربية (2014)<\/b> — مصادر أدلة الصدق الخمسة: المحتوى، عمليات الاستجابة، البنية الداخلية، العلاقات بمتغيرات أخرى، عواقب الاختبار.<div class=\"en\" dir=\"ltr\">Argument-based validity · Messick · Kane · AERA/APA/NCME<\/div><\/li><li><b>دليل المقياس:<\/b> انظر 2.6.<\/li><\/ul>"}, {"title": "3.3 الأطر المنهجية المنشورة ومقارنتها", "en": "", "html": "<div class=\"tw\"><table><tr><th><div class=\"cp\"><b>الإطار<\/b><\/div><\/th><th><div class=\"cp\"><b>البنية<\/b><\/div><\/th><th><div class=\"cp\"><b>ما يميزه<\/b><\/div><\/th><\/tr><tr><td><div class=\"cp\"><b>ديفيليس (1991 ثم طبعات حتى 2021)<\/b><\/div><div class=\"en\" dir=\"ltr\">DeVellis (1991)<\/div><\/td><td><div class=\"cp\">ثماني خطوات: تحديد ما تريد قياسه، توليد مجمّع العبارات، تحديد صيغة القياس، مراجعة الخبراء، إدراج عبارات صدق (مثل مقياس مرغوبية)، تطبيق على عينة تطوير، تقويم العبارات، تحديد الطول الأمثل<\/div><\/td><td><div class=\"cp\">الأكثر استخدامًا في التدريس؛ ينص على إدراج مقياس للمرغوبية الاجتماعية ضمن الخطوات<\/div><\/td><\/tr><tr><td><div class=\"cp\"><b>كلارك وواطسون (1995، 2019)<\/b><\/div><div class=\"en\" dir=\"ltr\">Clark &amp; Watson (1995, 2019)<\/div><\/td><td><div class=\"cp\">تصور البناء ومراجعة الأدبيات → بناء مجمّع واسع → اختيار العبارات بالتحليل العاملي والعلاقات الخارجية → التحقق الخارجي<\/div><\/td><td><div class=\"cp\">التركيز على «صدق البناء» منذ البداية؛ التحذير من الاعتماد على ألفا<\/div><\/td><\/tr><tr><td><div class=\"cp\"><b>هينكين (1995، 1998)<\/b><\/div><div class=\"en\" dir=\"ltr\">Hinkin (1995, 1998)<\/div><\/td><td><div class=\"cp\">توليد العبارات → إدارة المسح → الاختزال الأولي → التحليل العاملي التوكيدي → الصدق التقاربي/التمييزي → الإعادة<\/div><div class=\"en\" dir=\"ltr\">CFA<\/div><\/td><td><div class=\"cp\">موجّه لأبحاث التنظيمات والمسوح<\/div><\/td><\/tr><tr><td><div class=\"cp\"><b>بواتينج وآخرون (2018)<\/b><\/div><div class=\"en\" dir=\"ltr\">Boateng et al. (2018)<\/div><\/td><td><div class=\"cp\">3 مراحل و9 خطوات: تحديد المجال وتوليد العبارات؛ صدق المحتوى؛ التجريب؛ إدارة المسح وحجم العينة؛ اختزال العبارات؛ استخراج العوامل؛ اختبار الأبعاد؛ الثبات؛ الصدق<\/div><\/td><td><div class=\"cp\">الدليل الحديث الأشمل والأكثر استشهادًا<\/div><\/td><\/tr><tr><td><div class=\"cp\"><b>ورثينجتون وويتاكر (2006)<\/b><\/div><div class=\"en\" dir=\"ltr\">Worthington &amp; Whittaker (2006)<\/div><\/td><td><div class=\"cp\">تحليل محتوى لدراسات تطوير المقاييس في الإرشاد مع توصيات التحليل العاملي الاستكشافي/التحليل العاملي التوكيدي<\/div><div class=\"en\" dir=\"ltr\">EFA/CFA<\/div><\/td><td><div class=\"cp\">يحدد أخطاء التحليل العاملي الشائعة<\/div><\/td><\/tr><tr><td><div class=\"cp\"><b>مورجادو وآخرون (2017)<\/b><\/div><div class=\"en\" dir=\"ltr\">Morgado et al. (2017)<\/div><\/td><td><div class=\"cp\">عشرة قيود شائعة في دراسات بناء المقاييس وتوصيات لتجاوزها<\/div><\/td><td><div class=\"cp\">يصلح «قائمة فحص نقدية» للباحث<\/div><\/td><\/tr><tr><td><div class=\"cp\"><b>ويلسون (2005)<\/b><\/div><div class=\"en\" dir=\"ltr\">Wilson (2005)<\/div><\/td><td><div class=\"cp\">أربع لبنات: خريطة البناء، تصميم العبارات، فضاء النتائج، نموذج القياس (راش)<\/div><\/td><td><div class=\"cp\">الربط بين البناء النظري ونموذج نظرية الاستجابة للمفردة<\/div><div class=\"en\" dir=\"ltr\">IRT<\/div><\/td><\/tr><tr><td><div class=\"cp\"><b>الجمعية الأمريكية للبحث التربوي/الجمعية الأمريكية لعلم النفس/المجلس القومي للقياس في التربية (2014)<\/b><\/div><div class=\"en\" dir=\"ltr\">AERA/APA/NCME (2014)<\/div><\/td><td><div class=\"cp\">معايير وليست خطوات: مصادر أدلة الصدق الخمسة، الثبات، العدالة<\/div><\/td><td><div class=\"cp\">المرجعية المهنية العليا<\/div><\/td><\/tr><tr><td><div class=\"cp\"><b>الكتاب (ص 4–12)<\/b><\/div><\/td><td><div class=\"cp\">ثماني خطوات (انظر 2.2)<\/div><\/td><td><div class=\"cp\">يجمع التخطيط والمحك والعينة والتحليل والتقنين والدليل<\/div><\/td><\/tr><\/table><\/div>"}, {"title": "3.4 تحويل خطوات «إعداد الاختبار» إلى خطوات «إعداد المقياس»", "en": "", "html": "<div class=\"tw\"><table><tr><th><div class=\"cp\"><b>#<\/b><\/div><\/th><th><div class=\"cp\"><b>في إعداد الاختبار (الكتاب)<\/b><\/div><\/th><th><div class=\"cp\"><b>في إعداد المقياس النفسي<\/b><\/div><\/th><th><div class=\"cp\"><b>ما يتغير جوهريًا<\/b><\/div><\/th><\/tr><tr><td><div class=\"cp\">1<\/div><\/td><td><div class=\"cp\">تحديد الغرض والمحتوى التحصيلي<\/div><\/td><td><div class=\"cp\">تحديد السمة الكامنة ونموذجها النظري<\/div><\/td><td><div class=\"cp\">من «محتوى يُتقن» إلى «سمة توجد بدرجات»<\/div><\/td><\/tr><tr><td><div class=\"cp\">2<\/div><\/td><td><div class=\"cp\">تحليل المحتوى والأهداف السلوكية<\/div><\/td><td><div class=\"cp\">تحليل السمة إلى أبعاد ومؤشرات سلوكية<\/div><\/td><td><div class=\"cp\">الهدف السلوكي (سلوك + محتوى + شرط + مستوى) يتحول إلى مؤشر سلوكي للسمة<\/div><\/td><\/tr><tr><td><div class=\"cp\">3<\/div><\/td><td><div class=\"cp\">جدول مواصفات (محتوى × مستوى معرفي)<\/div><\/td><td><div class=\"cp\">جدول مواصفات (أبعاد × عدد عبارات × اتجاه موجب/سالب)<\/div><\/td><td><div class=\"cp\">يضاف بُعد «اتجاه العبارة» لضبط الموافقة المنهجية<\/div><\/td><\/tr><tr><td><div class=\"cp\">4<\/div><\/td><td><div class=\"cp\">كتابة أسئلة لها إجابة صحيحة<\/div><\/td><td><div class=\"cp\">كتابة عبارات تقريرية بلا صواب أو خطأ<\/div><\/td><td><div class=\"cp\">يختفي مفتاح الإجابة ويحل محله مفتاح الاتجاه<\/div><\/td><\/tr><tr><td><div class=\"cp\">5<\/div><\/td><td><div class=\"cp\">بدائل/مشتتات<\/div><\/td><td><div class=\"cp\">تدريج استجابة (ليكرت…)<\/div><\/td><td><div class=\"cp\">تحليل المشتتات يصير تحليل فئات الاستجابة<\/div><\/td><\/tr><tr><td><div class=\"cp\">6<\/div><\/td><td><div class=\"cp\">تحكيم<\/div><\/td><td><div class=\"cp\">تحكيم + فحص مرغوبية العبارات<\/div><\/td><td><div class=\"cp\">خطر المرغوبية الاجتماعية أكبر<\/div><\/td><\/tr><tr><td><div class=\"cp\">7<\/div><\/td><td><div class=\"cp\">تجريب وحساب الصعوبة والتمييز<\/div><\/td><td><div class=\"cp\">تجريب وحساب المتوسط والتشتت والارتباط بالكلي والتشبع<\/div><\/td><td><div class=\"cp\">الصعوبة تصير متوسط/معلم تأييد<\/div><\/td><\/tr><tr><td><div class=\"cp\">8<\/div><\/td><td><div class=\"cp\">تصحيح أثر التخمين<\/div><\/td><td><div class=\"cp\">كشف الإهمال والموافقة والمرغوبية<\/div><\/td><td><div class=\"cp\">لا معادلة تخمين<\/div><\/td><\/tr><tr><td><div class=\"cp\">9<\/div><\/td><td><div class=\"cp\">الصدق (محتوى/محك) والثبات<\/div><\/td><td><div class=\"cp\">الصدق البنائي العاملي أساسًا + التقاربي/التمييزي + الثبات<\/div><\/td><td><div class=\"cp\">التحليل العاملي هو قلب الصدق في المقاييس<\/div><\/td><\/tr><tr><td><div class=\"cp\">10<\/div><\/td><td><div class=\"cp\">معايير أو درجة قطع للإتقان<\/div><\/td><td><div class=\"cp\">معايير (مئينيات/تائية) ونقاط قطع تصنيفية بمحك مستقل<\/div><\/td><td><div class=\"cp\">«الإتقان» يصير «مستوى السمة»<\/div><\/td><\/tr><tr><td><div class=\"cp\">11<\/div><\/td><td><div class=\"cp\">دليل الاختبار<\/div><\/td><td><div class=\"cp\">دليل المقياس<\/div><\/td><td><div class=\"cp\">يضاف فيه وصف العبارات السالبة وضوابط التطبيق المحايد<\/div><\/td><\/tr><tr><td><div class=\"cp\">12<\/div><\/td><td><div class=\"cp\">فن إعطاء الاختبار<\/div><\/td><td><div class=\"cp\">تطبيق المقياس في ظروف تقلل المرغوبية (سرية، تعليمات محايدة)<\/div><\/td><td><div class=\"cp\">أثر الفاحص يتحول إلى أثر «الموقف التقويمي»<\/div><\/td><\/tr><\/table><\/div><aside class=\"box opinion\"><div class=\"bt\">رأي الباحث: رأيي كباحث في خطوات الإعداد<\/div><p>أرى أن الخطوات الثلاث الأكثر إهمالًا في الدراسات العربية لبناء المقاييس — ومنها البحثان المرفقان — هي: (1) <b>المرحلة الكيفية في توليد العبارات<\/b> (مقابلات مع الفئة نفسها) بدل الاكتفاء بمقاييس أجنبية مصدرًا للعبارات؛ (2) <b>المقابلات المعرفية<\/b> قبل التطبيق الواسع؛ (3) <b>الفصل بين عينة الاستكشاف وعينة التوكيد<\/b>. وأرى أن أقوى ما في بحث الاتزان الانفعالي هو إضافة <b>خطوة العدالة (الأداء التفاضلي للمفردة)<\/b> التي يغفلها كثيرون، وأن نقطة تطويره هي ضم <b>حجم الأثر<\/b> (تصنيف هيئة خدمات الاختبارات التربوية) إلى الدلالة الإحصائية قبل حذف العبارات. ولذلك أقترح في أي مقياس يُعَدّ النموذج ذا المراحل الثلاث (بواتينج وآخرون، 2018) مع إضافة صريحة لخطوة العدالة وخطوة ضبط المرغوبية.<\/p><div class=\"en\" dir=\"ltr\">DIF · Boateng et al., 2018 · ETS<\/div><\/aside>"}]}, "p4": {"key": "p4", "no": 4, "title": "كيف نحدّ من الذاتية في المقاييس النفسية؟", "en": "Part Four: Reducing Subjectivity in Psychological Scales", "sections": [{"title": "كيف نحدّ من الذاتية في المقاييس النفسية؟", "en": "", "html": "<aside class=\"box note\"><div class=\"bt\">ملاحظة: مدخل<\/div><p>«الذاتية» في القياس النفسي لها وجهان: <b>ذاتية المستجيب<\/b> (أن تعبّر الاستجابة عن ميله لتقديم صورة معينة لا عن سلوكه الفعلي) و<b>ذاتية القائس<\/b> (الباحث، المحكّم، الفاحص، المصحح، المفسّر). والقاعدة الأولى التي يجب أن تقولها: <b>لا يوجد إجراء يُلغي الذاتية؛ الإجراءات تخفض مصدرًا محددًا منها، وقد تُدخل مصدرًا آخر.<\/b> لذلك الحل هو <b>تعدد الاستراتيجيات<\/b> عبر مراحل البناء والتطبيق والتصحيح والتفسير (وهي خلاصة المراجعة المنهجية لـ ويراسينغ وآخرين، 2025، لـ 28 دراسة).<\/p><div class=\"en\" dir=\"ltr\">Weerasinghe<\/div><\/aside>"}, {"title": "4.1 خريطة مصادر الذاتية والتحيز", "en": "", "html": "<div class=\"tw\"><table><tr><th><div class=\"cp\"><b>#<\/b><\/div><\/th><th><div class=\"cp\"><b>المصدر<\/b><\/div><\/th><th><div class=\"cp\"><b>الإنجليزية<\/b><\/div><\/th><th><div class=\"cp\"><b>تعريفه المختصر<\/b><\/div><\/th><th><div class=\"cp\"><b>مراجعه الأساسية<\/b><\/div><\/th><\/tr><tr><td><div class=\"cp\">1<\/div><\/td><td><div class=\"cp\">المرغوبية الاجتماعية<\/div><\/td><td><div class=\"cp\">المرغوبية الاجتماعية<\/div><div class=\"en\" dir=\"ltr\">Social Desirability<\/div><\/td><td><div class=\"cp\">ميل لتقديم صورة مقبولة اجتماعيًا؛ بُعدان: خداع الذات (لاواعٍ) وإدارة الانطباع (واعٍ)<\/div><\/td><td><div class=\"cp\">Edwards (1953)؛ Crowne &amp; Marlowe (1960)؛ Paulhus (1984, 1991)؛ Nederhof (1985)؛ Krumpal (2013)<\/div><\/td><\/tr><tr><td><div class=\"cp\">2<\/div><\/td><td><div class=\"cp\">الموافقة المنهجية<\/div><\/td><td><div class=\"cp\">الإذعان<\/div><div class=\"en\" dir=\"ltr\">Acquiescence<\/div><\/td><td><div class=\"cp\">ميل للموافقة على العبارات بصرف النظر عن محتواها<\/div><\/td><td><div class=\"cp\">Couch &amp; Keniston (1960)؛ Weijters &amp; Baumgartner (2012)<\/div><\/td><\/tr><tr><td><div class=\"cp\">3<\/div><\/td><td><div class=\"cp\">الاستجابة المتطرفة/الوسطية<\/div><\/td><td><div class=\"cp\">الاستجابة المتطرفة / الوسطى<\/div><div class=\"en\" dir=\"ltr\">Extreme / Midpoint Responding<\/div><\/td><td><div class=\"cp\">تفضيل طرفي التدريج أو وسطه؛ تتأثر بالثقافة<\/div><\/td><td><div class=\"cp\">باومغارتنر وستينكامب (2001)<\/div><div class=\"en\" dir=\"ltr\">Baumgartner &amp; Steenkamp (2001)<\/div><\/td><\/tr><tr><td><div class=\"cp\">4<\/div><\/td><td><div class=\"cp\">الاستجابة المهملة<\/div><\/td><td><div class=\"cp\">الاستجابة المهملة / قليلة الجهد<\/div><div class=\"en\" dir=\"ltr\">Careless / Insufficient-Effort Responding<\/div><\/td><td><div class=\"cp\">الإجابة دون قراءة المحتوى<\/div><\/td><td><div class=\"cp\">Meade &amp; Craig (2012)؛ Huang et al. (2012)؛ Ward &amp; Meade (2023)<\/div><\/td><\/tr><tr><td><div class=\"cp\">5<\/div><\/td><td><div class=\"cp\">أخطاء المقدّر<\/div><\/td><td><div class=\"cp\">أثر الهالة، والتساهل، والنزعة المركزية<\/div><div class=\"en\" dir=\"ltr\">Halo, Leniency, Central Tendency<\/div><\/td><td><div class=\"cp\">أثر الهالة، التساهل أو التشدد، الميل للوسط<\/div><\/td><td><div class=\"cp\">ثورندايك (1920)<\/div><div class=\"en\" dir=\"ltr\">Thorndike (1920)<\/div><\/td><\/tr><tr><td><div class=\"cp\">6<\/div><\/td><td><div class=\"cp\">تحيز الطريقة المشتركة<\/div><\/td><td><div class=\"cp\">تحيز الطريقة المشتركة<\/div><div class=\"en\" dir=\"ltr\">Common Method Bias<\/div><\/td><td><div class=\"cp\">تباين مصدره الأداة أو المصدر الواحد لا البناء<\/div><\/td><td><div class=\"cp\">بودساكوف وآخرون (2003، 2012)<\/div><div class=\"en\" dir=\"ltr\">Podsakoff et al. (2003, 2012)<\/div><\/td><\/tr><tr><td><div class=\"cp\">7<\/div><\/td><td><div class=\"cp\">غموض الصياغة وأثر الترتيب<\/div><\/td><td><div class=\"cp\">أثر الصياغة / الترتيب<\/div><div class=\"en\" dir=\"ltr\">Wording / Order Effects<\/div><\/td><td><div class=\"cp\">النفي المزدوج، المصطلحات غير المألوفة، ترتيب العبارات<\/div><\/td><td><div class=\"cp\">تورانجو وريبس وراسينسكي (2000)<\/div><div class=\"en\" dir=\"ltr\">Tourangeau, Rips &amp; Rasinski (2000)<\/div><\/td><\/tr><tr><td><div class=\"cp\">8<\/div><\/td><td><div class=\"cp\">توقعات الفاحص<\/div><\/td><td><div class=\"cp\">توقعات الفاحص<\/div><div class=\"en\" dir=\"ltr\">Examiner Expectancy<\/div><\/td><td><div class=\"cp\">تأثير توقعات الفاحص في الأداء أو التسجيل<\/div><\/td><td><div class=\"cp\">روزنتال (1966)؛ <b>الكتاب ص 131، 148–149<\/b><\/div><div class=\"en\" dir=\"ltr\">Rosenthal<\/div><\/td><\/tr><tr><td><div class=\"cp\">9<\/div><\/td><td><div class=\"cp\">التحيز الثقافي واللغوي<\/div><\/td><td><div class=\"cp\">التحيز الثقافي / اللغوي<\/div><div class=\"en\" dir=\"ltr\">Cultural / Linguistic Bias<\/div><\/td><td><div class=\"cp\">تحيز البناء أو الطريقة أو المفردة<\/div><\/td><td><div class=\"cp\">van de Vijver &amp; Tanzer (2004)؛ ITC (2018)<\/div><\/td><\/tr><tr><td><div class=\"cp\">10<\/div><\/td><td><div class=\"cp\">ذاتية المصحح<\/div><\/td><td><div class=\"cp\">ذاتية المصحح<\/div><div class=\"en\" dir=\"ltr\">Scorer Subjectivity<\/div><\/td><td><div class=\"cp\">اختلاف المصححين في الاستجابات المفتوحة/الإسقاطية<\/div><\/td><td><div class=\"cp\">كوهين (1960)؛ شروت وفليس (1979)؛ <b>الكتاب ص 11–21<\/b><\/div><div class=\"en\" dir=\"ltr\">Cohen · Shrout &amp; Fleiss<\/div><\/td><\/tr><tr><td><div class=\"cp\">11<\/div><\/td><td><div class=\"cp\">تحيز التأكيد لدى الباحث<\/div><\/td><td><div class=\"cp\">التحيز التأكيدي / درجات حرية الباحث<\/div><div class=\"en\" dir=\"ltr\">Confirmation Bias / Researcher Degrees of Freedom<\/div><\/td><td><div class=\"cp\">اختيار التحليلات والمؤشرات التي تؤكد الفرض<\/div><\/td><td><div class=\"cp\">Nickerson (1998)؛ Simmons, Nelson &amp; Simonsohn (2011)<\/div><\/td><\/tr><tr><td><div class=\"cp\">12<\/div><\/td><td><div class=\"cp\">تحيز المفردة للمجموعة<\/div><\/td><td><div class=\"cp\">تحيز المفردة / الأداء التفاضلي للمفردة<\/div><div class=\"en\" dir=\"ltr\">Item Bias / DIF<\/div><\/td><td><div class=\"cp\">اختلاف أداء مجموعتين متساويتين في السمة على العبارة<\/div><\/td><td><div class=\"cp\">هولاند وثاير (1988)؛ زومبو (1999)؛ <b>بحث «الأداء التفاضلي لنوع الطالب على مقياس الاتزان الانفعالي»<\/b><\/div><div class=\"en\" dir=\"ltr\">Holland &amp; Thayer · Zumbo<\/div><\/td><\/tr><\/table><\/div>"}, {"title": "4.2 موقف كتاب «الاختبارات النفسية» من الذاتية", "en": "", "html": "<ul><li><b>الصياغة الموحية:<\/b> تجنب العبارات التي توحي بالإجابة المرغوبة اجتماعيًا أو أخلاقيًا (ص 11–21).<\/li><li><b>التصحيح الحر:<\/b> معايير تصحيح واضحة لتقليل اختلاف المقيّمين؛ «مشكلات الموضوعية تتزايد مع الغموض في معايير الحكم» (ص 11–21).<\/li><li><b>المفردات الإسقاطية:<\/b> الاستجابة المفتوحة تتطلب تفسيرًا من الفاحص فيصير ضبط الإجراءات حاسمًا (ص 11–21).<\/li><li><b>المجال الوجداني:<\/b> الاستحسان الاجتماعي، واستخدام «مؤشرات مرتبطة بالرغبة في الاستجابة المقبولة اجتماعيًا» لفحص البنود (ص 74–85).<\/li><li><b>مفتاح التصحيح:<\/b> «غموض مفتاح التصحيح قد يحوّل اختلاف الفاحصين إلى مصدر خطأ» (ص 4–12).<\/li><li><b>تحيز الفاحص وتوقعاته:<\/b> الالتزام بالملاحظة والإجراءات وعدم منح الاستنتاج الأولي سلطة على الوقائع (ص 131).<\/li><li><b>الحجب والتعمية:<\/b> إخفاء معلومات المجموعات عن المطبقين والمصححين، وخلط أوراق القبلي/البعدي والتجريبية/الضابطة بترميز مستقل (ص 148–149).<\/li><li><b>اللغة واللهجة:<\/b> الاستعانة بفاحص متمكن من لهجة المفحوص (ص 146–147).<\/li><li><b>التحكيم في درجات القطع:<\/b> أحكام الخبراء قد تكون متشددة أو متساهلة؛ وتعزيزها ببيانات الأداء يقلل انفصالها عن الواقع، مع خطر التأثير في استقلاليتها (ص 98–103).<\/li><\/ul>"}, {"title": "4.3 الضوابط بحسب مرحلة العمل", "en": "", "html": "<h4><b>أولًا: مرحلة البناء<\/b><\/h4><ul><li><b>تعريف إجرائي محدد<\/b> يقلل اجتهاد المحكمين والمفسرين.<\/li><li><b>صياغة محايدة<\/b> للعبارات وتجنب المحمّلة قيميًا؛ وفحص «درجة المرغوبية» للعبارات قبل الإبقاء عليها (منطق إدواردز، 1953).<\/li><li><b>العبارات السالبة والمقياس المتوازن<\/b> لضبط الموافقة المنهجية — <b>مع الحذر<\/b>: قد تُضعف الثبات وتخلق عاملًا منهجيًا زائفًا، خصوصًا مع غير المنتبهين (فايترز وباومغارتنر, 2012)؛ ووجدت دراسة على أربع عينات إسبانية أن العبارات المعكوسة عملت بشكل ضعيف (فينتا وآخرون، 2022) — نتيجة لا تُعمم على العربية دون فحص، لكنها تبرر فحص أداء العبارات السالبة في عينة الدراسة.<div class=\"en\" dir=\"ltr\">Weijters &amp; Baumgartner, 2012 · Venta et al., 2022<\/div><\/li><li><b>صيغ الاختيار الإجباري<\/b>: تخفض تضخم الدرجات في مواقف الانتقاء (تحليل بعدي: كاو ودراسجو، 2019)، لكنها قد لا تحفظ الترتيب الصادق للأفراد (شولته وآخرون، 2024) ولها مشكلات الدرجات الإبسَاتية (إبساتي (مقارنة ذاتية)).<div class=\"en\" dir=\"ltr\">Schulte et al., 2024 · Ipsative · Cao &amp; Drasgow, 2019<\/div><\/li><li><b>تحكيم متعدد ومكمّم<\/b> بدل الانطباع؛ وطريقة <b>دلفي<\/b> (دلفي) للوصول إلى إجماع الخبراء على جولات.<div class=\"en\" dir=\"ltr\">CVR/CVI/Aiken's V · Delphi<\/div><\/li><li><b>المقابلات المعرفية<\/b> لكشف الفهم المختلف للعبارة (ويليس, 2005).<div class=\"en\" dir=\"ltr\">Willis, 2005<\/div><\/li><\/ul><h4><b>ثانيًا: مرحلة التطبيق<\/b><\/h4><ul><li><b>السرية وعدم الكشف عن الهوية<\/b> (إخفاء الهوية) وتأكيد أن «لا توجد إجابة صحيحة أو خاطئة» — مع ملاحظة أن تجربة داوني وآخرين (2006) لم تجد فروقًا دالة بين المجموعتين مجهولة ومكشوفة الهوية في الذكاء العاطفي (كما لخصها بحث «المرغوبية الاجتماعية وعلاقتها بالذكاء العاطفي»، ص 408–409).<div class=\"en\" dir=\"ltr\">Anonymity · Downey<\/div><\/li><li><b>تعليمات مقننة<\/b> مكتوبة أو مسجلة، وتطبيق ذاتي أو إلكتروني موحد يقلل أثر الفاحص (كرومبال, 2013: خصائص القائم بالتطبيق وموقف المسح تؤثر في المرغوبية).<div class=\"en\" dir=\"ltr\">Krumpal, 2013<\/div><\/li><li><b>تحذيرات نشطة من الإهمال وبنود انتباه<\/b>: التحذير السلبي (قراءة فقط) لم يخفض الإهمال، أما التحذير الذي يكتبه المستجيب بيده فحسّن المؤشرات لكنه زاد الانسحاب (برولمان وآخرون، 2024).<div class=\"en\" dir=\"ltr\">Brühlmann et al., 2024<\/div><\/li><li><b>عدم حضور صاحب السلطة<\/b> (المعلم/المدير) أثناء التطبيق.<\/li><li><b>فصل زمني أو مصدري<\/b> بين قياس المتغيرين في البحوث الارتباطية للحد من تحيز الطريقة المشتركة (بودساكوف وآخرون، 2003, 2012).<div class=\"en\" dir=\"ltr\">Podsakoff et al., 2003, 2012<\/div><\/li><\/ul><h4><b>ثالثًا: مرحلة التصحيح<\/b><\/h4><ul><li><b>مفتاح تصحيح ثابت<\/b> يحدد العبارات السالبة مسبقًا.<\/li><li><b>التصحيح الأعمى<\/b> والترميز المستقل لهوية المجموعة (الكتاب ص 148–149).<div class=\"en\" dir=\"ltr\">Blind Scoring<\/div><\/li><li><b>تدريب المقدّرين ومحكات التقدير (سلالم التقدير اللفظية)<\/b> و<b>التصحيح المزدوج<\/b> مع حساب الاتفاق: كابا كوهين (1960)، معامل الارتباط داخل الفئة (شروت وفليس, 1979؛ وإرشادات كو ولي، 2016)، وألفا كريبندورف.<div class=\"en\" dir=\"ltr\">Rubrics · Cohen, 1960 · ICC (Shrout &amp; Fleiss, 1979) · Koo &amp; Li, 2016<\/div><\/li><li><b>كشف الاستجابات المهملة<\/b> بمؤشرات غير مباشرة (اتساق زوجي–فردي، المترادفات/المتضادات السيكومترية، مسافة ماهالانوبيس، طول السلسلة، زمن الإكمال) ومؤشرات مطابقة الأفراد في راش (مؤشرا المطابقة الداخلية/الخارجية)؛ ويوصي وارد وميد (2023) بمعايير مسبقة للحذف تُعلن قبل التحليل.<div class=\"en\" dir=\"ltr\">Infit/Outfit · Ward &amp; Meade<\/div><\/li><\/ul><h4><b>رابعًا: مرحلة التحليل والتفسير<\/b><\/h4><ul><li><b>مقياس مرافق للمرغوبية<\/b> (مارلو–كراون أو القائمة المتوازنة للاستجابة المرغوبة اجتماعيًا) وفحص ارتباطه بالسمة — <b>مع التحفظ<\/b> (انظر 4.5).<div class=\"en\" dir=\"ltr\">Marlowe–Crowne · BIDR<\/div><\/li><li><b>ضبط إحصائي لتحيز الطريقة<\/b>: متغير مرجعي، أو عامل طريقة في التحليل العاملي التوكيدي. واختبار هارمان أحادي العامل <b>ضعيف الحساسية<\/b> ولا يكفي دليلًا (بودساكوف وآخرون، 2012).<div class=\"en\" dir=\"ltr\">Marker Variable · Podsakoff et al., 2012 · CFA<\/div><\/li><li><b>القياس الموضوعي بنموذج راش<\/b>: «الموضوعية النوعية» — مقارنة الأفراد مستقلة عن العبارات المستخدمة، والعكس (راش, 1960؛ رايت وستون، 1979) — <b>بشرط مطابقة البيانات للنموذج<\/b>.<div class=\"en\" dir=\"ltr\">Rasch, 1960 · Wright &amp; Stone, 1979<\/div><\/li><li><b>فحص الأداء التفاضلي (الأداء التفاضلي للمفردة)<\/b> ثم <b>مراجعة محتوى<\/b> العبارات الدالة قبل حذفها؛ فـ الأداء التفاضلي للمفردة إشارة إحصائية، و«التحيز» حكم يتطلب تفسيرًا محتوائيًا. ويُضم إلى الدلالة <b>حجم الأثر<\/b>.<div class=\"en\" dir=\"ltr\">DIF · ETS: A · Zwick, 2012 · Holland &amp; Thayer, 1988<\/div><\/li><li><b>فحص التكافؤ القياسي<\/b> بين المجموعات (ميريديث, 1993؛ تشيونج ورينسفولد، 2002) — وقد وجدت مراجعة بوتنيك وبورنشتاين (2016) لـ 126 مقالة و269 اختبار تكافؤ أن التكافؤ <b>الجزئي<\/b> شائع (نحو ثلث الحالات)، وأن قليلًا من الدراسات يختبر التكافؤ الصارم.<div class=\"en\" dir=\"ltr\">Meredith, 1993 · Cheung &amp; Rensvold, 2002 · Putnick &amp; Bornstein<\/div><\/li><li><b>التسجيل المسبق <\/b> للفروض وخطة التحليل ومعايير الحذف، للحد من «درجات حرية الباحث» (سيمونز وآخرون، 2011).<div class=\"en\" dir=\"ltr\">Preregistration · Simmons et al., 2011<\/div><\/li><li><b>التفسير المقيد بحدود الأدلة<\/b>: «تجنب قرارات قاطعة من دليل منفرد» (الكتاب، ص 39–54).<\/li><\/ul>"}, {"title": "4.4 جدول موجز: المصدر | المرحلة | الضابط | المرجع | قوة الدليل", "en": "", "html": "<div class=\"tw\"><table><tr><th><div class=\"cp\"><b>المصدر<\/b><\/div><\/th><th><div class=\"cp\"><b>المرحلة<\/b><\/div><\/th><th><div class=\"cp\"><b>الضابط<\/b><\/div><\/th><th><div class=\"cp\"><b>المرجع الرئيس<\/b><\/div><\/th><\/tr><tr><td><div class=\"cp\">المرغوبية<\/div><\/td><td><div class=\"cp\">البناء<\/div><\/td><td><div class=\"cp\">موازنة مرغوبية العبارات؛ اختيار إجباري<\/div><\/td><td><div class=\"cp\">Edwards 1953؛ Cao &amp; Drasgow 2019<\/div><\/td><\/tr><tr><td><div class=\"cp\">المرغوبية<\/div><\/td><td><div class=\"cp\">التطبيق<\/div><\/td><td><div class=\"cp\">سرية، تعليمات محايدة، تطبيق ذاتي<\/div><\/td><td><div class=\"cp\">كرومبال 2013<\/div><div class=\"en\" dir=\"ltr\">Krumpal 2013<\/div><\/td><\/tr><tr><td><div class=\"cp\">المرغوبية<\/div><\/td><td><div class=\"cp\">التفسير<\/div><\/td><td><div class=\"cp\">مقياس مرافق (قائمة باولهس المتوازنة للاستجابة المرغوبة اجتماعيًا/مقياس مارلو–كراون)<\/div><div class=\"en\" dir=\"ltr\">BIDR/M-C<\/div><\/td><td><div class=\"cp\">باولهس 1991؛ أوزييل 2010<\/div><div class=\"en\" dir=\"ltr\">Paulhus 1991 · Uziel 2010<\/div><\/td><\/tr><tr><td><div class=\"cp\">الموافقة<\/div><\/td><td><div class=\"cp\">البناء<\/div><\/td><td><div class=\"cp\">عبارات موجبة وسالبة<\/div><\/td><td><div class=\"cp\">فايترز وباومغارتنر 2012<\/div><div class=\"en\" dir=\"ltr\">Weijters &amp; Baumgartner 2012<\/div><\/td><\/tr><tr><td><div class=\"cp\">الإهمال<\/div><\/td><td><div class=\"cp\">التطبيق<\/div><\/td><td><div class=\"cp\">تحذير نشط + بنود انتباه<\/div><\/td><td><div class=\"cp\">برولمان وآخرون 2024<\/div><div class=\"en\" dir=\"ltr\">Brühlmann et al. 2024<\/div><\/td><\/tr><tr><td><div class=\"cp\">الإهمال<\/div><\/td><td><div class=\"cp\">التحليل<\/div><\/td><td><div class=\"cp\">مؤشرات غير مباشرة + مطابقة الأفراد<\/div><\/td><td><div class=\"cp\">وارد وميد 2023<\/div><div class=\"en\" dir=\"ltr\">Ward &amp; Meade 2023<\/div><\/td><\/tr><tr><td><div class=\"cp\">ذاتية المقدّر<\/div><\/td><td><div class=\"cp\">التصحيح<\/div><\/td><td><div class=\"cp\">تعمية + سلالم التقدير اللفظية + كابا/معامل الارتباط داخل الفئة<\/div><div class=\"en\" dir=\"ltr\">Rubrics · ICC<\/div><\/td><td><div class=\"cp\">Cohen 1960؛ Shrout &amp; Fleiss 1979<\/div><\/td><\/tr><tr><td><div class=\"cp\">تحيز الطريقة<\/div><\/td><td><div class=\"cp\">التصميم/التحليل<\/div><\/td><td><div class=\"cp\">مصادر متعددة + عامل طريقة<\/div><\/td><td><div class=\"cp\">بودساكوف وآخرون 2012<\/div><div class=\"en\" dir=\"ltr\">Podsakoff et al. 2012<\/div><\/td><\/tr><tr><td><div class=\"cp\">الثقافة واللغة<\/div><\/td><td><div class=\"cp\">التكييف<\/div><\/td><td><div class=\"cp\">إرشادات اللجنة الدولية للاختبارات + ترجمة عكسية + تكافؤ<\/div><div class=\"en\" dir=\"ltr\">ITC<\/div><\/td><td><div class=\"cp\">Bartram et al. 2018؛ Putnick &amp; Bornstein 2016<\/div><\/td><\/tr><tr><td><div class=\"cp\">تحيز المفردة<\/div><\/td><td><div class=\"cp\">التحليل<\/div><\/td><td><div class=\"cp\">مانتل–هانزل/انحدار لوجستي/نظرية الاستجابة للمفردة + مراجعة محتوى<\/div><div class=\"en\" dir=\"ltr\">MH · IRT<\/div><\/td><td><div class=\"cp\">Holland &amp; Thayer 1988؛ Liu et al. 2023<\/div><\/td><\/tr><tr><td><div class=\"cp\">توقعات الفاحص<\/div><\/td><td><div class=\"cp\">التطبيق/التصحيح<\/div><\/td><td><div class=\"cp\">تقنين التعليمات + تعمية<\/div><\/td><td><div class=\"cp\">روزنتال 1966؛ الكتاب ص 148–149<\/div><div class=\"en\" dir=\"ltr\">Rosenthal 1966<\/div><\/td><\/tr><\/table><\/div>"}, {"title": "4.5 مراجعة نقدية: ما الذي لا ينجح كما يُظن؟", "en": "", "html": "<ul><li><b>«ضبط المرغوبية إحصائيًا يُنقّي المقياس»<\/b> — غير مضمون: يرى ماكري وكوستا (1983) أن مقاييس المرغوبية تحمل «مضمونًا أكثر من أسلوب»؛ ووجد التحليل البعدي لـ أونز وفيسفيسفاران وريس (1996) أن المرغوبية لا تُفسد الصدق التنبؤي للشخصية في الانتقاء الوظيفي، وأنها ترتبط بفروق حقيقية في الاتزان الانفعالي ويقظة الضمير؛ ويرى أوزييل (2010) أن مقاييس إدارة الانطباع تفشل كمقاييس «أسلوب استجابة»، وأن الأولى تفسيرها بوصفها <b>ضبطًا ذاتيًا موجهًا اجتماعيًا<\/b> — وهو ما أيدته دراسة يومية لاحقة (عزيئيل وشميت-باراد, 2023).<div class=\"en\" dir=\"ltr\">Uziel &amp; Schmidt-Barad, 2023 · McCrae &amp; Costa · Ones, Viswesvaran &amp; Reiss · Uziel<\/div><\/li><li><b>«العبارات السالبة علاج شامل للموافقة»<\/b> — قد تخلق عاملًا منهجيًا وتخفض الثبات.<\/li><li><b>«الاختيار الإجباري حصانة ضد التزييف»<\/b> — يخفض المتوسط لكنه قد يشوه الرتب.<\/li><li><b>«اختبار هارمان يثبت غياب تحيز الطريقة»<\/b> — ضعيف الحساسية.<\/li><li><b>«الدلالة الإحصائية لـ الأداء التفاضلي للمفردة تكفي للحذف»<\/b> — تتأثر بحجم العينة وتعدد الاختبارات؛ يلزم حجم أثر ومراجعة محتوى.<div class=\"en\" dir=\"ltr\">DIF<\/div><\/li><li><b>«الترجمة العكسية تضمن التكافؤ»<\/b> — لا؛ إرشادات اللجنة الدولية للاختبارات تتطلب تصميمًا وتحققًا تجريبيًا.<div class=\"en\" dir=\"ltr\">ITC<\/div><\/li><li><b>«مؤشر واحد للإهمال يكفي»<\/b> — بعض المؤشرات (أقصى طول سلسلة، تباين الاستجابة داخل الفرد) لم تتفوق على الصدفة في تجارب حديثة.<\/li><\/ul><aside class=\"box convert\"><div class=\"bt\">التطبيق على المقاييس النفسية: الربط ببحثي «الأداء التفاضلي لنوع الطالب على مقياس الاتزان الانفعالي» و«المرغوبية الاجتماعية وعلاقتها بالذكاء العاطفي»<\/div><ul><li><b>بحث «المرغوبية الاجتماعية وعلاقتها بالذكاء العاطفي»<\/b> يقدم الدليل المحلي على المشكلة: ارتباط موجب متوسط <b>r = 0.427<\/b> بين المرغوبية والذكاء العاطفي 755 طالبًا مصريًا (ص 420)، وكان <b>خداع الذات<\/b> أقوى ارتباطًا بـ <b>التكيف<\/b> (r = 0.435؛ R² = 0.189)، و<b>إدارة الانطباع<\/b> أقوى ارتباطًا بـ <b>العوامل الخارجية<\/b> (r = 0.298) (ص 422). ويقبل هذا الارتباط تفسيرين متنافسين: (أ) <b>تلوث<\/b> مقياس الذكاء العاطفي بالمرغوبية، أو (ب) <b>علاقة جوهرية<\/b> لأن الأذكياء عاطفيًا أكثر ضبطًا لصورتهم الاجتماعية (وهو تفسير أوزيل). البحث لم يحسم بينهما، <div class=\"en\" dir=\"ltr\">Uziel<\/div><\/li><li><b>بحث «الأداء التفاضلي لنوع الطالب على مقياس الاتزان الانفعالي»<\/b> يقدم أداة موضوعية للحد من <b>تحيز المفردة<\/b>: حذف العبارات 10 و12 و16 بعد ثبوت الأداء التفاضلي للمفردة للنوع (ص 386)، مع استخدام راش لتجاوز «ضعف الموضوعية» في النظرية الكلاسيكية (ص 363).<div class=\"en\" dir=\"ltr\">DIF<\/div><\/li><\/ul><\/aside><aside class=\"box opinion\"><div class=\"bt\">رأي الباحث: رأيي كباحث: استراتيجية من سبع طبقات للحد من الذاتية<\/div><ul><li>تعريف إجرائي بمؤشرات محددة. 2) تحكيم مكمّم متعدد الجامعات (نسبة صدق المحتوى/مؤشر صدق المحتوى) مع مقابلات معرفية. 3) صياغة محايدة ومزيج محسوب من العبارات الموجبة والسالبة مع فحص أدائها. 4) تطبيق سري بتعليمات محايدة دون حضور ذي سلطة. 5) مقياس مرافق للمرغوبية يُستخدم <b>للفهم لا للحذف الآلي<\/b>. 6) تحليل راش + الأداء التفاضلي للمفردة بحجم أثر + مراجعة محتوى. 7) خطة تحليل ومعايير حذف معلنة مسبقًا. وأرى أن «الموضوعية» في المقاييس النفسية ليست حالة نصل إليها، بل <b>سلسلة قرارات موثقة يمكن لغيرنا أن يكررها ويصل إلى النتيجة نفسها<\/b> — وهذا هو التعريف العملي الذي أتبناه.<div class=\"en\" dir=\"ltr\">CVR/CVI · DIF<\/div><\/li><\/ul><\/aside>"}]}, "p5": {"key": "p5", "no": 5, "title": "المدرسة البنائية ومقاييسها", "en": "Part Five: The Constructivist School and Its Measures", "sections": [{"title": "5.1 ضبط المصطلح أولًا", "en": "", "html": "<div class=\"tw\"><table><tr><th><div class=\"cp\"><b>المصطلح<\/b><\/div><\/th><th><div class=\"cp\"><b>الإنجليزية<\/b><\/div><\/th><th><div class=\"cp\"><b>المعنى<\/b><\/div><\/th><th><div class=\"cp\"><b>علاقته بموضوعنا<\/b><\/div><\/th><\/tr><tr><td><div class=\"cp\"><b>البنائية<\/b><\/div><\/td><td><div class=\"cp\">البنائية<\/div><div class=\"en\" dir=\"ltr\">Constructivism<\/div><\/td><td><div class=\"cp\">نظرية في المعرفة والتعلم: المتعلم <b>يبني<\/b> المعنى بنشاط ولا يتلقاه جاهزًا<\/div><\/td><td><div class=\"cp\"><b>هي المقصودة في هذا الجزء<\/b><\/div><\/td><\/tr><tr><td><div class=\"cp\">البنيوية<\/div><\/td><td><div class=\"cp\">البنيوية<\/div><div class=\"en\" dir=\"ltr\">Structuralism<\/div><\/td><td><div class=\"cp\">مدرسة فونت وتيتشنر في علم النفس (تحليل الشعور إلى عناصره)، أو البنيوية اللغوية والأنثروبولوجية (دي سوسير، ليفي شتراوس)<\/div><\/td><td><div class=\"cp\">مدرسة مختلفة؛ يقع الخلط بينهما كثيرًا في الترجمة<\/div><\/td><\/tr><tr><td><div class=\"cp\">البناء / التكوين الفرضي<\/div><\/td><td><div class=\"cp\">التكوين الفرضي<\/div><div class=\"en\" dir=\"ltr\">Construct<\/div><\/td><td><div class=\"cp\">مفهوم نظري كامن يُقاس (ذكاء، قلق، اتزان انفعالي)<\/div><\/td><td><div class=\"cp\">مفهوم سيكومتري<\/div><\/td><\/tr><tr><td><div class=\"cp\">صدق البناء<\/div><\/td><td><div class=\"cp\">صدق البناء<\/div><div class=\"en\" dir=\"ltr\">Construct Validity<\/div><\/td><td><div class=\"cp\">مدى قياس الأداة للبناء النظري (كرونباخ وميل, 1955)<\/div><div class=\"en\" dir=\"ltr\">Cronbach &amp; Meehl, 1955<\/div><\/td><td><div class=\"cp\">خاصية في المقياس لا مدرسة فكرية<\/div><\/td><\/tr><tr><td><div class=\"cp\">القياس البنائي (عند ويلسون)<\/div><div class=\"en\" dir=\"ltr\">Wilson<\/div><\/td><td><div class=\"cp\">بناء المقاييس<\/div><div class=\"en\" dir=\"ltr\">Constructing Measures<\/div><\/td><td><div class=\"cp\">منهج لبناء المقاييس حول «خريطة البناء» ونموذج راش<\/div><\/td><td><div class=\"cp\">منهج سيكومتري يتقاطع لفظيًا مع البنائية<\/div><\/td><\/tr><\/table><\/div>"}, {"title": "5.2 المدرسة البنائية: الجذور والرواد", "en": "", "html": "<div class=\"tw\"><table><tr><th><div class=\"cp\"><b>الرائد<\/b><\/div><\/th><th><div class=\"cp\"><b>الاتجاه<\/b><\/div><\/th><th><div class=\"cp\"><b>الإسهام الأساسي<\/b><\/div><\/th><\/tr><tr><td><div class=\"cp\"><b>جان بياجيه<\/b><\/div><div class=\"en\" dir=\"ltr\">Jean Piaget<\/div><\/td><td><div class=\"cp\">البنائية المعرفية<\/div><div class=\"en\" dir=\"ltr\">Cognitive Constructivism<\/div><\/td><td><div class=\"cp\">المعرفة تُبنى عبر <b>التمثل (التمثّل)<\/b> و<b>المواءمة <\/b> و<b>الموازنة <\/b>؛ «المخططات»؛ مراحل النمو المعرفي الأربع (الحسية الحركية، ما قبل العمليات، العمليات المحسوسة، العمليات المجردة)<\/div><div class=\"en\" dir=\"ltr\">Assimilation · Accommodation · Equilibration · Schemas<\/div><\/td><\/tr><tr><td><div class=\"cp\"><b>ليف فيجوتسكي<\/b><\/div><div class=\"en\" dir=\"ltr\">Lev Vygotsky<\/div><\/td><td><div class=\"cp\">البنائية الاجتماعية<\/div><div class=\"en\" dir=\"ltr\">Social Constructivism<\/div><\/td><td><div class=\"cp\">المعرفة تُبنى في سياق اجتماعي وثقافي بوساطة اللغة؛ <b>منطقة النمو القريبة (منطقة النمو القريبة (الوشيكة))<\/b>: المسافة بين ما يستطيعه المتعلم وحده وما يستطيعه بمساعدة<\/div><div class=\"en\" dir=\"ltr\">ZPD<\/div><\/td><\/tr><tr><td><div class=\"cp\"><b>جيروم برونر<\/b><\/div><div class=\"en\" dir=\"ltr\">Jerome Bruner<\/div><\/td><td><div class=\"cp\">التعلم بالاكتشاف<\/div><\/td><td><div class=\"cp\"><b>المنهج الحلزوني<\/b>؛ و«السقالات» (السقالات التعليمية) مع وود وروس (1976)<\/div><div class=\"en\" dir=\"ltr\">Scaffolding · Wood &amp; Ross<\/div><\/td><\/tr><tr><td><div class=\"cp\"><b>جون ديوي<\/b><\/div><div class=\"en\" dir=\"ltr\">John Dewey<\/div><\/td><td><div class=\"cp\">الجذور البراجماتية<\/div><\/td><td><div class=\"cp\">التعلم بالخبرة والعمل<\/div><\/td><\/tr><tr><td><div class=\"cp\"><b>جورج كيلي (1955)<\/b><\/div><div class=\"en\" dir=\"ltr\">George Kelly<\/div><\/td><td><div class=\"cp\">علم نفس البناءات الشخصية<\/div><div class=\"en\" dir=\"ltr\">Personal Construct Psychology<\/div><\/td><td><div class=\"cp\">الإنسان «عالِم» يبني تصورات ثنائية القطب لتفسير عالمه؛ وأداته <b>شبكة المخزون<\/b><\/div><div class=\"en\" dir=\"ltr\">Repertory Grid<\/div><\/td><\/tr><tr><td><div class=\"cp\"><b>إرنست فون جلاسرسفيلد (1995)<\/b><\/div><div class=\"en\" dir=\"ltr\">von Glasersfeld<\/div><\/td><td><div class=\"cp\">البنائية الجذرية<\/div><div class=\"en\" dir=\"ltr\">Radical Constructivism<\/div><\/td><td><div class=\"cp\">المعرفة لا تطابق الواقع بل «تلائمه» (الصلاحية الوظيفية)؛ لا يوجد نقل مباشر للمعرفة<\/div><div class=\"en\" dir=\"ltr\">Viability<\/div><\/td><\/tr><tr><td><div class=\"cp\"><b>ديفيد أوزوبل<\/b><\/div><div class=\"en\" dir=\"ltr\">David Ausubel<\/div><\/td><td><div class=\"cp\">(موقف مقارن)<\/div><\/td><td><div class=\"cp\">التعلم ذو المعنى عبر ربط الجديد بالبنية المعرفية السابقة، لكن بالاستقبال المنظَّم لا بالاكتشاف<\/div><\/td><\/tr><tr><td><div class=\"cp\"><b>روزاليند درايفر<\/b><\/div><div class=\"en\" dir=\"ltr\">Rosalind Driver<\/div><\/td><td><div class=\"cp\">البنائية في تعليم العلوم<\/div><\/td><td><div class=\"cp\">التصورات البديلة لدى المتعلمين<\/div><div class=\"en\" dir=\"ltr\">Alternative Conceptions<\/div><\/td><\/tr><tr><td><div class=\"cp\"><b>ديفيد كولب (1984)<\/b><\/div><div class=\"en\" dir=\"ltr\">David Kolb<\/div><\/td><td><div class=\"cp\">التعلم التجريبي<\/div><\/td><td><div class=\"cp\">دورة التعلم: خبرة ← تأمل ← تجريد ← تجريب<\/div><\/td><\/tr><tr><td><div class=\"cp\"><b>ديفيد جوناسن (1991)<\/b><\/div><div class=\"en\" dir=\"ltr\">David Jonassen<\/div><\/td><td><div class=\"cp\">التصميم التعليمي<\/div><\/td><td><div class=\"cp\">المقابلة بين الموضوعية والبنائية<\/div><div class=\"en\" dir=\"ltr\">Objectivism<\/div><\/td><\/tr><\/table><\/div><h4><b>المبادئ الأساسية (تركيب من الأدبيات)<\/b><\/h4><ul><li>المعرفة <b>تُبنى ولا تُنقل<\/b>.<\/li><li><b>المعرفة السابقة<\/b> نقطة البداية لكل تعلم جديد.<\/li><li>التعلم <b>نشط وسياقي<\/b> ومرتبط بمهام أصيلة.<\/li><li><b>التفاعل الاجتماعي واللغة<\/b> وسيطان للبناء (فيجوتسكي).<\/li><li><b>الصراع المعرفي<\/b> (اختلال التوازن) محرك للتعلم (بياجيه).<\/li><li><b>التأمل وما وراء المعرفة<\/b> جزء من التعلم.<\/li><li>المعلم <b>ميسّر<\/b> ومصمم لبيئة التعلم لا ناقل للمعلومة.<\/li><\/ul><h4><b>التعريف المفاهيمي والإجرائي<\/b><\/h4><ul><li><b>مفاهيميًا (تركيب):<\/b> البنائية نظرية في التعلم ترى أن المتعلم يبني معرفته بنفسه بصورة نشطة من خلال تفاعل خبراته السابقة مع الخبرات الجديدة في سياق اجتماعي، وأن المعنى يتكوّن داخل المتعلم ولا يُنقل إليه جاهزًا.<\/li><li><b>إجرائيًا (صياغة الباحث):<\/b> «درجة توافر خصائص بيئة التعلم البنائية كما يدركها الطلاب، مقيسة بالدرجة الكلية على مقياس بيئة التعلم البنائية (مثل مقياس بيئة التعلم البنائية) بأبعاده الخمسة: الصلة الشخصية، عدم اليقين العلمي، الصوت الناقد، المشاركة في التحكم، تفاوض الطلاب».<\/li><\/ul>"}, {"title": "5.3 كيف تنظر البنائية إلى القياس والتقويم؟", "en": "", "html": "<figure><img src=\"data:image/webp;base64,UklGRny+AABXRUJQVlA4IHC+AABwVAOdASp4BegDPmEwlUekIyIhIjKZkIAMCWdu/BFZqNO96H95O8UNQVf+s19X/vv+93fMj+oP3/+P9ODmfwy+GeNv7387P7f9lO7/3v/o+UXz//3/8z+Ynzq/3X/o/1X+e+CP9a/1H/X/P/6BP6t/Uv+n/hv878Sv/D+43ug/wP/m9Qf9G/zf7b+7j/vP/V/tP3/+Wf+H/3P7e/8n5A/7D/pv/b7af/q///ui/5X/xf/n3Hv6H/rv/168/7nf ئط المفاهيم، التفكير بصوت عالٍ، التقييم الدينامي، شبكة المخزون<\/div><\/td><\/tr><tr><td><div class=\"cp\">معيار الجودة<\/div><\/td><td><div class=\"cp\">الصدق والثبات والموضوعية<\/div><\/td><td><div class=\"cp\">الأصالة، المعنى، النقل، المصداقية، تعدد الأدلة<\/div><\/td><\/tr><tr><td><div class=\"cp\">النظرة للخطأ<\/div><\/td><td><div class=\"cp\">خطأ يُحسب<\/div><\/td><td><div class=\"cp\">نافذة على تصور المتعلم (تصور بديل)<\/div><\/td><\/tr><tr><td><div class=\"cp\">المقارنة<\/div><\/td><td><div class=\"cp\">بالجماعة (معيارية) أو بمحك<\/div><\/td><td><div class=\"cp\">بتقدم المتعلم نفسه وبمحكات أداء<\/div><\/td><\/tr><\/table><\/div><h4><b>أدوات التقويم البنائي الرئيسة<\/b><\/h4><ul><li><b>التقويم الأصيل/الأدائي:<\/b> مهام واقعية تتطلب توظيف المعرفة.<div class=\"en\" dir=\"ltr\">Authentic/Performance Assessment<\/div><\/li><li><b>ملف الإنجاز:<\/b> تجميع منظم لأعمال المتعلم يعكس نموه.<div class=\"en\" dir=\"ltr\">Portfolio<\/div><\/li><li><b>محكات التقدير (سلالم التقدير اللفظية):<\/b> وصف لمستويات الأداء — وهي الأداة التي تحد من ذاتية التقويم البنائي.<div class=\"en\" dir=\"ltr\">Rubrics<\/div><\/li><li><b>خرائط المفاهيم:<\/b> تمثيل بصري للعلاقات بين المفاهيم (نوفاك).<div class=\"en\" dir=\"ltr\">Concept Maps · Novak<\/div><\/li><li><b>التفكير بصوت عالٍ (التفكير بصوت مرتفع).<\/b><div class=\"en\" dir=\"ltr\">Think-Aloud<\/div><\/li><li><b>التقويم الذاتي وتقويم الأقران.<\/b><\/li><li><b>التقييم الدينامي:<\/b> قياس «قابلية التعلم» داخل منطقة النمو القريبة: اختبار ← تدخل/مساعدة ← إعادة اختبار. أشهر أدواته <b>أداة تقييم إمكانية التعلم أداة تقييم إمكانات التعلم لفويرشتاين (1979)<\/b>؛ ومن رواده <b>ليدز (1987)<\/b> و<b>براون وكامبيوني<\/b>. وأظهرت دراسة حديثة (يار أحمدي وكارجار بهبهاني, 2025) أثرًا إيجابيًا لتقييم دينامي تدخلي قائم على منطقة النمو القريبة (الوشيكة) في تعلم المفردات (عينة 80؛ سياق إيراني — لا يُعمم).<div class=\"en\" dir=\"ltr\">Dynamic Assessment · Feuerstein, 1979 · YarAhmadi &amp; Kargar Behbahani, 2025 · LPAD · Lidz · Brown &amp; Campione · ZPD<\/div><\/li><li><b>شبكة المخزون لكيلي:<\/b> تقنية لاستخراج البناءات الشخصية للفرد بمقارنة عناصر ثلاثية.<div class=\"en\" dir=\"ltr\">Repertory Grid<\/div><\/li><\/ul><aside class=\"box note\"><div class=\"bt\">ملاحظة: تطبيق ذلك على المادة العلمية<\/div><p>اللافت أن كتاب «الاختبارات النفسية» يتضمن جذورًا لهذا الفكر: <b>الاختبارات محكية المرجع<\/b> (ص 55–76) و<b>التحليل الهرمي للكفايات<\/b> و<b>الاختبار التشخيصي<\/b> الذي يبحث عن مواضع التعثر للعلاج لا لترتيب الأفراد (ص 120–127)، و<b>مستويات التعلم<\/b> (معلومات، مهارات عقلية، استراتيجيات معرفية) — وكلها أقرب إلى المنطق البنائي في التقويم من المنطق المعياري التقليدي.<\/p><\/aside>"}, {"title": "5.4 مقاييس المدرسة البنائية (فهرس الأدوات)", "en": "", "html": "<div class=\"tw\"><table><tr><th><div class=\"cp\"><b>الأداة<\/b><\/div><\/th><th><div class=\"cp\"><b>المؤلفون/السنة<\/b><\/div><\/th><th><div class=\"cp\"><b>ما تقيسه<\/b><\/div><\/th><th><div class=\"cp\"><b>البنية<\/b><\/div><\/th><th><div class=\"cp\"><b>ملاحظات<\/b><\/div><\/th><\/tr><tr><td><div class=\"cp\"><b>مسح بيئة التعلم البنائية مسح البيئة التعلمية البنائية<\/b><\/div><div class=\"en\" dir=\"ltr\">CLES<\/div><\/td><td><div class=\"cp\">تايلور وفريزر وفيشر (1997)؛ النسخة الأولى تايلور وفريزر (1991)<\/div><div class=\"en\" dir=\"ltr\">Taylor, Fraser &amp; Fisher · Taylor &amp; Fraser<\/div><\/td><td><div class=\"cp\">بيئة الصف البنائية كما يدركها الطلاب أو المعلم<\/div><\/td><td><div class=\"cp\">5 مقاييس فرعية: الصلة الشخصية، عدم اليقين، الصوت الناقد، المشاركة في التحكم، تفاوض الطلاب؛ 6 بنود لكل مقياس (30 بندًا)<\/div><div class=\"en\" dir=\"ltr\">Personal Relevance · Uncertainty · Critical Voice · Shared Control · Student Negotiation<\/div><\/td><td>DOI: 10.1016/S0883-0355(97)90011-2<\/td><\/tr><tr><td><div class=\"cp\"><b>مسح البيئة التعلمية البنائية المختصر (مسح بيئة التعلم البنائية-20)<\/b><\/div><div class=\"en\" dir=\"ltr\">CLES-20 · CLES<\/div><\/td><td><div class=\"cp\">جونسون وماكلور (2004)<\/div><div class=\"en\" dir=\"ltr\">Johnson &amp; McClure iv><\/td><td><div class=\"cp\">قابلية التعلم (تقييم دينامي)<\/div><\/td><td><div class=\"cp\">اختبار–تدخل–إعادة اختبار<\/div><\/td><td>—<\/td><\/tr><\/table><\/div><h4><b>دراسات عربية في التدريس والتعلم البنائي<\/b><\/h4><ul><li><b>سمارة (2015)<\/b>: مستوى ممارسة مبادئ التعلم البنائي لدى معلمي العلوم في مؤتة (الأردن)؛ بطاقة ملاحظة من 23 بندًا في 6 مجالات؛ 45 معلمًا؛ مستوى متوسط في خمسة مجالات وضعيف في بيئة النقاش. دراسات وأبحاث، 7(18)، 258–279.<\/li><li><b>مصطفة (2016)<\/b>: ممارسات التعلم البنائي لدى معلمي التربية الإسلامية؛ بطاقة ملاحظة من 37 بندًا؛ 30 معلمًا. المجلة الأردنية في العلوم التربوية، 12(3)، 335–347.<\/li><li><b>خلف والمياحي (2021)<\/b>: بناء مقياس للتدريس البنائي لمدرسي المرحلة الإعدادية (العراق). مجلة أبحاث البصرة للعلوم الإنسانية، 46(1)، 516–535.<\/li><\/ul>"}, {"title": "5.5 الجدل حول البنائية", "en": "", "html": "<ul><li><b>كيرشنر وسويلر وكلارك (2006)<\/b> في مجلة عالم النفس التربوي: التعليم «قليل التوجيه» (الاكتشافي، القائم على المشكلات، الاستقصائي، الخبراتي) أقل فاعلية وكفاءة من التوجيه القوي للمبتدئين، استنادًا إلى بنية الذاكرة العاملة ونظرية <b>الحمل المعرفي<\/b> و<b>أثر المثال المحلول<\/b>؛ ويقرون بأن وصف البنائية للتعلم صحيح، لكن التوصيات التعليمية المشتقة منه لا تلزم عنه.<div class=\"en\" dir=\"ltr\">Kirschner, Sweller &amp; Clark · Educational Psychologist<\/div><\/li><li><b>رد هميلو-سيلفر ودنكان وتشين (2007)<\/b>: التعلم القائم على المشكلات والاستقصاء ليسا «اكتشافًا غير موجّه» لأنهما يوفران <b>سقالات كثيفة<\/b> تخفض الحمل المعرفي وتحقق أهدافًا أوسع.<div class=\"en\" dir=\"ltr\">Hmelo-Silver, Duncan &amp; Chinn<\/div><\/li><li><b>مشكلة الصدق:<\/b> أدوات مثل مسح البيئة التعلمية البنائية تقيس <b>تصورات<\/b> الطلاب لا الممارسات الفعلية؛ والملاحظة المباشرة تعطي صورة مختلفة.<div class=\"en\" dir=\"ltr\">CLES<\/div><\/li><li><b>التوتر النظري–القياسي:<\/b> البنائية تنتقد القياس الموحد، لكن معظم أدواتها كمّية تقليدية (ليكرت + تحليل عاملي + ألفا).<\/li><li><b>النقل الثقافي:<\/b> لم يُعثر على دراسة عربية لفحص التكافؤ القياسي لـ مسح البيئة التعلمية البنائية بين ثقافتين.<div class=\"en\" dir=\"ltr\">CLES<\/div><\/li><\/ul><aside class=\"box opinion\"><div class=\"bt\">رأي الباحث: رأيي كباحث في المدرسة البنائية ومقاييسها<\/div><p>أرى أن البنائية <b>محقّة في تصورها لكيفية حدوث التعلم<\/b> (المتعلم يبني المعنى من خبراته)، لكنها <b>ليست بديلًا عن القياس الموضوعي بل مكمّل له<\/b>. فمشكلتها الكبرى أن أدواتها (ملف الإنجاز، المهام الأصيلة، خرائط المفاهيم) <b>أكثر عرضة للذاتية<\/b> — وهو بالضبط موضوع الفصل الرابع — ولا تُضبط إلا بمحكات تقدير صريحة وتدريب للمقدّرين وحساب لاتفاقهم. كما أرى مفارقة مثيرة: أن أحدث المقاييس في هذا الاتجاه (مثل QLEN، 2024) تستخدم <b>نموذج راش والأداء التفاضلي للمفردة<\/b> — أي أدوات القياس الموضوعي نفسها التي تنتقدها البنائية. ولذلك أتبنى موقفًا تكامليًا: <b>البنائية تحدد «ماذا» نقيس (الفهم، العملية، قابلية التعلم)، والقياس الموضوعي يحدد «كيف» نقيسه بعدالة وثبات<\/b>. ومنطقة الالتقاء الأوضح هي <b>التقييم الدينامي<\/b> (قياس ما يستطيعه المتعلم بمساعدة) و<b>الاختبارات التشخيصية القائمة على التحليل الهرمي<\/b> كما يعرضها الكتاب (ص 120–127).<\/p><div class=\"en\" dir=\"ltr\">DIF<\/div><\/aside>"}]}, "p6": {"key": "p6", "no": 6, "title": "قائمة المقاييس النفسية والمقاييس المعرفية", "en": "Part Six: Catalogue of Psychological and Cognitive Scales", "sections": [{"title": "6.1 جدول مرجعي سريع: المقاييس النفسية (غير المعرفية)", "en": "", "html": "<div class=\"tw\"><table><tr><th><div class=\"cp\"><b>المجال<\/b><\/div><\/th><th><div class=\"cp\"><b>المقياس<\/b><\/div><\/th><th><div class=\"cp\"><b>المؤلف (السنة)<\/b><\/div><\/th><th><div class=\"cp\"><b>البنود المتداولة<\/b><\/div><\/th><th><div class=\"cp\"><b>نوع الأداء<\/b><\/div><\/th><\/tr><tr><td><div class=\"cp\">طرق التدريج<\/div><\/td><td><div class=\"cp\">الفواصل المتساوية الظهور<\/div><\/td><td><div class=\"cp\">ثرستون (1928)<\/div><div class=\"en\" dir=\"ltr\">Thurstone (1928)<\/div><\/td><td><div class=\"cp\">طريقة بناء<\/div><\/td><td><div class=\"cp\">معتاد<\/div><\/td><\/tr><tr><td><div class=\"cp\">طرق التدريج<\/div><\/td><td><div class= iv class=\"cp\">20 بندًا (البدائل + التحكم)<\/div><\/td><td><div class=\"cp\">معتاد<\/div><\/td><\/tr><tr><td><div class=\"cp\">الإخفاق المعرفي<\/div><\/td><td><div class=\"cp\">الإخفاقات المعرفية استبيان الإخفاقات المعرفية<\/div><div class=\"en\" dir=\"ltr\">CFQ<\/div><\/td><td><div class=\"cp\">برودبنت وآخرون (1982)<\/div><div class=\"en\" dir=\"ltr\">Broadbent et al. (1982)<\/div><\/td><td><div class=\"cp\">25 بندًا<\/div><\/td><td><div class=\"cp\">معتاد<\/div><\/td><\/tr><tr><td><div class=\"cp\">القلق المعرفي<\/div><\/td><td><div class=\"cp\">قلق الاختبار المعرفي<\/div><\/td><td><div class=\"cp\">كاسادي وجونسون (2002)<\/div><div class=\"en\" dir=\"ltr\">Cassady &amp; Johnson (2002)<\/div><\/td><td><div class=\"cp\">27 بندًا<\/div><\/td><td><div class=\"cp\">معتاد<\/div><\/td><\/tr><tr><td><div class=\"cp\">بياجيه<\/div><\/td><td><div class=\"cp\">التفكير المنطقي اختبار التفكير المنطقي / اختبار التفكير المنطقي الجمعي<\/div><div class=\"en\" dir=\"ltr\">TOLT / GALT<\/div><\/td><td><div class=\"cp\">توبين وكابي (1981) / رودرانجكا وآخرون (1983)<\/div><div class=\"en\" dir=\"ltr\">Tobin &amp; Capie (1981) / Roadrangka et al. (1983)<\/div><\/td><td><div class=\"cp\">10 / 21 بندًا<\/div><\/td><td><div class=\"cp\">أقصى<\/div><\/td><\/tr><\/table><\/div><aside class=\"box critical\"><div class=\"bt\">ملاحظة نقدية: المقاييس المعرفية «ذاتية التقرير» ليست قياسًا للقدرة<\/div><p>مقاييس مثل قائمة الوعي بما وراء المعرفة وقائمة المرونة المعرفية واستبيان الإخفاقات المعرفية والحاجة إلى المعرفة تقيس <b>إدراك الفرد<\/b> لعملياته المعرفية أو ميله إليها (أداء معتاد)، لا قدرته الفعلية؛ ولذلك فهي معرضة للمرغوبية ونقص البصيرة (انظر الفصل الرابع). أما اختبارات الذكاء والوظائف التنفيذية فهي <b>اختبارات<\/b> بالمعنى الدقيق (أداء أقصى). وهذا تطبيق مباشر للتمييز الوارد في الفصل الأول.<\/p><div class=\"en\" dir=\"ltr\">MAI · CFI · CFQ · NFC<\/div><\/aside>"}]}, "p7": {"key": "p7", "no": 7, "title": "عرض وتحليل لبحثين منشورين — الاتزان الانفعالي والمرغوبية الاجتماعية", "en": "Part Seven: The Supervisor's Two Studies (Prof. Nagat Zaki Mousa) — Review, Analysis & Lessons", "sections": [{"title": "بحثا «الأداء التفاضلي لنوع الطالب على مقياس الاتزان الانفعالي» و«المرغوبية الاجتماعية وعلاقتها بالذكاء العاطفي» — عرض وتحليل واستفادة", "en": "", "html": "<aside class=\"box note\"><div class=\"bt\">ملاحظة<\/div><p>البحثان منشوران في <b>مجلة البحث في التربية وعلم النفس، كلية التربية، جامعة المنيا، المجلد 37، العدد 1، يناير 2022<\/b>الأول تطبيق مباشر لـ <b>بناء مقياس وتحليل عدالة مفرداته (الأداء التفاضلي للمفردة)<\/b>، والثاني تطبيق مباشر لـ <b>مشكلة الذاتية في التقرير الذاتي (المرغوبية الاجتماعية)<\/b> ولـ <b>خطوات تكييف مقياس أجنبي<\/b>.<\/p><div class=\"en\" dir=\"ltr\">DIF<\/div><\/aside>"}, {"title": "7.1 الأداء التفاضلي لنوع الطالب على مقياس الاتزان الانفعالي", "en": "", "html": "<figure><img src=\"data:image/webp;base64,UklGRsCEAABXRUJQVlA4ILSEAAAwJgKdASp4BT0CPmEwlEekIyIjolJJcIAMCWdu++P4wNH+LzzGjIQSQDbikRq6el/9H+/d9vJvmH91/gPTgtr66eb7r+6684Dnnzof5X9mPcH+mf/d7gP69/sh64P7Xe4394fUL/Sv9b+6HvNf8n92vdj/ePUP/p//G///rzexr+8nsReXd+8/wwf3P/r/u97R//4/5XuAf//22Olf6f/1T+3/sb/Xvkv8d/SP7P/hf8T/hf69+xXuH+N/NP2f+0/s5/fv2a+Lv/W8Qvqv8h/uPQv+QfZX8L/bf8z/vP7V+633V/g/89+af9q9FfzT97/z/+O/dD+5/IL+Pfyb+yf279vf7Z+7v1+fTf6Dtr9s/1f+x/1X7Qfv/9AvrL85/zf9z/yX/T/w3wQfB/5T/Jfur/cf//8ofXr/a/3f/H/rf9gH8x/ov+d/wv7kf5f///+j8J/13/K8Xb8H/tf2s/ID7Av5l/ZP93/if9R+yn0yf0n/Y/zn+m/aT29fn/+P/6n+f/0v7L/YR/Kv6p/tv75/mv/d/jf///+fve///uK/d3//+61+1X/9/6wskt0a6v+NK5F8lyL5LkXyXIvkuRfJci+S5F8lyL5LkXyXIvkuRfJci+S5F8lyL5LkXyVSSHiat91XBSyX7tMSaBPL9I8XI6IFLC4XgY2HmeyuRfJci+S5F8lyLONPqi6fVumxw8g44IcVUQ9VItuNrO/aZu6NdX/Glci+S5F8lyL48yng70q+AwnzhtbW6oU2a0lgWYoCxRKkUtFq4KuPl/1oZU7seGe9bNL9XX3hhMHD9ymlPYkMuBzQgsECda61pns2IT37CYtcqaqCZBW/QdBz11R0MTysxy/+BUeZ7K5F8lyL5LkXyVA4fOZE+zGwCQB882o5ZXr6UjBsEonbtwNA3VHkrtYuLIT+bEEb/yknUAaW0Cf8rz1ghBKujEs+6msvIEJDphdKmK0Xg4ZpALBhQfIS9mhwKjzPZXIvkuRfJci9nFSYQwGJqQx+mM8jN2eJDoJbo11f8aVyL5LkXyVbtU8lQ8mWIcN5WsYLIuRfJci+S5F8lyL5LkXyVUH/hj3SEFZNEXZZlyxE7o9IVTuDxGEcAq0PZHELp2pyrzjPe8Ery
