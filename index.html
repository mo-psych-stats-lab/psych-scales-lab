ر<\/b> متعلق بما تسنده الدرجة من معنى واستخدام، و<b>الثبات/الاتساق<\/b> متعلق باستقرار نتيجة أو قرار القياس؛ لا يغني أحدهما عن الآخر.<\/li><li><b>ثبات الدرجة مقابل ثبات القرار:<\/b> ثبات الدرجة عند إعادة التطبيق أو عبر أجزاء الاختبار شيء، وثبات قرار التصنيف حول حد قطع شيء آخر. في المحكي يُهتم باتفاق قرارات «متقن/غير متقن»، وفي المعياري تبرز المقارنات بين فروق درجات الأشخاص.<\/li><li><b>جودة الأداة لا تُختزل في معامل رقمي واحد،<\/b> ولا يكفي ثبات مرتفع لإثبات ملاءمتها لغرض معين؛ لأن الثبات لا يحدد بمفرده ما يقيسه الاختبار ولا يبرر جميع قرارات تفسير الدرجة.<\/li><\/ul><aside class=\"box convert\"><div class=\"bt\">التطبيق على المقاييس النفسية<\/div><p>في المقاييس النفسية يُبلَّغ عن: ثبات الاتساق الداخلي (ألفا، والأفضل معه أوميغا)، وثبات الاستقرار (إعادة التطبيق)، وفي نماذج راش: <b>ثبات الأفراد ومعامل الفصل<\/b> و<b>ثبات المفردات ومعامل الفصل<\/b> (بحث «الأداء التفاضلي لنوع الطالب على مقياس الاتزان الانفعالي»: 0.89 / 2.91 للأفراد، و0.98 / 7.07 للمفردات، ص 379). وإذا استُخدمت نقاط قطع تصنيفية وجب الإبلاغ أيضًا عن <b>اتساق التصنيف<\/b> — وهو ما يذكّر به الكتاب.<\/p><\/aside>"}, {"title": "2.11 درجة القطع وطرق تحديدها (ص 89–120)", "en": "", "html": "<p><b><\/b> يخصص الكتاب جزءًا مطولًا لمفهوم درجة القطع لأنها تربط الدرجة بحكم تربوي أو مهني.<\/p><div class=\"en\" dir=\"ltr\">Cut-off Score<\/div><h4><b>2.11.1 المفهوم والتسميات (ص 89–94)<\/b><\/h4><ul><li><b>تعدد التسميات:<\/b> درجة القطع، درجة الاجتياز، مستوى الحد الأدنى للكفاية، درجة المحك؛ وتختلف الصياغة بحسب غرض الاختبار.<\/li><li><b>تعريف عملي:<\/b> نقطة على متصل الدرجات تُستخدم للفصل بين فئات حكم أو أداء (مثل إتقان/عدم إتقان)؛ أهميتها في <b>المعنى المترتب على العبور من جانب إلى آخر<\/b>، لا في قيمتها العددية المجردة. <b>ليست قيمة طبيعية ثابتة في كل اختبار<\/b>؛ يجب تبريرها من حيث مضمون المجال والقرارات المترتبة عليها والأخطاء المتوقعة.<\/li><li><b>لماذا تختلف قيمتها؟<\/b> يتأثر تحديدها بتعريف الأداء الأدنى المقبول، وجودة المفردات، وأخطار القرار الخاطئ، وطبيعة مجال الاستخدام، وإجراء التحكيم.<\/li><li><b>أثر الخطأ قرب الحد:<\/b> قرب الدرجة من الحد يعني أن تغيرًا صغيرًا في الأداء أو القياس قد يغيّر التصنيف؛ لذلك يُرفق الحكم بإيضاح حدود الدقة.<\/li><li><b>التكلفة الأخلاقية للقرار:<\/b> الرفع الشديد للحد قد يزيد استبعاد المؤهلين، وخفضه قد يتيح اجتياز غير المؤهلين. لذلك <b>اختيار الدرجة قرار تفسيري وتنظيمي وليس استنتاجًا رياضيًا بحتًا<\/b>. والمناقشة السليمة لا تسأل فقط «ما الرقم؟» بل «ما نوع الخطأ الذي نريد تقليله؟».<\/li><li>يُفرّق بين <b>وضع<\/b> حد القطع بأحكام الخبراء وبين <b>فحص<\/b> ما يحدث فعليًا عند استخدامه على بيانات واقعية (تحديد القطع مقابل تطبيقه).<\/li><li><b>تسلسل مقترح لمناقشة أي درجة قطع شفهيًا:<\/b> يُسأل <b>أولًا<\/b>: ما تعريف الإتقان أو الكفاية؟ <b>ثم<\/b>: هل تقدير درجة القطع جاء من حكم الخبراء أو من توزيع الدرجات أو من معيار خارجي؟ <b>وأخيرًا<\/b>: ما حساسية القرار لأخطاء التصنيف؟ ولا ينبغي عرض درجة القطع على أنها درجة «طبيعية» ثابتة لا تتغير مع الغرض من الاختبار.<\/li><li><b>الفارق بين التمييز الإحصائي والقرار المحكي:<\/b> مجرد اختيار درجة رقمية لا يكفي لإثبات دقتها؛ القرار يتأثر بتعريف الإتقان، وبالطلبة المفحوصين، وبأخطاء التصنيف. ومن الضروري التمييز بين <b>مستوى أداء الطالب<\/b> وبين <b>نوع القرار<\/b> الذي يتخذه مستخدم الاختبار بناءً على درجة القطع.<\/li><\/ul><aside class=\"box note\"><div class=\"bt\">ملاحظة: نوعا الخطأ في قرار التصنيف<\/div><p><b>القرار / الحقيقة<\/b><\/p><p><b>متمكن حقيقة<\/b><\/p><p><b>غير متمكن حقيقة<\/b><\/p><p>صُنّف متمكنًا<\/p><p>تصنيف صحيح<\/p><p><b>إيجابي كاذب <\/b><\/p><div class=\"en\" dir=\"ltr\">False Positive<\/div><p><b>صُنّف غير متمكن<\/b><\/p><p><b>سلبي كاذب <\/b><\/p><p><b>تصنيف صحيح<\/b><\/p><div class=\"en\" dir=\"ltr\">False Negative<\/div><p>تغيير الحد قد يخفض أحد الخطأين لكنه يرفع الآخر. ويرمز الكتاب في بعض الطرق إلى الخطأين بـ α (الأول) وβ (الثاني)؛ ويلزم استخدام تعريفهما المحدد في نموذج الدراسة وعدم تبديل التسميات عند الحساب.<\/p><\/aside><h4><b>2.11.2 تصنيف الطرق كما يعرضه الكتاب<\/b><\/h4><p>يفصّل الكتاب مناهج التحكيم والمنهج التجريبي وبعض محاولات الجمع بينهما، ويورد ميزات وعيوبًا وأمثلة حسابية وجداول لبعض الطرق؛ وتتباين الطرق <b>في طبيعة المعلومات اللازمة وفي مقدار تأثرها بحجم العينة ومهارة المحكمين<\/b>. ومن الضروري بيان <b>مصدر<\/b> درجة القطع لا الاكتفاء بذكر الرقم النهائي.<\/p><h4><b>(أ) طرق التحكيم والخبرة (ص 92–101)<\/b><\/h4><p>يقيّم محكّمون متخصصون المحتوى أو المفردات أو التوقعات بشأن أداء <b>الفرد ذي الحد الأدنى من الكفاية (الشخص الحدّي)<\/b>؛ وتتطلب الطريقة تعريفًا صريحًا لهذا الشخص وتدريب المحكمين.<\/p><p><b>1) طريقة أنجوف (ص 94–98)<\/b><\/p><div class=\"en\" dir=\"ltr\">Angoff<\/div><ul><li>يقدّر المحكمون <b>احتمال أن يجيب الفرد ذو الكفاية الحدّية إجابة صحيحة عن كل مفردة<\/b>، ثم تُجمع التقديرات لاستخراج درجة قطع على مجموع درجات الاختبار، وتُراجع الأحكام حسب خطة التحكيم.<\/li><li>يوضح الكتاب مشكلاتها: <b>غموض تعريف الفرد الحدّي<\/b> وتباين التقديرات. التباس تعريف هذا الفرد يؤدي إلى تباعد الأحكام حتى إن كانت العمليات الحسابية سليمة.<\/li><li>لماذا يُحتاج إلى محكمين مدربين؟ لأن تقدير أداء الفرد الحدّي يتطلب فهمًا مشتركًا للحد الأدنى من الكفاية وللبنود.<\/li><\/ul><aside class=\"box made\"><div class=\"bt\">مثال توضيحي: منطق أنجوف<\/div><p>في اختبار من <b>5<\/b> بنود أعطى أحد المحكمين الاحتمالات: <b>0.8، 0.7، 0.6، 0.5، 0.4<\/b>. مجموعها <b>3.0 من 5<\/b>. وإذا اشترك أكثر من محكم تُراجع الفروق بين تقديراتهم ويُحسب الحد وفق إجراءات اللجنة (مثلًا متوسط مجاميع المحكمين). <\/p><\/aside><p><b>2) طريقة إيبل والجدول ذو البعدين (ص 92–96)<\/b><\/p><div class=\"en\" dir=\"ltr\">Ebel<\/div><ul><li>تستند إلى تصنيف البنود وفق <b>أهمية المحتوى<\/b> و<b>الصعوبة المقدّرة<\/b> (جدول ثنائي البعد)، ثم التقديرات المناسبة لفئات البنود والاستفادة من أحكام المحكمين. (توضيح: تُقدَّر عادة النسبة المتوقعة لنجاح الحدّي في كل خلية.)<\/li><li>يتناول النص مزاياها ومواطن قصورها، ومنها: اعتماد الحكم على تقييمات ليست مساوية للأداء الواقعي، وصعوبة تحديد بعض مناطق المحتوى، والتعامل مع التفاوت الفعلي في صعوبة البنود.<\/li><li><b>للمذاكرة:<\/b> فرق بين «أهمية البند في المحتوى» و«صعوبة البند بالنسبة للممتحَن»؛ فقد يكون بند سهل لكنه أساسي للغاية، أو بند صعب لكنه قليل الأهمية في القرارات المراد اتخاذها.<\/li><\/ul><p><b>3) طريقة نيدلسكي وطريقة مركبة<\/b><\/p><div class=\"en\" dir=\"ltr\">Nedelsky<\/div><ul><li>يورد الكتاب <b>طريقة مركبة تجمع متوسطًا مشتقًا من أنجوف وندلسكي (ص 100)<\/b>؛<\/li><li><b>مراجعة الاحتمالات للمفردات:<\/b> تدفع بعض الطرائق إلى تقديرات منفصلة بشأن بدائل الإجابة، غير أن زيادة تفاصيل الحكم تجعل المهمة أثقل وتزيد احتمال الاختلاف.<\/li><li><b>تعديل الأحكام ببيانات تجريبية:<\/b> يمكن تقديم معلومات عن أداء الطلاب ومفردات الاختبار للمحكمين ثم إعادة التقدير؛ البيانات قد تساعد على الواقعية لكنها <b>قد تؤثر أيضًا في استقلالية الحكم<\/b>.<\/li><\/ul><h4><b>(ب) طرق تجمع الحكم بالبيانات (ص 102–108)<\/b><\/h4><p><b>حدود التحكيم الخالص (ص 102؛ المطبوع ص 106):<\/b> قد لا تعكس تقديرات الخبراء الأداء الفعلي للطلاب، وقد ينتج عنها معيار متشدد أو متساهل؛ لذلك ينتقل العرض إلى طرق تجمع بين التقديرات المهنية وبعض معلومات الأداء الواقعي.<\/p><p><b>4) الطريقة التحكيمية المعززة بالمعلومات الحكم المستنير (ص 102–103)<\/b><\/p><div class=\"en\" dir=\"ltr\">Informed Judgment<\/div><ul><li>تُقدَّم للمحكمين <b>بيانات سابقة عن أداء الطلاب<\/b> إلى جانب الحكم على المفردات أو المستوى المطلوب، فلا يكون القرار بمعزل عن معلومات واقعية. يورد الكتاب اسم <b>بوفام (1981)<\/b>.<div class=\"en\" dir=\"ltr\">Popham<\/div><\/li><li>المغزى: المعلومات التجريبية لا تلغي دور المحكمين لكنها تقيّد تقديراتهم بمؤشرات أداء؛ ولا يلزم من ذلك أن الدرجة الناتجة صحيحة تلقائيًا، بل تجب مراجعة آثار التصنيف.<\/li><\/ul><p><b>5) طريقة التوفيق بين المطلق والنسبي طريقة التسوية بين المطلق والنسبي (ص 106–108)<\/b><\/p><div class=\"en\" dir=\"ltr\">Absolute–Relative Compromise<\/div><ul><li>صيغة توفيقية بين <b>معيار مطلق للأداء<\/b> وبين ما يظهر من مستويات الطلاب في بيانات التطبيق. يُطلب تقدير: <b>حد أدنى مقبول لنسبة المفردات الصحيحة (K)<\/b>، و<b>نسبة متوقعة لاجتياز الطلاب (V)<\/b>، ثم إجراء <b>مواءمة بيانية<\/b> تجمع التوزيع الفعلي للدرجات مع الأحكام المهنية لتحديد نقطة القطع (ص 106–107).<\/li><li><b>التمييز الأساسي:<\/b> K يعبر عن الأداء المطلوب على الاختبار؛ V يعبر عن النسبة المتوقعة للاجتياز؛ <b>لا يجوز التعامل معهما كمية واحدة<\/b>. وتوضح الصفحات علاقة تنازلية/توفيقية عند المفاضلة بين التشدد في حد النجاح ونسبة الناجحين.<\/li><li><b>المميزات (ص 108):<\/b> تدمج حكم الخبراء بالأداء الفعلي، وتفصل بين المستوى المطلق والنسبي.<\/li><li><b>القيود (ص 108):<\/b> تتطلب جهدًا تحكيميًا كبيرًا وتحتاج <b>أربعة تقديرات<\/b>، ما قد يجعلها أصعب من طرق أخرى في التحكيم والإجراءات الإحصائية.<\/li><\/ul><h4><b>(ج) الطرق التجريبية المدعومة بالتحكيم الطريقة التجريبية–التحكيمية (ص 108–114)<\/b><\/h4><p>Empirical-Judgmental<\/p><p><b>6) طريقة المجموعات المحكية المجموعات المحكّية (ص 108–109):<\/b> مقارنة مجموعات محددة مسبقًا من المتقنين وغير المتقنين والبحث عن حد يفصل بينهما مع مراعاة أخطاء التصنيف.<\/p><div class=\"en\" dir=\"ltr\">Criterion Groups<\/div><aside class=\"box note\"><div class=\"bt\">ملاحظة<\/div><p>يجب <b>عدم دمج التسميات الثلاث<\/b> (المجموعات المحكية، والمتضادة، والحدّية) في أسلوب واحد؛ فالفكرة الجامعة هي الاستعانة بمعلومات عن مستوى الأفراد لاستخراج حد ذي معنى، لكن يختلف أساس بناء المجموعات ومدى الاعتماد على حكم الخبراء والتوزيعات المرصودة وموضع المجموعة القريبة من الحد. وفي القراءة المركزة للصفحات <b>109–114<\/b> يميّز النص بين <b>معيار للنجاح مستمد من متطلبات الأداء<\/b> وبين <b>قرار تصنيف قد يتأثر بتوزيع الدرجات والعينة<\/b>.<\/p><\/aside><p><b>7) طريقة المجموعات المتضادة — (ليفنجستون وزيكي, 1982) (ص 112–113)<\/b><\/p><div class=\"en\" dir=\"ltr\">Livingston &amp; Zieky, 1982 · Contrasting Groups<\/div><ul><li>يُفصل الطلبة <b>بمعرفة المحكمين وبالاستناد إلى معلومات عن مهاراتهم ومستويات أدائهم<\/b> إلى مجموعتين تمثلان المستوى الجيد جدًا والمستوى الضعيف؛ بعد تطبيق الاختبار يُرسم توزيع درجات كل مجموعة، ويُتخذ <b>تقاطع منحنيي التوزيع<\/b> أساسًا مقترحًا لدرجة القطع.<\/li><li><b>المنطق:<\/b> درجة التقاطع تحاول الموازنة بين الإيجابي الكاذب والسلبي الكاذب.<\/li><li><b>الحدود:<\/b> تشترك في مشكلات المجموعات الحكمية، ويصعب معها تحديد مقدار الخطأ الناجم عن الحكم؛ ولا تعني أن تقاطع منحنيين يعطي تلقائيًا حدًا موضوعيًا صالحًا في كل مجتمع. ونجاحها يعتمد على جودة أحكام التصنيف الأولية.<\/li><li><b>شرط الاستقلال:<\/b> تتطلب تعريفًا مستقلًا نسبيًا للمجموعات؛ إذا كان تحديد مستوى الفرد في الأصل يعتمد على الاختبار نفسه تصبح المقارنة <b>دائرية<\/b>.<\/li><\/ul><p><b>8) طريقة المجموعة الحدّية — (ليفنجستون وزيكي, 1982) (ص 113)<\/b><\/p><div class=\"en\" dir=\"ltr\">Livingston &amp; Zieky, 1982 · Borderline Group<\/div><ul><li>اختيار طلاب يُرى أنهم يقعون على الحد الفاصل بين التمكن وعدم التمكن، ثم تطبيق الاختبار عليهم، ويؤخذ <b>وسيط درجاتهم<\/b> ليمثل بداية مستوى الأداء المطلوب (يُفضَّل الوسيط لأنه القيمة الوسطى لتوزيع درجات من وصفهم الخبراء بأنهم على الحد).<\/li><li><b>المميزات:<\/b> سهولة الفهم والتطبيق والحساب نسبيًا، وعدم الحاجة إلى عدد كبير من الطلاب للحصول على تقديرات مستقرة نسبيًا.<\/li><li><b>العيوب:<\/b> صعوبة اتفاق المحكمين أو المعلمين على من يمثّل المستوى الحدّي، وصعوبة تحديد الشخص الواقع بدقة على حد الإتقان، وصعوبة انتقاء حجم مناسب من هذه الفئة.<\/li><\/ul><p><b>9) طريقة المحك المعياري للمرجع المحك المعياري المرجع (ص 114)<\/b><\/p><div class=\"en\" dir=\"ltr\">Norm-Referenced Criterion<\/div><ul><li>ينقل الكتاب عن <b>بيرك (1986)<\/b> إمكان الاستناد إلى العلاقة بين درجات القطع في الاختبار محكي المرجع ودرجات الأداء في اختبار معياري المرجع، مع الاعتماد على <b>نسبة ثبات القرارات (P)<\/b>، و<b>ثبات القرارات المصحح عن عامل الصدفة (K)<\/b>، و<b>دالة الفقد (L)<\/b>.<div class=\"en\" dir=\"ltr\">Berk<\/div><\/li><li><b>الميزة:<\/b> سهلة الفهم والتطبيق والحساب إذا توفرت بيانات الاختبار المعياري.<\/li><li><b>القيد:<\/b> مثار انتقاد لأن اتخاذ درجة قطع اختبار معياري المرجع أساسًا لمحك الإتقان قد يكون غير منطقي؛ فترتيب الأشخاص بالنسبة للآخرين ليس مساويًا لإثبات إتقان محتوى محدد.<\/li><\/ul><p><b>10) طريقة النتائج التربوية العواقب التربوية — (الكتلة, 1972) (نهاية ص 114)<\/b><\/p><div class=\"en\" dir=\"ltr\">Block, 1972 · Educational Consequences<\/div><ul><li>ينسب الكتاب إلى <b>بيرك (1986)<\/b> عرضها بوصفها تربط درجة الاختبار <b>بقرارات أو نتائج تعليمية لاحقة<\/b>.<div class=\"en\" dir=\"ltr\">Berk<\/div><\/li><\/ul><h4><b>(د) طرق احتمالية ونظرية القرار (ص 115–118)<\/b><\/h4><p><b>11) طريقة إمريك لتقويم اختبارات التمكن طريقة إمريك لتقويم اختبارات الإتقان (1971) (ص 115–116)<\/b><\/p><div class=\"en\" dir=\"ltr\">Emrick's Mastery Testing Evaluation<\/div><ul><li>تربط الطريقة <b>بنظرية القرار<\/b> وتحديد أخطاء تصنيف الفرد إلى متقن وغير متقن، مع صيغة حسابية لوغاريتمية لتعيين درجة القطع.<\/li><li><b>الرموز بحسب الكتاب:<\/b> α = الخطأ الأول؛ β = الخطأ الثاني؛ <b>نسبة الفاقد = نسبة الفاقد للخطأين الأول والثاني<\/b>؛ N = عدد الأسئلة؛ K = درجة القطع.<div class=\"en\" dir=\"ltr\">RR<\/div><\/li><li><b>المغزى:<\/b> لا تتعامل مع القطع بصفته متوسط درجات أو قرار خبراء، بل <b>تُدخل تكلفة القرار الخاطئ<\/b>؛ تعديل تكاليف الخطأ يغيّر درجة القطع المثلى؛ مع عدم الخلط بين <b>معدلات الخطأ<\/b> و<b>خسارة كل نوع من الأخطاء<\/b>.<\/li><\/ul><p><b>12) طريقة نوفيك ومعاونيه نوفيك ومعاونوه (ص 116)<\/b><\/p><div class=\"en\" dir=\"ltr\">Novick and collaborators<\/div><ul><li>يذكر الكتاب أن عرض <b>ميسكاوسكاس (1976)<\/b> يجمع طريقة مبنية على تغيير درجة القطع والتوزيع الاحتمالي للقرارات الصحيحة والخاطئة من النوع الأول والثاني؛ يُضاف إلى توزيع الدرجات توزيع احتمالي مشتق، ثم تُناقش القيمة المقدّرة لمستوى الطالب الحقيقي في ضوء احتمال حصوله على درجة معينة.<div class=\"en\" dir=\"ltr\">Meskauskas<\/div><\/li><li><b>نقطة مهمة:<\/b> من الاتجاهات <b>الاحتمالية<\/b>؛ لا تعتمد على وصف مجموعة الحدّيين وحده، وتتطلب افتراضات وبيانات عن التوزيع أكثر من الطرق الحكمية؛ ولا يورد الجزء المقروء خطوات حسابية كافية، فلا يُخترع مثال باسمها.<\/li><\/ul><p><b>13) طريقة رودابوش للدرجة الحقيقية الثنائية طريقة رودابوش للدرجة الحقيقية الثنائية (ص 116–117)<\/b><\/p><div class=\"en\" dir=\"ltr\">Roudabush's Dichotomous True Score<\/div><ul><li>موجهة للاختبارات ذات <b>المفردات ثنائية الدرجة<\/b>، وينسب وصفها إلى ميسكاوسكاس (1976). تقوم على التمييز بين <b>الدرجة الحقيقية<\/b> و<b>درجة القطع<\/b> وتوزيع النتائج المحتملة، وحصر احتمالات <b>أربع حالات تصنيف<\/b> وفق التمكن الحقيقي وقرار الاختبار (الجدول في 2.11.1).<div class=\"en\" dir=\"ltr\">Meskauskas<\/div><\/li><\/ul><p><b>14) طريقة ميلمان المبنية على ذي الحدين قرار ميلمان القائم على التوزيع ذي الحدين (ص 117)<\/b><\/p><div class=\"en\" dir=\"ltr\">Millman's Binomial-Based Decision<\/div><ul><li>ينقل الكتاب عن <b>هامبلتون وآخرون (1978)<\/b> وصف جداول <b>توزيع ثنائي الحدين<\/b> تساعد في قرارات التمكن تحت افتراض اختبار من بنود ثنائية التصحيح ومستوى حقيقي مفترض، ويذكر استخدام درجات افتراضية تقع في مدى <b>من −1 إلى صفر<\/b> في العرض، ثم ربطها بالتكرارات والبيانات.<div class=\"en\" dir=\"ltr\">Hambleton et al<\/div><\/li><li><b>التمييز المنهجي:<\/b> الاستناد إلى ذي الحدين يختلف عن اختيار حد اعتباطي، لكنه يفترض خصائص محددة للبنود والإجابات. القسم وصفي ولا يعرض جدولًا عدديًا كاملًا صالحًا للاشتقاق.<\/li><\/ul><p><b>15) طريقة ديفز–دايموند البايزية طريقة ديفيز–دايموند البايزية (ص 118)<\/b><\/p><div class=\"en\" dir=\"ltr\">Davis–Diamond Bayesian Method<\/div><ul><li>منهج <b>بايزي<\/b> يستخدم درجات الاختبار وتقديرات احتمالية لمستوى الكفاية الحقيقي، ويورد مثالًا لجدول احتمالي لاختبارات قصيرة ودرجات قطع مختلفة؛ ويبيّن أن <b>نسبة الثقة المطلوبة بصحة التصنيف<\/b> و<b>ما يُعد مستوى كفاية حقيقية<\/b> يؤثران في القرار.<\/li><li>ترد في صورة الصفحة أرقام مثل <b>0.99 و0.85 و0.785 و0.90<\/b>؛ ولأنها تنتمي إلى شروط واحتمالات مختلفة <b>لا يصح تجميعها في معادلة واحدة أو تعميمها خارج السياق<\/b>.<\/li><\/ul><h4><b>2.11.3 معايير اختيار طريقة القطع وفق عرض بيرك (ص 118–120)<\/b><\/h4><p>Berk<\/p><div class=\"tw\"><table><tr><th><div class=\"cp\"><b>المجموعة<\/b><\/div><\/th><th><div class=\"cp\"><b>المعيار<\/b><\/div><\/th><th><div class=\"cp\"><b>معناه في اختيار الطريقة<\/b><\/div><\/th><\/tr><tr><td><div class=\"cp\">فنية<\/div><\/td><td><div class=\"cp\">ملاءمة معلومات التصنيف<\/div><\/td><td><div class=\"cp\">تمكين قرار إتقان/عدم إتقان أو نجاح/فشل<\/div><\/td><\/tr><tr><td><div class=\"cp\">فنية<\/div><\/td><td><div class=\"cp\">الحساسية لاختلافات صعوبة البنود وتمييزها<\/div><\/td><td><div class=\"cp\">تفاعل الحد مع خصائص الاختبار<\/div><\/td><\/tr><tr><td><div class=\"cp\">فنية<\/div><\/td><td><div class=\"cp\">الحساسية للتعلم والتدريب<\/div><\/td><td><div class=\"cp\">تعكس تغير الكفايات بعد التعليم الفعلي<\/div><\/td><\/tr><tr><td><div class=\"cp\">فنية<\/div><\/td><td><div class=\"cp\">الأساليب الإحصائية المناسبة<\/div><\/td><td><div class=\"cp\">إمكان تفسير الإجراء الإحصائي تفسيرًا صحيحًا<\/div><\/td><\/tr><tr><td><div class=\"cp\">فنية<\/div><\/td><td><div class=\"cp\">مراعاة أخطاء القياس<\/div><\/td><td><div class=\"cp\">عدم تجاهل عدم اليقين قرب الحد<\/div><\/td><\/tr><tr><td><div class=\"cp\">فنية<\/div><\/td><td><div class=\"cp\">صدق القرار<\/div><\/td><td><div class=\"cp\">تقدير احتمالات التصنيف الصحيح والخاطئ<\/div><\/td><\/tr><tr><td><div class=\"cp\">تطبيقية<\/div><\/td><td><div class=\"cp\">سهولة التطبيق<\/div><\/td><td><div class=\"cp\">إجراء واضح لا يتطلب تعقيدًا غير مبرر<\/div><\/td><\/tr><tr><td><div class=\"cp\">تطبيقية<\/div><\/td><td><div class=\"cp\">سهولة الحساب<\/div><\/td><td><div class=\"cp\">إمكان حسابه بأدوات متاحة<\/div><\/td><\/tr><tr><td><div class=\"cp\">تطبيقية<\/div><\/td><td><div class=\"cp\">سهولة التفسير<\/div><\/td><td><div class=\"cp\">فهم نتائجه من المعلمين والمسؤولين وغير المختصين<\/div><\/td><\/tr><tr><td><div class=\"cp\">تطبيقية<\/div><\/td><td><div class=\"cp\">المقبولية/المصداقية<\/div><\/td><td><div class=\"cp\">ثقة المستخدمين في المنهج والقرار<\/div><\/td><\/tr><\/table><\/div><p><b>عوامل إضافية (ص 120، نقلًا عن بيرك 1982):<\/b> (1) مدى أهمية القرارات المبنية على الحد؛ (2) كلفة الأخطاء في تحديد الدرجة؛ (3) توافر الموارد المالية والبشرية؛ (4) كفاية المحكمين ومستوى التحصيل لدى الطلاب؛ (5) مدى مناسبة الطريقة لنوعية الاختبار وأفراد العينة.<\/p><div class=\"en\" dir=\"ltr\">Berk 1982<\/div><p><b>كيفية المقارنة بين الطرق (ملخص الكتاب):<\/b> وضوح التعريف، الوقت والموارد، كفاءة المحكمين، طبيعة الاختبار، أهمية قرارات النجاح/الرسوب، والثقة العامة بالطريقة. <b>لا توجد «طريقة أفضل مطلقًا» لمجرد أنها أكثر تعقيدًا رياضيًا<\/b>؛ المفاضلة تشمل جودة قرار التصنيف وإمكان تطبيقه ومدى قبول نتائجه. ووجود أسماء طرق متعددة لا يعني صلاحيتها بالتساوي. وتظل الحاجة الأساسية إلى <b>الإبلاغ عن منهج تقدير الحد والأخطاء الممكنة حوله ودرجة الاتفاق بين أعضاء التحكيم.<\/b><\/p><h4><b>2.11.4 مصفوفة مقارنة شاملة لطرق القطع<\/b><\/h4><div class=\"tw\"><table><tr><th><div class=\"cp\"><b>الطريقة<\/b><\/div><\/th><th><div class=\"cp\"><b>نوع الأدلة / مصدر الحد<\/b><\/div><\/th><th><div class=\"cp\"><b>الميزة الأساسية<\/b><\/div><\/th><th><div class=\"cp\"><b>القيد الأساسي<\/b><\/div><\/th><\/tr><tr><td><div class=\"cp\">أنجوف<\/div><\/td><td><div class=\"cp\">احتمالات المحكمين لنجاح الحدّي في كل بند<\/div><\/td><td><div class=\"cp\">جمع مباشر لأحكام البنود<\/div><\/td><td><div class=\"cp\">غموض تعريف الحدّي وتباين التقديرات<\/div><\/td><\/tr><tr><td><div class=\"cp\">إيبل<\/div><\/td><td><div class=\"cp\">جدول أهمية × صعوبة + أحكام<\/div><\/td><td><div class=\"cp\">يفصل الأهمية عن الصعوبة<\/div><\/td><td><div class=\"cp\">أحكام لا تساوي الأداء الواقعي<\/div><\/td><\/tr><tr><td><div class=\"cp\">ندلسكي/المركبة<\/div><\/td><td><div class=\"cp\">أحكام مرتبطة بعدد البدائل + متوسط مشتق من أنجوف وندلسكي (ص 100)<\/div><\/td><td><div class=\"cp\">تجمع طريقتين<\/div><\/td><td><div class=\"cp\">جداولها غير مؤكدة في النسخة<\/div><\/td><\/tr><tr><td><div class=\"cp\">التحكيم المعزز بالمعلومات<\/div><\/td><td><div class=\"cp\">حكم الخبراء + بيانات أداء سابقة<\/div><\/td><td><div class=\"cp\">تقليل انفصال الحكم عن الواقع<\/div><\/td><td><div class=\"cp\">يتأثر بنوعية بيانات الأداء واستقلالية الحكم<\/div><\/td><\/tr><tr><td><div class=\"cp\">التوفيق المطلق–النسبي<\/div><\/td><td><div class=\"cp\">K + V + توزيع الدرجات<\/div><\/td><td><div class=\"cp\">موازنة معيار الأداء وحجم الاجتياز<\/div><\/td><td><div class=\"cp\">تقديرات متعددة وجهد تحكيمي<\/div><\/td><\/tr><tr><td><div class=\"cp\">المجموعات المحكية<\/div><\/td><td><div class=\"cp\">مجموعات معروفة المستوى + درجات فعلية<\/div><\/td><td><div class=\"cp\">وصل القطع بمحك خارجي<\/div><\/td><td><div class=\"cp\">صعوبة تحديد المحك والمجموعات<\/div><\/td><\/tr><tr><td><div class=\"cp\">المجموعات المتضادة<\/div><\/td><td><div class=\"cp\">تقاطع توزيعي المتمكنين وغير المتمكنين<\/div><\/td><td><div class=\"cp\">يربط الحد بنتائج مجموعتين معرفتين<\/div><\/td><td><div class=\"cp\">أخطاء الحكم والتصنيف<\/div><\/td><\/tr><tr><td><div class=\"cp\">المجموعة الحدّية<\/div><\/td><td><div class=\"cp\">وسيط درجات ذوي الأداء الحدّي<\/div><\/td><td><div class=\"cp\">سهولة الفهم والحساب<\/div><\/td><td><div class=\"cp\">صعوبة تعيين المجموعة الحدّية<\/div><\/td><\/tr><tr><td><div class=\"cp\">المحك المعياري للمرجع<\/div><\/td><td><div class=\"cp\">محك/اختبار معياري (P, K, L)<\/div><\/td><td><div class=\"cp\">الاستفادة من بيانات معيارية متوافرة<\/div><\/td><td><div class=\"cp\">خلط مرجع الجماعة بإتقان المحك<\/div><\/td><\/tr><tr><td><div class=\"cp\">النتائج التربوية<\/div><\/td><td><div class=\"cp\">صلة الدرجة بنتائج تعليمية لاحقة<\/div><\/td><td><div class=\"cp\">ربط القرار بعاقبته<\/div><\/td><td><div class=\"cp\">تفاصيلها تحتاج مطابقة الصفحات<\/div><\/td><\/tr><tr><td><div class=\"cp\">إمريك<\/div><\/td><td><div class=\"cp\">نظرية القرار وتكلفة الخطأين (α, β, نسبة الفاقد)<\/div><div class=\"en\" dir=\"ltr\">α, β, RR<\/div><\/td><td><div class=\"cp\">يدخل كلفة القرار<\/div><\/td><td><div class=\"cp\">معادلة غير منقولة حرفيًا<\/div><\/td><\/tr><tr><td><div class=\"cp\">نوفيك/رودابوش/ميلمان<\/div><\/td><td><div class=\"cp\">توزيعات احتمالية/ثنائية الحدين<\/div><\/td><td><div class=\"cp\">أساس احتمالي<\/div><\/td><td><div class=\"cp\">افتراضات وبيانات أكثر<\/div><\/td><\/tr><tr><td><div class=\"cp\">ديفز–دايموند<\/div><\/td><td><div class=\"cp\">منهج بايزي<\/div><\/td><td><div class=\"cp\">يدمج الثقة المطلوبة بالتصنيف<\/div><\/td><td><div class=\"cp\">أرقام المثال سياقية لا تُعمَّم<\/div><\/td><\/tr><\/table><\/div><p>(المصفوفة تركيب تحريري؛<\/p><aside class=\"box convert\"><div class=\"bt\">التطبيق على المقاييس النفسية: كيف تُحدَّد نقاط القطع في المقاييس؟<\/div><ul><li><b>المجموعات المتضادة<\/b> و<b>المجموعة الحدّية<\/b> تنتقلان إلى المقاييس النفسية مباشرة: مجموعة مشخَّصة إكلينيكيًا (أو حكم أخصائي مستقل) مقابل مجموعة غير مشخصة، ثم يُختار الحد الذي يوازن بين الحساسية والنوعية. وهذا هو منطق <b>منحنى خصائص التشغيل<\/b> الحديث، وهو امتداد مباشر لفكرة «تقاطع منحنيي التوزيع» والموازنة بين الإيجابي الكاذب والسلبي الكاذب.<div class=\"en\" dir=\"ltr\">ROC<\/div><\/li><li><b>شرط عدم الدائرية<\/b> الذي يذكره الكتاب حاسم: لا يُعرَّف «المرتفعون» بدرجتهم على المقياس نفسه ثم يُستخرج منهم الحد.<\/li><li><b>أنجوف وإيبل<\/b> أنسب لمقاييس الأداء المهاري والكفايات (قوائم الملاحظة، بطاقات التقدير) منها لمقاييس السمات.<\/li><li><b>التقسيم الوصفي الشائع<\/b> في الرسائل العربية (منخفض/متوسط/مرتفع بطول الفئة = المدى ÷ عدد المستويات، أو بالمتوسط ± انحراف معياري) هو قرار معياري/اصطلاحي <b>وليس<\/b> درجة قطع محكية؛ ويجب أن يُذكر ذلك صراحة حتى لا يُفهم أنه تصنيف إكلينيكي.<\/li><\/ul><\/aside>"}, {"title": "2.12 الكفايات والتحليل الهرمي والمقياس التشخيصي (ص 120–127)", "en": "", "html": "<p><b><\/b> يربط الكتاب قياس الإتقان بتحليل الكفايات إلى مهارات ومعارف قابلة للتعلم والملاحظة.<\/p><h4><b>الانتقال إلى الاختبارات التشخيصية (ص 120)<\/b><\/h4><p>الاختبارات التشخيصية تساعد في بيان <b>الصعوبات التي يواجهها المتعلم<\/b> أثناء تعلم مهارات أو كفايات معينة، سواء كان سببها سوء فهم أو عدم إتقان لإجراءات أو عمليات تعلم لازمة؛ وهذا يختلف عن اقتصار وظيفة الاختبار على النجاح والرسوب أو ترتيب الأفراد. تبدأ خطوات البناء بـ <b>«تحديد الكفايات والمهارات الرئيسية للخبرة ومحتواها»<\/b> بوصفها الهدف الذي يراد من البرنامج التعليمي أو التدريبي إكسابه.<\/p><h4><b>تحديد الكفاية ومعايير اختيارها (ص 121)<\/b><\/h4><ul><li>الكفاية <b>مجموعة منظمة متكاملة من المعارف والمهارات والأداء الوظيفي<\/b> في مجال محدد، تُصاغ بما يسمح بتحديد مستويات الإنجاز، ويمكن تحديدها وقياسها من خلال البرنامج — لا مجرد درجة مرتفعة في اختبار عام.<\/li><li><b>وسائل تحديدها:<\/b> الاستعانة بخبراء المادة، وتحليل محتوى المنهج أو البرنامج التدريبي، ودراسة احتياجات الفئة المستهدفة، وتحليل المتطلبات المهنية في التدريب.<\/li><li><b>معايير اختيارها:<\/b> اتساع الكفاية، وإمكان تعليمها، وإمكان انتقال أثرها، ومدى تمثيلها للسلوك الختامي المطلوب. فلا يكفي وضع قائمة أسماء مهارات؛ ينبغي تحديد أي أداء يمثل إتقانها فعلًا.<\/li><\/ul><h4><b>التحليل الهرمي (ص 121–122)<\/b><\/h4><p>يبدأ الباحث بكفاية نهائية مركبة ثم يسأل: <b>ما المعارف والمهارات السابقة اللازمة لتحقيقها؟<\/b> ويستمر في التفكيك إلى متطلبات أدنى ومهارات وسيطة مع تنظيمها في تتابع منطقي؛ فيعرف ما ينبغي تعليمه أولًا وما ينبغي قياسه لاحقًا، وتتسق البنود التشخيصية مع بنية المهارة لا مع العناوين العامة. وإذا بُنيت المفردات على خطوات مترابطة فالفشل في مهارة سابقة قد يفسر ضعف الأداء في مهارة لاحقة؛ ويتطلب التفسير التمييز بين <b>خطأ عابر<\/b> و<b>عدم تحقق شرط معرفي سابق<\/b>.<\/p><h4><b>الأهداف السلوكية — المكونات الأربعة (ص 123)<\/b><\/h4><p><b>السلوك المتوقع، والمحتوى المرجعي، وشروط الأداء، ومستوى الأداء المقبول.<\/b> ويصبح الهدف قابلًا للتحويل إلى مفردة عندما يكون المطلوب ملاحظًا وقابلًا للتقدير.<\/p><aside class=\"box made\"><div class=\"bt\">مثال توضيحي<\/div><p>«أن يحدد المتعلم الخطأ في <b>8<\/b> عبارات من أصل <b>10<\/b> باستخدام جدول قواعد معطى خلال عشر دقائق». السلوك (يحدد)، المحتوى (الأخطاء)، الشرط (جدول القواعد والوقت)، المستوى (8 من 10).<\/p><\/aside><h4><b>أنماط التعلم ومستوياته وعلاقتها بالمفردات (ص 124–127)<\/b><\/h4><ul><li><b>مجالات الإمكانات العقلية (ص 124):<\/b> ثلاثة أنماط مترابطة: <b>المعلومات، والمهارات العقلية، والاستراتيجيات المعرفية<\/b>؛ استرجاع معلومة ليس هو توظيف قاعدة، ولا يطابق إدارة الفرد لتفكيره أثناء مهمة معقدة.<\/li><li><b>الترابط اللفظي وغير اللفظي (ص 125):<\/b> تعلم علاقات بين مثيرات واستجابات؛ قد يكفي في تشخيصه الكشف عن ثبات الاستجابة المرتبطة بالمثير، بشرط ألا تُحمَّل المفردة مطلبًا أعلى من المهارة.<\/li><li><b>التمييز (ص 126):<\/b> الاستجابة بصورة مختلفة لمثيرات تختلف في خصائص محددة (ألوان، أشخاص، كلمات، أنواع)؛ وتقيس المفردة الخاصية المطلوب تمييزها لا خصائص عرضية.<\/li><li><b>المفاهيم (ص 126):<\/b> تصنيف الأشياء أو الأحداث استنادًا إلى خواص مشتركة مجردة (لون، شكل، عدد)؛ يعتمد على التمييز بين الأمثلة وغير الأمثلة؛ واختبار المفهوم الجيد يحتاج أمثلة متنوعة.<\/li><li><b>المبادئ (ص 126):<\/b> علاقات أو ترابطات بين مفهومين أو أكثر؛ بنودها تتطلب فهم العلاقات وتطبيقها.<\/li><li><b>حل المشكلات واستخلاص النتائج (ص 126–127):<\/b> تحديد المشكلة وتحليلها واختيار المبادئ الملائمة وتطبيقها، ومستوى استخلاص النتائج ذاتيًا؛ وبنودها تقدم موقفًا لم تُكشف فيه خطوات الحل كاملة مع إتاحة مؤشرات كافية لتقدير الأداء.<\/li><\/ul><aside class=\"box made\"><div class=\"bt\">مثال توضيحي: جدول إرشادي مقترح<\/div><p>يمكن تحويل تحليل الكفاية إلى جدول يرصد لكل هدف سلوكي: <b>شكل المهمة، وعدد البنود، وشرط نجاحها<\/b>.<\/p><p><b>الهدف السلوكي<\/b><\/p><p><b>شكل المهمة<\/b><\/p><p><b>عدد البنود<\/b><\/p><p><b>شرط النجاح<\/b><\/p><p>يحدد الخطأ في عبارات باستخدام جدول قواعد<\/p><p>تحديد/تصويب<\/p><p>10<\/p><p>8 من 10 خلال 10 دقائق<\/p><\/aside><aside class=\"box convert\"><div class=\"bt\">التطبيق على المقاييس النفسية<\/div><p>التحليل الهرمي يقابله في المقاييس النفسية <b>تحليل البناء إلى أبعاد ومؤشرات<\/b> (البناء ← الأبعاد ← المؤشرات السلوكية ← العبارات)، وهو جوهر «جدول المواصفات». ومستويات التعلم (معلومات/مهارات/استراتيجيات معرفية) هي الأساس النظري لكثير من <b>المقاييس المعرفية<\/b> وما وراء المعرفة (الفصل السادس).<\/p><\/aside>"}, {"title": "2.13 فن تطبيق المقياس (فن إعطاء الاختبارات) (ص 128–149)", "en": "", "html": "<p><b><\/b> الجزء الأخير يركز على أن <b>الدرجة نتاج تفاعل الأداة والمفحوص والفاحص وظروف الموقف<\/b>، وليست خاصية آلية منفصلة عن التطبيق. وإعطاء الاختبار إجراء مهني له أثر في النتيجة.<\/p><h4><b>2.13.1 التقنين الإجرائي والتطبيق الموحد (ص 128–130)<\/b><\/h4><ul><li>يربط الكتاب التقنين بوجود <b>قواعد صريحة وثابتة للتطبيق<\/b>، وبالحد من الاختلاف الناتج عن الأشخاص الذين يجرون الاختبار؛ فثبات إجراءات الإعطاء لا يقل أهمية عن خصائص البنود عند تفسير نتائج الأفراد.<\/li><li>توحيد <b>التعليمات والزمن والتجهيز والمكان وطريقة الإجابة<\/b> يقلل تفاوت الفرص بين الأفراد، ويجعل المقارنة أقدر على عكس الخاصية المقاسة؛ وعدم إجراء تغييرات مرتجلة في زمن الإجابة أو طريقة الشرح.<\/li><\/ul><h4><b>2.13.2 مهارات الفاحص واستعداده (ص 129–131)<\/b><\/h4><ul><li>لا تُختزل كفاءة الفاحص في تلاوة التعليمات، خصوصًا مع المقابلات والملاحظات والمواقف التي تتطلب تدريبًا متخصصًا. قراءة التعليمات حرفيًا قد تكفي لإجراء بسيط، بينما <b>المقابلة الفردية والأسئلة المتابعة والملاحظة المباشرة<\/b> تحتاج تدريبًا على قواعد الاستفسار وتوثيق الاستجابات والتعامل مع الحالات الخاصة.<\/li><li>ينبغي دراسة الدليل والتدرب على التعليمات وتسجيل الاستجابات وحل المشكلات المسموح التعامل معها أثناء التطبيق <b>دون تغيير قواعد الاختبار<\/b>؛ وألا يعتمد على الارتجال لحظة مواجهة المفحوصين.<\/li><\/ul><h4><b>2.13.3 الاتجاه العلمي وتحيز الفاحص (ص 131)<\/b><\/h4><p>يحذر الكتاب من ميل الفاحص إلى تفسير أداء المفحوص بما يتفق مع توقعاته السابقة أو اهتمامه النظري؛ فيلتزم بالملاحظة والإجراءات المحددة <b>ولا يمنح الاستنتاج الأولي سلطة على الوقائع المسجلة<\/b>.<\/p><h4><b>2.13.4 ملاءمة الأداة للمفحوص (ص 132)<\/b><\/h4><p>المسؤولية المهنية تشمل التأكد من صلاحية الاختبار للقدرات والمرحلة العمرية والثقافة وظروف الأداء؛ ويذكر النص مثالين: <b>اختبار المتاهة لمن يعاني صعوبة في التحكم بحركة اليد<\/b>، و<b>اختبار ميول معدّ لطلاب الجامعة مع تلاميذ أصغر<\/b>. <b>الدرجة الناتجة من اختبار غير ملائم قد تكون مضللة أشد من غياب الدرجة<\/b>، لأنها تبدو موضوعية لكنها تعكس إعاقة حركية أو سوء ملاءمة لغوية أو عمرية لا السمة المستهدفة.<\/p><h4><b>2.13.5 البيئة المادية وإعداد المكان والأدوات (ص 132–133)<\/b><\/h4><p>الإضاءة والهدوء والجلوس والمساحة والتهوية والقدرة على سماع التعليمات وتناول المواد اللازمة وضبط التشتيت؛ <b>ليست تفاصيل ثانوية<\/b> عندما يمكنها تغيير الأداء، فتُثبَّت وفق الدليل أو تُسجَّل الاختلافات المهمة بينها.<\/p><h4><b>2.13.6 التطبيق الجماعي والفردي (ص 134–135)<\/b><\/h4><ul><li><b>الجماعي:<\/b> وضع الفاحص في موضع يمكّنه من رؤية المشاركين ويسمح لهم برؤيته وسماع تعليماته، وبدء التعليمات بعد استقرار الجميع، بوضوح وبساطة، مع ضبط مستوى الرسمية بقدر ملائم لطبيعة الاختبار، ومنع الفوضى أو الغش.<\/li><li>تختلف إدارة الجلسة الجماعية عن مقابلة مفحوص واحد، في ضبط التعليمات وطرح الأسئلة والاستجابة للاستفسارات وأثر وجود الآخرين.<\/li><\/ul><h4><b>2.13.7 توحيد التعليمات ووضوح المطلوب (ص 135–136)<\/b><\/h4><p>اختلاف أسلوب إعطاء التعليمات مصدر غير مقصود لفروق الدرجات؛ لذا يُحدد المطلوب بدقة، ويُوضّح <b>في الحدود التي يجيزها الدليل<\/b> دون تدريب خاص على الحل أو تقديم تلميحات لبعض المشاركين دون الآخرين. وتصحيح الخطأ في بعض الإجراءات <b>لا يصح أن يتحول إلى تلميحات عن الإجابات<\/b>.<\/p><h4><b>2.13.8 التخمين ودافعية الاختبار (ص 136–137)<\/b><\/h4><p>يناقش الكتاب أثر التخمين وإجراءات تصحيحه (انظر 2.5.5)، ويؤكد أن <b>الدوافع والاستعداد النفسي لأخذ الاختبار<\/b> يغيّران الأداء.<\/p><h4><b>2.13.9 القلق وعلاقته بالأداء (ص 139)<\/b><\/h4><p>القلق المصاحب للاختبار <b>ليس ذا أثر واحد ثابت<\/b>: قد ترتبط مستويات منه بانخفاض الأداء أو ارتفاعه وفق درجة القلق وطبيعة المهمة؛ وتفيد بعض الدراسات بأثر <b>القلق الميسّر<\/b> على الأداء، بينما القلق المفرط معيق. فلا يصح أن يختزل الفاحص كل انخفاض في الدرجة إلى نقص القدرة المقاسة. والنتيجة التطبيقية: يراعي القائم على التطبيق الموقف الانفعالي <b>ولا يقدم المساعدة بما يغير معيار أداء المفحوص<\/b>، بل يهيئ مناخًا موحدًا قدر الإمكان..<\/p><h4><b>2.13.10 التهيئة وإدراك غرض الاختبار والتعاون (ص 140)<\/b><\/h4><ul><li>في فقرة «التهيئة لأخذ الاختبار» يشدد النص على أهمية أن <b>يرغب المفحوص في أن تكون درجته صادقة<\/b>؛ فالتعاون شرط عملي لتحسين تمثيل الدرجة لما يُراد قياسه.<\/li><li>يُفضَّل شرح الهدف المباشر للفحص بلغة مفهومة وبيان نوع القرار الذي قد يُستفاد من النتيجة فيه، مع توضيح أن التعاون مسؤولية مشتركة <b>لا تعني أن الفاحص سيؤدي الاختبار بدل المفحوص<\/b>.<\/li><li>أمثلة سياقات الاستخدام: العلاج والإرشاد النفسي، والالتحاق بمؤسسة تعليمية، واتخاذ قرارات مهنية.<\/li><\/ul><h4><b>2.13.11 المعلومات التمهيدية ومقابلات ما قبل الاختبار (ص 140–141)<\/b><\/h4><ul><li>تقديم معلومات تمهيدية للمفحوص قبل التطبيق وتقليل الغموض بشأن طبيعة الموقف.<\/li><li>إجراء <b>مقابلة أو أكثر تسبق اختيار الأداة<\/b> في السياقات الإرشادية لتحديد المشكلة واختيار الاختبار الأنسب؛ وظيفة المقابلة هنا ليست استبدال الاختبار، بل تحديد سؤال القياس والسياق والحاجة إلى بيانات إضافية.<\/li><li><b>تمييز مفاهيمي:<\/b> التهيئة تُعنى بالموقف النفسي وفهم الغرض؛ المقابلة التمهيدية تُعنى بتحديد المشكلة واختيار الأداة؛ تعليمات الأداء الفعلية تتبع ضوابط الاختبار المستخدم.<\/li><\/ul><h4><b>2.13.12 التدريب على الاختبار وأثر الخبرة السابقة (ص 141)<\/b><\/h4><ul><li>ظهور برامج لتدريب المفحوصين على الاختبارات النفسية، وأمثلة لتعليم حل مسائل في الاستعداد الرياضي أو اللفظي قبل الاختبار مع احتمال ارتفاع الدرجات نتيجة التدريب؛ ويناقش الكتاب <b>حدود الزيادة مع زيادة ساعات التدريب<\/b>.<\/li><li>فقد تعكس بعض فروق الأفراد تباين <b>الاستعداد أو الخبرة أو الألفة بإجراءات الاختبار<\/b> لا البناء المقاس وحده؛ لذا يُراعى عند المقارنة بين المجموعات ما إذا كان أحدها تلقى تدريبًا لا يتاح للآخر. ولا تُعمَّم مقادير التحسن العددية المذكورة في أمثلة الكتاب على كل الاختبارات.<\/li><li>التدريب على <b>مهارات التعامل مع نمط البنود أو حيل الإجابة<\/b> قد يؤثر في الأداء، ما يقتضي الانتباه لخبرة المفحوص السابقة ومدى صلتها بالبناء.<\/li><\/ul><h4><b>2.13.13 العلاقة بين الفاحص والمفحوص (ص 142–147)<\/b><\/h4><ul><li><b>العلاقة الاختبارية:<\/b> تعاون واحترام وطمأنة مع قدر رسمي ملائم؛ سوء التواصل قد يحول القلق وعدم الفهم إلى انخفاض في الأداء. ويشير الكتاب إلى علامات سوء العلاقة الاختبارية وما قد تسببه من قلق أو نفور، وأهمية <b>حياد الفاحص<\/b> وعدم التأثير في نوع الاستجابة. والحدة أو الغموض في الموقف قد يؤثران في الدافعية.<\/li><li><b>طرفا العلاقة (ص 143–144):<\/b> لا يدخل المفحوص الموقف <b>بصفحة نفسية بيضاء<\/b>؛ يحمل تصورات ومخاوف وتوقعات عن الفاحص والاختبار. والفاحص يحمل توقعات وخبرات وحاجات، فيتعامل معها بوصفها مصادر محتملة للتأثير لا حقائق عن المفحوص.<\/li><li><b>المقاومة (ص 144–145):<\/b> قد تظهر في التردد أو الانسحاب أو كثرة الاعتراض أو المبالغة في إظهار العجز؛ والعلاج مناخ مناسب ودعم عاطفي مهني <b>دون الإفراط في التساهل أو التصلب، أو الاعتماد المفرط على الاختبارات لتهدئة شكوك الفاحص نفسه<\/b>.<\/li><li><b>التفاعل بين شخصية الفاحص والمفحوص:<\/b> توقعات الفاحص واتجاهاته وتصوراته قد تؤثر في التعليمات والتواصل وتفسير السلوك؛ ويورد النص صورًا من ظواهر التأثير المتبادل.<\/li><li><b>اللغة واللهجة والفروق الثقافية (ص 146–147):<\/b> اختلاف اللهجات أو صعوبة اللغة قد يعوق فهم البند مع أن السمة المقاسة موجودة؛ ويُستحسن عند الحاجة <b>الاستعانة بفاحص متمكن من لهجة المفحوص<\/b>، مع إدراك أن اللغة تعمل داخل سياق اجتماعي وعلاقة إنسانية أوسع، وأن عدم الملاءمة الثقافية قد يصعّب التطبيق حتى مع ثبات النص المطبوع.<\/li><li><b>التيسيرات:<\/b> حاجات المستفيدين الذين يتطلب أداؤهم ترتيبات مناسبة؛ وصلاحية أي تيسير مرتبطة باحترام ما صُممت الأداة لقياسه <b>وبالتوثيق الصريح للتعديل<\/b>.<\/li><\/ul><h4><b>2.13.14 دافعية المفحوص والممتحِن وحماية النتائج من مصالح الفاحص (ص 148–149)<\/b><\/h4><ul><li>قد تؤثر حاجات الطرفين إلى النجاح أو إثبات تصور سابق في الأداء والتقدير.<\/li><li>يؤكد الفصل الأخير خطورة تشويه النتائج إذا كانت للفاحص <b>مصلحة في نتيجة معينة<\/b>، مادية أو متصلة بإثبات رأي أو نجاح برنامج تعليمي؛ وقد تدفع رغبات الفاحص في تأكيد رأيه إلى انتقاء الأدلة أو التصرف بطرق تغير الأداء.<\/li><li><b>الإجراء الوقائي:<\/b> فكرة <b>الحجب أو التعمية<\/b>: إخفاء معلومات المجموعات عن مطبقي الاختبار ومصححيه حين تسمح الظروف البحثية، و<b>خلط أوراق القياسات القبلية والبعدية أو التجريبية والضابطة وفق ترميز محفوظ مستقلًا<\/b>، لمنع أثر المعرفة المسبقة في التسجيل والتصحيح.<\/li><li><b>المغزى المنهجي:<\/b> موضوعية القياس لا تتعلق فقط ببنية الاختبار، بل أيضًا <b>باستقلال من يطبق الأداة ويسجل نتائجها ويصححها<\/b> عن التوقعات والمكافآت والمصالح المرتبطة بالمخرجات.<\/li><\/ul><h4><b>2.13.15 القرار النهائي<\/b><\/h4><p>نتيجة الاختبار تفسَّر في سياق معلومات أخرى وحدود الثقة وظروف التطبيق؛ <b>لا يجوز إخفاء العوامل التي تجعل النتيجة أقل قابلية للمقارنة أو التعميم.<\/b><\/p><h4><b>2.13.16 جداول جامعة لفصل التطبيق<\/b><\/h4><div class=\"tw\"><table><tr><th><div class=\"cp\"><b>المرحلة<\/b><\/div><\/th><th><div class=\"cp\"><b>الخطر الذي يناقشه الكتاب<\/b><\/div><\/th><th><div class=\"cp\"><b>الإجراء الوقائي المستفاد<\/b><\/div><\/th><\/tr><tr><td><div class=\"cp\">تحليل المهارة<\/div><\/td><td><div class=\"cp\">صياغة بنود لا تمثل بنية الكفاية<\/div><\/td><td><div class=\"cp\">تحليل هرمي وتحديد متطلبات سابقة<\/div><\/td><\/tr><tr><td><div class=\"cp\">الأهداف<\/div><\/td><td><div class=\"cp\">الغموض في الأداء ومستوى الإتقان<\/div><\/td><td><div class=\"cp\">صياغة السلوك والمحتوى والشروط والمستوى<\/div><\/td><\/tr><tr><td><div class=\"cp\">اختيار الاختبار<\/div><\/td><td><div class=\"cp\">عدم ملاءمة القدرة أو السن أو اللغة<\/div><\/td><td><div class=\"cp\">مراجعة ملاءمة الأداة قبل التطبيق<\/div><\/td><\/tr><tr><td><div class=\"cp\">إعطاء التعليمات<\/div><\/td><td><div class=\"cp\">فروق ناتجة عن تدخل الفاحص<\/div><\/td><td><div class=\"cp\">توحيد التعليمات قدر الإمكان<\/div><\/td><\/tr><tr><td><div class=\"cp\">موقف الاختبار<\/div><\/td><td><div class=\"cp\">الإضاءة أو الضوضاء أو سوء الجلوس<\/div><\/td><td><div class=\"cp\">ضبط البيئة وتسجيل الانحرافات<\/div><\/td><\/tr><tr><td><div class=\"cp\">العلاقة المهنية<\/div><\/td><td><div class=\"cp\">المقاومة والتوقعات المتبادلة<\/div><\/td><td><div class=\"cp\">علاقة مهنية داعمة وغير إيحائية<\/div><\/td><\/tr><tr><td><div class=\"cp\">تصحيح الدرجات<\/div><\/td><td><div class=\"cp\">توقعات الفاحص ومصالحه<\/div><\/td><td><div class=\"cp\">إخفاء معلومات المجموعات والترميز المستقل<\/div><\/td><\/tr><\/table><\/div><div class=\"tw\"><table><tr><th><div class=\"cp\"><b>المشكلة<\/b><\/div><\/th><th><div class=\"cp\"><b>كيف تظهر<\/b><\/div><\/th><th><div class=\"cp\"><b>الأثر في تفسير الدرجة<\/b><\/div><\/th><\/tr><tr><td><div class=\"cp\">قلق الاختبار<\/div><\/td><td><div class=\"cp\">انفعال أثناء الأداء<\/div><\/td><td><div class=\"cp\">قد يضيف تغيرًا عابرًا لا يعود إلى القدرة وحدها<\/div><\/td><\/tr><tr><td><div class=\"cp\">نقص فهم التعليمات<\/div><\/td><td><div class=\"cp\">خطأ في المطلوب أو توقيت الاستجابة<\/div><\/td><td><div class=\"cp\">قد يتحول الاختبار إلى قياس للفهم الإجرائي<\/div><\/td><\/tr><tr><td><div class=\"cp\">التدريب السابق<\/div><\/td><td><div class=\"cp\">ألفة بالأسئلة أو سرعة الإجابة<\/div><\/td><td><div class=\"cp\">قد تعكس الدرجة خبرة سابقة متفاوتة<\/div><\/td><\/tr><tr><td><div class=\"cp\">توقعات الفاحص<\/div><\/td><td><div class=\"cp\">تباين التلميحات أو التشجيع<\/div><\/td><td><div class=\"cp\">قد تتباين ظروف التطبيق بين المفحوصين<\/div><\/td><\/tr><\/table><\/div><p>.<\/p><aside class=\"box convert\"><div class=\"bt\">التطبيق على المقاييس النفسية<\/div><p>في المقاييس ذات التقرير الذاتي يتحول «أثر الفاحص» إلى خطرين إضافيين: (1) <b>المرغوبية الاجتماعية<\/b> حين يشعر المستجيب أنه مُراقَب أو مُقيَّم؛ (2) <b>الإيحاء في التعليمات<\/b> (مثل قول: «نريد أن نعرف كم أنت متزن انفعاليًا»). والوقاية: تعليمات محايدة («لا توجد إجابات صحيحة وخاطئة»)، وسرية الاستجابة، وعدم حضور المدرّس صاحب السلطة، وتوحيد طريقة التطبيق (ورقي/إلكتروني) أو فحص تكافؤهما — وقد اقترح بحث «الأداء التفاضلي لنوع الطالب على مقياس الاتزان الانفعالي» نفسه دراسة <b>تكافؤ القياس بين الصورة الورقية والإلكترونية<\/b> لمقياس الاتزان الانفعالي (ص 388). كما أن تطبيق المقياس «بلا ضغط زمني وعلى مدى شهرين» في ذلك البحث (ص 383) يقابل ما يسميه البحث «التحرر من السرعة» (أحد افتراضات نظرية الاستجابة للمفردة)، ويتصل بتمييز الكتاب بين اختبارات السرعة والقدرة.<\/p><div class=\"en\" dir=\"ltr\">IRT<\/div><\/aside>"}, {"title": "2.14 مقارنات علمية جامعة من موضوعات الكتاب", "en": "", "html": "<div class=\"tw\"><table><tr><th><div class=\"cp\"><b>المقارنة<\/b><\/div><\/th><th><div class=\"cp\"><b>الطرف الأول<\/b><\/div><\/th><th><div class=\"cp\"><b>الطرف الثاني<\/b><\/div><\/th><\/tr><tr><td><div class=\"cp\">الأداة مقابل الدرجة<\/div><\/td><td><div class=\"cp\">الاختبار يتضمن بنودًا وإجراءات وشروط تطبيق وتصحيح<\/div><\/td><td><div class=\"cp\">الدرجة ناتج من تطبيقه ولا تكفي وحدها للحكم<\/div><\/td><\/tr><tr><td><div class=\"cp\">الخام مقابل المفسَّر<\/div><\/td><td><div class=\"cp\">رقم ناتج من التصحيح<\/div><\/td><td><div class=\"cp\">دلالة مرتبطة بمعيار/محك<\/div><\/td><\/tr><tr><td><div class=\"cp\">التحليل الكيفي مقابل الكمي<\/div><\/td><td><div class=\"cp\">يحكم على تمثيل البند ووضوحه وخلوه من المشكلات (مضمون ولغة ومفتاح وبدائل)<\/div><\/td><td><div class=\"cp\">يدرس استجابات عينة فعلية وتمييزها وصعوبتها<\/div><\/td><\/tr><tr><td><div class=\"cp\">الجماعة المعيارية مقابل المحك<\/div><\/td><td><div class=\"cp\">تحدد موقع الفرد بين الآخرين<\/div><\/td><td><div class=\"cp\">تفحص بلوغه حد أداء أو مهارة معرّفة؛ وقد يفيد الاثنان لنفس الأداة لأغراض مختلفة<\/div><\/td><\/tr><tr><td><div class=\"cp\">الصدق مقابل الثبات<\/div><\/td><td><div class=\"cp\">ملاءمة تفسير النتائج وما تسنده الدرجة من معنى واستخدام<\/div><\/td><td><div class=\"cp\">اتساق القياس أو القرار<\/div><\/td><\/tr><tr><td><div class=\"cp\">الصعوبة مقابل التمييز<\/div><\/td><td><div class=\"cp\">مستوى نجاح العينة في البند<\/div><\/td><td><div class=\"cp\">فروق الأداء بين مستويات القدرة<\/div><\/td><\/tr><tr><td><div class=\"cp\">التصحيح مقابل التفسير<\/div><\/td><td><div class=\"cp\">تحويل الاستجابات إلى درجات<\/div><\/td><td><div class=\"cp\">ربط الدرجات بسياقها ومعيارها ودليل صدقها والقرار الناتج عنها<\/div><\/td><\/tr><tr><td><div class=\"cp\">تحديد القطع مقابل تطبيقه<\/div><\/td><td><div class=\"cp\">اختيار حد مناسب بالحجج والأدلة<\/div><\/td><td><div class=\"cp\">استخدام الحد على درجات الأفراد<\/div><\/td><\/tr><tr><td><div class=\"cp\">صلاحية المحتوى مقابل التمييز الإحصائي<\/div><\/td><td><div class=\"cp\">انتماء البند للنطاق المحدد وتغطيته<\/div><\/td><td><div class=\"cp\">أداء البند في العينة المستخدمة<\/div><\/td><\/tr><\/table><\/div>"}]}, "p3": {"key": "p3", "no": 3, "title": "خطوات إعداد المقاييس النفسية — ومن العلماء وراء كل خطوة", "en": "Part Three: Steps of Psychological Scale Development — and the Scholars Behind Each Step", "sections": [{"title": "3.1 الإطار العام: ثلاث مراحل واثنتا عشرة خطوة", "en": "", "html": "<div class=\"tw\"><table><tr><th><div class=\"cp\"><b>المرحلة (بواتينج وآخرون، 2018)<\/b><\/div><div class=\"cp\">Boateng et al., 2018<\/div><\/th><th><div class=\"cp\"><b>الخطوات<\/b><\/div><\/th><\/tr><tr><td><div class=\"cp\"><b>أولًا: تطوير البنود <\/b><\/div><div class=\"en\" dir=\"ltr\">Item Development<\/div><\/td><td><div class=\"cp\">1. تحديد البناء والغرض ومراجعة الأدبيات — 2. التعريف المفاهيمي والإجرائي — 3. تحديد الأبعاد وجدول المواصفات — 4. توليد العبارات — 5. اختيار صيغة الاستجابة والتصحيح — 6. صياغة العبارات ومراجعتها لغويًا — 7. صدق المحتوى بتحكيم الخبراء — 8. المقابلات المعرفية والتجريب القبلي<\/div><\/td><\/tr><tr><td><div class=\"cp\"><b>ثانيًا: بناء المقياس <\/b><\/div><div class=\"en\" dir=\"ltr\">Scale Construction<\/div><\/td><td><div class=\"cp\">9. التطبيق الاستطلاعي وتحليل العبارات — 10. تحديد البنية العاملية (التحليل العاملي الاستكشافي ثم التحليل العاملي التوكيدي)<\/div><div class=\"en\" dir=\"ltr\">EFA · CFA<\/div><\/td><\/tr><tr><td><div class=\"cp\"><b>ثالثًا: تقويم المقياس <\/b><\/div><div class=\"en\" dir=\"ltr\">Scale Evaluation<\/div><\/td><td><div class=\"cp\">11. الثبات، والصدق التقاربي والتمييزي والمحكي، والعدالة (الأداء التفاضلي للمفردة/التكافؤ) — 12. التقنين والمعايير ونقاط القطع ودليل المقياس، ثم التحقق المستمر<\/div><div class=\"en\" dir=\"ltr\">DIF<\/div><\/td><\/tr><\/table><\/div>"}, {"title": "3.2 الخطوات بالتفصيل", "en": "", "html": "<figure><img src=\"data:image/webp;base64,UklGRl77AABXRUJQVlA4IFL7AADwFwSdASp4BdwDPmEuk0ckIqIhIvL7OIAMCWVu/CjqThCKB2UsQDUe6X8mpC2Ty2UAWYBrEeLizr/m8LGj/df9D/Mfuz7ZnP/jH9L1P/8XhL7p/2/MX6G9Cv+y/b73J/2T/h/+z3B/7b/bf2e9w3/29Sn+T/8//j9gn9U/z37qe7p/yv/h/x/d5/hv+P+1v/I+QL+1f6z/6e2T/6//////hC/xf/e////t+Cj+c/7b//+0V/7/3o+HX+8f+H90fbB////n9wD//+23/AP//1w/Tv+u/2j9cffn8i/T/7V/bv8l/lP8F+zXtv+N/N/27+2f5T/W/272qf7//H+Mn0T+d/4P+p9S/5B9m/w392/y3+7/vP72fdD9x/yX+A/yX/N/yvo38av5r+//uL/efkF/I/5b/ef7p/kv+T/cP3u92//b/wvdSbb/qP9L/j/3o+AX16+ff6r+8/5b/z/5r0l/7T/E/vF/bf//8m/qX90/1H+F/dP/Hf///y/oD/NP6l/rP7t/j//N/oP///8/vz/ZeFP+C/2f7P/AF/PP7t/5f8f/pf3c+mL+q/8v+k/4f7S+4D9E/z//h/0n+2/ab7Cv5p/af+Z/if9H+03////H36f///5/DH98f/////iF/eH////8op3aSshkpb60wu7SVkMlLfWmF3aSshkpb60wu7SVkMlLfWmF3aSshkpb60wu7SVkMbEh6diznqc9Tnqc9Tnqc9Tnqc9Tnqc9Tnqc9Tnqc9Tnqc9Tnqc9Tnqc9Tnqc9Tnqc9Tnqc9Tnqc9Tnqc9Tnqc9Tnqc9Tnqc9Tnqc9TmEGcrtZDJK6mB3PpJWd1YRsC9wcxkOMhxkOMhxkOMhxkOMhxkOMhxkOMhxkOMhxkOMhxkOMhxkOMhxkOMhxkOMhxkOMhxkOMhxkOMhxkOMhxdN8Ko0ie0T2iWtf/Ra1+z6AESTr0dCN5QXQ5TRFEno/EPS5vUqSajCR/cLzEcWfsoquXaVIFYJA+nwKRQ8u6GDzxbknQkRQ89OWImtDqV3vkpb60wu7SVkMlLfWmF3aSshkpb60wu7QR3ag2J+MT
