U7ngp4xcstpHu6D8uPAsYLXNBM8o4xTc9Gb8AKEgP2dyHR68fKiZuXJPx/iMrrC9Xm/v/ww5WU2cZIchzbluIJR7xIPT9wTOO+8Okgqd20uR3rZgXspRo9iQVT9UhJOFu7QAOXjz7raH1yYpKSu19mxbEm4AAAAAAAAAAA=\" alt=\"الأداء التفاضلي المنتظم وغير المنتظم للمفردة (Zumbo, 1999)\"><figcaption>الأداء التفاضلي المنتظم وغير المنتظم للمفردة (Zumbo, 1999)<\/figcaption><\/figure><h4><b>البيانات الببليوغرافية<\/b><\/h4><ul><li><b>العنوان:<\/b> الكشف عن الأداء التفاضلي لنوع الطالب على مفردات مقياس الاتزان الانفعالي باستخدام طريقة مانتل–هانزل وفق افتراضات نظرية الاستجابة للمفردة.<\/li><li><b>English:<\/b> Detecting the Differential Item Function of Gender on the Emotional Balance Scale Using Mantel-Haenszel Method According to the Assumptions of Item Response Theory.<\/li><li><b>الباحثون:<\/b> مصطفى محمد سيد (مدرس مساعد)، أ.د. رأفت عطية باخوم، <b>أ.د. نجاة زكي موسى<\/b>، أ.م.د. محمد إبراهيم محمد — كلية التربية، جامعة المنيا..<\/li><li><b>الموضع:<\/b> مج 37، ع 1، يناير 2022، ص 361–396.<\/li><\/ul><h4><b>الهدف والأسئلة (ص 361، 366–367)<\/b><\/h4><ul><li>ما مدى تحقق افتراضات نظرية الاستجابة للمفردة في بيانات عينة التدريج على مقياس الاتزان الانفعالي المعَدّ؟<\/li><li>ما إمكانية الكشف عن الأداء التفاضلي لنوع الطالب على مفردات المقياس بطريقة مانتل–هانزل؟<\/li><\/ul><h4><b>المشكلة كما صاغها البحث (ص 363–366)<\/b><\/h4><ul><li><b>عيوب النظرية الكلاسيكية (ص 363):<\/b> ضعف موضوعية القياس لعدم وجود وحدة ثابتة؛ الاعتماد على الدرجة الكلية؛ تساوي أخطاء القياس لجميع الأفراد؛ افتراض خطية الدرجات.<\/li><li><b>ندرة الدراسات العربية<\/b> التي تدرّج مقاييس الشخصية بـ نظرية الاستجابة للمفردة، و«لم يجد الباحث دراسة بنت مقياسًا للاتزان الانفعالي بـ نظرية الاستجابة للمفردة» (ص 366).<div class=\"en\" dir=\"ltr\">IRT<\/div><\/li><li><b>قضية العدالة:<\/b> خلو المقياس من الأداء التفاضلي للمفردة «شرط ينبغي توافره قبل النشر»، ولا يكفي ترجمة المقاييس الأجنبية (ص 364–366).<div class=\"en\" dir=\"ltr\">DIF<\/div><\/li><\/ul><h4><b>التعريفات (ص 363، 367–368)<\/b><\/h4><ul><li><b>الاتزان الانفعالي (مفاهيميًا):<\/b> «سمة مزاجية يتميز صاحبها بالهدوء والتروي، والاستقرار المزاجي، والثقة في انفعالاته، والقدرة على تحمل الغموض والإثارة، ولديه القدرة على تحمل الإحباطات والعقبات التي تواجهه في حياته».<\/li><li><b>إجرائيًا:<\/b> الدرجة التي يحصل عليها الطالب على المقياس المعد.<\/li><li><b>الأداء التفاضلي للمفردة (فان دام وآخرون، 2009, 516):<\/b> «اختلاف احتمالية اختيار بدائل الاستجابة لمجموعات المفحوصين ذوي نفس السمة المقيسة باختلاف سماتهم الشخصية المتمثلة في الجنس أو الدين أو البيئة الثقافية وغيرها».<div class=\"en\" dir=\"ltr\">Van Dam et al., 2009, 516 · DIF<\/div><\/li><li><b>مانتل–هانزل (دودين وجوهانسون, 2003):<\/b> طريقة تعتمد على الدرجات الملاحظة وإحصائي مربع كاي، تصلح للمفردات ثنائية ومتعددة الاستجابات.<div class=\"en\" dir=\"ltr\">Dodeen &amp; Johanson, 2003<\/div><\/li><\/ul><h4><b>الإطار النظري المختصر<\/b><\/h4><ul><li><b>افتراضات نظرية الاستجابة للمفردة الأربعة:<\/b> أحادية البعد، الاستقلال الموضعي، التحرر من السرعة، منحنى خصائص المفردة (ص 368–372).<div class=\"en\" dir=\"ltr\">IRT<\/div><\/li><li><b>نوعا الأداء التفاضلي للمفردة (زومبو, 1999):<\/b> <b>منتظم<\/b> (لا تفاعل بين مستوى السمة وعضوية المجموعة) و<b>غير منتظم<\/b> (تفاعل؛ يتغير اتجاه الأفضلية بتغير المستوى) (ص 372–373).<div class=\"en\" dir=\"ltr\">Zumbo, 1999 · DIF<\/div><\/li><li><b>طرق الكشف:<\/b> معلمية (المساحة لراجو، مربع كاي للورد، نسبة الأرجحية) ولا معلمية (الانحدار اللوجستي، اختبار تحيز المفردة المتزامن، مانتل–هانزل) (ص 373–374).<div class=\"en\" dir=\"ltr\">SIBTEST<\/div><\/li><\/ul><p>MHχ² = [ |Σj (aj − E(aj))| − 0.5 ]² / Σj Var(aj) df = 1<\/p><p>E(aj) = (nRj · n1j) / Nj<\/p><p>Var(aj) = (nRj · nFj · n1j · n0j) / (Nj² (Nj − 1))<\/p><p>(0.5 = تصحيح ييتس للاتصال؛ j = طبقات الدرجة الكلية)<\/p><h4><b>المنهج والعينة والأداة (ص 375–378)<\/b><\/h4><ul><li><b>المنهج:<\/b> الوصفي المقارن. <b>العينة:<\/b> 639 طالبًا وطالبة (علمي وأدبي، الفرقتان الأولى والرابعة، 2020/2021)، طبقية عشوائية. <b>لم يُذكر عدد الذكور والإناث.<\/b><\/li><li><b>المقياس:<\/b> 19 عبارة، ليكرت خماسي (لا تنطبق عليّ أبدًا – نادرًا – أحيانًا – غالبًا – دائمًا)؛ أحادي البعد؛ بُني بمراجعة مقاييس كاتل وكومري وديرمن وآخرين والعوامل الخمس ومؤشر مايرز-بريجز للأنماط واستخبار الحالات الثمانية.<div class=\"en\" dir=\"ltr\">Cattell · Comrey · Dermen · MBTI<\/div><\/li><li><b>صدق المحتوى:<\/b> 20 محكمًا من جامعات المنيا وأسيوط وجنوب الوادي والإسكندرية ودمنهور والسويس؛ نسختان ورقية وإلكترونية (نماذج جوجل، ظروف كوفيد-19)؛ صيغة نسبة صدق المحتوى معدّلة؛ القيمة الحرجة 0.42؛ نسبة صدق المحتوى بين 0.50 و1.00؛ <b>مؤشر صدق المحتوى = 0.839<\/b>.<div class=\"en\" dir=\"ltr\">Google Forms · CVR · CVI<\/div><\/li><li><b>الثبات (نموذج سلم التقدير لأندريش، برنامج وينستبس 3.73):<\/b><div class=\"en\" dir=\"ltr\">Winsteps 3.73<\/div><\/li><\/ul><div class=\"tw\"><table><tr><th><div class=\"cp\"><b>المؤشر<\/b><\/div><\/th><th><div class=\"cp\"><b>الأفراد<\/b><\/div><\/th><th><div class=\"cp\"><b>المفردات<\/b><\/div><\/th><\/tr><tr><td><div class=\"cp\">الثبات<\/div><\/td><td><div class=\"cp\">0.89<\/div><\/td><td><div class=\"cp\">0.98<\/div><\/td><\/tr><tr><td><div class=\"cp\">معامل الفصل<\/div><\/td><td><div class=\"cp\">2.91<\/div><\/td><td><div class=\"cp\">7.07<\/div><\/td><\/tr><\/table><\/div><h4><b>النتائج<\/b><\/h4><p><b>السؤال الأول — تحقق افتراضات نظرية الاستجابة للمفردة (ص 380–385):<\/b> مؤشر كايزر–ماير–أولكن = 0.934؛ العامل الأول: جذر 6.705 وتباين 35.291%؛ الثاني: 1.322 و6.959%؛ نسبة الجذرين 5.072 &gt; 2؛ تشبعات العامل الأول 0.310–0.744 (كلها &gt; 0.30) ← <b>أحادية البعد متحققة<\/b>؛ والاستقلال الموضعي حُكم به تبعًا للأحادية؛ والتحرر من السرعة بتطبيق بلا زمن على مدى شهرين؛ ومنحنيات العتبات الأربع للمفردة 11 مرتبة.<\/p><div class=\"en\" dir=\"ltr\">IRT · KMO<\/div><p><b>السؤال الثاني — الأداء التفاضلي للمفردة للنوع (ص 385–387):<\/b> المجموعة المستهدفة = الذكور، المرجعية = الإناث.<\/p><div class=\"en\" dir=\"ltr\">DIF<\/div><div class=\"tw\"><table><tr><th><div class=\"cp\"><b>المفردة<\/b><\/div><\/th><th><div class=\"cp\"><b>نصها<\/b><\/div><\/th><th><div class=\"cp\"><b>صعوبة (ذكور)<\/b><\/div><\/th><th><div class=\"cp\"><b>صعوبة (إناث)<\/b><\/div><\/th><th><div class=\"cp\"><b>الفرق<\/b><\/div><\/th><th><div class=\"cp\"><b>MH<\/b><\/div><\/th><th><div class=\"cp\"><b>الدلالة<\/b><\/div><\/th><th><div class=\"cp\"><b>لصالح<\/b><\/div><\/th><\/tr><tr><td><div class=\"cp\">10<\/div><\/td><td><div class=\"cp\">أتحمل المواقف الغامضة<\/div><\/td><td><div class=\"cp\">−0.32<\/div><\/td><td><div class=\"cp\">−0.10<\/div><\/td><td><div class=\"cp\">−0.22<\/div><\/td><td><div class=\"cp\">4.822<\/div><\/td><td><div class=\"cp\">0.028<\/div><\/td><td><div class=\"cp\">الذكور<\/div><\/td><\/tr><tr><td><div class=\"cp\">12<\/div><\/td><td><div class=\"cp\">أواجه الصعاب بصدر رحب<\/div><\/td><td><div class=\"cp\">−0.37<\/div><\/td><td><div class=\"cp\">−0.11<\/div><\/td><td><div class=\"cp\">−0.26<\/div><\/td><td><div class=\"cp\">5.164<\/div><\/td><td><div class=\"cp\">0.023<\/div><\/td><td><div class=\"cp\">الذكور<\/div><\/td><\/tr><tr><td><div class=\"cp\">16<\/div><\/td><td><div class=\"cp\">أحتفظ بهدوئي عند التعرض لسخافات الآخرين<\/div><\/td><td><div class=\"cp\">0.15<\/div><\/td><td><div class=\"cp\">−0.18<\/div><\/td><td><div class=\"cp\">0.33<\/div><\/td><td><div class=\"cp\">7.081<\/div><\/td><td><div class=\"cp\">0.0078<\/div><\/td><td><div class=\"cp\">الإناث<\/div><\/td><\/tr><tr><td><div class=\"cp\">14 (قريبة)<\/div><\/td><td><div class=\"cp\">أتقبل هزيمة فريقي المفضل بصدر رحب<\/div><\/td><td><div class=\"cp\">0.32<\/div><\/td><td><div class=\"cp\">−0.08<\/div><\/td><td><div class=\"cp\">0.40<\/div><\/td><td><div class=\"cp\">3.413<\/div><\/td><td><div class=\"cp\">0.064<\/div><\/td><td><div class=\"cp\">غير دالة<\/div><\/td><\/tr><\/table><\/div><ul><li><b>القرار:<\/b> حذف المفردات الثلاث (10، 12، 16) فصار المقياس <b>16 مفردة<\/b> متحررة من تحيز النوع؛ وبعد الحذف لا توجد قيم مانتل–هانزل دالة (ص 386–387).<div class=\"en\" dir=\"ltr\">MH<\/div><\/li><li><b>الخلاصة:<\/b> 3 من 19 مفردة (≈ 15.8%) أظهرت الأداء التفاضلي للمفردة منتظمًا.<div class=\"en\" dir=\"ltr\">DIF<\/div><\/li><\/ul><h4><b>التوصيات والبحوث المقترحة (ص 387–388)<\/b><\/h4><ul><li>استخدام المقياس؛ التحول من الكلاسيكية إلى نظرية الاستجابة للمفردة؛ <b>«لا بد عند بناء الاختبارات والمقاييس النفسية والتربوية أن تكون جميع المفردات غير متحيزة لنوع أو جنس أو عرق… فالتحقق من عدم وجود أداء تفاضلي… أصبح ضرورة ملحة لتحقيق عدالة القياس»<\/b> (ص 388).<div class=\"en\" dir=\"ltr\">IRT<\/div><\/li><li>مقترحات: الأداء التفاضلي للمفردة لفئات استجابة قائمة العوامل الخمس؛ الأداء التفاضلي للمفردة <b>غير المنتظم<\/b> للنوع على مقياس كاتل؛ <b>تكافؤ الصورتين الورقية والإلكترونية<\/b>؛ طريقة المساحة الإشارية لراجو.<div class=\"en\" dir=\"ltr\">DIF<\/div><\/li><\/ul><h4><b>تقويم نقدي<\/b><\/h4><div class=\"tw\"><table><tr><th><div class=\"cp\"><b>نقطة القوة<\/b><\/div><\/th><th>جوانب تحتاج إلى استكمال<\/th><\/tr><tr><td><div class=\"cp\">أول بناء لمقياس اتزان انفعالي بـ نظرية الاستجابة للمفردة في البيئة العربية (بحسب البحث)<\/div><div class=\"en\" dir=\"ltr\">IRT<\/div><\/td><td><div class=\"cp\">لم يُذكر عدد الذكور والإناث ولا أعمارهم<\/div><\/td><\/tr><tr><td><div class=\"cp\">تحكيم واسع (20 محكمًا من 6 جامعات) وتكميم بـ نسبة صدق المحتوى/مؤشر صدق المحتوى<\/div><div class=\"en\" dir=\"ltr\">CVR/CVI<\/div><\/td><td><div class=\"cp\">صيغة نسبة صدق المحتوى معدّلة دون تبرير، وعدم اتساق بسيط في الجدول (المفردة 8) والـ مؤشر صدق المحتوى<\/div><div class=\"en\" dir=\"ltr\">CVR · CVI<\/div><\/td><\/tr><tr><td><div class=\"cp\">استخدام نموذج سلم التقدير ومؤشرات الفصل<\/div><\/td><td><div class=\"cp\">لم تُعرض مؤشرات المطابقة مؤشرا المطابقة الداخلية/الخارجية ولا ارتباطات البواقي<\/div><div class=\"en\" dir=\"ltr\">Infit/Outfit<\/div><\/td><\/tr><tr><td><div class=\"cp\">فحص عدالة المفردات بين الجنسين وحذف المتحيز<\/div><\/td><td><div class=\"cp\">لا حجم أثر (تصنيف هيئة خدمات الاختبارات التربوية) ولا تصحيح لتعدد الاختبارات (19 اختبارًا عند 0.05)، ولا تنقية للمحك<\/div><div class=\"en\" dir=\"ltr\">ETS<\/div><\/td><\/tr><tr><td><div class=\"cp\">ربط واضح بين النظرية والتطبيق<\/div><\/td><td><div class=\"cp\">الأداء التفاضلي للمفردة المنتظم فقط؛ لم يُفسَّر اتجاه التحيز نظريًا ولا راجع محتوى المفردات الثلاث<\/div><div class=\"en\" dir=\"ltr\">DIF<\/div><\/td><\/tr><tr><td><div class=\"cp\">—<\/div><\/td><td><div class=\"cp\">يرد في قائمة المراجع لورد. (1980) (دراسة نفسية اجتماعية) بدل لورد. (1980) في نظرية الاستجابة للمفردة؛ ومرجع Hayes (2012) PROCESS لا صلة له بأحادية البعد<\/div><div class=\"en\" dir=\"ltr\">Lord, C. G · Lord, F. M · IRT<\/div><\/td><\/tr><\/table><\/div><h4><b><\/b><\/h4><ul><li><b>نموذج لخطوات إعداد مقياس<\/b> (تعريف ← مراجعة مقاييس ← صياغة ← تحكيم مكمّم ← تطبيق ← أحادية البعد ← راش ← الأداء التفاضلي للمفردة ← صورة نهائية).<div class=\"en\" dir=\"ltr\">DIF<\/div><\/li><li><b>تطبيق عملي لـ «التحليل الكمي للبنود»<\/b> في المادة العلمية (الصعوبة والتمييز) بلغة نظرية الاستجابة للمفردة.<div class=\"en\" dir=\"ltr\">IRT<\/div><\/li><li><b>دليل على أن صدق المحتوى لا يضمن العدالة<\/b>: المفردات 10 و12 و16 صالحة محكَّمًا (نسبة صدق المحتوى 0.90 و0.85 و0.85) لكنها متحيزة للنوع.<div class=\"en\" dir=\"ltr\">CVR 0.90<\/div><\/li><\/ul>"}, {"title": "7.2 المرغوبية الاجتماعية وعلاقتها بالذكاء العاطفي", "en": "", "html": "<h4><b>البيانات الببليوغرافية<\/b><\/h4><ul><li><b>العنوان:<\/b> المرغوبية الاجتماعية وعلاقتها بالذكاء العاطفي لدى طلاب كلية التربية – جامعة المنيا.<\/li><li><b>English:<\/b> Social Desirability and its Relationship to Emotional Intelligence among Students of the Faculty of Education – Minia University.<\/li><li><b>الباحثون:<\/b> <b>أ.د. نجاة زكي موسى<\/b>، أ. عبد الله أحمد جمال (معيد)، أ.م.د. محمد عبد العزيز نور الدين، أ.د. صبري محمود عبد الفتاح.<\/li><li><b>الموضع:<\/b> مج 37، ع 1، يناير 2022، ص 397–424.<\/li><\/ul><h4><b>المشكلة والسؤال (ص 399–401)<\/b><\/h4><ul><li>أغلب البحوث النفسية تعتمد التقرير الذاتي، وميزته: عدد كبير، وقت وجهد أقل، معلومات يصعب جمعها بغيره؛ وعيبه أن الاستجابة «قد لا تعبّر عن سلوكه الفعلي بقدر ما تعبّر عن ميله إلى تقرير سلوكيات تجعله مقبولًا اجتماعيًا».<\/li><li>المرغوبية «تؤثر في المتغير السلوكي المقاس بالإضافة إلى تهديدها لصدق بناء المقاييس» (خيمينيز وآخرون، 2009).<div class=\"en\" dir=\"ltr\">Jiménez et al., 2009<\/div><\/li><li><b>السؤال:<\/b> هل توجد علاقة ارتباطية دالة بين المرغوبية الاجتماعية والذكاء العاطفي لدى طلاب كلية التربية؟<\/li><\/ul><h4><b>التعريفات والنماذج (ص 399–408)<\/b><\/h4><ul><li><b>باولهس (1991):<\/b> المرغوبية «ميل الأفراد إلى تقديم أنفسهم إيجابيًا فيما يتعلق بالقواعد والمعايير الاجتماعية الحالية»، ببُعدين: <b>خداع الذات<\/b> (إنكار غير واعٍ لخصائص غير مرغوبة) و<b>إدارة الانطباع<\/b> (تقديم واعٍ للنفس إيجابيًا).<div class=\"en\" dir=\"ltr\">Paulhus<\/div><\/li><li><b>كراون ومارلو (1960):<\/b> مكوّنا <b>العزو<\/b> و<b>الإنكار<\/b>؛ مقياس من 33 مفردة (18 عزو + 15 إنكار)، نعم/لا؛ مثال: «لم أكره شخصًا في حياتي».<div class=\"en\" dir=\"ltr\">Crowne &amp; Marlowe<\/div><\/li><li><b>إدواردز (1953):<\/b> ميل الأفراد إلى التصديق على مفردات الشخصية ذات القبول الاجتماعي العالي ورفض غير المقبولة حتى لو كانت واقعهم.<div class=\"en\" dir=\"ltr\">Edwards<\/div><\/li><li><b>الذكاء العاطفي:<\/b> نماذج جولمان (1995؛ و2001: 20 كفاءة في 4 تجمعات)، وبار-أون (1997: 5 أبعاد)، وعثمان ورزق (2001)؛ <b>وتبنّى البحث نموذج السمة لـ بار-أون<\/b>.<div class=\"en\" dir=\"ltr\">Goleman (1995) · Bar-On (1997: 5) · Bar-On<\/div><\/li><\/ul><h4><b>الأدوات (ص 411–417)<\/b><\/h4><p><b>1) الاستبيان المتوازن للاستجابة المرغوبة اجتماعيًا قائمة باولهس المتوازنة للاستجابة المرغوبة اجتماعيًا (باولهس, 1991) — ترجمة الباحث (2021):<\/b><\/p><div class=\"en\" dir=\"ltr\">Paulhus, 1991 · BIDR<\/div><ul><li>الأصل 40 عبارة (20 + 20)، تدريج سباعي، تصحيح ثنائي (6–7 = 1؛ 1–5 = صفر).<\/li><li><b>الترجمة العكسية (سون, 2018):<\/b> ترجمة أمامية ← مراجعة لغوية (متخصص عربي) ← ترجمة عكسية دون رؤية الأصل (متخصص إنجليزي) ← محكّمان قارنا النسختين (تطابق ≈ 100%).<div class=\"en\" dir=\"ltr\">Son, 2018<\/div><\/li><li><b>حذف 3 عبارات غير ملائمة ثقافيًا<\/b> (قيادة السيارة والسرعة والجمارك) ← 37 عبارة (19 + 18).<\/li><li><b>التحليل العاملي التوكيدي (برنامج أموس 23):<\/b> حذف 11 عبارة ضعيفة التشبع (7 من خداع الذات بتشبعات 0.10–0.23، و4 من إدارة الانطباع بتشبعات 0.07–0.23) ← <b>26 عبارة (12 + 14)<\/b>؛ جذر متوسط مربع خطأ الاقتراب = 0.021، مؤشر المطابقة المقارن = 0.688، مؤشر تاكر–لويس = 0.659، النسبة كا²/درجات الحرية = 1.776.<div class=\"en\" dir=\"ltr\">Amos 23 · CFA · RMSEA · CFI · TLI · CMIN/DF<\/div><\/li><li><b>الثبات:<\/b> α = 0.76 (الكلي)، 0.61 (خداع الذات)، 0.69 (إدارة الانطباع).<\/li><\/ul><p><b>2) مقياس الذكاء العاطفي (حسين وعبد الحميد، 2013 — السعودية):<\/b> 42 عبارة في 5 أبعاد (داخل الفرد 8، الخارجية 9، إدارة الضغط 9، التكيف 8، الحالة المزاجية 8)؛ خماسي؛ 42–210؛ α في البحث = 0.86، والأبعاد 0.53 / 0.68 / 0.66 / 0.71 / 0.63.<\/p><h4><b>العينة (ص 410–411، 417)<\/b><\/h4><p>عينة استطلاعية 300، وأساسية <b>755<\/b> طالبًا وطالبة (الفرق الأربع، علمي وأدبي، 18–20 سنة، 2020–2021)، طبقية عشوائية متعددة غير متناسبة. <b>لم يُذكر توزيع العينة حسب النوع أو الفرقة أو التخصص.<\/b><\/p><h4><b>النتائج (ص 417–420)<\/b><\/h4><div class=\"tw\"><table><tr><th><div class=\"cp\"><b>المتغير<\/b><\/div><\/th><th><div class=\"cp\"><b>المتوسط النظري<\/b><\/div><\/th><th><div class=\"cp\"><b>المتوسط الفعلي<\/b><\/div><\/th><th><div class=\"cp\"><b>الانحراف المعياري<\/b><\/div><\/th><\/tr><tr><td><div class=\"cp\">المرغوبية الاجتماعية (الكلية)<\/div><\/td><td><div class=\"cp\">13<\/div><\/td><td><div class=\"cp\">11.04<\/div><\/td><td><div class=\"cp\">4.45<\/div><\/td><\/tr><tr><td><div class=\"cp\">خداع الذات<\/div><\/td><td><div class=\"cp\">6<\/div><\/td><td><div class=\"cp\">3.86<\/div><\/td><td><div class=\"cp\">2.37<\/div><\/td><\/tr><tr><td><div class=\"cp\">إدارة الانطباع<\/div><\/td><td><div class=\"cp\">7<\/div><\/td><td><div class=\"cp\">7.18<\/div><\/td><td><div class=\"cp\">2.87<\/div><\/td><\/tr><tr><td><div class=\"cp\">الذكاء العاطفي (الكلي)<\/div><\/td><td><div class=\"cp\">126<\/div><\/td><td><div class=\"cp\">146.50<\/div><\/td><td><div class=\"cp\">15.95<\/div><\/td><\/tr><\/table><\/div><ul><li><b>r (المرغوبية، الذكاء العاطفي) = 0.427<\/b> دالة عند 0.01 (طردية متوسطة).<\/li><\/ul><div class=\"tw\"><table><tr><th><\/th><th><div class=\"cp\"><b>داخل الفرد<\/b><\/div><\/th><th><div class=\"cp\"><b>الخارجية<\/b><\/div><\/th><th><div class=\"cp\"><b>إدارة الضغط<\/b><\/div><\/th><th><div class=\"cp\"><b>التكيف<\/b><\/div><\/th><th><div class=\"cp\"><b>الحالة المزاجية<\/b><\/div><\/th><\/tr><tr><td><div class=\"cp\">خداع الذات<\/div><\/td><td><div class=\"cp\">0.279<\/div><\/td><td><div class=\"cp\">0.239<\/div><\/td><td><div class=\"cp\">0.400<\/div><\/td><td><div class=\"cp\"><b>0.435<\/b><\/div><\/td><td><div class=\"cp\">0.312<\/div><\/td><\/tr><tr><td><div class=\"cp\">إدارة الانطباع<\/div><\/td><td><div class=\"cp\">0.106<\/div><\/td><td><div class=\"cp\"><b>0.298<\/b><\/div><\/td><td><div class=\"cp\">0.280<\/div><\/td><td><div class=\"cp\">0.202<\/div><\/td><td><div class=\"cp\">0.180<\/div><\/td><\/tr><\/table><\/div><ul><li>التكيف أكثر الأبعاد تفسيرًا لتباين خداع الذات، والعوامل الخارجية أقلها (R² = 0.057)؛ والعوامل الخارجية أكثرها تفسيرًا لإدارة الانطباع (ص 422).<div class=\"en\" dir=\"ltr\">R²<\/div><\/li><li><b>الدراسات السابقة التي اتفقت معها (ص 408–410، 420):<\/b> Mesmer-Magnus et al. (2006): r = 0.44 (ن = 198)؛ Downey et al. (2006): r = 0.26 ولا فروق بين المجموعتين مجهولة ومكشوفة الهوية؛ Kluemper (2008): r = 0.61؛ Joshi &amp; Thingujam (2009): r = 0.25؛ Smorti, Andrei &amp; Trombini (2018): r = 0.75.<\/li><\/ul><h4><b>تقويم نقدي<\/b><\/h4><div class=\"tw\"><table><tr><th><div class=\"cp\"><b>نقطة القوة<\/b><\/div><\/th><th>جوانب تحتاج إلى استكمال<\/th><\/tr><tr><td><div class=\"cp\">أداة عربية جديدة (قائمة باولهس المتوازنة للاستجابة المرغوبة اجتماعيًا) بترجمة عكسية وتحكيم<\/div><div class=\"en\" dir=\"ltr\">BIDR<\/div><\/td><td><div class=\"cp\">مؤشر المطابقة المقارن/مؤشر تاكر–لويس منخفضان جدًا عن المحكات (≥ 0.90)، ووصف «المقبول بين 0 و1» غير دقيق<\/div><div class=\"en\" dir=\"ltr\">CFI/TLI<\/div><\/td><\/tr><tr><td><div class=\"cp\">حذف مبرر ثقافيًا لعبارات القيادة والجمارك<\/div><\/td><td><div class=\"cp\">ثبات خداع الذات (0.61) وإدارة الانطباع (0.69) دون 0.70، وبعض أبعاد الذكاء ا iv class=\"cp\">تجريبي<\/div><\/td><td><div class=\"cp\">التحذيرات تردع الاستجابة منخفضة الجهد؛ زمن الاستجابة والأضداد السيكومترية من أفضل المؤشرات<\/div><\/td><\/tr><tr><td><div class=\"cp\">برولمان وآخرون (2024)<\/div><div class=\"en\" dir=\"ltr\">Brühlmann et al. (2024), Behavior Research Methods, 56<\/div><\/td><td><div class=\"cp\">تجربة (ن = 812)<\/div><\/td><td><div class=\"cp\">التحذير السلبي بلا أثر؛ التحذير المكتوب يدويًا حسّن المؤشرات وزاد الانسحاب<\/div><\/td><\/tr><tr><td><div class=\"cp\">وارد وميد (2023)<\/div><div class=\"en\" dir=\"ltr\">Ward &amp; Meade (2023), Annual Review of Psychology, 74, 577–596<\/div><\/td><td><div class=\"cp\">مراجعة<\/div><\/td><td><div class=\"cp\">الوقاية والكشف والإبلاغ والتنظيف للاستجابة المهملة<\/div><\/td><\/tr><tr><td><div class=\"cp\">ويراسينغه وآخرون (2025)<\/div><div class=\"en\" dir=\"ltr\">Weerasinghe et al. (2025), Kelaniya Journal of HRM, 20(2), 97–119<\/div><\/td><td><div class=\"cp\">مراجعة منهجية (28 دراسة)<\/div><\/td><td><div class=\"cp\">لا استراتيجية وحيدة كافية؛ الأفضل تصميم متعدد الاستراتيجيات<\/div><\/td><\/tr><tr><td><div class=\"cp\">أحمد، حجاج غانم (2006)، المجلة المصرية للدراسات النفسية، 16(53)، 133–181<\/div><\/td><td><div class=\"cp\">تجريبي عربي<\/div><\/td><td><div class=\"cp\">برنامج لتخفيف حدة المرغوبية عند الاستجابة لمقاييس التقرير الذاتي<\/div><\/td><\/tr><\/table><\/div>"}, {"title": "8.5 المحور الخامس: الذكاء العاطفي والمرغوبية والاتزان (كما لخصها بحث «المرغوبية الاجتماعية وعلاقتها بالذكاء العاطفي»)", "en": "", "html": "<div class=\"tw\"><table><tr><th><div class=\"cp\"><b>الدراسة<\/b><\/div><\/th><th><div class=\"cp\"><b>العينة/الأدوات<\/b><\/div><\/th><th><div class=\"cp\"><b>النتيجة كما وردت<\/b><\/div><\/th><\/tr><tr><td><div class=\"cp\">Mesmer-Magnus, Viswesvaran, Deshpande &amp; Joseph (2006), Psychology Science, 48(3), 336–356<\/div><\/td><td><div class=\"cp\">198 طالبًا؛ مارلو–كراون<\/div><\/td><td><div class=\"cp\">r = 0.44 بين الذكاء العاطفي والمرغوبية<\/div><\/td><\/tr><tr>
