uitous phenomenon in many guises. Review of General Psychology, 2(2), 175–220. https://doi.org/10.1037/1089-2680.2.2.175 <b><\/b><\/li><li>Osgood, C. E., Suci, G. J., &amp; Tannenbaum, P. H. (1957). The measurement of meaning. University of Illinois Press. <b><\/b><\/li><li>Raju, N. S. (1988). The area between two item characteristic curves. Psychometrika, 53(4), 495–502. https://doi.org/10.1007/BF02294403 <b><\/b><\/li><li>Rosenthal, R. (1966). Experimenter effects in behavioral research. Appleton-Century-Crofts. <b><\/b><\/li><li>Simmons, J. P., Nelson, L. D., &amp; Simonsohn, U. (2011). False-positive psychology: Undisclosed flexibility in data collection and analysis allows presenting anything as significant. Psychological Science, 22(11), 1359–1366. https://doi.org/10.1177/0956797611417632 <b><\/b><\/li><li>Simms, L. J., Zelazny, K., Williams, T. F., &amp; Bernstein, L. (2019). Does the number of response options matter? Psychometric perspectives using personality questionnaire data. Psychological Assessment, 31(4), 557–566. https://doi.org/10.1037/pas0000648 <b><\/b><\/li><li>Stufflebeam, D. L., et al. [Phi Delta Kappa National Study Committee on Evaluation]. (1971). Educational evaluation and decision making. F. E. Peacock. [Note: full author list not seen in catalog record; APA 7 requires listing all authors] <b><\/b><\/li><li>Thorndike, E. L. (1918). The nature, purposes, and general methods of measurements of educational products. In G. M. Whipple (Ed.), The seventeenth yearbook of the National Society for the Study of Education: Part 2. The measurement of educational products (pp. 16–24). Public School Publishing. <b><\/b><\/li><li>Thorndike, E. L. (1920). A constant error in psychological ratings. Journal of Applied Psychology, 4(1), 25–29. <b><\/b><\/li><li>Tourangeau, R., Rips, L. J., &amp; Rasinski, K. (2000). The psychology of survey response. Cambridge University Press. <b><\/b><\/li><li>van de Vijver, F. J. R., &amp; Tanzer, N. K. (2004). Bias and equivalence in cross-cultural assessment: An overview. European Review of Applied Psychology, 54(2), 119–135. <b><\/b><\/li><li>Wood, D., Bruner, J. S., &amp; Ross, G. (1976). The role of tutoring in problem solving. Journal of Child Psychology and Psychiatry, 17(2), 89–100. https://doi.org/10.1111/j.1469-7610.1976.tb00381.x <b><\/b><\/li><li>Wright, B. D., &amp; Stone, M. H. (1979). Best test design. MESA Press. <b><\/b><\/li><li>Zwick, R. (2012). A review of ETS differential item functioning assessment procedures: Flagging rules, minimum sample size requirements, and criterion refinement (Research Report No. RR-12-08). Educational Testing Service. https://doi.org/10.1002/j.2333-8504.2012.tb02290.x <b><\/b><\/li><\/ul>"}]}, "rules12": {"key": "rules12", "no": null, "title": "القواعد الاثنتا عشرة لبناء المقياس", "en": "Twelve Rules of Scale Construction", "sections": [{"title": "الجدول الجامع للقواعد", "en": "", "html": "<p>تلخص هذه القواعد الاثنتا عشرة خطوات بناء المقياس النفسي في صورة إجرائية، وتُطبق بالترتيب لضمان موثوقية المقياس وصدقه. ويوضح الجدول اسم كل قاعدة ومثالًا تطبيقيًا عليها والمحك الذي يُحكم به على تحققها.<\/p><div class=\"tw\"><table class=\"rules\"><thead><tr><th>م<\/th><th>القاعدة<\/th><th>مثال تطبيقي<\/th><th>المحك<\/th><th>المرجع<\/th><\/tr><\/thead><tbody><tr><td><b class=\"num\">1<\/b><\/td><td><b>الوضوح المفاهيمي<\/b><\/td><td>تعريف السمة تعريفًا نظريًا يحدد حدودها، ثم تعريفًا إجرائيًا يحدد مؤشراتها<\/td><td>تعريف مكتوب يميّز السمة من المفاهيم المجاورة<\/td><td><span dir=\"ltr\">Cronbach & Meehl (1955)؛ Clark & Watson (1995)<\/span><\/td><\/tr><tr><td><b class=\"num\">2<\/b><\/td><td><b>المراجعة الأدبية<\/b><\/td><td>تحليل الأدبيات والمقاييس السابقة لاستخراج الأبعاد والمؤشرات<\/td><td>جدول بالمقاييس السابقة وأبعادها وحدودها<\/td><td><span dir=\"ltr\">Boateng et al. (2018)<\/span><\/td><\/tr><tr><td><b class=\"num\">3<\/b><\/td><td><b>تحديد الأبعاد<\/b><\/td><td>تحديد ثلاثة أبعاد مثلًا: التنظيم، والتفاعل، والوعي<\/td><td>ثلاث عبارات على الأقل لكل بعد في الصورة النهائية<\/td><td><span dir=\"ltr\">Loevinger (1957)<\/span><\/td><\/tr><tr><td><b class=\"num\">4<\/b><\/td><td><b>جدول المواصفات<\/b><\/td><td>توزيع الوزن النسبي للأبعاد: 30% و35% و35%<\/td><td>مجموع الأوزان 100%، وعدد العبارات متناسب مع الوزن<\/td><td><span dir=\"ltr\">Wilson (2005)<\/span><\/td><\/tr><tr><td><b class=\"num\">5<\/b><\/td><td><b>فيض الفقرات (بنك الفقرات)<\/b><\/td><td>كتابة 50 فقرة لتُصفّى في النهاية إلى نحو 30 فقرة<\/td><td>المجمّع الأولي من مرة ونصف إلى أربعة أمثال العدد النهائي<\/td><td><span dir=\"ltr\">DeVellis (2017)؛ Hinkin (1998)<\/span><\/td><\/tr><tr><td><b class=\"num\">6<\/b><\/td><td><b>جودة الصياغة<\/b><\/td><td>تجنب النفي المزدوج والعبارات العامة والعبارات التي تحمل فكرتين<\/td><td>فكرة واحدة لكل عبارة، ولغة مناسبة للفئة<\/td><td><span dir=\"ltr\">Clark & Watson (1995)<\/span><\/td><\/tr><tr><td><b class=\"num\">7<\/b><\/td><td><b>سلم الاستجابة<\/b><\/td><td>ليكرت خماسي موحد من «أوافق بشدة» إلى «أرفض بشدة»<\/td><td>تسميات واضحة ومتدرجة، وعدد فئات بين 4 و7<\/td><td><span dir=\"ltr\">Likert (1932)؛ Lozano et al. (2008)<\/span><\/td><\/tr><tr><td><b class=\"num\">8<\/b><\/td><td><b>صدق المحتوى<\/b><\/td><td>تحكيم الخبراء وحساب نسبة صدق المحتوى (CVR) ومؤشر صدق المحتوى (CVI)<\/td><td>CVR أعلى من القيمة الحرجة لعدد المحكمين، وI-CVI ≥ 0.78<\/td><td><span dir=\"ltr\">Lawshe (1975)؛ Lynn (1986)<\/span><\/td><\/tr><tr><td><b class=\"num\">9<\/b><\/td><td><b>التجريب الاستطلاعي<\/b><\/td><td>تجربة الصورة الأولية على نحو 30 طالبًا مع أسلوب التفكير بصوت مرتفع<\/td><td>فهم التعليمات والعبارات، وزمن الإجابة<\/td><td><span dir=\"ltr\">Willis (2005)<\/span><\/td><\/tr><tr><td><b class=\"num\">10<\/b><\/td><td><b>التحليل الإحصائي للفقرات<\/b><\/td><td>مراجعة الفقرة أو حذفها إذا قلّ ارتباطها المصحح بالدرجة الكلية عن 0.30<\/td><td>r المصحح ≥ 0.30، وتمييز دال بين المجموعتين الطرفيتين<\/td><td><span dir=\"ltr\">Nunnally & Bernstein (1994)<\/span><\/td><\/tr><tr><td><b class=\"num\">11<\/b><\/td><td><b>الثبات<\/b><\/td><td>ألفا كرونباخ أكبر من 0.70 مع ثبات إعادة الاختبار<\/td><td>α ≥ 0.70 للبحث، و≥ 0.90 للقرارات الفردية<\/td><td><span dir=\"ltr\">Cronbach (1951)؛ McDonald (1999)<\/span><\/td><\/tr><tr><td><b class=\"num\">12<\/b><\/td><td><b>الصدق العاملي والتقنين<\/b><\/td><td>تشبعات ≥ 0.40 في التحليل العاملي، ثم إعداد المعايير وكتابة دليل المقياس<\/td><td>KMO ≥ 0.60، ومطابقة مقبولة في التحليل التوكيدي<\/td><td><span dir=\"ltr\">Kaiser (1974)؛ Hu & Bentler (1999)<\/span><\/td><\/tr><\/tbody><\/table><\/div><aside class=\"box note\"><div class=\"bt\">ملاحظة<\/div><p>المحكات الرقمية في الجدول (0.30 و0.40 و0.70 و0.78) محكات اصطلاحية متداولة في الأدبيات، لا قوانين ثابتة؛ ويُفسَّر كل منها في ضوء غرض المقياس وحجم العينة وطبيعة السمة.<\/p><\/aside>"}, {"title": "شرح القواعد قاعدة قاعدة", "en": "", "html": "<h4><b>القاعدة 1: الوضوح المفاهيمي<\/b><\/h4><p>يبدأ المقياس من سؤال «ماذا أقيس؟». التعريف النظري يحدد حدود السمة وما ليس منها، والتعريف الإجرائي يترجمها إلى مؤشرات يمكن ملاحظتها، مثل: «الدرجة الكلية على مقياس من (ن) عبارة موزعة على الأبعاد (أ، ب، ج)، وتدل الدرجة المرتفعة على...».<\/p><p><b>مثال:<\/b> تعريف السمة تعريفًا نظريًا يحدد حدودها، ثم تعريفًا إجرائيًا يحدد مؤشراتها.<\/p><p><b>خطأ شائع:<\/b> الاكتفاء بقول «الدرجة التي يحصل عليها الفرد على المقياس» دون ذكر الأبعاد والمؤشرات.<\/p><h4><b>القاعدة 2: المراجعة الأدبية<\/b><\/h4><p>تُراجع النظريات والمقاييس السابقة لاستخراج الأبعاد المتفق عليها، ولإثبات الحاجة إلى مقياس جديد أو بيان قصور المقاييس القائمة في الفئة أو الثقافة المستهدفة.<\/p><p><b>مثال:<\/b> تحليل الأدبيات والمقاييس السابقة لاستخراج الأبعاد والمؤشرات.<\/p><p><b>خطأ شائع:<\/b> بناء مقياس جديد مع وجود مقياس مناسب ومقنن للفئة نفسها.<\/p><h4><b>القاعدة 3: تحديد الأبعاد<\/b><\/h4><p>يحدد الباحث أبعاد السمة بحيث يكون كل بعد متجانسًا داخليًا ومتمايزًا عن الأبعاد الأخرى، مع تعريف مستقل لكل بعد.<\/p><p><b>مثال:<\/b> تحديد ثلاثة أبعاد مثلًا: التنظيم، والتفاعل، والوعي.<\/p><p><b>خطأ شائع:<\/b> أبعاد متداخلة أو بعد بعبارتين فقط لا يكفي لتقدير بنية عاملية مستقرة.<\/p><h4><b>القاعدة 4: جدول المواصفات<\/b><\/h4><p>يوزع جدول المواصفات العبارات على الأبعاد بحسب وزنها النسبي، ويحدد اتجاه العبارات (موجبة/سالبة). فإذا كان المستهدف 30 عبارة وأوزان الأبعاد 30% و35% و35% كانت العبارات 9 و10.5 و10.5، فتُقرّب إلى 9 و11 و10 مثلًا.<\/p><p><b>مثال:<\/b> توزيع الوزن النسبي للأبعاد: 30% و35% و35%.<\/p><p><b>خطأ شائع:<\/b> ترك توزيع العبارات للمصادفة أو لسهولة الكتابة.<\/p><h4><b>القاعدة 5: فيض الفقرات (بنك الفقرات)<\/b><\/h4><p>يُكتب في البداية عدد أكبر من المطلوب لأن جزءًا كبيرًا سيُحذف في التحكيم والتحليل؛ وتُستمد العبارات من النظرية والمقاييس السابقة (مصدر استنباطي) ومن مقابلات وأسئلة مفتوحة للفئة المستهدفة (مصدر استقرائي).<\/p><p><b>مثال:<\/b> كتابة 50 فقرة لتُصفّى في النهاية إلى نحو 30 فقرة.<\/p><p><b>خطأ شائع:<\/b> مجمّع ضيق لا يترك مجالًا للاختيار، أو نسخ عبارات مقاييس محمية دون إذن.<\/p><h4><b>القاعدة 6: جودة الصياغة<\/b><\/h4><p>العبارة الجيدة قصيرة، تحمل فكرة واحدة، بلغة الفئة، خالية من النفي المزدوج والإيحاء بالإجابة المرغوبة اجتماعيًا ومن الكلمات المطلقة مثل «دائمًا» و«أبدًا» داخل العبارة.<\/p><p><b>مثال:<\/b> تجنب النفي المزدوج والعبارات العامة والعبارات التي تحمل فكرتين.<\/p><p><b>خطأ شائع:<\/b> عبارة مثل «لا أشعر بعدم الارتياح عند التحدث أمام الآخرين» (نفي مزدوج).<\/p><h4><b>القاعدة 7: سلم الاستجابة<\/b><\/h4><p>يُختار تدريج موحد لكل العبارات بتسميات واضحة لكل فئة، ويُحدد مفتاح التصحيح مسبقًا مع عكس العبارات السالبة. الشائع 5 فئات، ويتحسن الثبات عادة حتى 5–7 فئات ثم يستقر.<\/p><p><b>مثال:<\/b> ليكرت خماسي موحد من «أوافق بشدة» إلى «أرفض بشدة».<\/p><p><b>خطأ شائع:<\/b> تغيير عدد الفئات بين عبارات المقياس الواحد، أو نسيان عكس العبارات السالبة.<\/p><h4><b>القاعدة 8: صدق المحتوى<\/b><\/h4><p>تُعرض العبارات على محكمين متخصصين لتقدير انتمائها للبعد وأهميتها ووضوحها، ثم يُكمَّم اتفاقهم بنسبة صدق المحتوى (لوشي) أو مؤشر صدق المحتوى (لين) أو معامل V (أيكن). ويمكن حساب ذلك في «معمل صدق المحتوى».<\/p><p><b>مثال:<\/b> تحكيم الخبراء وحساب نسبة صدق المحتوى (CVR) ومؤشر صدق المحتوى (CVI).<\/p><p><b>خطأ شائع:<\/b> الاكتفاء بعبارة «عُرض المقياس على مجموعة من المحكمين» دون عددهم أو نسب اتفاقهم.<\/p><h4><b>القاعدة 9: التجريب الاستطلاعي<\/b><\/h4><p>تُطبق الصورة الأولية على عينة صغيرة من الفئة المستهدفة، ويُطلب من بعضهم التفكير بصوت مرتفع أثناء الإجابة لاكتشاف سوء فهم العبارات أو التعليمات، ويُسجل زمن الإجابة.<\/p><p><b>مثال:<\/b> تجربة الصورة الأولية على نحو 30 طالبًا مع أسلوب التفكير بصوت مرتفع.<\/p><p><b>خطأ شائع:<\/b> تخطي هذه الخطوة والانتقال مباشرة إلى التطبيق الواسع.<\/p><h4><b>القاعدة 10: التحليل الإحصائي للفقرات<\/b><\/h4><p>تُحسب لكل عبارة: المتوسط والانحراف المعياري، والارتباط المصحح بالدرجة الكلية، وألفا عند حذف العبارة، والتمييز بين المجموعتين الطرفيتين (27%). والعبارة الضعيفة تُراجع صياغتها واتجاه تصحيحها قبل حذفها.<\/p><p><b>مثال:<\/b> مراجعة الفقرة أو حذفها إذا قلّ ارتباطها المصحح بالدرجة الكلية عن 0.30.<\/p><p><b>خطأ شائع:<\/b> حذف العبارات اعتمادًا على ألفا وحدها مع إهمال تمثيل المحتوى.<\/p><h4><b>القاعدة 11: الثبات<\/b><\/h4><p>يُقدّر الثبات بأكثر من طريقة: الاتساق الداخلي (ألفا أو أوميغا أو KR-20)، والتجزئة النصفية، وإعادة التطبيق بعد نحو أسبوعين. وألفا ليست دليلًا على أحادية البعد، وارتفاعها الشديد (> 0.95) قد يعني تكرار العبارات.<\/p><p><b>مثال:<\/b> ألفا كرونباخ أكبر من 0.70 مع ثبات إعادة الاختبار.<\/p><p><b>خطأ شائع:<\/b> الاكتفاء بألفا للمقياس الكلي دون الأبعاد، أو دون حساب أوميغا عند اختلاف التشبعات.<\/p><h4><b>القاعدة 12: الصدق العاملي والتقنين<\/b><\/h4><p>يُفحص البناء بالتحليل العاملي الاستكشافي (KMO، واختبار بارتلت، والتحليل الموازي، والتشبعات ≥ 0.40) ثم التوكيدي على عينة مستقلة؛ وبعد ذلك تُعد المعايير (رتب مئينية، ودرجات تائية) ويُكتب دليل المقياس.<\/p><p><b>مثال:<\/b> تشبعات ≥ 0.40 في التحليل العاملي، ثم إعداد المعايير وكتابة دليل المقياس.<\/p><p><b>خطأ شائع:<\/b> إجراء التحليلين الاستكشافي والتوكيدي على العينة نفسها.<\/p>"}, {"title": "القواعد ومراحل البناء", "en": "", "html": "<p>ترتبط القواعد الاثنتا عشرة بالمراحل الثلاث لبناء المقياس عند بواتينج وآخرين (2018):<\/p><div class=\"tw\"><table class=\"\"><thead><tr><th>المرحلة<\/th><th>القواعد<\/th><th>الناتج<\/th><\/tr><\/thead><tbody><tr><td>تطوير البنود<\/td><td>1–7<\/td><td>تعريفات، وأبعاد، وجدول مواصفات، ومجمّع عبارات، وسلم استجابة<\/td><\/tr><tr><td>بناء المقياس<\/td><td>8–10<\/td><td>عبارات محكمة ومجربة ومحللة إحصائيًا<\/td><\/tr><tr><td>تقويم المقياس<\/td><td>11–12<\/td><td>أدلة ثبات وصدق عاملي ومعايير ودليل<\/td><\/tr><\/tbody><\/table><\/div><p>ويمكن تطبيق هذه القواعد عمليًا في قسم «ابنِ مقياسك» بالموقع، إذ تسير خطوات المعالج على ترتيب القواعد نفسه.<\/p>"}]}, "rel": {"key": "rel", "no": null, "title": "معاملات الثبات: المعادلات والتطبيق", "en": "Reliability Coefficients", "sections": [{"title": "جدول معاملات الثبات", "en": "", "html": "<p>يجمع الجدول المعاملات الأساسية لتقدير الثبات في القياس النفسي والتربوي: المعادلة، ومعنى الرموز، ومتى يُستخدم المعامل، ومثالًا تطبيقيًا محلولًا. ويمكن تجربة كل معادلة على بيانات حقيقية في «المعامل».<\/p><div class=\"tw\"><table class=\"coef\"><thead><tr><th>المعامل<\/th><th>المعادلة<\/th><th>معنى الرموز<\/th><th>متى يُستخدم<\/th><th>مثال تطبيقي<\/th><\/tr><\/thead><tbody><tr><td><b>ألفا كرونباخ<\/b><div class=\"en\">Cronbach's alpha<\/div><\/td><td><div class=\"fm\" dir=\"ltr\">α = <span class=\"fr\"><span>k<\/span><span>k − 1<\/span><\/span> × [ 1 − <span class=\"fr\"><span>Σσ²<sub>i<\/sub><\/span><span>σ²<sub>X<\/sub><\/span><\/span> ]<\/div><\/td><td>k: عدد الفقرات؛ σ²<sub>i<\/sub>: تباين كل فقرة؛ σ²<sub>X<\/sub>: تباين الدرجة الكلية<\/td><td>الاتساق الداخلي لفقرات متعددة الدرجات (ليكرت)<\/td><td>مقياس اتجاه من 10 فقرات، Σσ²<sub>i<\/sub> = 8، σ²<sub>X<\/sub> = 30 ← α = 0.815 (ثبات جيد)<\/td><\/tr><tr><td><b>كودر–ريتشاردسون 20<\/b><div class=\"en\">KR‑20<\/div><\/td><td><div class=\"fm\" dir=\"ltr\">KR‑20 = <span class=\"fr\"><span>k<\/span><span>k − 1<\/span><\/span> × [ 1 − <span class=\"fr\"><span>Σ p<sub>i<\/sub>q<sub>i<\/sub><\/span><span>σ²<sub>X<\/sub><\/span><\/span> ]<\/div><\/td><td>p<sub>i<\/sub>: نسبة الإجابة الصحيحة (أو الموافقة) للفقرة؛ q<sub>i<\/sub> = 1 − p<sub>i<\/sub><\/td><td>الفقرات ثنائية الدرجة (صح/خطأ، نعم/لا)؛ وهو حالة خاصة من ألفا<\/td><td>اختبار من 20 فقرة، Σpq = 3.6، σ²<sub>X<\/sub> = 14 ← KR‑20 = 0.782<\/td><\/tr><tr><td><b>كودر–ريتشاردسون 21<\/b><div class=\"en\">KR‑21<\/div><\/td><td><div class=\"fm\" dir=\"ltr\">KR‑21 = <span class=\"fr\"><span>k<\/span><span>k − 1<\/span><\/span> × [ 1 − <span class=\"fr\"><span>M (k − M)<\/span><span>k σ²<sub>X<\/sub><\/span><\/span> ]<\/div><\/td><td>M: متوسط الدرجات الكلية؛ k: عدد الفقرات<\/td><td>فقرات ثنائية مع افتراض تساوي صعوبتها تقريبًا؛ يعطي تقديرًا أدنى من KR‑20<\/td><td>k = 20، M = 12، σ²<sub>X<\/sub> = 16 ← KR‑21 = 0.737<\/td><\/tr><tr><td><b>سبيرمان–براون<\/b><div class=\"en\">Spearman–Brown<\/div><\/td><td><div class=\"fm\" dir=\"ltr\">r<sub>SB<\/sub> = <span class=\"fr\"><span>2 r<sub>hh<\/sub><\/span><span>1 + r<sub>hh<\/sub><\/span><\/span><\/div><\/td><td>r<sub>hh<\/sub>: معامل الارتباط بين نصفي الاختبار<\/td><td>تصحيح معامل التجزئة النصفية عند تساوي تبايني النصفين<\/td><td>r<sub>hh<\/sub> = 0.70 ← r<sub>SB<\/sub> = 0.824<\/td><\/tr><tr><td><b>جتمان للتجزئة النصفية<\/b><div class=\"en\">Guttman (Rulon–Flanagan) split‑half<\/div><\/td><td><div class=\"fm\" dir=\"ltr\">r<sub>G<\/sub> = 2 × [ 1 − <span class=\"fr\"><span>σ²<sub>1<\/sub> + σ²<sub>2<\/sub><\/span><span>σ²<sub>X<\/sub><\/span><\/span> ]<\/div><\/td><td>σ²<sub>1<\/sub>، σ²<sub>2<\/sub>: تباينا النصفين؛ σ²<sub>X<\/sub>: تباين الدرجة الكلية<\/td><td>بديل لسبيرمان–براون عند عدم تساوي تبايني النصفين<\/td><td>σ²<sub>1<\/sub> = 5، σ²<sub>2<\/sub> = 4.5، σ²<sub>X<\/sub> = 18 ← r<sub>G<\/sub> = 0.944<\/td><\/tr><tr><td><b>ثبات إعادة الاختبار<\/b><div class=\"en\">Test–retest<\/div><\/td><td><div class=\"fm\" dir=\"ltr\">r<sub>tt<\/sub> = <span class=\"fr\"><span>Cov(X<sub>1<\/sub>, X<sub>2<\/sub>)<\/span><span>σ<sub>X1<\/sub> σ<sub>X2<\/sub><\/span><\/span><\/div><\/td><td>X<sub>1<\/sub>، X<sub>2<\/sub>: درجات التطبيقين الأول والثاني؛ Cov: التغاير بينهما<\/td><td>استقرار الدرجات عبر الزمن بتطبيق المقياس مرتين على العينة نفسها (بفاصل نحو أسبوعين)<\/td><td>تطبيق على 50 طالبًا بفاصل أسبوعين ← r<sub>tt<\/sub> = 0.82 (استقرار مرتفع)<\/td><\/tr><tr><td><b>كابا كوهين<\/b><div class=\"en\">Cohen's kappa<\/div><\/td><td><div class=\"fm\" dir=\"ltr\">κ = <span class=\"fr\"><span>P<sub>o<\/sub> − P<sub>e<\/sub><\/span><span>1 − P<sub>e<\/sub><\/span><\/span><\/div><\/td><td>P<sub>o<\/sub>: نسبة الاتفاق الملاحظ؛ P<sub>e<\/sub>: نسبة الاتفاق المتوقع بالصدفة<\/td><td>اتفاق مقدِّرين اثنين على تصنيف اسمي (ثنائي أو متعدد)<\/td><td>مقدِّران صنفا سلوك 50 طالبًا: P<sub>o<\/sub> = 0.85، P<sub>e<\/sub> = 0.60 ← κ = 0.625<\/td><\/tr><tr><td><b>أوميغا ماكدونالد<\/b><div class=\"en\">McDonald's omega<\/div><\/td><td><div class=\"fm\" dir=\"ltr\">ω = <span class=\"fr\"><span>(Σλ<sub>i<\/sub>)²<\/span><span>(Σλ<sub>i<\/sub>)² + Σθ<sub>i<\/sub><\/span><\/span><\/div><\/td><td>λ<sub>i<\/sub>: تشبع الفقرة المعياري؛ θ<sub>i<\/sub> = 1 − λ²<sub>i<\/sub>: تباين الخطأ<\/td><td>الاتساق الداخلي عند اختلاف تشبعات الفقرات (أدق من ألفا)<\/td><td>تشبعات 0.70، 0.65، 0.80، 0.60، 0.75 ← ω = 0.829<\/td><\/tr><tr><td><b>الخطأ المعياري للقياس<\/b><div class=\"en\">SEM<\/div><\/td><td><div class=\"fm\" dir=\"ltr\">SEM = σ<sub>X<\/sub> √(1 − r<sub>XX<\/sub>)<\/div><\/td><td>σ<sub>X<\/sub>: الانحراف المعياري للدرجات؛ r<sub>XX<\/sub>: معامل الثبات<\/td><td>بناء فترة ثقة حول الدرجة الفردية: الدرجة ± 1.96 × SEM<\/td><td>σ = 15.95، r = 0.86 ← SEM = 5.97<\/td><\/tr><\/tbody><\/table><\/div><aside class=\"box note\"><div class=\"bt\">تفسير قيم الثبات (محك اصطلاحي)<\/div><p>≥ 0.90 ممتاز؛ 0.80–0.89 جيد؛ 0.70–0.79 مقبول للبحث؛ أقل من 0.70 ضعيف. ولكابا كوهين تصنيف لانديس وكوخ (1977): 0.41–0.60 متوسط، و0.61–0.80 جيد، وأكثر من 0.80 شبه تام.<\/p><\/aside>"}, {"title": "أمثلة محلولة خطوة بخطوة", "en": "", "html": "<h4><b>ألفا كرونباخ<\/b><\/h4><div class=\"f\" dir=\"ltr\">α = <span class=\"fr\"><span>k<\/span><span>k − 1<\/span><\/span> × [ 1 − <span class=\"fr\"><span>Σσ²<sub>i<\/sub><\/span><span>σ²<sub>X<\/sub><\/span><\/span> ]<\/div><p><b>المثال:<\/b> k = 10، Σσ²<sub>i<\/sub> = 8، σ²<sub>X<\/sub> = 30.<\/p><div class=\"f\" dir=\"ltr\">α = (10 ÷ 9) × (1 − 8 ÷ 30) = 1.111 × 0.733 = 0.815<\/div><h4><b>كودر–ريتشاردسون 20<\/b><\/h4><div class=\"f\" dir=\"ltr\">KR‑20 = <span class=\"fr\"><span>k<\/span><span>k − 1<\/span><\/span> × [ 1 − <span class=\"fr\"><span>Σ p<sub>i<\/sub>q<sub>i<\/sub><\/span><span>σ²<sub>X<\/sub><\/span><\/span> ]<\/div><p><b>المثال:<\/b> k = 20، Σpq = 3.6، σ²<sub>X<\/sub> = 14.<\/p><div class=\"f\" dir=\"ltr\">KR‑20 = (20 ÷ 19) × (1 − 3.6 ÷ 14) = 1.053 × 0.743 = 0.782<\/div><h4><b>كودر–ريتشاردسون 21<\/b><\/h4><div class=\"f\" dir=\"ltr\">KR‑21 = <span class=\"fr\"><span>k<\/span><span>k − 1<\/span><\/span> × [ 1 − <span class=\"fr\"><span>M (k − M)<\/span><span>k σ²<sub>X<\/sub><\/span><\/span> ]<\/div><p><b>المثال:<\/b> k = 20، M = 12، σ²<sub>X<\/sub> = 16.<\/p><div class=\"f\" dir=\"ltr\">KR‑21 = (20 ÷ 19) × [1 − 12 × 8 ÷ (20 × 16)] = 1.053 × 0.70 = 0.737<\/div><p>ويلاحظ أن KR‑21 أقل من KR‑20 لأنه يفترض تساوي صعوبة الفقرات.<\/p><h4><b>التجزئة النصفية<\/b><\/h4><div class=\"f\" dir=\"ltr\">r<sub>SB<\/sub> = <span class=\"fr\"><span>2 r<sub>hh<\/sub><\/span><span>1 + r<sub>hh<\/sub><\/span><\/span><\/div><div class=\"f\" dir=\"ltr\">r<sub>G<\/sub> = 2 × [ 1 − <span class=\"fr\"><span>σ²<sub>1<\/sub> + σ²<sub>2<\/sub><\/span><span>σ²<sub>X<\/sub><\/span><\/span> ]<\/div><p><b>المثال:<\/b> σ²<sub>1<\/sub> = 5، σ²<sub>2<\/sub> = 4.5، σ²<sub>X<\/sub> = 18.<\/p><div class=\"f\" dir=\"ltr\">r<sub>G<\/sub> = 2 × (1 − 9.5 ÷ 18) = 2 × 0.472 = 0.944<\/div><p>ومن البيانات نفسها: التغاير بين النصفين = (18 − 9.5) ÷ 2 = 4.25، والارتباط بينهما = 4.25 ÷ √(5 × 4.5) = 0.896، وتصحيحه بسبيرمان–براون = 0.945؛ وتقارب القيمتين يدل على تقارب تبايني النصفين.<\/p><h4><b>كابا كوهين<\/b><\/h4><div class=\"f\" dir=\"ltr\">κ = <span class=\"fr\"><span>P<sub>o<\/sub> − P<sub>e<\/sub><\/span><span>1 − P<sub>e<\/sub><\/span><\/span><\/div><p><b>المثال:<\/b> P<sub>o<\/sub> = 0.85، P<sub>e<\/sub> = 0.60.<\/p><div class=\"f\" dir=\"ltr\">κ = (0.85 − 0.60) ÷ (1 − 0.60) = 0.25 ÷ 0.40 = 0.625<\/div><h4><b>أوميغا ماكدونالد<\/b><\/h4><div class=\"f\" dir=\"ltr\">ω = <span class=\"fr\"><span>(Σλ<sub>i<\/sub>)²<\/span><span>(Σλ<sub>i<\/sub>)² + Σθ<sub>i<\/sub><\/span><\/span><\/div><p><b>المثال:<\/b> Σλ = 3.50 ← (Σλ)² = 12.25؛ Σθ = 0.51 + 0.5775 + 0.36 + 0.64 + 0.4375 = 2.525.<\/p><div class=\"f\" dir=\"ltr\">ω = 12.25 ÷ (12.25 + 2.525) = 0.829<\/div>"}, {"title": "أخطاء شائعة في جداول الثبات المتداولة", "en": "", "html": "<p>تتداول بين الطلاب جداول لمعاملات الثبات تحتوي أخطاء ينبغي الانتباه لها عند النقل عنها:<\/p><ul><li>معادلة KR‑20 تستخدم <b>Σpq<\/b> (حاصل ضرب نسبة الصواب في نسبة الخطأ لكل فقرة)، أما الصيغة التي تستخدم <b>Σσ²<\/b> لتباينات الفقرات فهي معادلة ألفا كرونباخ.<\/li><li>KR‑20 خاص بالفقرات <b>ثنائية الدرجة<\/b>؛ ولا يُستخدم لمقياس ليكرت، بل تُستخدم ألفا.<\/li><li>معادلة جتمان للتجزئة النصفية هي r = 2 [1 − (σ²<sub>1<\/sub> + σ²<sub>2<\/sub>) ÷ σ²<sub>X<\/sub>]، أي أن مجموع تبايني النصفين يُقسم كله على تباين الدرجة الكلية.<\/li><li>معادلة ثبات إعادة الاختبار هي معامل ارتباط بيرسون بين التطبيقين (التغاير ÷ حاصل ضرب الانحرافين المعياريين)، ومعادلة كابا هي (P<sub>o<\/sub> − P<sub>e<\/sub>) ÷ (1 − P<sub>e<\/sub>)؛ ويقع الخلط بينهما أحيانًا عند تبادل صفوف الجدول.<\/li><li>معادلة سبيرمان–براون (2r ÷ (1 + r)) تصحح معامل التجزئة النصفية فقط، ولا تحل محل جتمان إلا عند تساوي تبايني النصفين.<\/li><\/ul>"}, {"title": "أي معامل أختار؟", "en": "", "html": "<div class=\"tw\"><table class=\"\"><thead><tr><th>طبيعة البيانات والسؤال<\/th><th>المعامل المناسب<\/th><\/tr><\/thead><tbody><tr><td>فقرات ليكرت متعددة الدرجات، وتشبعات متقاربة<\/td><td>ألفا كرونباخ<\/td><\/tr><tr><td>فقرات ليكرت مع تشبعات مختلفة أو بنية عاملية معروفة<\/td><td>أوميغا ماكدونالد (مع ألفا)<\/td><\/tr><tr><td>فقرات ثنائية (صح/خطأ)<\/td><td>KR‑20، أو KR‑21 عند تقارب صعوبة الفقرات<\/td><\/tr><tr><td>تطبيق واحد وتقسيم المقياس نصفين<\/td><td>سبيرمان–براون، أو جتمان عند اختلاف تبايني النصفين<\/td><\/tr><tr><td>استقرار الدرجات عبر الزمن<\/td><td>ثبات إعادة الاختبار (بيرسون أو معامل الارتباط داخل الفئة)<\/td><\/tr><tr><td>مقدِّران وتصنيف اسمي<\/td><td>كابا كوهين<\/td><\/tr><tr><td>أكثر من مقدِّرين أو تقديرات كمية<\/td><td>معامل الارتباط داخل الفئة (ICC)<\/td><\/tr><tr><td>الدقة حول درجة فرد بعينه<\/td><td>الخطأ المعياري للقياس وفترة الثقة<\/td><\/tr><\/tbody><\/table><\/div>"}]}, "methods": {"key": "methods", "no": null, "title": "طرق بناء المقاييس وأنواع الاختبارات", "en": "Scaling Methods and Types of Tests", "sections": [{"title": "طرق بناء المقاييس: جدول مقارن", "en": "", "html": "<p>تختلف طرق بناء المقاييس في افتراضاتها عن طبيعة السمة، وفي صيغة الاستجابة، وطريقة حساب الدرجة. والطرق الثلاث الكلاسيكية (ثرستون وليكرت وجتمان) طرق لتدريج الاتجاهات، أضيف إليها التمايز الدلالي ثم النماذج الحديثة.<\/p><div class=\"tw\"><table class=\"\"><thead><tr><th>الطريقة<\/th><th>الفكرة<\/th><th>صيغة الاستجابة<\/th><th>حساب الدرجة<\/th><th>الميزة والقيد<\/th><\/tr><\/thead><tbody><tr><td><b>ثرستون — الفترات المتساوية ظاهريًا<\/b><div class=\"en\">Thurstone (1928)<\/div><\/td><td>يكتب الباحث عبارات كثيرة متدرجة من الرفض الشديد إلى القبول الشديد، ويقدّر محكمون موقع كل عبارة على متصل من 1 إلى 11، وتُختار العبارات ذات الاتفاق العالي وقيم موزعة على المتصل.<\/td><td>أوافق / لا أوافق<\/td><td>وسيط القيم المقياسية للعبارات التي وافق عليها المفحوص<\/td><td>دقيق نظريًا لكنه مكلف (يحتاج 50–100 محكم)<\/td><\/tr><tr><td><b>ليكرت — التقديرات التجميعية<\/b><div class=\"en\">Likert (1932)<\/div><\/td><td>عبارات موجبة وسالبة يستجيب لها المفحوص على تدريج متدرج (عادة خماسي)، وتُجمع الدرجات بعد عكس السالبة.<\/td><td>موافق بشدة … معارض بشدة<\/td><td>مجموع الدرجات (أو متوسطها)<\/td><td>الأكثر استخدامًا؛ سهل البناء والتحليل (ألفا، التحليل العاملي)<\/td><\/tr><tr><td><b>جتمان — التدرج التراكمي<\/b><div class=\"en\">Guttman (1944)<\/div><\/td><td>عبارات مرتبة تصاعديًا في الشدة؛ من يوافق على عبارة قوية يوافق على ما قبلها. يُتحقق منه بمعامل إعادة الإنتاج (≥ 0.90).<\/td><td>نعم / لا<\/td><td>عدد العبارات الموافَق عليها (يدل على موقعه في السلم)<\/td><td>أحادي البعد صارم؛ نادر التحقق في بيانات الاتجاهات<\/td><\/tr><tr><td><b>التمايز الدلالي — أوسجود<\/b><div class=\"en\">Osgood et al. (1957)<\/div><\/td><td>يُقيَّم مفهوم واحد على أزواج من الصفات المتضادة (جيد–سيئ، قوي–ضعيف) بتدريج سباعي، وتمثل الأزواج ثلاثة أبعاد: التقييم والقوة والنشاط.<\/td><td>تدريج سباعي بين صفتين<\/td><td>متوسط درجات أزواج كل بعد<\/td><td>سريع ومرن، ويتأثر بترجمة الصفات<\/td><\/tr><tr><td><b>نموذج راش ونظرية الاستجابة للمفردة<\/b><div class=\"en\">Rasch (1960); Andrich (1978)<\/div><\/td><td>تُبنى العبارات لتغطي مستويات مختلفة من شدة السمة، ويُقدَّر موقع الفرد والعبارة على متصل واحد بوحدة اللوجيت مستقلًا عن العينة.<\/td><td>ليكرت (يفضل 4–5 فئات)<\/td><td>تقدير السمة θ بالـ logit<\/td><td>قياس موضوعي وفحص للأداء التفاضلي؛ يحتاج 150–250 فردًا وبرامج متخصصة<\/td><\/tr><tr><td><b>الاختيار القسري<\/b><div class=\"en\">Brown & Maydeu-Olivares (2011)<\/div><\/td><td>عبارتان أو أكثر متساويتان في المرغوبية من أبعاد مختلفة، ويختار المفحوص الأكثر انطباقًا عليه.<\/td><td>اختيار عبارة من زوج أو مجموعة<\/td><td>نموذج Thurstonian IRT (أو درجات إبساتية تقليديًا)<\/td><td>يقلل التزييف والمرغوبية؛ تحليله معقد<\/td><\/tr><tr><td><b>الحكم الموقفي<\/b><div class=\"en\">Motowidlo et al. (1990)<\/div><\/td><td>يُعرض موقف واقعي وعدة تصرفات، ويختار المفحوص الأفضل أو يرتبها.<\/td><td>اختيار تصرف<\/td><td>مطابقة اختيار المفحوص لمفتاح الخبراء<\/td><td>يقيس الكفايات السلوكية؛ يحتاج مفتاحًا من 5–10 خبراء<\/td><\/tr><tr><td><b>الاختبار التكيفي المحوسب<\/b><div class=\"en\">Weiss (1982)<\/div><\/td><td>بنك عبارات معاير بنظرية الاستجابة للمفردة؛ يختار الحاسوب العبارة التالية بحسب إجابات الفرد، ويتوقف عند بلوغ دقة محددة.<\/td><td>بحسب البنك<\/td><td>تقدير θ مع خطأ معياري<\/td><td>دقة أعلى بعبارات أقل؛ يحتاج بنكًا معايرًا على 500 فرد فأكثر<\/td><\/tr><\/tbody><\/table><\/div>"}, {"title": "شرح الطرق طريقة طريقة", "en": "", "html": "<h4><b>ثرستون — الفترات المتساوية ظاهريًا<\/b><\/h4><p>يكتب الباحث عبارات كثيرة متدرجة من الرفض الشديد إلى القبول الشديد، ويقدّر محكمون موقع كل عبارة على متصل من 1 إلى 11، وتُختار العبارات ذات الاتفاق العالي وقيم موزعة على المتصل.<\/p><ul><li><b>الاستجابة:<\/b> أوافق / لا أوافق.<\/li><li><b>الدرجة:<\/b> وسيط القيم المقياسية للعبارات التي وافق عليها المفحوص.<\/li><li><b>التقويم:<\/b> دقيق نظريًا لكنه مكلف (يحتاج 50–100 محكم).<\/li><\/ul><h4><b>ليكرت — التقديرات التجميعية<\/b><\/h4><p>عبارات موجبة وسالبة يستجيب لها المفحوص على تدريج متدرج (عادة خماسي)، وتُجمع الدرجات بعد عكس السالبة.<\/p><ul><li><b>الاستجابة:<\/b> موافق بشدة … معارض بشدة.<\/li><li><b>الدرجة:<\/b> مجموع الدرجات (أو متوسطها).<\/li><li><b>التقويم:<\/b> الأكثر استخدامًا؛ سهل البناء والتحليل (ألفا، التحليل العاملي).<\/li><\/ul><h4><b>جتمان — التدرج التراكمي<\/b><\/h4><p>عبارات مرتبة تصاعديًا في الشدة؛ من يوافق على عبارة قوية يوافق على ما قبلها. يُتحقق منه بمعامل إعادة الإنتاج (≥ 0.90).<\/p><ul><li><b>الاستجابة:<\/b> نعم / لا.<\/li><li><b>الدرجة:<\/b> عدد العبارات الموافَق عليها (يدل على موقعه في السلم).<\/li><li><b>التقويم:<\/b> أحادي البعد صارم؛ نادر التحقق في بيانات الاتجاهات.<\/li><\/ul><h4><b>التمايز الدلالي — أوسجود<\/b><\/h4><p>يُقيَّم مفهوم واحد على أزواج من الصفات المتضادة (جيد–سيئ، قوي–ضعيف) بتدريج سباعي، وتمثل الأزواج ثلاثة أبعاد: التقييم والقوة والنشاط.<\/p><ul><li><b>الاستجابة:<\/b> تدريج سباعي بين صفتين.<\/li><li><b>الدرجة:<\/b> متوسط درجات أزواج كل بعد.<\/li><li><b>التقويم:<\/b> سريع ومرن، ويتأثر بترجمة الصفات.<\/li><\/ul><h4><b>نموذج راش ونظرية الاستجابة للمفردة<\/b><\/h4><p>تُبنى العبارات لتغطي مستويات مختلفة من شدة السمة، ويُقدَّر موقع الفرد والعبارة على متصل واحد بوحدة اللوجيت مستقلًا عن العينة.<\/p><ul><li><b>الاستجابة:<\/b> ليكرت (يفضل 4–5 فئات).<\/li><li><b>الدرجة:<\/b> تقدير السمة θ بالـ logit.<\/li><li><b>التقويم:<\/b> قياس موضوعي وفحص للأداء التفاضلي؛ يحتاج 150–250 فردًا وبرامج متخصصة.<\/li><\/ul><h4><b>الاختيار القسري<\/b><\/h4><p>عبارتان أو أكثر متساويتان في المرغوبية من أبعاد مختلفة، ويختار المفحوص الأكثر انطباقًا عليه.<\/p><ul><li><b>الاستجابة:<\/b> اختيار عبارة من زوج أو مجموعة.<\/li><li><b>الدرجة:<\/b> نموذج Thurstonian IRT (أو درجات إبساتية تقليديًا).<\/li><li><b>التقويم:<\/b> يقلل التزييف والمرغوبية؛ تحليله معقد.<\/li><\/ul><h4><b>الحكم الموقفي<\/b><\/h4><p>يُعرض موقف واقعي وعدة تصرفات، ويختار المفحوص الأفضل أو يرتبها.<\/p><ul><li><b>الاستجابة:<\/b> اختيار تصرف.<\/li><li><b>الدرجة:<\/b> مطابقة اختيار المفحوص لمفتاح الخبراء.<\/li><li><b>التقويم:<\/b> يقيس الكفايات السلوكية؛ يحتاج مفتاحًا من 5–10 خبراء.<\/li><\/ul><h4><b>الاختبار التكيفي المحوسب<\/b><\/h4><p>بنك عبارات معاير بنظرية الاستجابة للمفردة؛ يختار الحاسوب العبارة التالية بحسب إجابات الفرد، ويتوقف عند بلوغ دقة محددة.<\/p><ul><li><b>الاستجابة:<\/b> بحسب البنك.<\/li><li><b>الدرجة:<\/b> تقدير θ مع خطأ معياري.<\/li><li><b>التقويم:<\/b> دقة أعلى بعبارات أقل؛ يحتاج بنكًا معايرًا على 500 فرد فأكثر.<\/li><\/ul><aside class=\"box note\"><div class=\"bt\">خطوات طريقة ثرستون<\/div><ol><li>كتابة 100 عبارة تقريبًا تغطي المتصل كله.<\/li><li>تقدير المحكمين لكل عبارة من 1 (رفض شديد) إلى 11 (قبول شديد).<\/li><li>حساب الوسيط (القيمة المقياسية) والمدى الربيعي (مؤشر الغموض) لكل عبارة.<\/li><li>اختيار نحو 20 عبارة صغيرة المدى الربيعي وموزعة القيم.<\/li><li>درجة المفحوص = وسيط القيم المقياسية للعبارات التي وافق عليها.<\/li><\/ol><\/aside><aside class=\"box note\"><div class=\"bt\">معامل إعادة الإنتاج لجتمان<\/div><p>CR = 1 − (عدد أخطاء النمط ÷ (عدد الأفراد × عدد العبارات))، ويُقبل السلم إذا كان CR ≥ 0.90.<\/p><\/aside>"}, {"title": "أنواع الاختبارات والمقاييس", "en": "", "html": "<p>تُصنف الاختبارات والمقاييس بأكثر من أساس، ويجتمع في الأداة الواحدة أكثر من تصنيف:<\/p><div class=\"tw\"><table class=\"\"><thead><tr><th>أساس التصنيف<\/th><th>الأنواع<\/th><\/tr><\/thead><tbody><tr><td><b>طبيعة الأداء<\/b><\/td><td>أداء أقصى (قدرات، تحصيل) ↔ أداء معتاد (شخصية، اتجاهات، ميول)<\/td><\/tr><tr><td><b>مرجع التفسير<\/b><\/td><td>معياري المرجع (موقع الفرد بين أقرانه) ↔ محكي المرجع (بلوغ مستوى محدد)<\/td><\/tr><tr><td><b>الزمن<\/b><\/td><td>اختبارات سرعة (زمن محدد وعبارات سهلة) ↔ اختبارات قوة (زمن كاف وعبارات متدرجة الصعوبة)<\/td><\/tr><tr><td><b>طريقة التطبيق<\/b><\/td><td>فردية (مثل وكسلر) ↔ جماعية (مثل المصفوفات المتتابعة)<\/td><\/tr><tr><td><b>مادة الاختبار<\/b><\/td><td>لفظية ↔ غير لفظية (أدائية، أشكال)<\/td><\/tr><tr><td><b>طبيعة الاستجابة<\/b><\/td><td>موضوعية (اختيار من بدائل) ↔ إسقاطية (استجابة حرة لمثير غامض: رورشاخ، تفهم الموضوع)<\/td><\/tr><tr><td><b>مصدر البيانات<\/b><\/td><td>تقرير ذاتي ↔ تقدير الآخرين (معلم، والد) ↔ ملاحظة مباشرة<\/td><\/tr><tr><td><b>درجة التقنين<\/b><\/td><td>مقننة (تعليمات ومعايير موحدة) ↔ غير مقننة (من إعداد المعلم أو الباحث)<\/td><\/tr><tr><td><b>وسيط التطبيق<\/b><\/td><td>ورقية ↔ إلكترونية ↔ تكيفية محوسبة<\/td><\/tr><\/tbody><\/table><\/div>"}, {"title": "كيف أختار طريقة البناء؟", "en": "", "html": "<div class=\"tw\"><table class=\"\"><thead><tr><th>الهدف أو الموقف<\/th><th>الطريقة المقترحة<\/th><\/tr><\/thead><tbody><tr><td>قياس اتجاه أو سمة لدى طلاب في بحث وصفي أو ارتباطي<\/td><td>ليكرت (خماسي)<\/td><\/tr><tr><td>سمة تتدرج شدتها تراكميًا (مثل مراحل تقبل فكرة)<\/td><td>جتمان<\/td><\/tr><tr><td>معنى مفهوم أو صورة ذهنية (مثل صورة المعلم)<\/td><td>التمايز الدلالي<\/td><\/tr><tr><td>قياس موضوعي مستقل عن العينة وفحص العدالة بين المجموعات<\/td><td>نموذج راش<\/td><\/tr><tr><td>مواقف الانتقاء الوظيفي التي يكثر فيها التزييف<\/td><td>الاختيار القسري أو الحكم الموقفي<\/td><\/tr><tr><td>قياس متكرر بدقة عالية وعدد عبارات قليل<\/td><td>الاختبار التكيفي المحوسب<\/td><\/tr><\/tbody><\/table><\/div>"}]}, "compare": {"key": "compare", "no": null, "title": "مقارنة بين المصادر: كتاب مجيد، وكتاب الاختبارات النفسية، والبحث", "en": "Comparing the Sources", "sections": [{"title": "المصادر الثلاثة باختصار", "en": "The Three Sources", "html": "\n<p>يقارن هذا الفصل بين ثلاثة مصادر يعتمد عليها الطالب في مادة بناء المقاييس:<\/p>\n<ol>\n<li><b>كتاب مجيد (2014):<\/b> «أسس بناء الاختبارات والمقاييس النفسية والتربوية» لسوسن شاكر مجيد، الطبعة الثالثة، مركز ديبونو، نحو 480 صفحة في اثني عشر فصلًا: مفهوم القياس والتقويم، والأهداف التعليمية، وخطوات بناء الاختبار، والصدق، والثبات، والمعايير، والاختبارات المحكية والمعيارية والتشخيصية، والاختبارات التحصيلية، والذكاء، والاتجاهات، والشخصية، والميول.<\/li>\n<li><b>كتاب «الاختبارات النفسية» (كتاب المقرر):<\/b> الكتاب الذي قُرئ في الفصل الثاني من هذا البحث، ويقع محتواه المعروض في نحو 149 صفحة: منطق التصميم، وخطة البناء، وعينة التقنين، وإعداد البنود وتحليلها كيفيًا وكميًا، ودليل الاختبار، وأخلاقيات المستخدم، والاختبارات معيارية ومحكية المرجع، وطرق درجة القطع، والكفايات والتحليل الهرمي، وفن تطبيق الاختبار.<\/li>\n<li><b>هذا البحث والموقع:<\/b> ثمانية عشر فصلًا تجمع المصدرين وتحوّل لغة «الاختبار» إلى لغة «المقياس»، وتضيف القواعد الاثنتي عشرة، ومعاملات الثبات الحديثة، والصدق العاملي، ونظرية الاستجابة للمفردة، والأداء التفاضلي، وتسع طرق للبناء، ونماذج حقيقية، وبنك أسئلة، وأدوات حسابية وبناءً تفاعليًا للمقياس.<\/li><\/ol>"}, {"title": "جدول مقارنة الموضوعات", "en": "Topic Coverage", "html": "<div class=\"tw\"><table><thead><tr><th>الموضوع<\/th><th>كتاب مجيد (2014)<\/th><th>كتاب الاختبارات النفسية<\/th><th>البحث والموقع<\/th><\/tr><\/thead><tbody><tr><td>القياس والتقييم والتقويم ومستويات القياس<\/td><td>✔ الفصل 1 (ص 17–44)<\/td><td>جزئيًا<\/td><td>✔ الفصل 1<\/td><\/tr><tr><td>الأهداف التعليمية والسلوكية (بلوم، هارو)<\/td><td>✔ الفصل 2 (ص 45–66)<\/td><td>—<\/td><td>—<\/td><\/tr><tr><td>خطوات بناء الاختبار أو المقياس<\/td><td>✔ الفصل 3 (ص 67–90)<\/td><td>✔ خطة البناء (ص 4–12)<\/td><td>✔ الفصلان 3 و14 (القواعد الاثنتا عشرة)<\/td><\/tr><tr><td>صياغة البنود وأنواع الأسئلة التحصيلية<\/td><td>✔ الفصل 8 (ص 239–274)<\/td><td>✔ (ص 11–22)<\/td><td>✔ قواعد صياغة العبارة<\/td><\/tr><tr><td>التحليل الكمي للبنود (صعوبة، تمييز، مشتتات)<\/td><td>✔ ضمن الخطوات<\/td><td>✔ مفصل (ص 18–36)<\/td><td>✔ مع تحويله إلى عبارات المقاييس<\/td><\/tr><tr><td>الصدق<\/td><td>✔ الفصل 4 (ص 91–120)<\/td><td>✔ صدق المحكي (ص 75–89)<\/td><td>✔ مع CVR وCVI وأيكن والصدق العاملي<\/td><\/tr><tr><td>الثبات<\/td><td>✔ الفصل 5 (ص 121–158)<\/td><td>✔ ثبات المحكي<\/td><td>✔ ألفا، KR‑20/21، أوميغا، كابا، أمثلة محلولة<\/td><\/tr><tr><td>المعايير والتقنين<\/td><td>✔ الفصل 6 (ص 159–168)<\/td><td>✔ عينة التقنين والدليل<\/td><td>✔ مئينيات وتائية وتساعية + أداة حساب<\/td><\/tr><tr><td>الاختبارات المحكية ودرجات القطع<\/td><td>✔ الفصل 7 (ص 169–235)<\/td><td>✔ مفصل (ص 55–120)<\/td><td>✔ أنجوف وإيبل وندلسكي<\/td><\/tr><tr><td>الاختبارات التشخيصية والكفايات<\/td><td>✔ (ص 229–235)<\/td><td>✔ التحليل الهرمي (ص 120–127)<\/td><td>جزئيًا<\/td><\/tr><tr><td>قياس الذكاء<\/td><td>✔ الفصل 9 (ص 275–336)<\/td><td>—<\/td><td>جزئيًا<\/td><\/tr><tr><td>قياس الاتجاهات: ثرستون وليكرت وجتمان وأوسجود<\/td><td>✔ الفصل 10 (ص 337–392) بأمثلة<\/td><td>جزئيًا<\/td><td>✔ تسع طرق + نماذج حقيقية<\/td><\/tr><tr><td>قياس الشخصية والأساليب الإسقاطية<\/td><td>✔ الفصل 11 (ص 393–426)<\/td><td>—<\/td><td>جزئيًا<\/td><\/tr><tr><td>قياس الميول<\/td><td>✔ الفصل 12 (ص 427–464)<\/td><td>—<\/td><td>—<\/td><\/tr><tr><td>أخلاقيات الاستخدام وفن تطبيق الاختبار<\/td><td>جزئيًا<\/td><td>✔ (ص 39–54، 128–149)<\/td><td>✔ الفصل 4<\/td><\/tr><tr><td>التحليل العاملي الاستكشافي والتوكيدي<\/td><td>—<\/td><td>—<\/td><td>✔ مع KMO وبارتلت والتحليل الموازي<\/td><\/tr><tr><td>نظرية الاستجابة للمفردة ونموذج راش<\/td><td>—<\/td><td>—<\/td><td>✔ الفصل 13<\/td><\/tr><tr><td>الأداء التفاضلي للمفردة والتكافؤ القياسي<\/td><td>—<\/td><td>—<\/td><td>✔ الفصلان 7 و13<\/td><\/tr><tr><td>أساليب الاستجابة والمرغوبية الاجتماعية<\/td><td>جزئيًا<\/td><td>جزئيًا<\/td><td>✔<\/td><\/tr><tr><td>أدوات حسابية وبناء إلكتروني وجمع بيانات<\/td><td>—<\/td><td>—<\/td><td>✔ الموقع<\/td><\/tr><\/tbody><\/table><\/div>"}, {"title": "ما ينفرد به كل مصدر", "en": "Unique Contributions", "html": "\n<p><b>كتاب مجيد (2014)<\/b> هو الأوسع: يغطي الأهداف التعليمية وتصنيفاتها، وأنواع الأسئلة التحصيلية تفصيلًا، وقياس الذكاء والشخصية والميول، ويقدم <b>نماذج عربية حقيقية<\/b> لمقاييس الاتجاهات: مقياس ثرستون وشيف وأوزان عباراته، وجدول بوجاردس بنسب القبول، ومقياس الاتجاه نحو تعليم البنت بطريقة جتمان، ومقياس الاتجاه نحو المعوقين بصورتيه، ودراسة القيم المعرّبة؛ وطابعه تربوي يجمع الاختبار التحصيلي والمقياس النفسي.<\/p>\n<p><b>كتاب الاختبارات النفسية<\/b> أعمق في <b>هندسة الاختبار<\/b>: منطق التصميم، وتمثيل عينة التقنين، والتحليل الكمي للبنود بما فيه تصحيح التخمين وفاعلية المشتتات، ودليل الاختبار، وأهلية المستخدم وأخلاقياته، والفرق بين المرجع المعياري والمحكي، و<b>طرق تحديد درجة القطع<\/b> في نحو ثلاثين صفحة، وفن تطبيق الاختبار؛ وأمثلته من اختبارات الأداء الأقصى.<\/p>\n<p><b>البحث والموقع<\/b> يضيفان ما لم يرد في الكتابين: <b>تحويل<\/b> مفاهيم الاختبار إلى المقياس النفسي (الصعوبة ← مؤشر الموافقة، المشتتات ← فئات الاستجابة)، والقواعد الاثنتي عشرة بمحكاتها، ومعاملات أوميغا وكابا وأيكن وCVR بالجداول المصححة، والتحليل العاملي، ونظرية الاستجابة للمفردة، والأداء التفاضلي بطريقتي مانتل–هانزل والانحدار اللوجستي، وعرض بحثين منشورين، والاتجاهات الحديثة (الاختيار القسري، والحكم الموقفي، والاختبار التكيفي، والتوليد بالذكاء الاصطناعي)، وأدوات تطبيقية تحسب كل ذلك وتبني المقياس وتجمع بياناته.<\/p>"}, {"title": "نقاط الاتفاق", "en": "Agreement", "html": "\n<ul>\n<li>المصادر الثلاثة تبدأ البناء بتحديد الهدف والسمة وتعريفها، ثم جدول المواصفات، ثم كتابة بنود أكثر من المطلوب، ثم التحكيم والتجريب، ثم التحليل الإحصائي للبنود، ثم الصدق والثبات والمعايير.<\/li>\n<li>الثبات شرط لازم غير كافٍ للصدق، والصدق أهم خصائص الأداة.<\/li>\n<li>المقارنة الطرفية بين المرتفعين والمنخفضين أساس الحكم على تمييز البند.<\/li>\n<li>الاختبارات معيارية المرجع تقارن الفرد بجماعته، والمحكية تقارنه بمستوى أداء محدد؛ ولكل منها طرق صدق وثبات خاصة.<\/li>\n<li>المعايير المحلية ضرورة، ولا تُنقل معايير بيئة إلى بيئة أخرى دون تقنين.<\/li><\/ul>"}, {"title": "نقاط الاختلاف في الأرقام والمحكات", "en": "Differences in Criteria", "html": "<div class=\"tw\"><table><thead><tr><th>المسألة<\/th><th>كتاب مجيد (2014)<\/th><th>البحث والموقع<\/th><th>التوضيح<\/th><\/tr><\/thead><tbody><tr><td>نسبة المجموعتين الطرفيتين في تحليل عبارات ليكرت<\/td><td>أعلى 25% وأدنى 25%<\/td><td>27% (نسبة كيلي)<\/td><td>كلاهما مقبول؛ 27% تعطي أفضل توازن بين حدة الفرق وحجم المجموعتين، و25% أبسط حسابيًا.<\/td><\/tr><tr><td>محك قبول عبارة ليكرت<\/td><td>قيمة t ≥ 1.75 تقريبًا<\/td><td>t دالة عند 0.05، وارتباط مصحح بالكلية ≥ 0.30<\/td><td>المحك الحديث يجمع الدلالة والارتباط بالدرجة الكلية وألفا عند الحذف.<\/td><\/tr><tr><td>تاريخ طريقة جتمان<\/td><td>1947–1950<\/td><td>1944<\/td><td>نشر جتمان أساس التدرج التراكمي عام 1944، وطُبق في دراسات الجنود الأمريكيين المنشورة عام 1950؛ فالتاريخان يشيران إلى مرحلتين.<\/td><\/tr><tr><td>شروط سلم جتمان<\/td><td>CR ≥ 0.90 ومعامل القياسية ≥ 0.60<\/td><td>CR ≥ 0.90 مع مقارنة CR بالحد الأدنى الهامشي MMR<\/td><td>الطريقتان متكافئتان: كلاهما يتحقق من أن التراكم ليس ناتجًا عن توزيع النسب وحده.<\/td><\/tr><tr><td>عدد محكمي ثرستون<\/td><td>300 محكم في الأصل، و15–50 تكفي<\/td><td>التحكيم لصدق المحتوى 5–10 خبراء<\/td><td>محكمو ثرستون يقدّرون موقع العبارة على المتصل، ومحكمو صدق المحتوى يحكمون على تمثيلها للسمة؛ وظيفتان مختلفتان.<\/td><\/tr><tr><td>الحد الأدنى لثبات المقياس<\/td><td>نحو 0.85 لمقياس ليكرت من 20 عبارة<\/td><td>ألفا ≥ 0.70 للبحوث، و0.80–0.90 للقرارات الفردية<\/td><td>رقم الكتاب وصف لما تبلغه المقاييس عادة، ورقم البحث محك للقبول.<\/td><\/tr><tr><td>القيمة الحرجة لنسبة صدق المحتوى<\/td><td>لا يتناولها الكتاب<\/td><td>جدول لوشي، والجدول المصحح (Ayre & Scally, 2014)<\/td><td>الجدول المصحح أدق لعدد المحكمين القليل.<\/td><\/tr><\/tbody><\/table><\/div>"}, {"title": "كيف تستخدم المصادر الثلاثة في المذاكرة", "en": "How to Study with Them", "html": "\n<ol>\n<li>ابدأ بكتاب مجيد لفهم المفاهيم الأساسية وطرق قياس الاتجاهات بأمثلتها العربية.<\/li>\n<li>ارجع إلى كتاب الاختبارات النفسية في تحليل البنود ودرجات القطع وأخلاقيات التطبيق، فهي الأكثر تفصيلًا فيه.<\/li>\n<li>استخدم البحث والموقع لربط ما سبق بالمقاييس النفسية الحديثة: القواعد الاثنتا عشرة، ومعاملات الثبات، والتحليل العاملي، والأداء التفاضلي؛ ثم طبّق في المعامل وابنِ مقياسك.<\/li>\n<li>عند اختلاف رقم أو محك بين المصادر، اذكر في الإجابة المصدر الذي تعتمد عليه، وبيّن سبب الاختلاف كما في الجدول السابق.<\/li><\/ol>"}]}, "real": {"key": "real", "no": null, "title": "نماذج حقيقية: مقياس منشور لكل طريقة ولكل عالم", "en": "Real Published Scales", "sections": [{"title": "مدخل: كيف تُقرأ النماذج", "en": "Reading the Examples", "html": "\n<p>يعرض هذا الفصل لكل طريقة من طرق بناء المقاييس مقياسًا حقيقيًا منشورًا بُني بها، مع بنية المقياس وعبارات نموذجية منه وطريقة تصحيحه وما يوضحه عن الطريقة. وقد أُخذت النماذج العربية من الفصل العاشر «قياس الاتجاهات» في كتاب مجيد، سوسن شاكر (2014). أسس بناء الاختبارات والمقاييس النفسية والتربوية (ط3). عمّان: مركز ديبونو لتعليم التفكير، وأُحيلت النماذج الأجنبية إلى مصادرها الأصلية. وحيث تظهر عبارة «(ترجمة الباحث)» فالترجمة لأغراض الدراسة وليست الصورة العربية المقننة للمقياس، ولا تُستخدم في بحث إلا بعد الرجوع إلى الصورة المقننة واستئذان أصحابها.<\/p>\n<p>وتُختم الفصل بجدول يربط كل عالم ورد في البحث بمقياس أو اختبار حقيقي يرتبط باسمه، أو بتطبيق حقيقي لإسهامه حين لا يرتبط اسمه بمقياس بعينه.<\/p>"}, {"title": "طريقة ثرستون: مقياس الاتجاه نحو الكنيسة (ثرستون وشيف، 1929)", "en": "Thurstone & Chave Attitude Toward the Church Scale", "html": "\n<p><b>البناء:<\/b> جمع ثرستون وشيف 130 عبارة تعبر عن مواقف متدرجة نحو الكنيسة، وعرضاها على 300 محكم صنّف كل منهم العبارات في 11 فئة من A (التأييد الأقصى) إلى K (الرفض الأقصى)، والفئة F محايدة. وحُسبت <b>القيمة المقياسية<\/b> لكل عبارة بوصفها وسيط تقديرات المحكمين، وحُسب <b>المدى الربيعي Q<\/b> مؤشرًا لغموض العبارة؛ فالعبارة التي يختلف عليها المحكمون (Q كبير) تُستبعد. وتكوّن المقياس النهائي من نحو 20–25 عبارة موزعة على المتصل كله (مجيد، 2014، ص 356–359).<\/p>\n<p><b>عبارات من المقياس وأوزانها<\/b> (القيمة الأقل = اتجاه أكثر تأييدًا في هذا المقياس):<\/p>\n<div class=\"tw\"><table><thead><tr><th>م<\/th><th>العبارة<\/th><th>القيمة المقياسية<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>أعتقد أن الكنيسة أعظم معهد أمريكي في الوقت الحاضر.<\/td><td>0.2<\/td><\/tr><tr><td>2<\/td><td>أعتقد أن الانتماء إلى الكنيسة يعتبر تقريبًا من أساسيات الحياة الناجحة في الوقت الحاضر.<\/td><td>1.5<\/td><\/tr><tr><td>3<\/td><td>أرى أن الخدمات التي تقدمها الكنيسة تبعث على الاستقرار والراحة.<\/td><td>2.2<\/td><\/tr><tr><td>4<\/td><td>أحب كنيستي لأن فيها يشيع جو المحبة.<\/td><td>3.3<\/td><\/tr><tr><td>5<\/td><td>أصدق ما تقدمه الكنيسة من تعليم ولكن مع بعض التحفظ العقلي.<\/td><td>4.5<\/td><\/tr><tr><td>6<\/td><td>أشعر في بعض الأحيان بأن الكنيسة والدين ضروريان، بينما أشك في ذلك أحيانًا أخرى.<\/td><td>5.6<\/td><\/tr><tr><td>7<\/td><td>أظن أن الكنيسة معطلة للدين لأنها لا تزال تعتمد على الخرافات السحرية والأساطير.<\/td><td>9.6<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"exbox\"><b>مثال تصحيح:<\/b> مفحوص وافق على العبارات 2 و3 و4 فقط ← قيمها 1.5 و2.2 و3.3 ← درجته = وسيطها = <b>2.2<\/b>، أي اتجاه مؤيد. ومفحوص وافق على العبارتين 6 و7 ← درجته = (5.6 + 9.6) ÷ 2 = <b>7.6<\/b>، أي اتجاه رافض.<\/p>\n<p><b>ما يوضحه:<\/b> المسافات بين العبارات متساوية «ظاهريًا» لأنها مبنية على أحكام المحكمين، والمفحوص لا يرى الأوزان. وتشير الدراسات التي عرضها الكتاب إلى أن تقديرات عدد أقل من المحكمين (نحو 15–50) تعطي قيمًا مقياسية قريبة من تقديرات العدد الكبير، فقد بلغ الارتباط بين قيم مجموعتين من المحكمين نحو 0.99 (مجيد، 2014، ص 359–360). ولأن عبارات ثرستون تتبع نموذج «النقطة المثالية» فإن معامل ألفا لا يناسبها، ويُقدَّر ثباتها بإعادة التطبيق أو بالصور المتكافئة.<\/p>"}, {"title": "طريقة ليكرت (1): مقياس روزنبرج لتقدير الذات (1965)", "en": "Rosenberg Self-Esteem Scale", "html": "\n<p><b>البنية:<\/b> عشر عبارات أحادية البعد يجيب عنها المفحوص على تدريج رباعي (أوافق بشدة، أوافق، أعارض، أعارض بشدة)؛ خمس عبارات موجبة وخمس سالبة تُعكس درجاتها لضبط أسلوب الموافقة. الدرجة الكلية من 10 إلى 40، والأعلى يعني تقديرًا أعلى للذات (Rosenberg, 1965). وهو من أكثر مقاييس ليكرت استخدامًا في البحوث، وتُرجم إلى لغات كثيرة منها العربية.<\/p>\n<div class=\"tw\"><table><thead><tr><th>م<\/th><th>العبارة (ترجمة الباحث)<\/th><th>الاتجاه<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>أنا راضٍ عن نفسي بوجه عام.<\/td><td>موجبة<\/td><\/tr><tr><td>2<\/td><td>أشعر أحيانًا أنني لا أصلح لشيء على الإطلاق.<\/td><td>سالبة<\/td><\/tr><tr><td>3<\/td><td>أشعر أن لديّ عددًا من الصفات الجيدة.<\/td><td>موجبة<\/td><\/tr><tr><td>4<\/td><td>أستطيع أن أؤدي الأعمال بمستوى أداء معظم الناس.<\/td><td>موجبة<\/td><\/tr><tr><td>5<\/td><td>أشعر أنه ليس لديّ ما أفخر به كثيرًا.<\/td><td>سالبة<\/td><\/tr><tr><td>6<\/td><td>أشعر بالتأكيد أنني عديم الفائدة أحيانًا.<\/td><td>سالبة<\/td><\/tr><tr><td>7<\/td><td>أشعر أنني شخص ذو قيمة، على الأقل مساوٍ للآخرين.<\/td><td>موجبة<\/td><\/tr><tr><td>8<\/td><td>أتمنى لو كان لديّ احترام أكبر لنفسي.<\/td><td>سالبة<\/td><\/tr><tr><td>9<\/td><td>أميل في المجمل إلى الشعور بأنني فاشل.<\/td><td>سالبة<\/td><\/tr><tr><td>10<\/td><td>أتخذ موقفًا إيجابيًا تجاه نفسي.<\/td><td>موجبة<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"exbox\"><b>مثال تصحيح:<\/b> الدرجات من 1 (أعارض بشدة) إلى 4 (أوافق بشدة) للعبارات الموجبة، وتُعكس للسالبة (الدرجة = 5 − الاستجابة). مفحوص اختار «أوافق» (3) في كل العبارات ← العبارات الموجبة 5 × 3 = 15، والسالبة بعد العكس 5 × (5 − 3) = 10 ← الدرجة الكلية <b>25<\/b> من 40. ولاحظ أن الموافقة على كل شيء لم تعطِ درجة مرتفعة، وهذه وظيفة العبارات السالبة.<\/p>\n<p><b>ما يوضحه:<\/b> خطوات ليكرت كما عرضها الكتاب: جمع عبارات كثيرة موجبة وسالبة، وتطبيقها على عينة، ثم <b>تحليل الفقرات<\/b> بمقارنة متوسطي أعلى 25% وأدنى 25% باختبار (ت)، وإبقاء العبارات المميزة (ت ≥ 1.75 تقريبًا)، حتى يتكون المقياس من نحو 20–25 عبارة؛ ويبلغ ثبات مقياس ليكرت من 20 عبارة عادة 0.85 فأكثر (مجيد، 2014، ص 362–366).<\/p>"}, {"title": "طريقة ليكرت (2): مقياس الاتجاه نحو المعوقين (يوكر وبلوك وكامبل، 1960)", "en": "Attitude Toward Disabled Persons (ATDP)", "html": "\n<p><b>البنية:<\/b> صورتان متكافئتان (A وB) في كل منهما 30 عبارة تتعلق بأوجه الشبه والاختلاف بين المعوقين وغيرهم والمعاملة الخاصة لهم، والاستجابة على تدريج سداسي (موافق جدًا، موافق، موافق قليلًا، غير موافق قليلًا، غير موافق، غير موافق جدًا). وبلغ ثبات التجزئة النصفية 0.78–0.83، ومعامل التكافؤ بين الصورتين 0.83 (مجيد، 2014، ص 386–387).<\/p>\n<div class=\"tw\"><table><thead><tr><th>الصورة<\/th><th>عبارات من المقياس<\/th><\/tr><\/thead><tbody><tr><td>A<\/td><td>العاجزون غالبًا ما يكونون غير محبوبين. · العاجزون أكثر انفعالًا من الناس الآخرين. · معظم العاجزين يشعرون بأنهم مثل الناس الآخرين. · الأطفال العاجزون ينبغي وضعهم مع الأطفال الاعتياديين.<\/td><\/tr><tr><td>B<\/td><td>العاجزون هم دائمًا محبوبون. · معظم العاجزين يتوقعون معاملة خاصة. · يفضل معظم العاجزين العمل مع الناس العاجزين. · لا يحتاج معظم العاجزين إلى رعاية خاصة.<\/td><\/tr><\/tbody><\/table><\/div>\n<p><b>ما يوضحه:<\/b> الصور المتكافئة طريقة لتقدير الثبات (معامل التكافؤ) ولإعادة القياس دون أثر التذكر؛ وفي الكتاب نموذج عربي مماثل هو مقياس الاتجاه نحو المتخلفين عقليًا الذي أعده يوسف القريوتي بطريقة ليكرت: بدأ بـ 38 عبارة، وبعد تحليل الفقرات بقيت 22 عبارة، وبلغ ثباته 0.90 بإعادة التطبيق و0.822 بالاتساق الداخلي، ومن عباراته: «المتخلفون عقليًا خطرون على السلامة العامة للمجتمع» (مجيد، 2014، ص 387–388).<\/p>"}, {"title": "طريقة جتمان (1): مقياس بوجاردس للبعد الاجتماعي (1925)", "en": "Bogardus Social Distance Scale", "html": "\n<p><b>البنية:<\/b> سبع عبارات متدرجة في القرب الاجتماعي من جماعة قومية، يُسأل المفحوص عن قبوله لأفرادها؛ ومن يقبل درجة قرب كبيرة يقبل عادة ما دونها، وهذا جوهر التدرج التراكمي الذي صاغه جتمان لاحقًا (مجيد، 2014، ص 353–355):<\/p>\n<ol><li>أقبل أن أتزوج من فرد منهم.<\/li><li>أقبل انضمام فرد منهم إلى النادي الذي أنتمي إليه ليكون صديقي.<\/li><li>أقبله جارًا لي في المسكن.<\/li><li>أقبله زميلًا في مهنتي.<\/li><li>أقبله مواطنًا في وطني.<\/li><li>أقبله زائرًا لوطني فقط.<\/li><li>أقبل استبعاده من وطني.<\/li><\/ol>\n<p><b>نتائج حقيقية:<\/b> طبّق بوجاردس المقياس على 1725 أمريكيًا، فكانت نسب القبول (%) لأربعة شعوب كما يلي:<\/p>\n<div class=\"tw\"><table><thead><tr><th>الشعب<\/th><th>1 زواج<\/th><th>2 صداقة<\/th><th>3 جيرة<\/th><th>4 زمالة<\/th><th>5 مواطنة<\/th><th>6 زائر فقط<\/th><th>7 استبعاد<\/th><\/tr><\/thead><tbody><tr><td>الإنجليز<\/td><td>93.7<\/td><td>96.7<\/td><td>97.3<\/td><td>95.4<\/td><td>95.9<\/td><td>1.7<\/td><td>—<\/td><\/tr><tr><td>السويديون<\/td><td>45.3<\/td><td>62.1<\/td><td>75.6<\/td><td>78.0<\/td><td>86.3<\/td><td>5.4<\/td><td>1.0<\/td><\/tr><tr><td>البولنديون<\/td><td>11.0<\/td><td>11.6<\/td><td>28.3<\/td><td>44.3<\/td><td>58.3<\/td><td>19.7<\/td><td>4.7<\/td><\/tr><tr><td>الكوريون<\/td><td>1.1<\/td><td>6.8<\/td><td>13.0<\/td><td>2.4<\/td><td>23.7<\/td><td>47.1<\/td><td>19.1<\/td><\/tr><\/tbody><\/table><\/div>\n<p><b>ما يوضحه:<\/b> كلما بعدت الجماعة اجتماعيًا انخفضت نسب القبول في الدرجات القريبة (الزواج والصداقة) قبل البعيدة (المواطنة)، وهذا هو النمط التراكمي. والتطبيق يبين أيضًا عيبًا ذكره الكتاب: الوحدات ليست متساوية، والانتقال من درجة إلى أخرى لا يمثل المسافة نفسها.<\/p>"}, {"title": "طريقة جتمان (2): مقياس الاتجاه نحو تعليم البنت", "en": "Guttman Cumulative Scale Example", "html": "\n<p>عرض الكتاب نموذجًا لمقياس تراكمي من خمس عبارات يجاب عنها بنعم أو لا (مجيد، 2014، ص 368):<\/p>\n<ol><li>ينبغي أن تكمل البنت تعليمها حتى بعد الجامعة.<\/li><li>نهاية المستوى الثانوي لا تعتبر كافية لتعليم البنت.<\/li><li>نهاية المستوى الإعدادي لا تعتبر كافية لتعليم البنت.<\/li><li>نهاية المستوى الابتدائي لا تعتبر كافية لتعليم البنت.<\/li><li>ينبغي ألا يزيد تعليم البنت عن مجرد القراءة والكتابة.<\/li><\/ol>\n<p>من يوافق على العبارة 1 يوافق على 2 و3 و4 ويرفض 5؛ فالأنماط المقبولة محدودة (مثل: نعم نعم نعم نعم لا، أو لا نعم نعم نعم لا)، ودرجة المفحوص = عدد مواقفه المؤيدة، وتكفي معرفتها لاستنتاج نمط إجاباته كله.<\/p>\n<p class=\"exbox\"><b>التحقق:<\/b> معامل إعادة الإنتاج CR = 1 − (عدد الأخطاء ÷ عدد الاستجابات الكلي)، ويُشترط ألا يقل عن 0.90 (أي ألا تتجاوز الأخطاء 10%)، ومعامل القياسية Scalability = (نسبة التحسن ÷ نسبة التحسن المحتملة) ولا يقل عن 0.60؛ حيث نسبة التحسن = CR − أقل قيمة لمعامل الإنتاج، ونسبة التحسن المحتملة = 1 − أقل قيمة لمعامل الإنتاج (مجيد، 2014، ص 369–370). <b>مثال تدريبي:<\/b> 20 مفحوصًا × 5 عبارات = 100 استجابة، فيها 7 أخطاء ← CR = 1 − 7/100 = <b>0.93<\/b> ← السلم تراكمي مقبول.<\/p>"}, {"title": "التمايز الدلالي (أوسجود وسوسي وتاننباوم، 1957)", "en": "Semantic Differential", "html": "\n<p><b>البنية:<\/b> مفهوم واحد يقيّمه المفحوص على أزواج من الصفات المتضادة بتدريج سباعي، وأظهرت التحليلات العاملية التي أجراها أوسجود وزملاؤه ثلاثة أبعاد عامة للمعنى: <b>التقييم<\/b> (جيد–رديء، مفيد–ضار)، و<b>القوة<\/b> (قوي–ضعيف، كبير–صغير)، و<b>النشاط<\/b> (سريع–بطيء، نشيط–خامل) (Osgood, Suci, &amp; Tannenbaum, 1957).<\/p>\n<p><b>نموذج من الكتاب<\/b> لمفهوم «التعلم» (مجيد، 2014، ص 371):<\/p>\n<div class=\"tw\"><table><thead><tr><th>الصفة الموجبة<\/th><th>7<\/th><th>6<\/th><th>5<\/th><th>4<\/th><th>3<\/th><th>2<\/th><th>1<\/th><th>الصفة السالبة<\/th><\/tr><\/thead><tbody><tr><td>سريع<\/td><td>—<\/td><td>—<\/td><td>—<\/td><td>—<\/td><td>—<\/td><td>—<\/td><td>—<\/td><td>بطيء<\/td><\/tr><tr><td>جيد<\/td><td>—<\/td><td>—<\/td><td>—<\/td><td>—<\/td><td>—<\/td><td>—<\/td><td>—<\/td><td>رديء<\/td><\/tr><tr><td>مفيد<\/td><td>—<\/td><td>—<\/td><td>—<\/td><td>—<\/td><td>—<\/td><td>—<\/td><td>—<\/td><td>غير مفيد<\/td><\/tr><tr><td>سار<\/td><td>—<\/td><td>—<\/td><td>—<\/td><td>—<\/td><td>—<\/td><td>—<\/td><td>—<\/td><td>غير سار<\/td><\/tr><\/tbody><\/table><\/div>\n<p><b>ما يوضحه:<\/b> تُعطى الدرجات من 1 إلى 7 (أو من −3 إلى +3) بحيث تقع القيمة الصغرى قرب الصفة السالبة، ويُحسب متوسط كل بعد. وذكر الكتاب أن ارتباط درجات التمايز الدلالي بدرجات مقياسي ثرستون وليكرت تراوح بين 0.74 و0.82، وأن ثبات التجزئة النصفية تراوح بين 0.83 و0.91 (مجيد، 2014، ص 372). ويُعاب عليه أنه يقيس الجانب الوجداني (المشاعر نحو المفهوم) أكثر من المعلومات أو السلوك.<\/p>"}, {"title": "الاختيار القسري: دراسة القيم (ألبورت وفيرنون وليندزي)", "en": "Study of Values — Forced Choice", "html": "\n<p><b>البنية:<\/b> يقيس ست قيم مستمدة من تصنيف شبرنجر: النظرية، والاقتصادية، والجمالية، والاجتماعية، والسياسية، والدينية. أعده جوردون ألبورت وفيليب فيرنون وجاردنر ليندزي، وعرّبه عطية محمود هنا (1986). وفي القسم الأول 30 فقرة يختار فيها المفحوص بين بديلين يمثلان قيمتين مختلفتين، وفي القسم الثاني 15 فقرة يرتب فيها أربعة بدائل (مجيد، 2014، ص 388–389).<\/p>\n<p class=\"exbox\"><b>فقرة من القسم الأول:<\/b> إن الهدف من الجمعيات الدينية في الوقت الحاضر يجب أن يكون: (أ) تنمية الإيثار وعمل الخير. (ب) تشجيع العبادة والصيام.<br><b>فقرة من القسم الثاني:<\/b> إذا كنت في مجتمع يضم أصدقاء لك من نفس الجنس فما هو الموضوع الذي تفضل التحدث فيه؟ معنى الحياة · التطورات العلمية · الأدب · الاشتراكية.<\/p>\n<p><b>ما يوضحه:<\/b> كل اختيار يعطي نقطة لقيمة على حساب أخرى، فمجموع الدرجات ثابت لكل مفحوص؛ وهذه درجات «إبساتية» تقارن قيم الفرد بعضها ببعض (أيها أقوى لديه) ولا تصلح للمقارنة بين الأفراد أو لحساب ألفا والتحليل العاملي التقليدي. ومن أشهر الاستبيانات القسرية الحديثة جدول إدواردز للتفضيل الشخصي (Edwards, 1959) بأزواجه المتكافئة في المرغوبية الاجتماعية، واستبيان OPQ32r الذي يُصحَّح بنموذج Thurstonian IRT (Brown &amp; Maydeu-Olivares, 2011) فيعطي درجات صالحة للمقارنة بين الأفراد.<\/p>"}, {"title": "نموذج راش ونظرية الاستجابة للمفردة والاختبار التكيفي", "en": "Rasch, IRT and CAT", "html": "\n<p><b>نموذج راش — استبيان «حب العلوم»:<\/b> من أشهر أمثلة نموذج سلم التقدير لأندريش التحليل الذي عرضه رايت وماسترز (Wright &amp; Masters, 1982) لاستبيان من 25 نشاطًا علميًا أجاب عنها 75 طفلًا بثلاث استجابات (لا أحب، محايد، أحب). أظهر التحليل ترتيب الأنشطة على متصل واحد من الأسهل تأييدًا (مثل مشاهدة الطيور) إلى الأصعب تأييدًا (مثل البحث عن الحشرات في شقوق الأرصفة)، وقدّر موقع كل طفل بوحدة اللوجيت على المتصل نفسه، وكشف عن العبارات غير المطابقة للنموذج. وهذا ما يفعله مختبر المقاييس تقريبيًا في خطوة الثبات حين تُختار طريقة راش.<\/p>\n<p><b>الاختبار التكيفي — بنوك PROMIS:<\/b> طورت المعاهد الوطنية للصحة الأمريكية منذ 2004 نظام PROMIS، وهو بنوك فقرات معايرة بنظرية الاستجابة للمفردة لقياس الاكتئاب والقلق والتعب وغيرها. ومن فقرات بنك الاكتئاب: «خلال الأيام السبعة الماضية شعرت بأنني بلا قيمة» (أبدًا، نادرًا، أحيانًا، غالبًا، دائمًا) (ترجمة الباحث). ويختار الحاسوب الفقرة التالية بحسب الإجابات السابقة، ويتوقف حين يصبح الخطأ المعياري صغيرًا بما يكفي، فيقيس بدقة بنحو 4–12 فقرة بدل البنك كله، وتُعرض الدرجة بالدرجة التائية (متوسط 50، انحراف 10).<\/p>\n<p><b>ما يوضحه:<\/b> في نظرية الاستجابة للمفردة تُقدَّر صعوبة الفقرة وقدرة الفرد على مقياس واحد، فيمكن بناء بنك فقرات، ومقارنة أفراد أجابوا عن فقرات مختلفة، وهو ما لا تتيحه النظرية الكلاسيكية.<\/p>"}, {"title": "الحكم الموقفي والتوليد بالذكاء الاصطناعي", "en": "SJT and AI Item Generation", "html": "\n<p><b>اختبارات الحكم الموقفي:<\/b> تُستخدم في اختيار المتقدمين لكليات الطب في المملكة المتحدة (ضمن اختبار UCAT) وفي اختيار المعلمين ورجال الشرطة. وبنود هذه الاختبارات محمية، لذلك نعرض <b>مثالًا توضيحيًا على النمط<\/b> لا بندًا حقيقيًا: «زميلك في مجموعة المشروع لم يسلّم الجزء المطلوب منه قبل الموعد بيومين. ما أنسب تصرف؟ (أ) تتحدث معه على انفراد لتعرف السبب وتعرض المساعدة. (ب) تبلغ المشرف فورًا. (ج) تكتب الجزء بدلًا منه دون إخباره. (د) تتجاهل الأمر.» ويُحدَّد مفتاح التصحيح بإجماع خبراء (هنا: أ أفضل، ود أسوأ).<\/p>\n<p><b>التوليد بالذكاء الاصطناعي:<\/b> من الأبحاث المنشورة في هذا الاتجاه دراسة هومل وزملائه (Hommel et al., 2022) في مجلة Psychometrika التي استخدمت نماذج لغوية من نوع المحولات لتوليد فقرات لسمات الشخصية، ودراسة جوتس وزملائه (Götz et al., 2024) في مجلة Psychological Methods التي اقترحت مولد الفقرات السيكومتري. وفي الحالتين لم تُستخدم الفقرات المولدة مباشرة، بل مرت بمراجعة الخبراء والتحليل العاملي، كما يفعل معالج «ابنِ مقياسك» حين يولد العبارات بحساب الطالب في Claude ثم يمررها على التحكيم والتجريب.<\/p>"}, {"title": "جدول جامع: لكل عالم مقياس أو تطبيق حقيقي", "en": "Scholars and Real Instruments", "html": "<p>يربط الجدول كل عالم ورد في البحث بأشهر مقياس أو اختبار حقيقي يرتبط باسمه، أو بتطبيق حقيقي لإسهامه في القياس حين لا يرتبط اسمه بمقياس بعينه.<\/p><div class=\"tw\"><table><thead><tr><th>العالم<\/th><th>المقياس أو التطبيق الحقيقي<\/th><\/tr><\/thead><tbody><tr><td>ألفريد بينيه<\/td><td>مقياس بينيه–سيمون للذكاء (1905): 30 مهمة متدرجة الصعوبة، ومنه مفهوم العمر العقلي؛ ثم ستانفورد–بينيه (تيرمان، 1916).<\/td><\/tr><tr><td>إدوارد ثورندايك<\/td><td>مقياس ثورندايك لجودة الخط (1910): عينات خط مرتبة على متصل متساوي الوحدات يُقارن بها خط التلميذ.<\/td><\/tr><tr><td>تشارلز سبيرمان<\/td><td>العامل العام g، ويُقاس عادة باختبار المصفوفات المتتابعة لرافن (1938).<\/td><\/tr><tr><td>لويس ثرستون<\/td><td>مقياس الاتجاه نحو الكنيسة مع شيف (1929)؛ واختبار القدرات العقلية الأولية (1938).<\/td><\/tr><tr><td>رنسيس ليكرت<\/td><td>مقاييس الاتجاهات في دراسته (1932)؛ وأشهر تطبيقات طريقته اليوم مقياس روزنبرج لتقدير الذات (1965).<\/td><\/tr><tr><td>لويس جتمان<\/td><td>تحليل السلالم التراكمية لاتجاهات الجنود الأمريكيين في الحرب العالمية الثانية؛ ومثاله الكلاسيكي سابقًا مقياس بوجاردس للبعد الاجتماعي (1925).<\/td><\/tr><tr><td>تشارلز أوسجود<\/td><td>التمايز الدلالي في كتاب «قياس المعنى» (1957) بأبعاده: التقييم والقوة والنشاط.<\/td><\/tr><tr><td>ستانلي ستيفنز<\/td><td>مستويات القياس (1946): النوع (اسمي)، الترتيب في مسابقة (رتبي)، درجة الحرارة المئوية ومعظم المقاييس النفسية (فئوي)، زمن الرجع (نسبي).<\/td><\/tr><tr><td>لي كرونباخ<\/td><td>معامل ألفا (1951) الذي يُحسب لكل مقياس ليكرت، ومنه مقياس روزنبرج.<\/td><\/tr><tr><td>بول ميل<\/td><td>صدق البناء (مع كرونباخ، 1955)؛ وشارك في التفكير المنهجي حول مقياس MMPI.<\/td><\/tr><tr><td>جين لوفينجر<\/td><td>اختبار جامعة واشنطن لتكملة الجمل لقياس نمو الأنا (WUSCT).<\/td><\/tr><tr><td>دونالد كامبل وفيسك<\/td><td>مصفوفة السمات والطرق المتعددة (1959) لفحص الصدق التقاربي والتمييزي.<\/td><\/tr><tr><td>صمويل ميسيك<\/td><td>المفهوم الموحد للصدق، ويُطبق في تقويم صدق الاختبارات الكبرى واستخدامات درجاتها وعواقبها.<\/td><\/tr><tr><td>مايكل كين<\/td><td>الصدق المبني على الحجة، وطُبق في بناء حجة صدق اختبار TOEFL iBT (Chapelle, Enright, &amp; Jamieson, 2008).<\/td><\/tr><tr><td>آن أناستازي<\/td><td>كتاب «الاختبارات النفسية» المرجعي الذي يعرض عشرات الاختبارات ومعاييرها.<\/td><\/tr><tr><td>جوم نانالي<\/td><td>محك 0.70 للحد الأدنى المقبول لمعامل ألفا في البحوث.<\/td><\/tr><tr><td>كودر وريتشاردسون<\/td><td>معادلتا KR‑20 وKR‑21 لثبات الاختبارات التحصيلية ذات الفقرات الثنائية؛ ولكودر أيضًا سجل كودر للتفضيل المهني.<\/td><\/tr><tr><td>هنري كايزر<\/td><td>محك الجذر الكامن ومؤشر KMO وتدوير فاريماكس، وتُستخدم في التحليل العاملي لكل مقياس متعدد الأبعاد.<\/td><\/tr><tr><td>ريموند كاتل<\/td><td>استخبار العوامل الستة عشر للشخصية 16PF (1949)؛ واختبار المنحدر (1966).<\/td><\/tr><tr><td>جون هورن<\/td><td>التحليل الموازي (1965) لتحديد عدد العوامل، ونظرية الذكاء السائل والمتبلور مع كاتل.<\/td><\/tr><tr><td>هو وبنتلر<\/td><td>محكات مؤشرات المطابقة (CFI ≥ 0.95، RMSEA ≤ 0.06) في التحليل العاملي التوكيدي.<\/td><\/tr><tr><td>سي. إتش. لوشي<\/td><td>نسبة صدق المحتوى CVR (1975)، طُورت لتحكيم اختبارات الاختيار المهني.<\/td><\/tr><tr><td>ماري لين<\/td><td>تكميم صدق المحتوى بمؤشر CVI مع 3–10 خبراء (1986).<\/td><\/tr><tr><td>لويس أيكن<\/td><td>معامل V (1985) لاتفاق المحكمين على تقديرات متدرجة.<\/td><\/tr><tr><td>بوليت وبيك<\/td><td>مؤشرا S‑CVI/Ave وS‑CVI/UA لصدق المحتوى للمقياس ككل (2006).<\/td><\/tr><tr><td>جوردون ويليس<\/td><td>المقابلات المعرفية (2005) لفحص فهم المفحوصين للعبارات أثناء التجريب.<\/td><\/tr><tr><td>روبرت ديفيليس<\/td><td>كتاب «تطوير المقاييس: النظرية والتطبيق» المرجعي في خطوات البناء.<\/td><\/tr><tr><td>كلارك وواطسون<\/td><td>جدول الوجدان الإيجابي والسلبي PANAS (Watson, Clark, &amp; Tellegen, 1988): 20 صفة على تدريج خماسي.<\/td><\/tr><tr><td>تيموثي هينكن<\/td><td>التوليد الاستنباطي والاستقرائي للفقرات في بناء مقاييس السلوك التنظيمي.<\/td><\/tr><tr><td>جودفري بواتينج<\/td><td>أفضل ممارسات تطوير المقاييس في ثلاث مراحل وتسع خطوات (2018).<\/td><\/tr><tr><td>روديريك ماكدونالد<\/td><td>معامل أوميغا (1999) بديلًا لألفا حين تختلف تشبعات الفقرات.<\/td><\/tr><tr><td>جاكوب كوهين<\/td><td>معامل كابا (1960) لاتفاق مصححين أو مشخصين على تصنيفات.<\/td><\/tr><tr><td>جورج راش<\/td><td>نموذج راش (1960)، وطُبق أولًا على اختبارات القراءة والذكاء العسكرية الدنماركية.<\/td><\/tr><tr><td>فريدريك لورد<\/td><td>نظرية الاستجابة للمفردة وتطبيقها على اختبارات SAT في ETS.<\/td><\/tr><tr><td>ديفيد أندريش<\/td><td>نموذج سلم التقدير (1978) لمقاييس ليكرت.<\/td><\/tr><tr><td>بنجامين رايت<\/td><td>تحليل استبيان «حب العلوم» (مع ماسترز، 1982)، وبرامج تحليل راش.<\/td><\/tr><tr><td>رونالد هامبلتون<\/td><td>إرشادات ITC لترجمة الاختبارات وتكييفها عبر الثقافات.<\/td><\/tr><tr><td>مانتل وهانزل<\/td><td>إحصائي مانتل–هانزل (1959) في البحوث الطبية، ثم في كشف DIF.<\/td><\/tr><tr><td>هولاند وثاير<\/td><td>تطبيق مانتل–هانزل على DIF في اختبارات ETS (1988)، وتصنيف A/B/C.<\/td><\/tr><tr><td>برونو زومبو<\/td><td>كشف DIF بالانحدار اللوجستي (1999)، ومثاله في البحث: Zumbo (1999).<\/td><\/tr><tr><td>ويليام ميريديث<\/td><td>التكافؤ القياسي (1993) لاختبار عدالة المقياس بين الجنسين أو الثقافات.<\/td><\/tr><tr><td>آلن إدواردز<\/td><td>مقياس إدواردز للمرغوبية الاجتماعية (1957)، وجدول إدواردز للتفضيل الشخصي (1959).<\/td><\/tr><tr><td>كراون ومارلو<\/td><td>مقياس المرغوبية الاجتماعية (1960): 33 عبارة صح/خطأ، منها «لم أكره أحدًا كرهًا شديدًا قط» (ترجمة الباحث).<\/td><\/tr><tr><td>ديلروي باولهس<\/td><td>قائمة الاستجابة المرغوبة اجتماعيًا المتوازنة BIDR (1991): 40 عبارة.<\/td><\/tr><tr><td>فيليب بودساكوف<\/td><td>اختبار هارمان للعامل الواحد وأساليب ضبط تحيز الطريقة المشتركة (2003).<\/td><\/tr><tr><td>روبرت روزنتال<\/td><td>دراسة «بجماليون في الفصل» (مع جاكوبسون، 1968) التي استخدمت اختبار ذكاء غير لفظي.<\/td><\/tr><tr><td>ويليام أنجوف<\/td><td>طريقة أنجوف لتحديد درجة القطع في امتحانات الترخيص المهني (1971).<\/td><\/tr><tr><td>روبرت إيبل<\/td><td>طريقة إيبل لدرجة القطع، ومحك تصنيف معامل التمييز (≥ 0.40 ممتاز).<\/td><\/tr><tr><td>ليو ندلسكي<\/td><td>طريقة ندلسكي (1954) لدرجة القطع في اختبارات الاختيار من متعدد.<\/td><\/tr><tr><td>ليفنجستون وزيكي<\/td><td>طريقتا المجموعات المتضادة والحدية لدرجات القطع (1982).<\/td><\/tr><tr><td>رونالد بيرك<\/td><td>معايير اختيار طريقة تحديد درجة القطع (1986).<\/td><\/tr><tr><td>رالف تايلر<\/td><td>دراسة السنوات الثماني (1933–1941) وتقويم المناهج بالأهداف.<\/td><\/tr><tr><td>مايكل سكريفن<\/td><td>التمييز بين التقويم التكويني والختامي (1967).<\/td><\/tr><tr><td>دانيال ستافلبيم<\/td><td>نموذج CIPP لتقويم البرامج، ويُستخدم فيه الاستبيان والمقابلة.<\/td><\/tr><tr><td>بلاك وويليام<\/td><td>مراجعة «داخل الصندوق الأسود» (1998) لأثر التقييم التكويني.<\/td><\/tr><tr><td>جان بياجيه<\/td><td>مهام الاحتفاظ والمقابلة الإكلينيكية؛ ومنها بُنيت سلالم أوزجيريس وهنت الترتيبية للنمو النفسي في الطفولة (1975).<\/td><\/tr><tr><td>ليف فيجوتسكي<\/td><td>منطقة النمو القريبة، ومنها التقييم الدينامي (قياس قبلي ← تدخل ← قياس بعدي).<\/td><\/tr><tr><td>جيروم برونر<\/td><td>لا يرتبط باسمه مقياس نفسي مشهور؛ وتطبيقه في القياس: تقويم التعلم بالاكتشاف بالملاحظة وبطاقات الأداء.<\/td><\/tr><tr><td>جورج كيلي<\/td><td>شبكة المخزون (Repertory Grid، 1955) لاستخراج البناءات الشخصية بطريقة الثلاثيات.<\/td><\/tr><tr><td>فون جلاسرسفيلد<\/td><td>البنائية الجذرية؛ وتطبيقها في القياس: المقابلات التي تكشف بناء الطالب لمعرفته.<\/td><\/tr><tr><td>رؤوفين فويرشتاين<\/td><td>أداة تقييم إمكانات التعلم LPAD (تقييم دينامي).<\/td><\/tr><tr><td>تايلور وفريزر<\/td><td>مسح البيئة التعلمية البنائية CLES بأبعاده الخمسة.<\/td><\/tr><tr><td>كيرشنر وسويلر<\/td><td>مقاييس العبء المعرفي (مثل مقياس باس للجهد العقلي) في دراسات التعليم الموجه.<\/td><\/tr><tr><td>نجاة زكي موسى<\/td><td>مقياسا الاتزان الانفعالي والمرغوبية الاجتماعية في بحثيها عن الأداء التفاضلي (2022)، المعروضين في الفصل السابع من هذا البحث.<\/td><\/tr><tr><td>صلاح الدين علام<\/td><td>كتابا القياس والتقويم التربوي والنفسي، ونماذج الاستجابة للمفردة، وفيهما أمثلة عربية لبناء المقاييس وتحليلها.<\/td><\/tr><tr><td>فؤاد أبو حطب وآمال صادق<\/td><td>التقويم النفسي ومناهج البحث، ويعرضان المقاييس العربية المقننة وطرق تقنينها.<\/td><\/tr><tr><td>سوسن شاكر مجيد<\/td><td>كتاب «أسس بناء الاختبارات والمقاييس النفسية والتربوية» (2014)، ومنه نماذج هذا الفصل: ثرستون، وبوجاردس، وجتمان، والتمايز الدلالي، ودراسة القيم.<\/td><\/tr><\/tbody><\/table><\/div>"}, {"title": "مراجع هذا الفصل", "en": "References", "html": "<ul class=\"refs\"><li>Allport, G. W., Vernon, P. E., &amp; Lindzey, G. (1960). <i>Study of values<\/i> (3rd ed.). Houghton Mifflin.<\/li><li>Bogardus, E. S. (1925). Measuring social distance. <i>Journal of Applied Sociology, 9<\/i>, 299–308.<\/li><li>Brown, A., &amp; Maydeu-Olivares, A. (2011). Item response modeling of forced-choice questionnaires. <i>Educational and Psychological Measurement, 71<\/i>(3), 460–502.<\/li><li>Götz, F. M., Maertens, R., Loomba, S., &amp; van der Linden, S. (2024). Let the algorithm speak: How to use neural networks for automatic item generation in psychological scale development. <i>Psychological Methods, 29<\/i>(3), 494–518.<\/li><li>Hommel, B. E., Wollang, F.-J. M., Kotova, V., Zacher, H., &amp; Schmukle, S. C. (2022). Transformer-based deep neural language modeling for construct-specific automatic item generation. <i>Psychometrika, 87<\/i>(2), 749–772.<\/li><li>Osgood, C. E., Suci, G. J., &amp; Tannenbaum, P. H. (1957). <i>The measurement of meaning<\/i>. University of Illinois Press.<\/li><li>Rosenberg, M. (1965). <i>Society and the adolescent self-image<\/i>. Princeton University Press.<\/li><li>Thurstone, L. L., &amp; Chave, E. J. (1929). <i>The measurement of attitude<\/i>. University of Chicago Press.<\/li><li>Watson, D., Clark, L. A., &amp; Tellegen, A. (1988). Development and validation of brief measures of positive and negative affect: The PANAS scales. <i>Journal of Personality and Social Psychology, 54<\/i>(6), 1063–1070.<\/li><li>Wright, B. D., &amp; Masters, G. N. (1982). <i>Rating scale analysis<\/i>. MESA Press.<\/li><li>Yuker, H. E., Block, J. R., &amp; Campbell, W. J. (1960). <i>A scale to measure attitudes toward disabled persons<\/i>. Human Resources Foundation.<\/li><li>مجيد، سوسن شاكر (2014). <i>أسس بناء الاختبارات والمقاييس النفسية والتربوية<\/i> (ط3). عمّان: مركز ديبونو لتعليم التفكير.<\/li><\/ul>"}]}}, "order": [["المدخل", "الخلاصة في دقائق", ["intro"]], ["الوحدة الأولى", "المفاهيم والأسس العلمية", ["p1", "p2"]], ["الوحدة الثانية", "بناء المقياس خطوة بخطوة", ["p3", "rules12", "methods", "real", "p11", "p4"]], ["الوحدة الثالثة", "الإحصاء: الصدق والثبات والمعادلات", ["p10", "rel", "p12", "p13"]], ["الوحدة الرابعة", "المدارس والبحوث والدراسات", ["p5", "p6", "p7", "p8", "p9"]], ["المكتبة", "المراجعة والملاحق والمسارد", ["compare", "p14", "apx", "gloss", "sch", "refs"]]], "bank": [{"q": "لماذا لا يكفي التحكيم النظري للبنود؟", "a": "لأن الاستجابة الفعلية قد تكشف صعوبة أو تمييزًا أو فهمًا مختلفًا عما يتوقعه الخبير.", "part": "p2"}, {"q": "ما الفرق بين بند جيد إحصائيًا وبند صالح محتوى؟", "a": "الجودة الإحصائية مرهونة بأداء العينة، بينما صدق التمثيل يتعلق بانتماء البند للنطاق المحدد وتغطيته.", "part": "p2"}, {"q": "ما أهمية اختيار عينة تقنين ممثلة؟", "a": "حتى تحمل المقارنات المرجعية معنى مقبولًا للفئة التي ستُطبق عليها الأداة.", "part": "p2"}, {"q": "كيف تؤثر عينة التقنين؟", "a": "تؤثر في التوزيع المرجعي وبالتالي معنى الدرجات النسبية وإمكان تعميمها.", "part": "p2"}, {"q": "ما المشكلة في بنود ذات مشتتات لا يختارها أحد؟", "a": "قد لا تضيف قدرة تشخيصية أو تمييزية وتحتاج إلى تعديل.", "part": "p2"}, {"q": "لماذا اختيرت المجموعتان العليا والدنيا بدلًا من كل أفراد العينة؟", "a": "لتكبير التباين بين فئتي الأداء وإظهار قدرة البند على الفصل، مع بقاء احتمال فقد معلومات الوسط وارتفاع حساسية النتيجة لتكوين العينة.", "part": "p2"}, {"q": "إذا كان معامل التمييز سالبًا، هل نحذف البند فورًا؟", "a": "لا؛ يُراجع أولًا مفتاح التصحيح وصياغة البند واحتمال تفسيره بوجهين وتركيب العينة وغرض الاختبار.", "part": "p2"}, {"q": "هل البند الأصعب هو الأفضل دائمًا؟", "a": "لا؛ تُختار درجات الصعوبة بما يخدم القدرة أو التحصيل المستهدف وحدود الفئة، وتُفحص قوة التمييز مع ملاءمة المحتوى.", "part": "p2"}, {"q": "متى تكون صعوبة البند المرتفعة ملائمة؟", "a": "عندما يتناسب المستوى مع غرض الاختبار ومجتمع التطبيق والمجال المراد تمثيله.", "part": "p2"}, {"q": "لماذا لا تصح المقارنة المباشرة بين النسب الخام للصعوبة؟", "a": "لأن تغير نسبة الصحيحة لا يلزم أن يمثل تغيرًا متساويًا في مستوى القدرة، ولأن شكل التوزيع وتكوين العينة يغيران معناه.", "part": "p2"}, {"q": "لماذا لا يكفي اختبار بدرجة ثبات عالية؟", "a": "الثبات لا يحدد بمفرده ما يقيسه الاختبار ولا يبرر جميع قرارات تفسير الدرجة.", "part": "p2"}, {"q": "متى يكون التفسير المحكي أنسب؟", "a": "حين نريد الحكم على إتقان مهارة أو مستوى أداء معرف مسبقًا، لا مجرد ترتيب الأفراد.", "part": "p2"}, {"q": "ما خطأ الاعتماد المطلق على اختبار معياري المرجع عند قياس الإتقان؟", "a": "لأن الموقع النسبي بين الأفراد لا يساوي بالضرورة إثبات بلوغ مستوى محدد من المعرفة أو المهارة.", "part": "p2"}, {"q": "كيف يؤثر مستوى القطع في القرار؟", "a": "لأنه يحوّل الدرجة إلى فئة اجتياز/عدم اجتياز، فتتغير أخطاء التصنيف بتغيره.", "part": "p2"}, {"q": "هل تتغير قيمة درجة القطع حسب القرار؟", "a": "قد تختلف باختلاف تعريف الكفاية والخطأ المحتمل وعواقب التصنيف؛ ويلزم توثيق منهج الاختيار.", "part": "p2"}, {"q": "لماذا تحتاج طريقة أنجوف محكمين مدربين؟", "a": "لأن تقدير أداء
