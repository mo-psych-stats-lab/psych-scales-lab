<body><div id="app" class="app"></div><div id="toast" class="toast" hidden role="status" aria-live="polite"></div><script type="application/json" id="content">{"parts": {"intro": {"key": "intro", "no": null, "title": "الخلاصة وورقة المراجعة", "en": "", "sections": [{"title": "الخلاصة التنفيذية", "en": "", "html": "<aside class=\"box note\"><div class=\"bt\">ملاحظة: الخلاصة في عشر نقاط<\/div><ul><li><b>القياس<\/b> إجراء (تعيين أعداد وفق قواعد — ستيفنز 1946)، و<b>الاختبار<\/b> أداة أداء أقصى بصواب وخطأ، و<b>المقياس<\/b> أداة أداء معتاد بلا صواب وخطأ، و<b>التقييم (Assessment)<\/b> تفسير وتشخيص، و<b>التقويم<\/b> حكم وقرار وعلاج؛ والعلاقة: قياس ← تقييم ← تقويم.<div class=\"en\" dir=\"ltr\">Assessment · Evaluation · Stevens 1946<\/div><\/li><li><b>ليس كل مقياس اختبارًا<\/b>، والاختبار مقياس بالمعنى الواسع فقط؛ والفيصل طبيعة الاستجابة لا اسم الأداة (مقياس وكسلر «اختبار»، و«اختبار» مؤشر مايرز-بريجز للأنماط «مقياس»).<div class=\"en\" dir=\"ltr\">MBTI<\/div><\/li><li><b>المادة العلمية<\/b> (149 صفحة) تغطي: التصميم والتخطيط، تحليل البنود كيفيًا وكميًا، الدليل والأخلاقيات، المعياري والمحكي، الوجدان والمرغوبية، الصدق والثبات، <b>15 طريقة<\/b> لدرجات القطع، الكفايات والتحليل الهرمي، وفن تطبيق الاختبار؛ ونُقلت كلها إلى المقاييس.<\/li><li><b>قاعدة التحويل:<\/b> الصعوبة ← مؤشر التأييد/معلم راش، المشتتات ← فئات الاستجابة، التخمين ← أنماط الاستجابة (المرغوبية، الموافقة، الإهمال)، الإتقان ← مستوى السمة ونقاط القطع بمحك مستقل.<\/li><li><b>خطوات إعداد المقياس:<\/b> 12 خطوة في 3 مراحل (تطوير البنود، البناء، التقويم)، ولكل خطوة علماؤها: كرونباخ وميل، لوفينجر، ليكرت، ثرستون، جتمان، لوشي، لين، أيكن، ويليس، كايزر، كاتل، هورن، هو وبنتلر، كامبل وفيسك، كرونباخ، ماكدونالد، كيودر وريتشاردسون، مانتل وهانزل، ميسيك، كين، بواتنج وآخرون<div class=\"en\" dir=\"ltr\">Cronbach &amp; Meehl · Loevinger · Likert · Thurstone · Guttman · Lawshe · Lynn · Aiken · Willis · Kaiser · Cattell · Horn · Hu &amp; Bentler · Campbell &amp; Fiske · Cronbach · McDonald · Kuder &amp; Richardson · Mantel &amp; Haenszel · Messick · Kane · Boateng<\/div><\/li><li><b>الذاتية لا تُلغى بل تُخفّض<\/b> بطبقات متعددة عبر البناء والتطبيق والتصحيح والتفسير؛ وضبط المرغوبية إحصائيًا <b>خلافي<\/b> (قد يحذف تباينًا حقيقيًا).<\/li><li><b>البنائية<\/b> (بياجيه، فيجوتسكي، برونر، كيلي، فون جلاسرسفيلد) محقة في وصف التعلم؛ ومقاييسها الأشهر <b>مسح البيئة التعلمية البنائية<\/b> بأبعاده الخمسة، وأدواتها التقويمية: ملف الإنجاز، محكات التقدير، خرائط المفاهيم، <b>التقييم الدينامي<\/b>؛ وهي مكمّلة للقياس الموضوعي لا بديل عنه.<div class=\"en\" dir=\"ltr\">CLES<\/div><\/li><li><b>بحث «الأداء التفاضلي لنوع الطالب على مقياس الاتزان الانفعالي»:<\/b> مقياس اتزان انفعالي (19 ← 16 عبارة) بنموذج راش؛ ثبات الأفراد 0.89 والمفردات 0.98؛ الأداء التفاضلي للمفردة للنوع في المفردات 10 و12 (للذكور) و16 (للإناث).<div class=\"en\" dir=\"ltr\">DIF<\/div><\/li><li><b>بحث «المرغوبية الاجتماعية وعلاقتها بالذكاء العاطفي»:<\/b> قائمة باولهس المتوازنة للاستجابة المرغوبة اجتماعيًا عربي (40 ← 26 عبارة) بترجمة عكسية والتحليل العاملي التوكيدي؛ ارتباط المرغوبية بالذكاء العاطفي r = 0.427 لدى 755 طالبًا.<div class=\"en\" dir=\"ltr\">BIDR · CFA<\/div><\/li><li><b>فجوات بحثية واعدة:<\/b> الأداء التفاضلي للمفردة بعد ضبط المرغوبية، تكافؤ الصورتين الورقية والإلكترونية، العبارات المعكوسة بالعربية، فصل «التلوث» عن «الجوهر» بتصميم متعدد المصادر.<div class=\"en\" dir=\"ltr\">DIF<\/div><\/li><\/ul><\/aside>"}, {"title": "ورقة المراجعة السريعة", "en": "Two-Page Review Sheet", "html": "<div class=\"tw\"><table><tr><th><div class=\"cp\"><b>المحور<\/b><\/div><\/th><th><div class=\"cp\"><b>ما يجب أن تقوله في جملة<\/b><\/div><\/th><\/tr><tr><td><div class=\"cp\">القياس<\/div><\/td><td><div class=\"cp\">تعيين أعداد وفق قواعد (ستيفنز 1946)<\/div><\/td><\/tr><tr><td><div class=\"cp\">الاختبار مقابل المقياس<\/div><\/td><td><div class=\"cp\">الاختبار أداء أقصى بصواب وخطأ، والمقياس أداء معتاد بلا صواب وخطأ<\/div><\/td><\/tr><tr><td><div class=\"cp\">التقييم مقابل التقويم<\/div><\/td><td><div class=\"cp\">التقييم = وصف وتشخيص (التقويم)، والتقويم = حكم وقرار وعلاج (التقويم)<\/div><div class=\"en\" dir=\"ltr\">Assessment · Evaluation<\/div><\/td><\/tr><tr><td><div class=\"cp\">الهرم<\/div><\/td><td><div class=\"cp\">قياس ← تقييم ← تقويم<\/div><\/td><\/tr><tr><td><div class=\"cp\">التحويل للمقاييس<\/div><\/td><td><div class=\"cp\">الصعوبة ← مؤشر التأييد؛ المشتتات ← فئات الاستجابة؛ التخمين ← أنماط الاستجابة<\/div><\/td><\/tr><tr><td><div class=\"cp\">خطة الكتاب<\/div><\/td><td><div class=\"cp\">8 خطوات: الغرض، المحك، العينة، التحليل، المفردات، الصعوبة والتمييز، التصحيح، الصورة النهائية والدليل<\/div><\/td><\/tr><tr><td><div class=\"cp\">مثال الكتاب<\/div><\/td><td><div class=\"cp\">100 فرد، 27 لكل مجموعة: س (18−6)/27 = 0.44؛ ص (8−3)/27 = 0.19<\/div><\/td><\/tr><tr><td><div class=\"cp\">مدى التمييز<\/div><\/td><td><div class=\"cp\">من −1 إلى +1؛ السالب يُراجع لا يُحذف فورًا<\/div><\/td><\/tr><tr><td><div class=\"cp\">درجات القطع<\/div><\/td><td><div class=\"cp\">15 طريقة؛ لا توجد طريقة أفضل مطلقًا؛ اسأل عن تعريف الإتقان ومصدر الحد وحساسية الخطأ<\/div><\/td><\/tr><tr><td><div class=\"cp\">أنجوف<\/div><\/td><td><div class=\"cp\">احتمالات نجاح الحدّي تُجمع (مثال: 0.8+0.7+0.6+0.5+0.4 = 3 من 5)<\/div><\/td><\/tr><tr><td><div class=\"cp\">المتضادة / الحدّية<\/div><\/td><td><div class=\"cp\">تقاطع التوزيعين / وسيط الحدّيين — بشرط محك مستقل<\/div><\/td><\/tr><tr><td><div class=\"cp\">الهدف السلوكي<\/div><\/td><td><div class=\"cp\">سلوك + محتوى + شرط + مستوى<\/div><\/td><\/tr><tr><td><div class=\"cp\">مراحل البناء<\/div><\/td><td><div class=\"cp\">تطوير البنود ← بناء المقياس ← تقويمه (بواتينج وآخرون 2018)<\/div><\/td><\/tr><tr><td><div class=\"cp\">صدق المحتوى<\/div><\/td><td><div class=\"cp\">نسبة صدق المحتوى لوشي؛ مؤشر صدق المحتوى؛ القيمة الحرجة تتغير بعدد المحكمين<\/div><div class=\"en\" dir=\"ltr\">CVR · CVI<\/div><\/td><\/tr><tr><td><div class=\"cp\">البنية العاملية<\/div><\/td><td><div class=\"cp\">مؤشر كايزر–ماير–أولكن ≥ 0.60؛ تحليل موازي؛ مؤشر المطابقة المقارن/مؤشر توكر–لويس ≥ 0.95؛ جذر متوسط مربع خطأ الاقتراب ≤ 0.06<\/div><div class=\"en\" dir=\"ltr\">KMO · CFI/TLI · RMSEA<\/div><\/td><\/tr><tr><td><div class=\"cp\">الثبات<\/div><\/td><td><div class=\"cp\">ألفا ≥ 0.70 مع أوميغا؛ ألفا ليست دليل أحادية بُعد<\/div><\/td><\/tr><tr><td><div class=\"cp\">العدالة<\/div><\/td><td><div class=\"cp\">مانتل–هانزل + حجم أثر هيئة خدمات الاختبارات التربوية (A/B/C) + تكافؤ Δفرق مؤشر المطابقة المقارن ≤ 0.01<\/div><div class=\"en\" dir=\"ltr\">ETS (A/B/C) · CFI<\/div><\/td><\/tr><tr><td><div class=\"cp\">الذاتية<\/div><\/td><td><div class=\"cp\">لا تُلغى بل تُخفض بطبقات؛ ضبط المرغوبية إحصائيًا خلافي<\/div><\/td><\/tr><tr><td><div class=\"cp\">خداع الذات / إدارة الانطباع<\/div><\/td><td><div class=\"cp\">لا واعٍ / واعٍ (باولهس)<\/div><\/td><\/tr><tr><td><div class=\"cp\">البنائية<\/div><\/td><td><div class=\"cp\">بياجيه، فيجوتسكي، برونر، كيلي؛ مسح البيئة التعلمية البنائية بخمسة أبعاد؛ التقييم الدينامي<\/div><div class=\"en\" dir=\"ltr\">CLES<\/div><\/td><\/tr><tr><td><div class=\"cp\">موقفي من البنائية<\/div><\/td><td><div class=\"cp\">تكاملي: البنائية تحدد ماذا نقيس، والقياس الموضوعي يحدد كيف<\/div><\/td><\/tr><tr><td><div class=\"cp\">بحث «الأداء التفاضلي لنوع الطالب على مقياس الاتزان الانفعالي»<\/div><\/td><td><div class=\"cp\">639 طالبًا؛ 19 ← 16 مفردة؛ الأداء التفاضلي للمفردة: 10، 12 (ذكور)، 16 (إناث)؛ ثبات 0.89/0.98<\/div><div class=\"en\" dir=\"ltr\">DIF: 10<\/div><\/td><\/tr><tr><td><div class=\"cp\">بحث «المرغوبية الاجتماعية وعلاقتها بالذكاء العاطفي»<\/div><\/td><td><div class=\"cp\">755 طالبًا؛ قائمة باولهس المتوازنة للاستجابة المرغوبة اجتماعيًا 40 ← 26؛ r = 0.427؛ مؤشر المطابقة المقارن = 0.688 (نقطة نقد)<\/div><div class=\"en\" dir=\"ltr\">BIDR 40 · CFI<\/div><\/td><\/tr><tr><td><div class=\"cp\">معادلات سريعة<\/div><\/td><td><div class=\"cp\">T = 50 + 10z؛ الخطأ المعياري للقياس = ع√(1−r)؛ سبيرمان–براون = 2r/(1+r)<\/div><div class=\"en\" dir=\"ltr\">SEM · SBr/(1+r)<\/div><\/td><\/tr><tr><td><div class=\"cp\">أقوى فجوة بحثية<\/div><\/td><td><div class=\"cp\">الأداء التفاضلي للمفردة بعد ضبط المرغوبية + تكافؤ الصورتين الورقية والإلكترونية<\/div><div class=\"en\" dir=\"ltr\">DIF<\/div><\/td><\/tr><\/table><\/div>"}]}, "p1": {"key": "p1", "no": 1, "title": "المفاهيم الأساسية — القياس، المقياس، الاختبار، التقييم، التقويم", "en": "Part One: Core Concepts — Measurement, Scale, Test, Assessment, Evaluation", "sections": [{"title": "1.1 القياس", "en": "", "html": "<h4><b>التعريف اللغوي<\/b><\/h4><p>القياس في العربية من الجذر (ق ي س): قاس الشيءَ بغيره أو على غيره: <b>قدّره على مثاله<\/b>. والمعنى المحوري: تقدير الشيء بنسبته إلى معيار معلوم..<\/p><h4><b>التعريفات الاصطلاحية<\/b><\/h4><div class=\"tw\"><table><tr><th><div class=\"cp\"><b>العالِم<\/b><\/div><\/th><th><div class=\"cp\"><b>التعريف<\/b><\/div><\/th><th><div class=\"cp\"><b>ما يميّزه<\/b><\/div><\/th><\/tr><tr><td><div class=\"cp\"><b>ثورندايك (1918)<\/b><\/div><div class=\"en\" dir=\"ltr\">Thorndike (1918)<\/div><\/td><td><div class=\"cp\">كل ما يوجد، يوجد بمقدار<\/div><div class=\"en\" dir=\"ltr\">«Whatever exists at all exists in some amount»<\/div><\/td><td><div class=\"cp\">الأساس الفلسفي لإمكان قياس الظواهر النفسية<\/div><\/td><\/tr><tr><td><div class=\"cp\"><b>ماكول (1939)<\/b><\/div><div class=\"en\" dir=\"ltr\">McCall (1939)<\/div><\/td><td><div class=\"cp\">كل ما يوجد بمقدار يمكن قياسه<\/div><div class=\"en\" dir=\"ltr\">«Anything that exists in amount can be measured»<\/div><\/td><td><div class=\"cp\">استكمال لعبارة ثورنديك<\/div><\/td><\/tr><tr><td><div class=\"cp\"><b>كامبل (1920)<\/b><\/div><div class=\"en\" dir=\"ltr\">Campbell (1920)<\/div><\/td><td><div class=\"cp\">القياس في العلوم الطبيعية: تمثيل الخصائص بالأعداد، مع التمييز بين القياس الأساسي والمشتق<\/div><div class=\"en\" dir=\"ltr\">Fundamental · Derived<\/div><\/td><td><div class=\"cp\">التصور الفيزيائي الصارم الذي رفض إمكان القياس النفسي، فجاء رد ستيفنز<\/div><\/td><\/tr><tr><td><div class=\"cp\"><b>ستيفنز (1946)<\/b><\/div><div class=\"en\" dir=\"ltr\">Stevens (1946)<\/div><\/td><td><div class=\"cp\">القياس هو <b>تعيين أعداد للأشياء أو الأحداث وفق قواعد<\/b><\/div><div class=\"en\" dir=\"ltr\">«Measurement, in the broadest sense, is defined as the assignment of numerals to objects or events according to rules»<\/div><\/td><td><div class=\"cp\">التعريف الأكثر اقتباسًا؛ ومنه مستويات القياس الأربعة: الاسمي، الرتبي، الفئوي (المسافات)، النسبي<\/div><\/td><\/tr><tr><td><div class=\"cp\"><b>نانلي وبيرنشتاين (1994)<\/b><\/div><div class=\"en\" dir=\"ltr\">Nunnally &amp; Bernstein (1994)<\/div><\/td><td><div class=\"cp\">القياس قواعد لتعيين رموز للأشياء بحيث (1) تمثل مقادير الخصائص عدديًا (<b>التدريج<\/b>) أو (2) تحدد هل تقع الأشياء في الفئة نفسها أو فئات مختلفة (<b>التصنيف<\/b>)<\/div><div class=\"en\" dir=\"ltr\">Scaling · Classification<\/div><\/td><td><div class=\"cp\">يربط القياس بالتدريج والتصنيف معًا، ويشدد على أن القواعد يجب أن تكون صريحة ومتفقًا عليها<\/div><\/td><\/tr><tr><td><div class=\"cp\"><b>راش (1960) ومدرسة القياس الموضوعي<\/b><\/div><div class=\"en\" dir=\"ltr\">Rasch<\/div><\/td><td><div class=\"cp\">القياس لا يكون موضوعيًا إلا إذا كانت المقارنة بين الأفراد مستقلة عن المفردات المستخدمة، والمقارنة بين المفردات مستقلة عن الأفراد (<b>الموضوعية النوعية<\/b>)<\/div><div class=\"en\" dir=\"ltr\">Specific Objectivity<\/div><\/td><td><div class=\"cp\">الأساس الذي بنى عليه بحث «الأداء التفاضلي لنوع الطالب على مقياس الاتزان الانفعالي» نقده للنظرية الكلاسيكية (ص 363–364)<\/div><\/td><\/tr><tr><td><div class=\"cp\"><b>صلاح الدين علام (بالمعنى)<\/b><\/div><\/td><td><div class=\"cp\">تقدير الأشياء والمستويات تقديرًا كميًا وفق إطار معين من المقاييس المدرجة<\/div><\/td><td><div class=\"cp\">التعريف المتداول في المراجع العربية<\/div><\/td><\/tr><\/table><\/div><h4><b>التعريف الإجرائي المقترح (صياغة الباحث)<\/b><\/h4><p><b>القياس:<\/b> إجراء منظَّم يُعيَّن بموجبه لكل فرد عددٌ (درجة) يمثل موقعه على سمة نفسية محددة، وفق قواعد تصحيح مكتوبة ومعلنة مسبقًا، بحيث يمكن إعادة الإجراء والحصول على النتيجة نفسها في الظروف نفسها.<\/p>"}, {"title": "1.2 المقياس", "en": "", "html": "<p>Scale<\/p><h4><b>التعريف اللغوي<\/b><\/h4><p>«المقياس» اسم آلة على وزن «مِفعال» من الجذر نفسه: <b>ما يُقاس به<\/b>.<\/p><h4><b>المقياس في الاصطلاح: ثلاثة معانٍ يجب الفصل بينها<\/b><\/h4><div class=\"tw\"><table><tr><th><div class=\"cp\"><b>المعنى<\/b><\/div><\/th><th><div class=\"cp\"><b>الإنجليزية<\/b><\/div><\/th><th><div class=\"cp\"><b>المقصود<\/b><\/div><\/th><th><div class=\"cp\"><b>مثال<\/b><\/div><\/th><\/tr><tr><td><div class=\"cp\"><b>1. مستوى القياس<\/b><\/div><\/td><td><div class=\"cp\">مستوى القياس<\/div><div class=\"en\" dir=\"ltr\">Scale of measurement<\/div><\/td><td><div class=\"cp\">نوع القواعد التي تحكم الأعداد (ستيفنز, 1946)<\/div><div class=\"en\" dir=\"ltr\">Stevens, 1946<\/div><\/td><td><div class=\"cp\">اسمي، رتبي، فئوي، نسبي<\/div><\/td><\/tr><tr><td><div class=\"cp\"><b>2. أداة القياس (المقياس النفسي)<\/b><\/div><\/td><td><div class=\"cp\">المقياس النفسي / القائمة<\/div><div class=\"en\" dir=\"ltr\">Psychological scale / Inventory<\/div><\/td><td><div class=\"cp\">مجموعة عبارات متجانسة تُجمع درجاتها لتمثيل موقع الفرد على سمة<\/div><\/td><td><div class=\"cp\">مقياس الاتزان الانفعالي (19 عبارة، بحث «الأداء التفاضلي لنوع الطالب على مقياس الاتزان الانفعالي»)<\/div><\/td><\/tr><tr><td><div class=\"cp\"><b>3. سلم الدرجات المشتقة<\/b><\/div><\/td><td><div class=\"cp\">سلم الدرجات<\/div><div class=\"en\" dir=\"ltr\">Score scale<\/div><\/td><td><div class=\"cp\">النظام الذي تُحوَّل إليه الدرجات الخام للتفسير<\/div><\/td><td><div class=\"cp\">الرتب المئينية، الدرجات التائية T، الدرجات الزائية z<\/div><\/td><\/tr><\/table><\/div><p><b>التعريفات الاصطلاحية للمقياس بوصفه أداة:<\/b><\/p><ul><li><b>ديفيليس (2017/2021):<\/b> المقاييس أدوات قياس تتكون من <b>مجموعات من البنود<\/b> تهدف إلى الكشف عن مستويات متغيرات نظرية لا يمكن ملاحظتها مباشرة؛ ويفرّق بين «المقياس» الذي تنبع بنوده من متغير كامن مشترك (المقياس) و«المؤشر المركّب» (المؤشر) الذي يجمع عناصر لا يجمعها سبب مشترك.<div class=\"en\" dir=\"ltr\">Scales · Latent Variables · Scale · Index · DeVellis (2017/2021)<\/div><\/li><li><b>ليكرت (1932):<\/b> المقياس التجميعي: مجموعة عبارات يستجيب لها الفرد على متصل موافقة، وتُجمع الاستجابات في درجة كلية تمثل اتجاهه.<div class=\"en\" dir=\"ltr\">Summated Rating Scale · Likert<\/div><\/li><li><b>في المراجع العربية:<\/b> المقياس أداة لقياس السمات والاتجاهات والميول (الأداء المعتاد)، بعبارات لا توجد لها إجابة صحيحة أو خاطئة، وإنما تعبّر الاستجابة عن درجة انطباق العبارة على المفحوص.<\/li><\/ul><h4><b>التعريف الإجرائي المقترح (صياغة الباحث)<\/b><\/h4><p><b>المقياس النفسي:<\/b> أداة مقنَّنة تتكون من مجموعة عبارات متجانسة صيغت لتمثّل مؤشرات سلوكية لسمة نفسية (أو أبعادها) كما حُدّدت نظريًا، يستجيب لها الفرد على تدريج متدرج (مثل ليكرت الخماسي) دون إجابة صحيحة أو خاطئة، وتُجمع استجاباته وفق مفتاح تصحيح معلن في درجة كلية و/أو درجات فرعية، مع توافر أدلة على صدق تفسير هذه الدرجات وثباتها في المجتمع المستهدف.<\/p>"}, {"title": "1.3 الاختبار", "en": "", "html": "<p>Test<\/p><h4><b>التعريف اللغوي<\/b><\/h4><p>من الجذر (خ ب ر): اختبر الشيءَ: <b>امتحنه ليعرف حقيقته وخبره<\/b>. ويتداخل في الاستعمال العربي مع «الامتحان» (م ح ن)، والغالب استعمال «الامتحان» في السياق الدراسي الرسمي و«الاختبار» في السياق النفسي والتربوي.<\/p><h4><b>التعريفات الاصطلاحية<\/b><\/h4><div class=\"tw\"><table><tr><th><div class=\"cp\"><b>العالِم/الجهة<\/b><\/div><\/th><th><div class=\"cp\"><b>التعريف<\/b><\/div><\/th><\/tr><tr><td><div class=\"cp\"><b>أناستازي وأوربينا (1997)<\/b><\/div><div class=\"en\" dir=\"ltr\">Anastasi &amp; Urbina (1997)<\/div><\/td><td><div class=\"cp\">الاختبار النفسي في جوهره <b>مقياس موضوعي مقنَّن لعينة من السلوك<\/b><\/div><div class=\"en\" dir=\"ltr\">«A psychological test is essentially an objective and standardized measure of a sample of behavior»<\/div><\/td><\/tr><tr><td><div class=\"cp\"><b>كرونباخ (1990)<\/b><\/div><div class=\"en\" dir=\"ltr\">Cronbach (1990)<\/div><\/td><td><div class=\"cp\"><b>إجراء منظم لملاحظة السلوك ووصفه بمساعدة مقاييس عددية أو فئات ثابتة<\/b>؛ ويقسم الاختبارات إلى مقاييس <b>الأداء الأقصى<\/b> ومقاييس <b>الأداء المعتاد/النمطي<\/b><\/div><div class=\"en\" dir=\"ltr\">Maximum Performance · Typical Performance<\/div><div class=\"cp\">«A test is a systematic procedure for observing behavior and describing it with the aid of numerical scales or fixed categories»<\/div><\/td><\/tr><tr><td><div class=\"cp\"><b>الجمعية الأمريكية للبحث التربوي والجمعية الأمريكية لعلم النفس والمجلس القومي للقياس في التربية (2014) — المعايير<\/b><\/div><div class=\"en\" dir=\"ltr\">AERA, APA &amp; NCME<\/div><\/td><td><div class=\"cp\">الاختبار أداة أو إجراء يُحصل به على <b>عينة من سلوك المفحوص في مجال محدد<\/b>، ثم تُقيَّم هذه العينة وتُصحَّح <b>بإجراء مقنَّن<\/b><\/div><\/td><\/tr><tr><td><div class=\"cp\"><b>براون (1983)<\/b><\/div><div class=\"en\" dir=\"ltr\">Brown (1983)<\/div><\/td><td><div class=\"cp\">إجراء منظم لقياس عينة من السلوك (يتداوله كثير من المراجع العربية)<\/div><\/td><\/tr><tr><td><div class=\"cp\"><b>المراجع العربية (بالمعنى)<\/b><\/div><\/td><td><div class=\"cp\">مجموعة من الأسئلة أو المهام المقننة تُقدَّم للمفحوص لاستثارة استجابات يمكن تقديرها كميًا، ويغلب أن يكون لها إجابة صحيحة وأخرى خاطئة<\/div><\/td><\/tr><\/table><\/div><p><b>العناصر المشتركة في كل التعريفات:<\/b> (1) عينة من السلوك لا كل السلوك؛ (2) التقنين (توحيد التطبيق والتصحيح)؛ (3) الموضوعية؛ (4) التعبير الكمي أو الفئوي؛ (5) المقارنة بمعيار أو محك. وهي العناصر نفسها التي يقوم عليها الفصل الثاني (المادة العلمية).<\/p><h4><b>التعريف الإجرائي المقترح (صياغة الباحث)<\/b><\/h4><p><b>الاختبار:<\/b> مجموعة مهام أو أسئلة مقننة تُطبَّق في ظروف موحدة لاستثارة <b>أقصى أداء<\/b> ممكن للمفحوص في قدرة أو تحصيل أو مهارة، ويكون لاستجاباتها مفتاح صواب وخطأ، وتُفسَّر درجته بالمقارنة بمعيار جماعة أو بمحك أداء.<\/p>"}, {"title": "1.4 التقييم (التقويم)", "en": "", "html": "<p>Assessment<\/p><h4><b>التعريف اللغوي<\/b><\/h4><p>من (ق و م/ق ي م): <b>قيّم الشيء: قدّر قيمته<\/b>. وقد اعترض بعض اللغويين قديمًا على صيغة «قيّم» وعدّوا الصواب «قوّم»، ثم شاع «التقييم» في الاستعمال المعاصر بمعنى بيان القيمة وإعطاء الحكم أو الدرجة.<\/p><h4><b>التعريفات الاصطلاحية<\/b><\/h4><ul><li><b>بلاك وويليام (1998):<\/b> التقييم (بالمعنى التكويني) <b>كل الأنشطة التي يقوم بها المعلمون و/أو طلابهم وتوفر معلومات تُستخدم تغذية راجعة لتعديل أنشطة التعليم والتعلم.<\/b><div class=\"en\" dir=\"ltr\">all those activities undertaken by teachers, and/or by their students, which provide information to be used as feedback to modify the teaching and learning activities · Black &amp; Wiliam<\/div><\/li><li><b>في القياس النفسي:<\/b> عملية أوسع من الاختبار، يجمع فيها الأخصائي معلومات من <b>مصادر متعددة<\/b> (اختبارات، مقاييس، مقابلة، ملاحظة، سجلات) ويدمجها ليصل إلى فهم للحالة أو قرار بشأنها. فالاختبار أداة، والتقييم عملية تستخدم الأداة وغيرها.<div class=\"en\" dir=\"ltr\">Psychological Assessment<\/div><\/li><li><b>في الاستعمال الأمريكي الشائع:<\/b> التقويم = جمع المعلومات عن المتعلم/الفرد، و Evaluation = الحكم على قيمة البرامج والمناهج؛ وفي الاستعمال البريطاني يتسع Assessment ليشمل الحكم على أداء الطالب نفسه. <b>(هذا التمييز شائع في الأدبيات لكنه غير موحد؛ لذلك يجب أن يعرّف الباحث استخدامه في أول موضع).<\/b><div class=\"en\" dir=\"ltr\">Assessment · Evaluation<\/div><\/li><\/ul><h4><b>التعريف الإجرائي المقترح (صياغة الباحث)<\/b><\/h4><p><b>التقييم:<\/b> عملية منهجية لجمع معلومات كمية (درجات المقاييس) ونوعية (المقابلة والملاحظة) عن سمة أو أداء لدى الفرد وتفسيرها في ضوء معيار، بهدف <b>وصف الحالة الراهنة وتشخيصها<\/b>، دون أن تتضمن بالضرورة قرار علاج أو تطوير.<\/p>"}, {"title": "1.5 التقويم", "en": "", "html": "<p>Evaluation<\/p><h4><b>التعريف اللغوي<\/b><\/h4><p>من (ق و م): <b>قوّم الشيءَ: عدّله وأزال اعوجاجه<\/b> (قوّمتُ العود)، و<b>قوّم السلعة: قدّر ثمنها<\/b>. فالكلمة تجمع معنيين: <b>تقدير القيمة<\/b> و<b>الإصلاح والتعديل<\/b>. وهذا الجمع هو سبب تفضيل كثير من التربويين العرب لمصطلح «التقويم»: لأنه يتضمن الحكم ثم العلاج.<\/p><h4><b>التعريفات الاصطلاحية<\/b><\/h4><div class=\"tw\"><table><tr><th><div class=\"cp\"><b>العالِم<\/b><\/div><\/th><th><div class=\"cp\"><b>التعريف<\/b><\/div><\/th><\/tr><tr><td><div class=\"cp\"><b>تايلر (1949)<\/b><\/div><div class=\"en\" dir=\"ltr\">Tyler (1949)<\/div><\/td><td><div class=\"cp\">التقويم عملية تحديد <b>مدى تحقق الأهداف التربوية فعليًا<\/b> — النموذج الموجَّه بالأهداف<\/div><div class=\"en\" dir=\"ltr\">«the process of determining to what extent the educational objectives are actually being realized»<\/div><\/td><\/tr><tr><td><div class=\"cp\"><b>سكريفن (1967)<\/b><\/div><div class=\"en\" dir=\"ltr\">Scriven (1967)<\/div><\/td><td><div class=\"cp\">التقويم تحديد <b>الجدارة أو القيمة<\/b> (الجدارة/القيمة)، وهو صاحب التمييز بين <b>التقويم التكويني<\/b> و<b>الختامي<\/b><\/div><div class=\"en\" dir=\"ltr\">Merit/Worth · Formative · Summative<\/div><\/td><\/tr><tr><td><div class=\"cp\"><b>بلوم وهاستنجز ومادوس (1971)<\/b><\/div><div class=\"en\" dir=\"ltr\">Bloom, Hastings &amp; Madaus (1971)<\/div><\/td><td><div class=\"cp\">طبّقوا التمييز التكويني/الختامي على تعلم الطلاب، وأضافوا <b>التقويم التشخيصي<\/b><\/div><\/td><\/tr><tr><td><div class=\"cp\"><b>ستافلبيم (1971)<\/b><\/div><div class=\"en\" dir=\"ltr\">Stufflebeam (1971)<\/div><\/td><td><div class=\"cp\">التقويم عملية <b>تحديد المعلومات المفيدة والحصول عليها وتقديمها للحكم على بدائل القرار<\/b> — نموذج السياق والمدخلات والعمليات والمخرجات: السياق، المدخلات، العمليات، المخرجات<\/div><div class=\"en\" dir=\"ltr\">CIPP<\/div><\/td><\/tr><tr><td><div class=\"cp\"><b>جرونلند<\/b><\/div><div class=\"en\" dir=\"ltr\">Gronlund<\/div><\/td><td><div class=\"cp\"><b>التقويم = وصف كمي (قياس) أو وصف كيفي (غير قياسي) + حكم قيمي<\/b><\/div><\/td><\/tr><tr><td><div class=\"cp\"><b>المراجع العربية (بالمعنى)<\/b><\/div><\/td><td><div class=\"cp\">عملية منهجية لإصدار حكم على قيمة الشيء أو الأداء في ضوء معايير محددة، تتبعها <b>قرارات علاجية أو تطويرية<\/b>؛ فهو أشمل من القياس والتقييم<\/div><\/td><\/tr><\/table><\/div><h4><b>التعريف الإجرائي المقترح (صياغة الباحث)<\/b><\/h4><p><b>التقويم:<\/b> عملية منهجية شاملة تبدأ بالقياس (بيانات كمية) والتقييم (تفسير هذه البيانات وتشخيصها)، وتنتهي <b>بإصدار حكم قيمي في ضوء معايير معلنة، واتخاذ قرار تحسين أو علاج أو تطوير<\/b> للفرد أو البرنامج.<\/p>"}, {"title": "1.6 أدوات قريبة: الاستبيان، القائمة، قائمة الشطب، سلم التقدير، المقابلة", "en": "", "html": "<div class=\"tw\"><table><tr><th><div class=\"cp\"><b>الأداة<\/b><\/div><\/th><th><div class=\"cp\"><b>الإنجليزية<\/b><\/div><\/th><th><div class=\"cp\"><b>الوصف<\/b><\/div><\/th><th><div class=\"cp\"><b>الفرق عن المقياس<\/b><\/div><\/th><\/tr><tr><td><div class=\"cp\">الاستبيان<\/div><\/td><td><div class=\"cp\">الاستبيان<\/div><div class=\"en\" dir=\"ltr\">Questionnaire<\/div><\/td><td><div class=\"cp\">مجموعة أسئلة مكتوبة لجمع معلومات أو آراء أو وقائع<\/div><\/td><td><div class=\"cp\">قد لا يُنتج درجة كلية ولا يفترض سمة كامنة واحدة<\/div><\/td><\/tr><tr><td><div class=\"cp\">القائمة / الاستخبار<\/div><\/td><td><div class=\"cp\">قائمة<\/div><div class=\"en\" dir=\"ltr\">Inventory<\/div><\/td><td><div class=\"cp\">عبارات تقرير ذاتي عن سمات أو ميول تُجمع في درجات (مثل قائمة مينيسوتا متعددة الأوجه للشخصية)<\/div><div class=\"en\" dir=\"ltr\">MMPI<\/div><\/td><td><div class=\"cp\">قريبة جدًا من المقياس؛ الفرق اصطلاحي وتاريخي<\/div><\/td><\/tr><tr><td><div class=\"cp\">قائمة الشطب<\/div><\/td><td><div class=\"cp\">قائمة مراجعة<\/div><div class=\"en\" dir=\"ltr\">Checklist<\/div><\/td><td><div class=\"cp\">سلوكيات يُؤشَّر على وجودها أو غيابها<\/div><\/td><td><div class=\"cp\">ثنائية (موجود/غير موجود) دون شدة<\/div><\/td><\/tr><tr><td><div class=\"cp\">سلم التقدير<\/div><\/td><td><div class=\"cp\">مقياس التقدير<\/div><div class=\"en\" dir=\"ltr\">Rating Scale<\/div><\/td><td><div class=\"cp\">يحكم الملاحظ على درجة أو شدة السلوك على متصل<\/div><\/td><td><div class=\"cp\">يقدّره شخص آخر، فتدخل ذاتية المقدّر<\/div><\/td><\/tr><tr><td><div class=\"cp\">المقابلة<\/div><\/td><td><div class=\"cp\">المقابلة<\/div><div class=\"en\" dir=\"ltr\">Interview<\/div><\/td><td><div class=\"cp\">تفاعل لفظي موجَّه بين الباحث والمفحوص؛ مقننة أو شبه مقننة أو حرة<\/div><\/td><td><div class=\"cp\">لا تصبح أداة قياس إلا إذا قُننت أسئلتها ووُضع لها دليل تقدير (سلّم ><\/td><td><div class=\"cp\">مقياس / قائمة<\/div><div class=\"en\" dir=\"ltr\">Scale / Inventory<\/div><\/td><td><div class=\"cp\">التقويم<\/div><div class=\"en\" dir=\"ltr\">Assessment<\/div><\/td><td><div class=\"cp\">التقويم<\/div><div class=\"en\" dir=\"ltr\">Evaluation<\/div><\/td><\/tr><tr><td><div class=\"cp\"><b>طبيعته<\/b><\/div><\/td><td><div class=\"cp\">عملية (إجراء)<\/div><\/td><td><div class=\"cp\">أداة<\/div><\/td><td><div class=\"cp\">أداة<\/div><\/td><td><div class=\"cp\">عملية<\/div><\/td><td><div class=\"cp\">عملية شاملة<\/div><\/td><\/tr><tr><td><div class=\"cp\"><b>السؤال الذي يجيب عنه<\/b><\/div><\/td><td><div class=\"cp\">كم؟<\/div><\/td><td><div class=\"cp\">كم يستطيع؟ (أقصى ما يقدر)<\/div><\/td><td><div class=\"cp\">كيف يكون عادة؟ (ما يميل إليه)<\/div><\/td><td><div class=\"cp\">ما وضعه؟ ولماذا؟<\/div><\/td><td><div class=\"cp\">ما قيمته؟ وماذا نفعل؟<\/div><\/td><\/tr><tr><td><div class=\"cp\"><b>المخرَج<\/b><\/div><\/td><td><div class=\"cp\">عدد/درجة<\/div><\/td><td><div class=\"cp\">درجة صواب<\/div><\/td><td><div class=\"cp\">درجة سمة<\/div><\/td><td><div class=\"cp\">وصف وتشخيص<\/div><\/td><td><div class=\"cp\">حكم + قرار<\/div><\/td><\/tr><tr><td><div class=\"cp\"><b>صواب وخطأ<\/b><\/div><\/td><td><div class=\"cp\">لا ينطبق<\/div><\/td><td><div class=\"cp\"><b>نعم<\/b> غالبًا<\/div><\/td><td><div class=\"cp\"><b>لا<\/b><\/div><\/td><td><div class=\"cp\">لا ينطبق<\/div><\/td><td><div class=\"cp\">لا ينطبق<\/div><\/td><\/tr><tr><td><div class=\"cp\"><b>نوع الأداء<\/b><\/div><\/td><td><div class=\"cp\">—<\/div><\/td><td><div class=\"cp\">أداء أقصى<\/div><\/td><td><div class=\"cp\">أداء معتاد (نمطي)<\/div><\/td><td><div class=\"cp\">كلاهما<\/div><\/td><td><div class=\"cp\">كلاهما<\/div><\/td><\/tr><tr><td><div class=\"cp\"><b>صيغة الاستجابة<\/b><\/div><\/td><td><div class=\"cp\">—<\/div><\/td><td><div class=\"cp\">اختيار من متعدد، مقالي، أداء<\/div><\/td><td><div class=\"cp\">ليكرت، ثنائي، تمايز دلالي<\/div><\/td><td><div class=\"cp\">أدوات متعددة<\/div><\/td><td><div class=\"cp\">أدوات متعددة<\/div><\/td><\/tr><tr><td><div class=\"cp\"><b>التصحيح<\/b><\/div><\/td><td><div class=\"cp\">قواعد<\/div><\/td><td><div class=\"cp\">مفتاح إجابة<\/div><\/td><td><div class=\"cp\">مفتاح اتجاه (موجب/سالب)<\/div><\/td><td><div class=\"cp\">دمج مصادر<\/div><\/td><td><div class=\"cp\">معايير + حكم<\/div><\/td><\/tr><tr><td><div class=\"cp\"><b>التفسير<\/b><\/div><\/td><td><div class=\"cp\">—<\/div><\/td><td><div class=\"cp\">معياري أو محكي<\/div><\/td><td><div class=\"cp\">معياري غالبًا، ونقاط قطع أحيانًا<\/div><\/td><td><div class=\"cp\">وصفي/تشخيصي<\/div><\/td><td><div class=\"cp\">قيمي<\/div><\/td><\/tr><tr><td><div class=\"cp\"><b>الشمول<\/b><\/div><\/td><td><div class=\"cp\">الأضيق<\/div><\/td><td><div class=\"cp\">جزء من القياس<\/div><\/td><td><div class=\"cp\">جزء من القياس<\/div><\/td><td><div class=\"cp\">يتضمن القياس<\/div><\/td><td><div class=\"cp\">يتضمن القياس والتقييم<\/div><\/td><\/tr><tr><td><div class=\"cp\"><b>مثال<\/b><\/div><\/td><td><div class=\"cp\">تعيين 146.5 درجة<\/div><\/td><td><div class=\"cp\">اختبار تحصيلي، مصفوفات رافن<\/div><\/td><td><div class=\"cp\">مقياس الاتزان الانفعالي، قائمة باولهس المتوازنة للاستجابة المرغوبة اجتماعيًا<\/div><div class=\"en\" dir=\"ltr\">BIDR<\/div><\/td><td><div class=\"cp\">تقرير حالة نفسية<\/div><\/td><td><div class=\"cp\">تقويم برنامج إرشادي وتعديله<\/div><\/td><\/tr><\/table><\/div><h4><b>العلاقة الهرمية<\/b><\/h4><p><b>القياس ← التقييم ← التقويم<\/b>: القياس يقدّم الأرقام، والتقييم يفسرها ويشخّص، والتقويم يحكم ويقرر ويعالج. فكل تقويم يتضمن تقييمًا، وكل تقييم سليم يستند إلى قياس (أو وصف كيفي منظم)، والعكس غير لازم.<\/p><aside class=\"box critical\"><div class=\"bt\">ملاحظة نقدية: الجدل حول هذا التسلسل <\/div><ul><li><b>التقويم النوعي<\/b> (ملف الإنجاز، المقابلة، الملاحظة) لا يقتضي قياسًا كميًا بالضرورة، فيكسر التسلسل الخطي — وهو موقف المدرسة البنائية (الفصل الخامس). 2) <b>التقييم التكويني<\/b> عند بلاك وويليام ليس مرحلة وسطى بل غاية في ذاته (تحسين التعلم). 3) <b>التقابل العربي–الإنجليزي ليس واحدًا لواحد<\/b>: بعض المؤلفين العرب يجعلون «التقويم» يقابل Assessment و«التقييم» Evaluation، وآخرون يستعملون «التقويم» للمفهومين ويتجنبون «التقييم» لغويًا. <b>الحل العملي:<\/b> عرّف المصطلح في أول موضع واكتب مقابله الإنجليزي بين قوسين، ثم التزم به في الرسالة كلها.<div class=\"en\" dir=\"ltr\">Black &amp; Wiliam · Evaluation · Assessment<\/div><\/li><\/ul><\/aside>"}, {"title": "1.8 هل كل اختبار مقياس؟ وهل كل مقياس اختبار؟", "en": "", "html": "<p><b>الجواب المختصر:<\/b> كلاهما <b>أداة قياس<\/b>، لكن ليس كل مقياس اختبارًا، والاختبار يُعد مقياسًا بالمعنى الواسع لا بالمعنى الاصطلاحي الضيق.<\/p><div class=\"en\" dir=\"ltr\">Measuring Instrument<\/div><div class=\"tw\"><table><tr><th><div class=\"cp\"><b>الحكم<\/b><\/div><\/th><th><div class=\"cp\"><b>التعليل<\/b><\/div><\/th><\/tr><tr><td><div class=\"cp\"><b>نعم بالمعنى الواسع<\/b> (أداة قياس تنتج درجة على متصل)، <b>ولا بالمعنى الاصطلاحي الضيق<\/b><\/div><\/td><td><div class=\"cp\">الاختبار يقيس أداءً أقصى بصواب وخطأ، أما «المقياس» في العرف النفسي العربي فيُخص بالأداء المعتاد<\/div><\/td><\/tr><tr><td><div class=\"cp\"><b>لا<\/b><\/div><\/td><td><div class=\"cp\">مقياس الاتجاه نحو الإرشاد لا يُختبر فيه الفرد؛ لا توجد إجابة صحيحة، ولا «نجاح» ولا «رسوب»<\/div><\/td><\/tr><tr><td><div class=\"cp\"><b>اختبار<\/b> رغم اسم المقياس<\/div><div class=\"en\" dir=\"ltr\">Scale<\/div><\/td><td><div class=\"cp\">يقيس أداءً أقصى بإجابات صحيحة؛ كلمة المقياس هنا تاريخية وتعني «سلم مُتدرج للعمر العقلي/الدرجات»<\/div><div class=\"en\" dir=\"ltr\">Scale<\/div><\/td><\/tr><tr><td><div class=\"cp\"><b>مقياس<\/b> رغم اسم «اختبار»<\/div><\/td><td><div class=\"cp\">لا صواب فيه ولا خطأ؛ التسمية العربية التجارية غير دقيقة<\/div><\/td><\/tr><tr><td><div class=\"cp\"><b>ليست أداة أصلًا<\/b><\/div><\/td><td><div class=\"cp\">خاصية لنظام الأعداد؛ فكل اختبار وكل مقياس له «مستوى قياس»<\/div><\/td><\/tr><\/table><\/div><aside class=\"box opinion\"><div class=\"bt\">رأي الباحث: رأيي كباحث في الفرق بين الاختبار والمقياس<\/div><p>أرى أن الفيصل الحقيقي ليس اسم الأداة بل <b>طبيعة الاستجابة المطلوبة وطريقة تفسيرها<\/b>: إن كانت المهمة تستثير «أقصى ما يستطيع» الفرد وتُصحَّح بالصواب والخطأ فهي <b>اختبار<\/b>، وإن كانت تستثير «ما يميل إليه عادة» وتُصحَّح باتجاه الانطباق فهي <b>مقياس<\/b>. وعلى هذا الأساس فإن كل الأدوات — التي صيغت بلغة «الاختبار» — يمكن نقلها إلى «المقياس» بشرط تحويل ثلاثة مفاهيم تحديدًا: <b>الصعوبة<\/b> (تصير مؤشر تأييد)، و<b>المشتتات<\/b> (تصير فئات استجابة)، و<b>التخمين<\/b> (يصير أنماط استجابة مثل المرغوبية والموافقة والإهمال)؛ وهذا ما فعلته في الفصل الثاني. كما أرى أن التمسك بالفرق بين «التقييم» و«التقويم» ليس ترفًا لغويًا؛ لأن البحث الذي يكتفي بوصف مستوى الطلاب (كمقارنة المتوسط الفعلي بالنظري) يقف عند <b>التقييم<\/b>، ولا يصير <b>تقويمًا<\/b> إلا إذا انتهى إلى حكم معياري مبرر وقرار تطوير.<\/p><\/aside>"}, {"title": "1.9 الموقف التعريفي للباحث", "en": "", "html": "<aside class=\"box opinion\"><div class=\"bt\">رأي الباحث: التعريفات التي يتبناها الباحث<\/div><ul><li><b>القياس<\/b> عندي: إجراء منظم لتعيين أرقام لاستجابات الأفراد وفق قواعد معلنة، تمثّل مقدار ما لديهم من سمة نفسية، بحيث يمكن تكرار الإجراء.<\/li><li><b>المقياس النفسي<\/b> عندي: أداة مقننة من عبارات متجانسة تمثّل مؤشرات سلوكية لسمة محددة نظريًا، يستجيب لها الفرد على تدريج متدرج دون صواب أو خطأ، وتُجمع استجاباته في درجة لها أدلة صدق وثبات وعدالة في المجتمع المستهدف.<\/li><li><b>الاختبار<\/b> عندي: أداة مقننة لاستثارة أقصى أداء للفرد في قدرة أو تحصيل، لاستجاباتها صواب وخطأ.<\/li><li><b>التقييم<\/b> عندي: تفسير بيانات القياس (مع مصادر أخرى) لوصف وضع الفرد الراهن وتشخيصه.<\/li><li><b>التقويم<\/b> عندي: إصدار حكم قيمي على الأداء أو البرنامج في ضوء معايير معلنة، يتبعه قرار علاج أو تطوير.<\/li><li><b>وأتبنى في هذا العمل<\/b> استعمال «المقياس» لكل أداة أداء معتاد، و«الاختبار» لأدوات الأداء الأقصى فقط، و«التقييم» مقابلًا لـ Assessment، و«التقويم» مقابلًا لـ Evaluation.<div class=\"en\" dir=\"ltr\">Assessment · Evaluation<\/div><\/li><\/ul><\/aside>"}]}, "p2": {"key": "p2", "no": 2, "title": "الأسس العلمية لتصميم المقاييس — قراءة في كتاب «الاختبارات النفسية»", "en": "Part Two: Comprehensive Summary of the Course Material — Reframed for Psychological Scales", "sections": [{"title": "2.0 منهجية القراءة والتحويل", "en": "", "html": "<h4><b>2.0.2 قاعدة التحويل من «الاختبار» إلى «المقياس»<\/b><\/h4><p>الكتاب في أصله يتناول «الاختبارات النفسية» بالمعنى الواسع، وأمثلته الحسابية (الصعوبة، التخمين، البدائل، درجات القطع) مأخوذة في معظمها من اختبارات الأداء الأقصى (تحصيل/قدرات)، بينما المقاييس النفسية (اتجاهات، سمات، انفعالات) هي في الغالب <b>أداء معتاد<\/b> بلا إجابة صحيحة وخاطئة. لذلك أعتمد في التحويل الجدول التالي، وهو أساس كل ما سيأتي.<\/p><div class=\"tw\"><table><tr><th><div class=\"cp\"><b>مفهوم الكتاب (اختبار)<\/b><\/div><\/th><th><div class=\"cp\"><b>يقابله في المقياس النفسي<\/b><\/div><\/th><th><div class=\"cp\"><b>ملاحظة منهجية<\/b><\/div><\/th><\/tr><tr><td><div class=\"cp\">الاختبار / الأداة<\/div><\/td><td><div class=\"cp\">المقياس / أداة القياس<\/div><div class=\"en\" dir=\"ltr\">Scale / Inventory / Questionnaire<\/div><\/td><td><div class=\"cp\">يبقى مصطلح «الاختبار» عند ذكر الكتاب نفسه كما ورد في الكتاب<\/div><\/td><\/tr><tr><td><div class=\"cp\">المفردة ذات الإجابة الصحيحة<\/div><\/td><td><div class=\"cp\">العبارة (المفردة) ذات تدريج موافقة/انطباق<\/div><div class=\"en\" dir=\"ltr\">Item<\/div><\/td><td><div class=\"cp\">لا توجد إجابة «صحيحة»؛ يوجد اتجاه تصحيح (موجب/سالب)<\/div><\/td><\/tr><tr><td><div class=\"cp\">صعوبة المفردة (نسبة الإجابة الصحيحة)<\/div><\/td><td><div class=\"cp\"><b>مؤشر الموافقة/الشيوع<\/b>: متوسط درجة العبارة أو نسبة الموافقة؛ وفي نموذج راش/سلم التقدير: معلم «صعوبة» العبارة (مدى صعوبة تأييدها) بالوجيت<\/div><\/td><td><div class=\"cp\">في بحث «الأداء التفاضلي لنوع الطالب على مقياس الاتزان الانفعالي» (ص 386 من البحث) تُعرض «معالم الصعوبة» للمفردات الـ 19 بالوجيت<\/div><\/td><\/tr><tr><td><div class=\"cp\">تمييز المفردة (عليا − دنيا)<\/div><\/td><td><div class=\"cp\">معامل ارتباط العبارة بالدرجة الكلية المصحَّحة؛ المقارنة بين الربيع الأعلى والأدنى (27%) بـ t؛ تشبع العبارة بالعامل<\/div><\/td><td><div class=\"cp\">الصيغة (ع − د)/ن تصلح مباشرة لعبارات ثنائية الاستجابة (موافق/غير موافق)<\/div><\/td><\/tr><tr><td><div class=\"cp\">المشتتات (البدائل الخاطئة)<\/div><\/td><td><div class=\"cp\"><b>فئات الاستجابة<\/b> ووظيفتها: تكرار كل فئة، ترتيب العتبات<\/div><div class=\"en\" dir=\"ltr\">Response Categories<\/div><\/td><td><div class=\"cp\">في بحث «الأداء التفاضلي لنوع الطالب على مقياس الاتزان الانفعالي»: منحنيات عتبات الفئات الخمس (ص 383–385 من البحث)<\/div><\/td><\/tr><tr><td><div class=\"cp\">التخمين وتصحيحه<\/div><\/td><td><div class=\"cp\">الاستجابة العشوائية/الإهمال، الموافقة المنهجية (الإذعان)<\/div><div class=\"en\" dir=\"ltr\">Careless Responding · Acquiescence<\/div><\/td><td><div class=\"cp\">لا توجد معادلة تصحيح تخمين في المقاييس ذات الأداء المعتاد<\/div><\/td><\/tr><tr><td><div class=\"cp\">الأداء الأقصى<\/div><\/td><td><div class=\"cp\">يُستعمل مع المقاييس المعرفية فقط (ذكاء، انتباه، ذاكرة)<\/div><\/td><td><div class=\"cp\">انظر الفصل السادس<\/div><\/td><\/tr><tr><td><div class=\"cp\">الأداء النمطي (المعتاد)<\/div><\/td><td><div class=\"cp\">هو الأصل في المقاييس النفسية (شخصية، اتجاهات، انفعالات)<\/div><\/td><td><div class=\"cp\">يشير إليه الكتاب (ص 18–21)<\/div><\/td><\/tr><tr><td><div class=\"cp\">درجة القطع للإتقان<\/div><\/td><td><div class=\"cp\">حد التصنيف الإكلينيكي/الوصفي (مرتفع/متوسط/منخفض، مرضي/غير مرضي)<\/div><\/td><td><div class=\"cp\">تُستخدم طرق المجموعات المتضادة والحدّية والمنحنيات المميّزة، وتُستخدم طريقة أنجوف أساسًا في مقاييس الأداء المهاري<\/div><\/td><\/tr><tr><td><div class=\"cp\">المحك<\/div><div class=\"en\" dir=\"ltr\">Criterion<\/div><\/td><td><div class=\"cp\">المحك الخارجي: تشخيص، تقدير مدرّس، مقياس معتمد آخر<\/div><\/td><td><div class=\"cp\">الكتاب (ص 4–12)<\/div><\/td><\/tr><tr><td><div class=\"cp\">فن إعطاء الاختبار<\/div><\/td><td><div class=\"cp\">تطبيق المقياس وضبط ظروفه، وأثر الفاحص والمرغوبية الاجتماعية<\/div><\/td><td><div class=\"cp\">الجزء 2.13<\/div><\/td><\/tr><\/table><\/div><h4><b>2.0.3 خريطة الكتاب <\/b><\/h4><div class=\"tw\"><table><tr><th><div class=\"cp\"><b>الصفحات<\/b><\/div><\/th><th><div class=\"cp\"><b>الموضوع<\/b><\/div><\/th><\/tr><tr><td><div class=\"cp\">1–38<\/div><\/td><td><div class=\"cp\">تصميم الاختبار: التخطيط، البنود، التحليل الكيفي والكمي، الصعوبة والتمييز، التصحيح والتقنين والدليل<\/div><\/td><\/tr><tr><td><div class=\"cp\">39–54<\/div><\/td><td><div class=\"cp\">استخدام الاختبار النفسي: الاختصاص، الحصول على الأدوات، الضوابط المهنية والأخلاقية، السرية وحماية المفحوص وتفسير النتائج<\/div><\/td><\/tr><tr><td><div class=\"cp\">55–89<\/div><\/td><td><div class=\"cp\">الانتقال من مرجعية الجماعة إلى مرجعية المحك، بناء الاختبارات محكية المرجع، المجالات المعرفية والوجدانية، أدلة الصدق والثبات<\/div><\/td><\/tr><tr><td><div class=\"cp\">90–120<\/div><\/td><td><div class=\"cp\">درجات القطع، أساليب تحديدها وتحكيمها، ومزايا طرق التحديد وقيودها<\/div><\/td><\/tr><tr><td><div class=\"cp\">121–127<\/div><\/td><td><div class=\"cp\">الكفايات، التحليل الهرمي للتعلم، المهارات والمفردات التحصيلية<\/div><\/td><\/tr><tr><td><div class=\"cp\">128–149<\/div><\/td><td><div class=\"cp\">إعطاء الاختبارات، ظروف التطبيق، علاقة الفاحص بالمفحوص، التعليمات، التحيزات وأخلاقيات الممارسة<\/div><\/td><\/tr><\/table><\/div>"}, {"title": "2.1 منطق تصميم المقياس النفسي (ص 1–4)", "en": "", "html": "<p><b><\/b> يتعامل الكتاب مع تصميم الأداة بوصفه <b>عملية منهجية تجمع النظرية والدراية الفنية والخبرة السيكومترية<\/b>؛ فليست كتابة الأسئلة كافية لتقديم درجة قابلة للتفسير. وهو يعرض اتجاهين في التصميم:<\/p><h4><b>أولًا: الاتجاه النظري (العلمي)<\/b><\/h4><ul><li>ينطلق من <b>إطار مفاهيمي<\/b> يحدد السمة أو الظاهرة المقاسة، ويستنبط منها <b>مؤشرات سلوكية وبنودًا<\/b> يمكن اختبارها.<\/li><li>ما الصفة المقاسة؟ وما السلوك المشاهد الذي يدل عليها؟ وما العلاقة المتوقعة بين أجزائها؟<\/li><li>قوته مشروطة بوضوح المفاهيم وملاءمة النظرية، وإلا فالحصول على درجات لا يعني تحقق الافتراضات التي بُنيت عليها؛ ويحذّر الكتاب من بناء أداة على نظرية غير متماسكة.<\/li><li>فائدته: يساعد في اختيار مضمون البنود وفي الاستدلال على معاني درجات الاختبار.<\/li><\/ul><h4><b>ثانيًا: الاتجاه العملي (الفني)<\/b><\/h4><ul><li>ينطلق من <b>الحاجة التطبيقية<\/b> إلى أداة جديدة أو أفضل، ويدعم تطوير البنود وفق ما تُظهره التطبيقات السابقة وبيانات المفحوصين.<\/li><li>يعتمد على <b>دراسة أشكال أداء الأفراد والنتائج التجريبية والاختيار المتدرج لمفردات مناسبة<\/b>.<\/li><li>قد يتوجه إلى تطوير أدوات جديدة أو تعديل أدوات موجودة وفق طبيعة الفئة والغرض.<\/li><li>لا يسوّغ الاستغناء عن التسويغ النظري ولا عن أدلة الجودة السيكومترية.<\/li><\/ul><h4><b>ثالثًا: التكامل بين الاتجاهين<\/b><\/h4><ul><li>لا يغني أحدهما عن الآخر: <b>صياغة البند تستدعي تصورًا عن السلوك، والتحليل التجريبي يكشف ما إذا كان البند يعمل كما توقّع المصمم.<\/b><\/li><li>الصياغة النظرية تحتاج إلى اختبار تجريبي، والانتقاء الإحصائي بلا تفسير نظري قد ينتج تجميعًا غير واضح البناء.<\/li><\/ul><h4><b>الاختبار الجديد ليس غاية في ذاته<\/b><\/h4><p>يعرض الكتاب تصميم الاختبار باعتباره انتقالًا من تعريف السمة أو المجال إلى إجراءات منظّمة تنشئ مفردات وتعطي درجات ذات معنى؛ و<b>الاختبار الجديد ليس غاية في ذاته<\/b>: الحاجة إليه تنشأ حين لا تلبي الأدوات القائمة الغرض المقصود أو المجتمع المستهدف أو الخصائص المطلوبة. <b>سبب الحاجة إليها، والأساس المفاهيمي الذي يحدد ما يُقاس، والغاية العملية من استخدامها<\/b> (ص 1–4).<\/p><h4><b>لماذا نعيد بناء مقياس؟<\/b><\/h4><p>قد تدفع إلى البناء: الحاجة إلى قياس خاصية جديدة؛ أو قصور أداة متاحة في عينة أو ثقافة أو مجال استخدام؛ أو تحوّل معنى البناء المقاس؛ أو الحاجة إلى صيغ أداء أو تقدير مختلفة. <b>وتغيير اسم الأداة وحده لا يُعد تطويرًا.<\/b><\/p><h4><b>أسئلة تُطرح عند مناقشة أي مقياس جديد<\/b><\/h4><p>ما الفرضية عن السمة؟ من جماعة التطبيق؟ ما قرار الاستخدام؟ ما الدليل المتاح على تفسير الدرجة؟ وما القيود التي ستُعلن في الدليل؟.<\/p><aside class=\"box convert\"><div class=\"bt\">التطبيق على المقاييس النفسية<\/div><p>المثال التطبيقي القريب هو <b>مقياس الاتزان الانفعالي<\/b> في بحث «الأداء التفاضلي لنوع الطالب على مقياس الاتزان الانفعالي»: انطلق الباحثون من تعريف مفاهيمي للسمة (سمة مزاجية يتميز صاحبها بالهدوء والتروي…، ص 363)، ثم راجعوا مقاييس سابقة كمصدر للمفردات (الاتجاه العملي/الفني)، ثم تحققوا بالتحكيم والتحليل العاملي ونموذج راش (الاتجاه التجريبي). انظر الفصل السابع.<\/p><\/aside>"}, {"title": "2.2 خطة بناء المقياس (ص 4–12)", "en": "", "html": "<p><b><\/b> يرسم الكتاب خطة متدرجة؛ ويفيد عرضها باعتبارها <b>دورة قد تستدعي المراجعة لا سلسلة خطية جامدة<\/b>. ثماني خطوات:<\/p><h4><b>الخطوة 1 — تحديد الغرض والمطلوب قياسه<\/b><\/h4><p>يُوضَّح <b>ما الذي نريد قياسه، ولماذا، ولمن، وفي أي موقف.<\/b> ترتبط ملاءمة البنود والدرجات والوقت وأسلوب التنفيذ بهذا القرار الأول.<\/p><ul><li>هل تستخدم الأداة للتشخيص، أو التصنيف، أو الانتقاء، أو الحكم على إتقان هدف، أو المقارنة بين أفراد؟ تتغير تبعًا لذلك طبيعة البنود ومستوى الصعوبة وطريقة تفسير الدرجة ونوعية الأخطاء التي ينبغي الحذر منها (ص 4–12). و<b>اختلاف الغرض يغيّر طريقة أخذ العينة وصياغة البنود ونوع الدليل المطلوب.<\/b><\/li><li>تحديد السلوك المطلوب قياسه لا يساوي اختيار اسم عام للسمة؛ فعبارة «القدرة على الحساب» واسعة وتحتاج تحديد نوع العمليات ومستوى التعقيد وظروف الاستجابة.<\/li><li>يربط الكتاب بين <b>تحليل المهمات أو الأهداف<\/b> وبين كتابة المفردات بحيث تمثل المجال المحدد كله، لا جزءًا مريحًا منه فقط.<\/li><\/ul><h4><b>الخطوة 2 — تقرير المحك أو معيار تفسير الدرجة<\/b><\/h4><p>درجة المفحوص لا تُفسَّر بذاتها؛ يجب اختيار <b>مرجع للمقارنة<\/b>: جماعة معيارية تحدد موضع الفرد النسبي، أو مستوى أداء محدد مسبقًا يبيّن إنجاز متطلب معين. ولذلك يأتي قرار معيار التفسير <b>مبكرًا<\/b> في الخطة لا بعد حساب الدرجات.<\/p><h4><b>الخطوة 3 — اختيار عينة تمثل مجتمع التقنين<\/b><\/h4><p>تحديد المجتمع الأصلي ومتغيراته العمرية والتعليمية والاجتماعية والجغرافية المهمة، وتحقيق تمثيل كافٍ داخل عينة المعايير. <b>لا تكفي كثرة الأفراد وحدها إذا كانت العينة متحيزة.<\/b><\/p><h4><b>الخطوة 4 — تحليل المهام أو الخصائص والأهداف<\/b><\/h4><p>تُفكَّك الخاصية إلى <b>أبعاد قابلة للملاحظة<\/b> ويُحدَّد مجال المحتوى أو أنماط الأداء التي ينبغي أن تشملها الأداة؛ ويتيح ذلك ضبط التمثيل ومنع الإفراط في جانب على حساب آخر.<\/p><h4><b>الخطوة 5 — كتابة المفردات وتحديد نوعها<\/b><\/h4><p>يختار الباحث الصيغة المناسبة لقياس المطلوب: مفردات موضوعية، أو أداء، أو استجابات مفتوحة، أو <b>تقرير ذاتي<\/b> بحسب طبيعة الهدف. ويُراعى الوضوح وعدم التعقيد غير الضروري.<\/p><h4><b>الخطوة 6 — فحص مستويات الصعوبة والتمييز<\/b><\/h4><p>تُجرَّب البنود على عينة مناسبة وتُدرس استجاباتها بحيث لا تهيمن البنود غير المميِّزة أو غير الملائمة. الصعوبة هنا <b>مؤشر متعلق بالأداء والاحتمال بحسب نوع المفردة<\/b> وليست خاصية لغوية فحسب.<\/p><h4><b>الخطوة 7 — تحديد الاستجابة والتصحيح<\/b><\/h4><p>تحديد كيفية تسجيل الاستجابة وترميزها وكيفية جمع الدرجات والتحويلات المحتملة؛ <b>غموض مفتاح التصحيح قد يحوّل اختلاف الفاحصين إلى مصدر خطأ.<\/b><\/p><h4><b>الخطوة 8 — إعداد صورة قابلة للاستخدام والتقنين<\/b><\/h4><p>تنظيم الكراسة، ترتيب البنود، التعليمات، الزمن، إجراءات التطبيق ومعايير تفسير النتيجة، ثم إعداد <b>دليل موثّق<\/b> يساعد المستخدم المختص.<\/p><h4><b>جدول: خطوات الكتاب ومقابلها في بناء المقياس النفسي<\/b><\/h4><div class=\"tw\"><table><tr><th><div class=\"cp\"><b>#<\/b><\/div><\/th><th><div class=\"cp\"><b>خطوة الكتاب (ص 4–12)<\/b><\/div><\/th><th><div class=\"cp\"><b>مقابلها في إعداد المقياس النفسي<\/b><\/div><\/th><th><\/th><\/tr><tr><td><div class=\"cp\">1<\/div><\/td><td><div class=\"cp\">تحديد الغرض والمطلوب قياسه<\/div><\/td><td><div class=\"cp\">تحديد السمة/البناء وتعريفها مفاهيميًا وإجرائيًا، وتحديد الفئة والغرض<\/div><\/td><td><div class=\"cp\">الفصل الرابع<\/div><\/td><\/tr><tr><td><div class=\"cp\">2<\/div><\/td><td><div class=\"cp\">تقرير المحك/معيار التفسير<\/div><\/td><td><div class=\"cp\">اختيار نوع المعيار: معياري (مئينيات/تائية) أم نقاط قطع تصنيفية<\/div><\/td><td><div class=\"cp\">2.8 و2.11<\/div><\/td><\/tr><tr><td><div class=\"cp\">3<\/div><\/td><td><div class=\"cp\">عينة التقنين<\/div><\/td><td><div class=\"cp\">عينة التجريب وعينة التقنين (طبقية)، وحجمها لكل نوع تحليل<\/div><\/td><td><div class=\"cp\">الفصل الرابع<\/div><\/td><\/tr><tr><td><div class=\"cp\">4<\/div><\/td><td><div class=\"cp\">تحليل المهام/الخصائص<\/div><\/td><td><div class=\"cp\">تحديد الأبعاد وجدول المواصفات<\/div><div class=\"en\" dir=\"ltr\">Blueprint<\/div><\/td><td><div class=\"cp\">الفصل الرابع<\/div><\/td><\/tr><tr><td><div class=\"cp\">5<\/div><\/td><td><div class=\"cp\">كتابة المفردات ونوعها<\/div><\/td><td><div class=\"cp\">صياغة العبارات واختيار تدريج الاستجابة (ليكرت…)<\/div><\/td><td><div class=\"cp\">2.4<\/div><\/td><\/tr><tr><td><div class=\"cp\">6<\/div><\/td><td><div class=\"cp\">الصعوبة والتمييز<\/div><\/td><td><div class=\"cp\">تحليل العبارات: متوسط/تشتت، ارتباط بالكلي، تشبع، نظرية الاستجابة للمفردة<\/div><div class=\"en\" dir=\"ltr\">IRT<\/div><\/td><td><div class=\"cp\">2.5<\/div><\/td><\/tr><tr><td><div class=\"cp\">7<\/div><\/td><td><div class=\"cp\">الاستجابة والتصحيح<\/div><\/td><td><div class=\"cp\">مفتاح التصحيح، العبارات السالبة، الدرجة الكلية<\/div><\/td><td><div class=\"cp\">2.4<\/div><\/td><\/tr><tr><td><div class=\"cp\">8<\/div><\/td><td><div class=\"cp\">الصورة النهائية والدليل<\/div><\/td><td><div class=\"cp\">الصورة النهائية + دليل المقياس + الخصائص السيكومترية<\/div><\/td><td><div class=\"cp\">2.6<\/div><\/td><\/tr><\/table><\/div><h4><b>التمييز بين التفسير المعياري والمحكي<\/b><\/h4><p>في التفسير <b>المعياري<\/b> يصير الموقع النسبي وسط جماعة مرجعية أساسيًا؛ وفي التفسير <b>المحكي<\/b> يبرز السؤال عمّا يستطيع الفرد القيام به عند مستوى أو مجال محدد. كلاهما يحتاج دلائل جودة وليس مجرد تحويل مقياس الدرجة.<\/p><h4><b>المعايير النمائية والترتيبية (ص 4–12)<\/b><\/h4><ul><li>يفرق الكتاب بين المرجع <b>المحكي<\/b> الذي يقارن أداء الفرد بمعيار أداء محدد، والمرجع <b>المعياري<\/b> الذي يحدد موضع الفرد بين أقرانه.<\/li><li>كما يتناول المراجع <b>النمائية<\/b> مثل المقارنة بمستويات العمر أو الصف ويشرح القيود المتعلقة بها: تحويل الدرجة الخام إلى مستوى عمري أو صفي لا يجعل جميع الأفراد المتساوين في تلك الدرجة متطابقين في الجوانب النفسية الأخرى.<\/li><li>تُستخدم <b>الرتب المئينية<\/b> لوصف الموقع النسبي في جماعة مرجعية؛ <b>وهي لا تعادل النسبة المئوية من الأسئلة الصحيحة.<\/b><\/li><\/ul><aside class=\"box convert\"><div class=\"bt\">التطبيق على المقاييس النفسية<\/div><p>في المقاييس النفسية تُحوَّل الدرجة الخام عادة إلى رتب مئينية أو درجات معيارية (z) أو تائية (T = 50 + 10z). والتنبيه نفسه ينطبق: الرتبة المئينية 84 لا تعني أن الفرد حصل على 84% من الدرجة، بل أن 84% من جماعة التقنين حصلوا على درجة أقل منه أو مساوية. والمعايير العمرية مهمة في مقاييس النمو وسمات الأطفال.<\/p><\/aside><h4><b>جدول المواصفات<\/b><\/h4><p>يُفترض <b>توزيع البنود وفق الأهداف والمحتوى والأهمية النسبية<\/b>، بدل ترك الوزن للمصادفة أو لسهولة تأليف الأسئلة. ويصبح نموذج المواصفات أداة لضبط تمثيل مجال السلوك أو التحصيل. عند إعداد الجدول تتوزع البنود بين محتويات ومهارات أو أهداف وقد تُعطى أوزان مختلفة حسب أهميتها، فيصير مدى التغطية قابلًا للفحص بدل أن يعتمد على انطباع واضع الاختبار (ص 7–12).<\/p><h4><b>البناء من منظور قابلية الاستخدام<\/b><\/h4><p>يتناول الكتاب مستوى صعوبة الصياغة وطول الأداة وطريقة الاستجابة وتقدير الدرجات وسهولة التصحيح، ويجب النظر إلى هذه الشروط <b>مجتمعة لا كل شرط منفصلًا.<\/b><\/p>"}, {"title": "2.3 عينة التقنين وتمثيل المجتمع (ص 7–12)", "en": "", "html": "<ul><li>تحتاج الدرجات المستمدة من اختبار معياري إلى <b>جماعة مرجعية مناسبة<\/b>. ولا تصبح الجماعة معيارية لمجرد كبر حجمها؛ يجب النظر إلى المجتمع المراد تطبيق الاختبار عليه، وطريقة اختيار الأفراد، واختلاف العمر والخلفية التعليمية وغيرها من الخصائص المؤثرة.<\/li><li>يناقش الكتاب <b>تحديث المعايير<\/b> كلما تغيّر مجتمع التطبيق أو طرائق التعليم أو خصائص الأداء. المقارنة بدرجات جماعة قديمة أو مختلفة يمكن أن تنتج دلالات مضللة حتى لو كان حساب الدرجة صحيحًا.<\/li><\/ul><aside class=\"box convert\"><div class=\"bt\">التطبيق على المقاييس النفسية<\/div><p>هذا يعني أن مقياسًا للاتزان الانفعالي معايَر على طلاب كلية التربية بجامعة المنيا (كما في بحث «الأداء التفاضلي لنوع الطالب على مقياس الاتزان الانفعالي»: 639 طالبًا وطالبة، عينة طبقية عشوائية، ص 375) لا يصلح معياره تلقائيًا لعمّال أو مراهقين أو مجتمع خليجي. وقد أكد البحث نفسه (ص 364) أن الاكتفاء بترجمة مقياس أجنبي لا يغني عن التحقق من صدقه وثباته في الثقافة العربية وعن عدالته بين المجموعات الفرعية (الأداء التفاضلي للمفردة).<\/p><div class=\"en\" dir=\"ltr\">DIF<\/div><\/aside>"}, {"title": "2.4 إعداد البنود (العبارات) والتحليل الكيفي (ص 11–22)", "en": "", "html": "<p><b><\/b> يناقش الكتاب صياغة المفردة من حيث شكلها ومضمونها، والمشكلات التي تشوّه معنى استجابة المفحوص. <b>لا يغني التحليل الإحصائي اللاحق عن فحص معنى السؤال نفسه.<\/b> يقصد بالتحليل الكيفي للبند: التأكد من صلته بهدف القياس، وخلوه من الازدواج والالتباس، وصحة اللغة ومستوى المفردات، ووضوح المطلوب من المفحوص.<\/p><div class=\"tw\"><table><tr><th><div class=\"cp\"><b>القاعدة<\/b><\/div><\/th><th><div class=\"cp\"><b>ما يقوله الكتاب<\/b><\/div><\/th><th><div class=\"cp\"><b>تحويلها لعبارات المقياس النفسي<\/b><\/div><\/th><\/tr><tr><td><div class=\"cp\"><b>تحديد حدود السلوك المستهدف<\/b><\/div><\/td><td><div class=\"cp\">البند الجيد يمثل جانبًا جوهريًا من البناء أو القدرة، ولا ينصرف إلى معلومات جانبية أو ثقافة غير لازمة، ما لم تكن جزءًا معلنًا من مجال القياس<\/div><\/td><td><div class=\"cp\">كل عبارة تمثل مؤشرًا سلوكيًا/انفعاليًا للسمة كما حُدّدت في التعريف الإجرائي<\/div><\/td><\/tr><tr><td><div class=\"cp\"><b>بساطة القراءة واللغة<\/b><\/div><\/td><td><div class=\"cp\">يُتجنب تركيب الجملة الطويلة والتراكيب المبهمة والنفي المربك، لأن صعوبة فهم العبارة قد تبدو ظاهريًا صعوبة في الخاصية المراد قياسها؛ و<b>النص الملتبس قد يقيس القدرة على تفسير صياغة الباحث بدل السمة المراد قياسها<\/b><\/div><\/td><td><div class=\"cp\">مثال في بحث «الأداء التفاضلي لنوع الطالب على مقياس الاتزان الانفعالي»: «يتقلب مزاجي بين الابتهاج والحزن بصعوبة» و«تتغير مشاعري تجاه الآخرين بصعوبة» صياغات نفي مزدوج (ص 376)<\/div><\/td><\/tr><tr><td><div class=\"cp\"><b>الطول وتعدد المطالب<\/b><\/div><\/td><td><div class=\"cp\">كلما حمّل البند المجيب أكثر من فكرة أو شرط، تعذّر تفسير ما الذي وافق عليه أو أخفق فيه؛ يحسن الفصل أو إعادة الصياغة. يُضعف الطولُ أو تداخل التفاصيل قدرةَ المفحوص على تحديد الفكرة الأساسية، وقد تصبح الدرجة انعكاسًا لقدرة القراءة أو الانتباه (ص 13–22)<\/div><\/td><td><div class=\"cp\">تجنّب العبارة ذات الفكرتين<\/div><div class=\"en\" dir=\"ltr\">Double-barreled<\/div><\/td><\/tr><tr><td><div class=\"cp\"><b>الصياغة الموحية والتحيز<\/b><\/div><\/td><td><div class=\"cp\">تجنب العبارات التي توحي بالإجابة المرغوبة اجتماعيًا أو أخلاقيًا، أو التي تقدم دلائل شكلية تسهّل التخمين بلا امتلاك القدرة<\/div><\/td><td><div class=\"cp\">الخطر الأكبر في المقاييس: <b>المرغوبية الاجتماعية<\/b> (الفصل الخامس)<\/div><\/td><\/tr><tr><td><div class=\"cp\"><b>المفردات ذات البدائل (الاختيار من متعدد)<\/b><\/div><\/td><td><div class=\"cp\">يجب أن تكون البدائل المشتتة معقولة وواضحة وليست حشوًا؛ البديل الذي لا يختاره أحد لا يوفر تمييزًا. وأن تكون الإجابة الصحيحة محددة عند الحاجة، وألا تكون البدائل غير متوازنة في الطول أو اللغة، وألا يُجعل جزء من الفقرة قرينة شكلية على الحل<\/div><\/td><td><div class=\"cp\">يقابله <b>تدريج الاستجابة<\/b>: عدد الفئات ووضوح تسمياتها وتدرجها (أبدًا ← دائمًا)<\/div><\/td><\/tr><tr><td><div class=\"cp\"><b>كلمات لا يعرفها الأفراد على نحو متكافئ<\/b><\/div><\/td><td><div class=\"cp\">من مواطن الخلل: أكثر من نفي، و<b>مشتتات كلها معقولة<\/b>، وخيارات غير متوازنة في الطول أو اللغة، وكلمات غير متكافئة المعرفة، وإشارات لغوية تقود للإجابة. قد يلزم إعادة كتابة المفردة لا الاكتفاء بحذفها<\/div><\/td><td><div class=\"cp\">مصدر لـ <b>الأداء التفاضلي (الأداء التفاضلي للمفردة)<\/b>: كلمة غير مألوفة لمجموعة تخفض درجتها لا لانخفاض السمة (ص 366)<\/div><div class=\"en\" dir=\"ltr\">DIF · Lord 1980<\/div><\/td><\/tr><tr><td><div class=\"cp\"><b>التصحيح والاستجابة الحرة<\/b><\/div><\/td><td><div class=\"cp\">عند الاستجابات المقالية/الحرة تُصاغ تعليمات ومعايير تصحيح تقلل اختلاف المقيّمين؛ وتتزايد مشكلات الموضوعية مع الغموض في معايير الحكم<\/div><\/td><td><div class=\"cp\">مقاييس التقدير والملاحظة تحتاج <b>دليل تقدير ومحكًّا للتدريج<\/b> وتدريب مقدّرين<\/div><div class=\"en\" dir=\"ltr\">Rating Scales<\/div><\/td><\/tr><tr><td><div class=\"cp\"><b>المفردات الإسقاطية<\/b><\/div><\/td><td><div class=\"cp\">يلفت النظر إلى إشكالات اختبارات كالرورشاخ وتفهم الموضوع: الاستجابة المفتوحة تتطلب تفسيرًا من الفاحص، فيصير ضبط الإجراءات والتحقق من التفسير حاسمًا<\/div><\/td><td><div class=\"cp\">الأدوات الإسقاطية أضعف موضوعية؛ وأي تحليل نوعي لاستجابة مفتوحة يلزمه ترميز مستقل<\/div><\/td><\/tr><tr><td><div class=\"cp\"><b>الأداء الأقصى والنمطي<\/b><\/div><\/td><td><div class=\"cp\">ليس من الملائم التعامل مع صعوبة فقرات الشخصية أو الاتجاهات كما نتعامل مع الصواب والخطأ في التحصيل؛ وظيفة الاستجابة ومقصود التفسير مختلفان<\/div><\/td><td><div class=\"cp\">هذه هي النقطة المفصلية في تحويل المادة للمقاييس النفسية<\/div><\/td><\/tr><tr><td><div class=\"cp\"><b>الحساسية للغة والتحيز<\/b><\/div><\/td><td><div class=\"cp\">قد تحدث بعض العبارات اختلافات غير مقصودة لدى فئات من المفحوصين بسبب اللغة والسياق الاجتماعي؛ ويناقش الكتاب التمييز في ألفاظ المذكر والمؤنث<\/div><\/td><td><div class=\"cp\">يُفحص إحصائيًا بـ الأداء التفاضلي للمفردة للنوع (بحث «الأداء التفاضلي لنوع الطالب على مقياس الاتزان الانفعالي»، ص 385–387)<\/div><div class=\"en\" dir=\"ltr\">DIF<\/div><\/td><\/tr><tr><td><div class=\"cp\"><b>التخمين والاستجابات الإسقاطية<\/b><\/div><\/td><td><div class=\"cp\">يناقش الكتاب أثر تخمين الاختيار الصحيح في أسئلة البدائل، ويفرّقه عن صعوبات التصحيح الموضوعي لاستجابات مفتوحة مثل بعض الاختبارات الإسقاطية التي تحتاج قواعد واضحة وتدريبًا<\/div><\/td><td><div class=\"cp\">في المقاييس: الاستجابة العشوائية/الإهمال والموافقة المنهجية<\/div><\/td><\/tr><tr><td><div class=\"cp\"><b>أشكال البنود<\/b><\/div><\/td><td><div class=\"cp\">الأسئلة المغلقة تسمح بتصحيح أكثر توحيدًا لكن قد تتأثر بالتخمين؛ والاستجابة المنشأة أو الحرة تحتاج قواعد تصحيح محددة؛ وفي بعض الاختبارات الإسقاطية أو الأدائية تزيد أهمية تدريب الفاحص وتوثيق مؤشرات الحكم<\/div><\/td><td><div class=\"cp\">اختيار شكل الاستجابة قرار تصميمي يحدد طريقة التصحيح<\/div><\/td><\/tr><\/table><\/div><aside class=\"box note\"><div class=\"bt\">ملاحظة: تمييز مهم يكرره الكتاب (ص 12–21)<\/div><p><b>صلاحية المحتوى<\/b> تأتي من ملاءمة البند للمجال، في حين أن <b>حسن التمييز الإحصائي<\/b> يتعلق بأدائه في العينة المستخدمة؛ قد يحقق بند أحدهما دون الآخر. ومنه السؤال: «ما الفرق بين بند جيد إحصائيًا وبند صالح محتوى؟».<\/p><\/aside><aside class=\"box convert\"><div class=\"bt\">التطبيق على المقاييس النفسية: مثال تطبيقي من بحث «الأداء التفاضلي لنوع الطالب على مقياس الاتزان الانفعالي»<\/div><p>في مقياس الاتزان الانفعالي (19 عبارة) عُرضت العبارات على <b>20 محكمًا<\/b> وحُسب لها نسبة صدق المحتوى؛ فكانت أدنى القيم <b>0.50<\/b> للعبارتين 13 و18، ومع ذلك لم تُحذف عبارة (القيمة الحرجة 0.42، ص 378). ثم أظهر التحليل الإحصائي (الأداء التفاضلي للمفردة) أن العبارات 10 و12 و16 متحيزة للنوع رغم صلاحيتها المحكَّمة — وهي بالضبط حالة «بند صالح محتوى لكنه غير مكافئ إحصائيًا». (التفاصيل في الفصل السابع).<\/p><div class=\"en\" dir=\"ltr\">DIF · CVR<\/div><\/aside>"}, {"title": "2.5 التحليل الكمي للبنود: التمييز والصعوبة والتخمين (ص 18–36)", "en": "", "html": "<h4><b>2.5.1 لماذا لا يكفي صدق الاختبار الكلي للحكم على جودة كل بند؟ (ص 23–24)<\/b><\/h4><ul><li>يناقش الكتاب التحليل الكمي للبنود بعد تحديد خصائصها النوعية، ويفرّق بين <b>صدق الاختبار ككل<\/b> وبين <b>قدرة كل مفردة على التمييز<\/b> بين الأفراد ذوي المستويات المختلفة في السمة أو التحصيل.<\/li><li>تحليل بند ضعيف لا يعني بالضرورة أن الاختبار كله غير صالح، لكنه يقدّم دليلًا لإعادة صياغة البند أو حذفه بعد النظر في محتواه.<\/li><li><b>تحذير منهجي:<\/b> معامل تمييز البند ليس صفة ثابتة مستقلة عن عينة التطبيق؛ يتأثر بتفاوت قدرات الأفراد ومحتوى الاختبار ونوعية المحك.<\/li><\/ul><h4><b>2.5.2 فكرة معامل التمييز وطريقة المجموعتين المتطرفتين (ص 24–26)<\/b><\/h4><ul><li>يبحث المصمم عمّا إذا كان البند يفرق بين المفحوصين الأعلى والأدنى على البناء أو على الدرجة الكلية الملائمة. وتعرض الصفحات 24–26 مقارنة مجموعات مرتفعة ومنخفضة وتفسير اختلاف نسبة الإجابات الصحيحة.<\/li><li>تُقارن <b>نسبة الإجابة الصحيحة (أو اختيار الاستجابة)<\/b> بين المجموعة العليا والمجموعة الدنيا؛ عندما ترتفع نسبة النجاح في العليا مقارنة بالدنيا يكون البند أكثر ملاءمة للتمييز في المجال المقصود.<\/li><li>يقترح الكتاب تقسيم العينة بعد ترتيب درجاتها إلى مجموعتين متعارضتين، عليا ودنيا، ويعرض استخدام نسبة <b>27%<\/b> لكل مجموعة في المثال.<\/li><li>لماذا المجموعتان العليا والدنيا بدلًا من كل العينة؟ لتكبير التباين بين فئتي الأداء وإظهار قدرة البند على الفصل، مع بقاء احتمال فقد معلومات الوسط وارتفاع حساسية النتيجة لتكوين العينة. ويناقش الكتاب أيضًا ما يترتب على استخدام المجموعتين المتطرفتين بدل جميع أفراد العينة من تحيز في التقدير (ص 28–31).<\/li><\/ul><p>معامل التمييز D = (ع − د) ÷ ن<\/p><p>ع = عدد المجيبين إجابة صحيحة من المجموعة العليا<\/p><p>د = عدد المجيبين إجابة صحيحة من المجموعة الدنيا<\/p><p>ن = عدد أفراد كل مجموعة (متساوية الحجم)<\/p><p><b>المجال النظري لمعامل التمييز في هذه الصيغة: من −1 إلى +1<\/b> (ص 25–26):<\/p><ul><li>موجب ← نجاح أكثر في المجموعة العليا.<\/li><li>صفر ← لا فارق بين المجموعتين.<\/li><li>سالب ← أداء أعلى في المجموعة الدنيا، ويستدعي فحص البند أو مفتاح التصحيح أو الصياغة، <b>أو احتمال أن البند يقيس بُعدًا مختلفًا<\/b> (ص 19–34).<\/li><\/ul><p><b>حالات الضبط الثلاث التي يعرضها الكتاب (ص 25–26):<\/b> إذا أجاب جميع أفراد العليا ولم يجب أحد من الدنيا ← <b>+1<\/b>؛ إذا انعكس الأمر ← <b>−1<\/b>؛ إذا تساوت استجابات المجموعتين ← <b>صفر<\/b>.<\/p><aside class=\"box example\"><div class=\"bt\">مثال من كتاب «الاختبارات النفسية»: ص 25، مثال العينة (100 فرد)<\/div><p>عينة قوامها <b>100<\/b> فرد، والمجموعتان العليا والدنيا قوام كل منهما <b>27<\/b> فردًا، وبندان يُرمز إليهما بـ (س) و(ص).<\/p><ul><li>البند س: الإجابات الصحيحة في العليا <b>18<\/b>، وفي الدنيا <b>6<\/b>.<\/li><li>البند ص: في العليا <b>8<\/b>، وفي الدنيا <b>3<\/b>.<\/li><\/ul><p><b>البند<\/b><\/p><p><b>العليا (ع)<\/b><\/p><p><b>الدنيا (د)<\/b><\/p><p><b>الحساب<\/b><\/p><p><b>التمييز<\/b><\/p><p>س<\/p><p>18<\/p><p>6<\/p><p>(18 − 6) ÷ 27<\/p><p>0.44 تقريبًا<\/p><p>ص<\/p><p>8<\/p><p>3<\/p><p>(8 − 3) ÷ 27<\/p><p>0.19 تقريبًا<\/p><p><b>الاستنتاج:<\/b> البند (س) أكثر قدرة على الفصل بين المجموعتين من (ص)، مع ضرورة ألا تكون قوة التمييز وحدها أساس الحكم؛ فالكتاب يربط جودة البنود أيضًا بالغرض ومستوى الصعوبة.<\/p><\/aside><aside class=\"box made\"><div class=\"bt\">مثال توضيحي<\/div><p>مجموعتان بكل واحدة <b>27<\/b> طالبًا؛ أجاب <b>22<\/b> من العليا و<b>9<\/b> من الدنيا إجابة صحيحة. الفرق النسبي = (22/27) − (9/27) = 13/27 ≈ <b>0.48<\/b>.<\/p><\/aside><aside class=\"box convert\"><div class=\"bt\">التطبيق على المقاييس النفسية<\/div><ul><li><b>عبارة ثنائية الاستجابة (موافق/غير موافق):<\/b> تُطبَّق صيغة (ع − د) ÷ ن مباشرة مع «ع و د = عدد من وافقوا في العليا والدنيا».<\/li><li><b>عبارة ليكرت (5 فئات):<\/b> يُستعاض عن النسبة بـ <b>الفرق بين متوسطَي المجموعتين العليا والدنيا<\/b> مع اختبار t، أو بمعامل ارتباط العبارة بالدرجة الكلية المصحَّحة (بعد استبعاد العبارة نفسها)، أو بتشبعها بالعامل. في بحث «الأداء التفاضلي لنوع الطالب على مقياس الاتزان الانفعالي» اعتُمدت التشبعات (من 0.310 إلى 0.744، ص 382) وحُدّ أدنى مقبول 0.30.<\/li><li>التفسير نفسه: العبارة ذات التمييز السالب تُراجع من حيث <b>اتجاه التصحيح<\/b> (هل هي عبارة سالبة لم تُعكس؟) قبل حذفها.<\/li><\/ul><\/aside><h4><b>2.5.3 مقارنة البدائل والمشتتات (ص 18–34)<\/b><\/h4><ul><li>لا تكفي صحة المفتاح؛ يجب فحص مدى انجذاب المفحوصين للمشتتات وفروق الاختيار بين المجموعات. بديل غير مستخدم أو يُستخدم على نحو غير متوقع قد يستلزم تعديلًا.<\/li><li>عند عدم اختيار بديل خاطئ من أي مفحوص يصبح البديل <b>ضعيف الوظيفة<\/b> ويستدعي المراجعة؛ وإذا جذب مشتتٌ عددًا غير متوقع من ذوي الأداء المرتفع ينبغي التحقق من دقة الصياغة والمفتاح <b>لا حذف البديل تلقائيًا<\/b>.<\/li><li>التحليل النوعي للمشتتات يكمل النتيجة العددية: إذا لم يختر أحد البدائل الخاطئة أي مشارك فقد لا يؤدي دوره كخيار جاذب للأفراد غير المتمكنين؛ ومع ذلك يُنظر إلى طبيعة المحتوى والعينة قبل تقرير الحذف.<\/li><\/ul><aside class=\"box convert\"><div class=\"bt\">التطبيق على المقاييس النفسية<\/div><p>المقابل هو <b>تحليل فئات الاستجابة <\/b>: هل تُستعمل الفئات الخمس كلها؟ هل العتبات مرتبة تصاعديًا؟ وهو ما عرضه بحث «الأداء التفاضلي لنوع الطالب على مقياس الاتزان الانفعالي» بمنحنيات عتبات الاستجابة الأربع (أبدًا←نادرًا، نادرًا←أحيانًا، أحيانًا←غالبًا، غالبًا←دائمًا) وتدرجها في الصعوبة (شكل 9، ص 384).<\/p><div class=\"en\" dir=\"ltr\">Category Functioning · Thresholds<\/div><\/aside><h4><b>2.5.4 صعوبة المفردة: ماذا تقيس النسبة؟ (ص 21–34)<\/b><\/h4><ul><li><b>الصعوبة بوصفها نسبة أداء:<\/b> تُستخدم نسب الإجابة الصحيحة في البنود التحصيلية والقدرات؛ كلما ارتفعت نسبة الصواب كان البند <b>أيسر<\/b> في تلك العينة، ويجب الحذر عند النقل إلى جماعة مختلفة. وتحذّر الفكرة العامة للكتاب من تفسير المؤشر بلا ذكر اتجاه تعريفه: نسبة مرتفعة من الإجابات الصحيحة تعني فقرة أسهل لا أصعب (مؤشر السهولة). ومفهوم صعوبة البند يرتبط عادة بنصيب من يجيبون إجابة صحيحة، أو بمكمّله، وفق الاصطلاح المستخدم.<\/li><li><b>لا يُفسَّر المؤشر منعزلًا عن غرض الاختبار:<\/b> ففي اختبارات الإتقان قد تكون البنود سهلة بعد التعليم وهذا متوقع، أما اختبار التفريق بين مستويات واسعة من القدرة فيحتاج تدرجًا في الصعوبة.<\/li><li><b>الصعوبة والصدق والتمييز:<\/b> يحذّر الكتاب من فرض مستوى صعوبة موحد بلا مراعاة وظيفة الاختبار؛ اختيار نقطة متوسطة قد يحسّن التمييز في حالات معينة لكنه ليس قانونًا عامًا لكل أداة أو غرض. ولا يصلح هدف صعوبة واحدة لجميع الأدوات خصوصًا عندما يختلف الاختبار بين السرعة والقدرة أو بين الأداء الأقصى والنمطي.<\/li><li><b>ما العلاقة بين الصعوبة والتمييز؟<\/b> قد يكون بند شديد السهولة قليل التمييز إذا نجح فيه معظم أفراد المجموعتين؛ وقد يكون بند شديد الصعوبة قليل التمييز إذا أخفق فيه الجميع تقريبًا. هذا لا يعني أن كل بند متوسط الصعوبة جيد تلقائيًا، بل تُفحص الاستجابة ومحتوى البند وغرض الأداة.<\/li><li><b>المقارنة بين نسب الصعوبة الخام:<\/b> لا تصح المقارنة المباشرة بين النسب الخام للصعوبة، لأن تغيّر نسبة الصحيحة لا يلزم أن يمثّل تغيرًا متساويًا في مستوى القدرة، ولأن شكل التوزيع وتكوين العينة يغيّران المعنى. وينتقد الكتاب التعامل مع النسب وحدات متساوية المسافات، ويراجع تحويلها إلى درجات معيارية بالاستناد إلى افتراض التوزيع الاعتدالي (ص 28–31)، كما يناقش ما يترتب على اختيار المجموعتين المتطرفتين من تحيز في التقدير إذا استُخدمتا بدل جميع أفراد العينة.<\/li><li><b>يتطرق النص أيضًا<\/b> إلى مؤشرات خاصة وأمثلة عددية لمقارنة عادلة تراعي أثر الصعوبة والنجاح بالصدفة؛ <b>ينبغي مراجعة ص 24–33<\/b> <\/li><\/ul><aside class=\"box made\"><div class=\"bt\">مثال توضيحي<\/div><p>لو أجاب <b>72<\/b> فردًا إجابة صحيحة من أصل <b>100<\/b> فنسبة الإجابة 72/100 = <b>0.72<\/b>. هذا يخبرنا عن نسبة الإجابة في تلك العينة فقط، ولا يكفي وحده للحكم على صدق البند أو ثباته.<\/p><\/aside><aside class=\"box convert\"><div class=\"bt\">التطبيق على المقاييس النفسية<\/div><p>في المقاييس ذات التدريج لا توجد «إجابة صحيحة»، فيُعبَّر عن الصعوبة بـ<b>متوسط العبارة<\/b> أو بمعلم الصعوبة في نموذج سلم التقدير: كلما زاد المعلم كانت العبارة أصعب تأييدًا. في بحث «الأداء التفاضلي لنوع الطالب على مقياس الاتزان الانفعالي» تراوحت معالم صعوبة العبارات بين <b>−0.40 و0.65 وجيت<\/b> للذكور وبين <b>−0.71 و0.82<\/b> للإناث (جدول 5، ص 386). وللتنبيه نفسه المذكور في الكتاب: لا يُقارن مستوى «صعوبة» عبارات من عينات مختلفة دون تعديل، وهو ما تعالجه نماذج نظرية الاستجابة للمفردة بوحدة قياس ثابتة (ص 363).<\/p><div class=\"en\" dir=\"ltr\">Rating Scale Model · IRT<\/div><\/aside><h4><b>2.5.5 التخمين ومعادلات تصحيح الدرجة (ص 30–34، 136–137)<\/b><\/h4><ul><li>تعرض ص <b>31–32<\/b> معالجة احتمالية للتخمين في مفردات الاختيار من متعدد؛ <b>لا يجوز تطبيق معامل تصحيح من تلقاء النفس<\/b> ما لم تنص عليه خطة القياس والتصحيح.<\/li><li>يوضح الكتاب أن الإجابة الصحيحة في بند الاختيار من متعدد قد تنتج من المعرفة أو من التخمين، ولذلك يناقش تصحيح الدرجات أو نسبة الإجابات الصحيحة وفق <b>عدد البدائل<\/b>، مع بيان أن تقدير التخمين <b>يفترض شروطًا لا تتحقق بالضرورة في كل بند<\/b> (ص 31–33).<\/li><li>تفسير تربوي: ليست كل الاستجابات الخاطئة موزعة بالتساوي على البدائل، وقد يساعد حذف بدائل مستبعدة على زيادة احتمال الإجابة الصحيحة؛ لذا ينبغي فحص صلاحية المشتتات لا الاكتفاء بتطبيق تصحيح آلي على جميع البنود (ص 32–34).<\/li><li>في الفصل الأخير (ص 136–137) يناقش الكتاب أثر التخمين وإمكان تطبيق قواعد تصحيح مخصصة لبعض الاختبارات؛ <b>تُختار القاعدة وفق نظام الأداة وليس الرغبة في رفع أو خفض الدرجات.<\/b> <\/li><\/ul><aside class=\"box convert\"><div class=\"bt\">التطبيق على المقاييس النفسية<\/div><p>لا تُطبَّق معادلات تصحيح التخمين على مقاييس الأداء المعتاد. بدلًا منها: (1) اكتشاف <b>الاستجابة العشوائية/الإهمال<\/b> بفحص أنماط الاستجابة وبنود الانتباه؛ (2) ضبط <b>الموافقة المنهجية<\/b> بعبارات موجبة وسالبة؛ (3) ضبط <b>المرغوبية الاجتماعية<\/b> بمقياس مرافق (الفصل الخامس). وتبقى القاعدة التي يؤكدها الكتاب: <b>تُحدَّد قاعدة التصحيح مسبقًا في خطة القياس، لا بعد رؤية النتائج.<\/b><\/p><\/aside><h4><b>2.5.6 أسلوب الإجابة وعلاقته بدرجات البنود (ص 34–36)<\/b><\/h4><ul><li>يتناول الكتاب أثر صيغة الإجابة في الاختيار من متعدد: صياغة السؤال، وطريقة عرض البدائل، ووجود إجابة واحدة صحيحة أو أكثر، وأثر ذلك في أداء المفحوص وطبيعة التحليل الإحصائي (ص 34–35).<\/li><li>يميّز بين نمطين عمليين من الأغراض: اختبار <b>التحصيل<\/b> الذي يفترض استظهار معرفة محددة، واختبار يتطلب <b>الاستدلال<\/b> أو الإجابة عن مشكلة، حيث قد تتغير إجراءات الحكم على البند ومعنى الإجابة الصحيحة (ص 34–36).<\/li><\/ul><h4><b>2.5.7 المؤشرات لا تحسم وحدها (ص 21–34)<\/b><\/h4><ul><li><b>جودة المفردة لا تُختزل في معامل واحد:<\/b> ينبغي الجمع بين ملاءمة المحتوى ووضوح العبارة ودليل أداء العينة وعلاقة البند بالدرجة الكلية وبالغرض من الاستعمال.<\/li><li>القرار بتعديل البند أو استبعاده يجمع بين جودة محتواه وصعوبته وتمييزه وارتباطه بغرض الاختبار. يختلف تفسير ارتفاع السهولة وفق الاختبار التحصيلي أو المعيار المحكي، ولا يُعد بندًا ضعيفًا آليًا.<\/li><li><b>لا ينبغي أن يصبح تحسين المؤشرات العددية غاية منفصلة عن شمول المحتوى؛<\/b> فالاختبار قد يبدو جيدًا حسابيًا لكنه يستبعد جوانب أساسية من مجال القياس.<\/li><li><b>الصعوبة مقابل التمييز:<\/b> الصعوبة تعكس شيوع النجاح في البند لدى العينة، والتمييز يعكس ارتباط استجابة البند بالفروق المرغوب قياسها.<\/li><\/ul><h4><b>2.5.8 إعداد الصورة النهائية (ص 35–38)<\/b><\/h4><p>بعد التعديل واستبعاد البنود الضعيفة يجري تنظيم الأداة وإجراءات تطبيقها وتصحيحها وتقرير حدود النتائج، مع الانتباه للتغيرات التقنية في عرض البنود وتسجيلها. يؤكد الكتاب في نهاية مناقشة البنود أهمية الإعداد النهائي: <b>ترتيب المفردات، الوضوح الشكلي، التعليمات، طريقة الإجابة، زمن الاختبار<\/b>، ثم تجريب الأداة واستكمال دلائل الصدق والثبات وإعداد المعايير عند الحاجة، والانتقال من التجريب المحدود إلى الاستخدام مع عينات أكبر (ص 35–38). وتشمل الصيغة النهائية ضبط تعليمات المفحوص والفاحص وتنسيق الصفحة وعملية التسجيل وترتيب البنود وأمثلة التدريب؛ وقد يستلزم اختلاف أعمار المفحوصين أو ظروفهم تغيير أسلوب العرض والإجابة.<\/p>"}, {"title": "2.6 دليل المقياس والتجهيز للاستعمال والتقنين (ص 35–38)", "en": "", "html": "<p><b><\/b> يعرض الكتاب <b>دليل الاختبار<\/b> بوصفه وسيلة لحماية جودة القياس من الاستعمال الاعتباطي. <b>الدليل ليس كتيّب أسئلة<\/b>؛ إنه يبيّن الهدف والفئة المناسبة وشروط التطبيق ومواد الاختبار والتعليمات والتوقيت وقواعد التصحيح ومعايير تفسير النتائج والأدلة المتعلقة بجودتها وحدود الاستخدام.<\/p><p><b>مكونات الدليل:<\/b><\/p><ul><li>الإطار النظري والغرض ومجال الاستخدام.<\/li><li>عينات التطوير والتقنين.<\/li><li>أصل المفردات ومراحل اختيارها.<\/li><li>دليل الصدق والثبات.<\/li><li>إجراءات التطبيق والتصحيح.<\/li><li>المعايير أو المحكات.<\/li><li>حدود التفسير.<\/li><\/ul><p><b>نتائج دراسات الأداة:<\/b> يحسن أن يورد الدليل ارتباطات مع اختبارات أخرى ونتائج المفحوصين من مجموعات فرعية حين تتوافر، بحيث يتمكن المستخدم من الحكم على ملاءمتها لمجتمعه.<\/p><p><b>ظروف التطبيق والمتطلبات الخاصة:<\/b> تختلف أدوات القياس في الزمن والطريقة والأدوات والتفاعل اللازم؛ <b>المحافظة على شروط التطبيق جزء من المحافظة على معنى الدرجة.<\/b><\/p><p><b>التقنين ليس مجرد حساب متوسط وانحراف معياري:<\/b> يشمل توحيد الإجراءات التي تؤثر في الحصول على الدرجة، وتجربة التعليمات وتوضيح حدود التفسير ومواقف التطبيق المناسبة. وأي نسخة بلا دليل يصف استخدامها وحدود نتائجها يصعب اعتمادها أداةً مهنية قابلة للتفسير السليم.<\/p><aside class=\"box convert\"><div class=\"bt\">التطبيق على المقاييس النفسية: نموذج فهرس دليل المقياس<\/div><ul><li>اسم المقياس والسمة وتعريفها المفاهيمي والإجرائي. 2) الإطار النظري والنموذج المتبنى. 3) الفئة المستهدفة وحدود الاستخدام. 4) مصادر العبارات وجدول المواصفات. 5) خطوات البناء والتحكيم (عدد المحكمين، نسبة صدق المحتوى/مؤشر صدق المحتوى). 6) العينة الاستطلاعية والأساسية. 7) نتائج تحليل العبارات. 8) الصدق (محتوى، بناء عاملي، تقاربي/تمييزي، مجموعات متضادة). 9) الثبات (ألفا/أوميغا، إعادة التطبيق، ثبات الأفراد والمفردات في راش). 10) العدالة (الأداء التفاضلي للمفردة/التكافؤ). 11) التعليمات ومفتاح التصحيح والعبارات السالبة. 12) المعايير (مئينيات/تائية) ونقاط القطع ومبرراتها. 13) حدود التفسير.<div class=\"en\" dir=\"ltr\">CVR/CVI). 6 · DIF<\/div><\/li><\/ul><\/aside>"}, {"title": "2.7 مستخدم المقياس: الأهلية والأخلاقيات وتفسير النتائج (ص 39–54)", "en": "", "html": "<p>(المؤهلات المهنية والاستعمال: ص 39–44؛ المراجع والناشرون وحقوق النسخ: ص 45–49؛ مواثيق المهنة والسرية وتفسير النتائج: ص 50–54)<\/p><p><b><\/b> ينتقل الكتاب من الإنشاء إلى <b>مسؤولية الأخصائي<\/b> عن استخدام الأداة وعن الأشخاص الذين تنتج عن تطبيقها قرارات.<\/p><h4><b>لماذا لا يكفي شراء الاختبار؟ (التخصص والتدريب)<\/b><\/h4><ul><li>الاختبارات النفسية أدوات مهنية وبحثية لا ينبغي تداولها دون إعداد متخصص. يتطلب حسن الاستخدام <b>معرفة القياس والإحصاء ومجال السلوك والخبرة في التطبيق وتفسير الدرجات<\/b>.<\/li><li>فهم النظريات والنمو والتفسير النفسي شرط، بالإضافة إلى المهارة في الاختبار المحدد وتفسير نتائجه.<\/li><li>شراء الاختبار أو الاطلاع على بنوده لا يُكسب تلقائيًا كفاءة استخدامه؛ الفاحص يحتاج فهم خصائص الأداة ودراساتها والحدود التي تمنع تعميم تفسير معين.<\/li><\/ul><h4><b>تحديد الغرض والاختيار الملائم<\/b><\/h4><ul><li>على المختص مقارنة هدف التطبيق بخصائص الأداة ومجتمع بنائها وشروط نجاح استعمالها؛ <b>لا يُتخذ اختيار المقياس من ذيوعه أو سهولة الحصول عليه فقط.<\/b><\/li><li>لا تجيز الخبرة العامة تعميم صلاحية مقياس من فئة إلى فئة أخرى دون مراجعة.<\/li><\/ul><h4><b>مصادر الاختبارات والمراجع (ص 45–49)<\/b><\/h4><p>يتناول الكتاب <b>الأدلة الفنية وكتب نقد الاختبارات والجهات الناشرة والمؤسسات المعنية<\/b>. مراجعة الدليل الفني ومنشورات التقييم جزء من عمل الباحث قبل الانتقاء.<\/p><h4><b>حقوق النشر والنسخ والوصول المشروع<\/b><\/h4><ul><li>لا تجيز إتاحة نسخة لأغراض التقييم إعادة طباعة الاختبار أو توزيعه بغير إذن؛ ويشير الكتاب إلى دور جهات النشر المختصة في ضبط تداول الأدوات.<\/li><li>يجب حماية مواد الاختبار من التداول الذي يفسد سرية المفردات أو يكشف مفاتيح الإجابة أو يعرّض الأفراد لاستخدام غير مسؤول.<\/li><\/ul><h4><b>القواعد الأخلاقية للمهنة (ص 50–54)<\/b><\/h4><p>تعرض الصفحات بنودًا تتعلق بـ: حدود الكفاية المهنية، والمسؤولية، والضرر الممكن، والسرية، وحقوق المفحوصين وحماية نتائجهم. وتشمل الالتزامات المهنية: مراعاة السرية؛ وحق المفحوص في فهم الغرض المناسب؛ وعدم إساءة استخدام الدرجات في قرارات لا تستند إلى دليل كاف؛ والانتباه للظروف الشخصية والاجتماعية والثقافية التي قد تغيّر معنى الأداء.<\/p><h4><b>السرية وحماية البيانات<\/b><\/h4><p>تتصل أخلاقيات الاستخدام <b>بحقوق الفرد وسلامته، وسرية بياناته وحماية سجلاته<\/b>، وعدم استعمال الدرجات لقرارات تتجاوز ما يسمح به الاختبار. وبيانات المفحوص ليست مادة عامة؛ ينبغي تقليل اطلاع غير المعنيين عليها والتمييز بين <b>التقارير الممكن مشاركتها<\/b> و<b>ملفات التفاصيل الحساسة<\/b>.<\/p><h4><b>تفسير النتائج لا الاقتصار على الدرجات<\/b><\/h4><p>لا يكفي إعطاء رقم خام أو درجة معيارية؛ ينبغي شرح ماذا تعني النتائج في ضوء غرض الأداة وحدودها والبيئة التي طُبقت فيها، وربطها <b>بمرجع تفسير محدد، وبالخطأ المحتمل، وحدود صدق التفسير، وبمعطيات الشخص وسياق القياس.<\/b><\/p><h4><b>حدود الاستدلال<\/b><\/h4><p>يجب تقييد النتائج بمقدار ما تسمح به معايير التقنين والصدق وظروف التطبيق، وتجنب <b>قرارات قاطعة من دليل منفرد<\/b>.<\/p><aside class=\"box convert\"><div class=\"bt\">التطبيق على المقاييس النفسية<\/div><p>هذه المبادئ تنطبق على المقاييس حرفيًا، وأهم تطبيقاتها في البحث: (1) الحصول على إذن مؤلف المقياس قبل تعريبه أو استخدامه؛ (2) موافقة مستنيرة وسرية للمستجيبين؛ (3) عدم إصدار حكم إكلينيكي على طالب من درجة مقياس بحثي واحد؛ (4) الإبلاغ عن حدود العينة والثقافة عند تفسير المتوسطات.<\/p><\/aside>"}, {"title": "2.8 المقاييس معيارية المرجع ومحكية المرجع (ص 55–76)", "en": "", "html": "<p><b><\/b> يعقد الكتاب مقارنة واسعة بين الاتجاهين على مستوى هدف الاختبار وإعداد المحتوى وتفسير الدرجة وما يوجَّه إلى كل منهما من نقد.<\/p><div class=\"tw\"><table><tr><th><div class=\"cp\"><b>وجه المقارنة<\/b><\/div><\/th><th><div class=\"cp\"><b>معياري المرجع<\/b><\/div><div class=\"cp\">Norm-Referenced<\/div><\/th><th><div class=\"cp\"><b>محكي المرجع<\/b><\/div><div class=\"cp\">Criterion-Referenced<\/div><\/th><\/tr><tr><td><div class=\"cp\">السؤال الأساسي<\/div><\/td><td><div class=\"cp\">أين يقع أداء هذا الشخص بالنسبة للجماعة؟<\/div><\/td><td><div class=\"cp\">هل بلغ المستوى المحدد من المعرفة أو الأداء؟<\/div><\/td><\/tr><tr><td><div class=\"cp\">تفسير الدرجة<\/div><\/td><td><div class=\"cp\">بالقياس إلى توزيع أداء جماعة مقارنة مناسبة؛ معنى الدرجة يعتمد على موقعها بين درجات الآخرين<\/div><\/td><td><div class=\"cp\">بمدى تحقق حد محدد من الكفاية أو الأهداف، بصرف النظر عن ترتيب الأفراد<\/div><\/td><\/tr><tr><td><div class=\"cp\">الاستخدام<\/div><\/td><td><div class=\"cp\">الترتيب والاختيار والمقارنة النسبية<\/div><\/td><td><div class=\"cp\">وصف السلوك والكفاية والمهارات التي ينبغي امتلاكها<\/div><\/td><\/tr><tr><td><div class=\"cp\">بناء المحتوى<\/div><\/td><td><div class=\"cp\">عينة بنود تميز بين الأفراد<\/div><\/td><td><div class=\"cp\">تحديد دقيق للنطاق السلوكي والأهداف قبل تأليف المفردات<\/div><\/td><\/tr><tr><td><div class=\"cp\">جدول المواصفات<\/div><\/td><td><div class=\"cp\">يعكس أهمية المجالات<\/div><\/td><td><div class=\"cp\">أكثر ارتباطًا بتحليل المهام والأهداف المحددة<\/div><\/td><\/tr><tr><td><div class=\"cp\">الثبات المطلوب<\/div><\/td><td><div class=\"cp\">ثبات ترتيب الأفراد وفروق درجاتهم<\/div><\/td><td><div class=\"cp\">ثبات <b>قرار التصنيف<\/b> (متقن/غير متقن)<\/div><\/td><\/tr><tr><td><div class=\"cp\">حدوده<\/div><\/td><td><div class=\"cp\">المستوى النسبي لا يجيب وحده عن امتلاك مهارة بعينها<\/div><\/td><td><div class=\"cp\">صعوبة تحديد النطاق ونقاط الاجتياز وتعارض أحكام المحكمين<\/div><\/td><\/tr><\/table><\/div><p>(الجدول تنظيم تحريري لمقارنة الكتاب؛ خانتا «بناء المحتوى» و«جدول المواصفات» في العمود المعياري من التركيب التحريري.)<\/p><p><b>محدودية التفسير النسبي:<\/b> قد يكون فرد ضمن الأعلى في جماعة ضعيفة الأداء دون أن يبلغ معيار الكفاية المطلوب؛ وقد يكون متوسط الموقع في جماعة قوية رغم بلوغه معيارًا عاليًا.<\/p><aside class=\"box made\"><div class=\"bt\">مثال توضيحي<\/div><p>لو أجاب جميع المتعلمين عن <b>90%<\/b> من مفردات مهارة أساسية فلا يلزم أن يكون هناك «ضعفاء» فقط لأن ترتيبهم النسبي يختلف؛ لكن الحكم على الإتقان يحتاج محكًا مناسبًا ومبررًا.<\/p><\/aside><h4><b>بداية الجدل والانتقادات والمقترحات<\/b><\/h4><p>يعرض الكتاب انتقادات القياس المعياري الذي يجعل ترتيب الفرد بين أفراد الجماعة مركز التفسير، والنقد الموجه إلى الاعتماد المفرط على التصنيف النسبي في التربية، ويقدّم الاختبار محكي المرجع في سياق قياس تحقيق أهداف معرفية أو سلوكية محددة. ويستعرض كذلك <b>حدود<\/b> بناء المحتوى المحكي، وتحديد نقاط الاجتياز، وتعارض أحكام المحكمين.<\/p><h4><b>دقة تعريف النطاق السلوكي وتحديد الأهداف<\/b><\/h4><ul><li>يعتمد القياس المحكي بدرجة كبيرة على تحديد ما يتعيّن تعلمه أو أداؤه وتعيين مؤشرات يمكن ملاحظتها، ويُختار من هذا النطاق محتوى تمثله المفردات.<\/li><li>تمييز <b>الهدف العام<\/b> من <b>الهدف السلوكي المحدد<\/b>، وربط كل مفردة بالمهارة أو المؤشر المطلوب بدل الاكتفاء بانتقاء أسئلة شائعة.<\/li><li><b>جداول المواصفات:<\/b> يُربط المحتوى ومستوى الأداء وتوزع الأوزان على خلايا الجدول، بحيث يعكس الاختبار أهمية المجالات بدل التوزيع الاعتباطي للبنود.<\/li><li><b>التنظيم البنائي للمحتوى:<\/b> ترد مسارات متنوعة لتنظيم المحتوى ومعايير تحديد السلوك الذي يصلح دليلًا على تحقيق الهدف، منها تقسيم الأهداف إلى مكونات أدائية ومهارات تمهيدية.<\/li><li><b>نوع الهدف:<\/b> أهداف معرفية ومهارية ووجدانية؛ ولا يصح تصوّر أن جميع المجالات تقاس بطريقة واحدة، إذ تختلف آليات الاستجابة ومصادر الخطأ.<\/li><li><b>صدق التمثيل:<\/b> عندما يُطلب من الاختبار الحكم على مجال واسع، يصبح اختيار عينة البنود ومسؤولية المطابقة بين المحتوى والعينة قضية مركزية؛ ونقص التمثيل يؤدي إلى استنتاجات غير مسوّغة عن إتقان المجال. ولا تكفي عينة بنود عشوائية لتبرير الحكم بالإتقان.<\/li><\/ul><h4><b>أشكال المعايير والأحكام<\/b><\/h4><p>قد يقوم المرجع على <b>أداء مسبق محدد<\/b> أو <b>معايير اجتماعية<\/b> أو <b>أحكام نوعية<\/b>؛ ويقتضي كل نمط تسويغ سبب اعتماد حد الإتقان.<\/p><aside class=\"box convert\"><div class=\"bt\">التطبيق على المقاييس النفسية<\/div><p>أغلب المقاييس النفسية <b>معيارية المرجع<\/b> (تُفسَّر الدرجة بالمئينيات/التائية أو بالمقارنة بالمتوسط النظري كما في بحث المرغوبية الاجتماعية: متوسط فعلي 11.04 مقابل نظري 13، ص 417–419). لكن كثيرًا من المقاييس الإكلينيكية تعمل بمنطق <b>محكي<\/b> عبر نقاط قطع (مثلًا: تصنيف شدة الأعراض). والقاعدة نفسها: <b>الموقع النسبي لا يساوي حكمًا إكلينيكيًا<\/b>؛ والحكم بالمرض أو بالمستوى «المرتفع» يحتاج محكًا مبررًا (تشخيص مستقل، منحنى خصائص التشغيل، مجموعات متضادة).<\/p><div class=\"en\" dir=\"ltr\">ROC<\/div><p><b>ملاحظة نقدية تفيدك:<\/b> مقارنة المتوسط الفعلي بالمتوسط النظري وصفيًا دون اختبار دلالة أو حجم أثر (كما في بحث المرغوبية) ليست حكمًا معياريًا ولا محكيًا كاملًا.<\/p><\/aside>"}, {"title": "2.9 المجال الوجداني وحدود الاستجابة الذاتية (ص 74–85)", "en": "", "html": "<p><b><\/b> يناقش الكتاب بناء <b>مقاييس الاتجاه والميل والجوانب الوجدانية<\/b>، وما قد ينشأ في تقرير الذات من الميل إلى <b>الاستحسان الاجتماعي<\/b>.<\/p><ul><li><b>صعوبة تعريف المجال السلوكي<\/b> في بعض الجوانب الوجدانية: الاستجابة قد تتأثر بمعرفة الفرد بالسلوك المقبول اجتماعيًا وطريقة صياغة العبارة وحالة التطبيق. <b>فلا يكفي أن يصرّح الشخص بقبول قيمة معينة حتى يُستدل مباشرة على اتساق سلوكه معها.<\/b><\/li><li><b>التقرير الذاتي:<\/b> صعوبة قياس الجوانب الوجدانية اعتمادًا على إجابات لفظية مباشرة أو قوائم استبيان، إذ قد تتأثر الاستجابات بما يراه الفرد مرغوبًا اجتماعيًا.<\/li><li><b>المرغوبية الاجتماعية:<\/b> ميل المفحوص إلى تقديم صورة مقبولة اجتماعيًا يحدّ من تفسير استجابته بوصفها انعكاسًا مباشرًا لسلوكه الواقعي في كل المواقف.<\/li><li>يرد في مناقشة المجال الوجداني <b>استخدام مؤشرات أو أدوات مرتبطة بالرغبة في الاستجابة المقبولة اجتماعيًا<\/b> لفحص البنود التي قد ترتبط بهذا التأثير. والفكرة <b>ألا نخلط السمة المراد قياسها بأسلوب الإجابة<\/b>، لا أن نجزم بأن أداة بعينها تصحح جميع صور التحيز.<\/li><li>إذا كان المجال أكثر تعقيدًا من مهارة دراسية محددة فيلزم <b>تعريفات إجرائية أدق<\/b> وعناية أكبر بصدق المحتوى وطريقة جمع الأدلة.<\/li><li><b>الصدق الوظيفي:<\/b> صدق يتصل بما إذا كان الاختبار يساعد في اتخاذ قرارات أو التنبؤ بسلوك مطلوب في سياق فعلي؛ ولا يكفي مجرد ارتباط الأداة بمظهر لفظي للخاصية دون فحص الاستخدام. ويربط النص بين صدق الأداة ودقة القرار العملي، خاصة متى كان الهدف التمييز بين متمكن وغير متمكن.<\/li><\/ul><aside class=\"box convert\"><div class=\"bt\">التطبيق على المقاييس النفسية: الربط المباشر ببحث «المرغوبية الاجتماعية وعلاقتها بالذكاء العاطفي» (المرغوبية والذكاء العاطفي)<\/div><p>هذا الفصل من الكتاب هو الأساس النظري لبحث «المرغوبية الاجتماعية وعلاقتها بالذكاء العاطفي»: فقد بدأ البحث من أن معظم البحوث النفسية تعتمد التقرير الذاتي، وأن استجابة المفحوص «قد لا تعبّر عن سلوكه الفعلي بقدر ما تعبّر عن ميله إلى تقرير سلوكيات تجعله مقبولًا اجتماعيًا» (ص 399)، واستخدم <b>الاستبيان المتوازن قائمة باولهس المتوازنة للاستجابة المرغوبة اجتماعيًا لباولهس (1991)<\/b> أداةً لرصد هذا الميل، ووجد ارتباطًا <b>r = 0.427<\/b> بين المرغوبية والذكاء العاطفي (ص 420). أي أن «المؤشرات المرتبطة بالرغبة في الاستجابة المقبولة اجتماعيًا» التي يذكرها الكتاب هي ما طبّقه البحث عمليًا.<\/p><div class=\"en\" dir=\"ltr\">BIDR<\/div><\/aside>"}, {"title": "2.10 الصدق والثبات في القياس محكي المرجع (ص 75–89)", "en": "", "html": "<p><b><\/b> يناقش الكتاب القضايا المتعلقة بالتطابق مع الأهداف، وإمكان اتخاذ قرارات إتقان دقيقة، وأثر اتساق التصنيف.<\/p><ul><li><b>صدق المحتوى والنطاق:<\/b> اختيار المفردات من محتوى معرَّف وموثق يساند الادعاء بأن الاختبار يمثل مجال الأداء المطلوب؛ <b>لا تكفي المراجعة اللفظية إذا كان المجال نفسه ناقص التحديد.<\/b><\/li><li><b>الصدق الوظيفي:<\/b> ربط صدق الأداة بدقة القرار العملي (انظر 2.9).<\/li><li><b>الاتساق في تصنيف الأفراد:<\/b> حيث يكون الحكم اجتياز/عدم اجتياز، قد ينصب اهتمام الثبات على <b>استقرار القرارات<\/b> بدل ترتيب الأفراد فقط. ويتطرق الكتاب إلى تطبيقات وصور متوازية وصيغ لحساب الاتفاق.<\/li><li><b>الحساسية لمستويات الكفاية:<\/b> يرتبط أداء الاختبار بالنطاق المقصود ومستوى القطع ومقدار قرب درجات الأفراد منه؛ الخطأ حول الحد يؤدي إلى تبدلات في قرارات التصنيف. فالفرد القريب من الحد قد يتغير تصنيفه بأثر خطأ القياس حتى إذا لم يحدث تغير حقيقي في مهارته؛ لذلك تُفسَّر القرارات الحدّية بحذر.<\/li><li><b>تمييز الصدق عن الثبات:<\/b> استقرار حكم التصنيف لا يضمن صحة الحد المستخدم ولا كفاية تمثيل النطاق؛ يُنظر إلى دليل كل خاصية مستقلًا وفي علاقتها ببقية الخصائص. <b>صدق التفسي
