)<\/div><div class=\"en\" dir=\"ltr\">Sari, Ridwan &amp; Sastrawijaya (2024), Pedagogika, 153(1), 185–198<\/div><\/td><td><div class=\"cp\">830 طالبًا، إندونيسيا<\/div><\/td><td><div class=\"cp\">QLEN: التحليل العاملي التوكيدي + راش؛ α = 0.98؛ الأداء التفاضلي للمفردة لثلاثة بنود<\/div><div class=\"en\" dir=\"ltr\">QLEN: CFA · DIF<\/div><\/td><\/tr><tr><td><div class=\"cp\">YarAhmadi &amp; Kargar Behbahani (2025), Language Testing in Asia, 15, 2<\/div><\/td><td><div class=\"cp\">80 متعلمًا، إيران<\/div><\/td><td><div class=\"cp\">أثر إيجابي للتقييم الدينامي التدخلي القائم على منطقة النمو القريبة (الوشيكة)<\/div><div class=\"en\" dir=\"ltr\">ZPD<\/div><\/td><\/tr><tr><td><div class=\"cp\">Kirschner, Sweller &amp; Clark (2006)؛ Hmelo-Silver et al. (2007), Educational Psychologist<\/div><\/td><td><div class=\"cp\">جدل نظري<\/div><\/td><td><div class=\"cp\">انظر 5.5<\/div><\/td><\/tr><tr><td><div class=\"cp\">سمارة (2015)؛ مصطفة (2016)؛ خلف والمياحي (2021)<\/div><\/td><td><div class=\"cp\">الأردن والعراق<\/div><\/td><td><div class=\"cp\">انظر 5.4<\/div><\/td><\/tr><\/table><\/div>"}, {"title": "8.7 المحور السابع: التكييف عبر الثقافي", "en": "", "html": "<div class=\"tw\"><table><tr><th><div class=\"cp\"><b>الدراسة<\/b><\/div><\/th><th><div class=\"cp\"><b>أبرز ما فيها<\/b><\/div><\/th><\/tr><tr><td><div class=\"cp\">Bartram et al. / ITC (2018), International Journal of Testing, 18(2), 101–134<\/div><\/td><td><div class=\"cp\">إرشادات الهيئة الدولية للاختبارات لترجمة الاختبارات وتكييفها (الطبعة الثانية)<\/div><\/td><\/tr><tr><td><div class=\"cp\">بيتون وآخرون (2000)<\/div><div class=\"en\" dir=\"ltr\">Beaton et al. (2000), Spine, 25(24), 3186–3191<\/div><\/td><td><div class=\"cp\">ست مراحل لتكييف مقاييس التقرير الذاتي<\/div><\/td><\/tr><tr><td><div class=\"cp\">Guillemin, Bombardier &amp; Beaton (1993), Journal of Clinical Epidemiology, 46(12)<\/div><\/td><td><div class=\"cp\">الإرشادات الأولى لتكييف مقاييس جودة الحياة<\/div><\/td><\/tr><tr><td><div class=\"cp\">Aldridge et al. (2000), International Journal of Science Education, 22(1), 37–55<\/div><\/td><td><div class=\"cp\">مسح البيئة التعلمية البنائية عبر أستراليا وتايوان؛ أسئلة حول نقل أداة غربية لسياق شرقي<\/div><div class=\"en\" dir=\"ltr\">CLES<\/div><\/td><\/tr><tr><td><div class=\"cp\">موسى وآخرون (2022) — بحث «المرغوبية الاجتماعية وعلاقتها بالذكاء العاطفي»<\/div><\/td><td><div class=\"cp\">نموذج محلي للترجمة العكسية والحذف الثقافي والتحليل العاملي التوكيدي<\/div><div class=\"en\" dir=\"ltr\">CFA<\/div><\/td><\/tr><\/table><\/div>"}, {"title": "8.8 التعقيب على الدراسات السابقة", "en": "", "html": "<aside class=\"box opinion\"><div class=\"bt\">رأي الباحث: أوجه الاتفاق والاختلاف والفجوة<\/div><p><b>تتفق<\/b> الدراسات على أن (1) ألفا وحدها دليل غير كافٍ (فليك 2017؛ هسي وهيوز 2020؛ ماكنيش 2018)؛ (2) المرغوبية ترتبط إيجابيًا بالسمات المرغوبة كالذكاء العاطفي (0.25–0.75 في خمس دراسات أجنبية + 0.43 في دراسة المنيا)؛ (3) التكافؤ والعدالة خطوة ضرورية قبل المقارنة بين المجموعات (بوتنيك وبورنشتاين 2016؛ بحث «الأداء التفاضلي لنوع الطالب على مقياس الاتزان الانفعالي»).<\/p><div class=\"en\" dir=\"ltr\">Flake 2017 · Hussey &amp; Hughes 2020 · McNeish 2018 · Putnick &amp; Bornstein 2016<\/div><p><b>وتختلف<\/b> في: (أ) هل نضبط المرغوبية إحصائيًا أم نعدّها جزءًا من الشخصية (ماكري وكوستا 1983؛ أونيس 1996؛ أوزيل 2010)؟ (ب) هل العبارات المعكوسة مفيدة (فايترز وباومغارتنر 2012) أم ضارة في بعض اللغات (فينتا 2022)؟ (ج) هل الاختيار الإجباري حل للتزييف (كاو ودراسجو 2019) أم يشوه الرتب (شولته 2024)؟<\/p><div class=\"en\" dir=\"ltr\">Weijters &amp; Baumgartner 2012 · Venta 2022 · Cao &amp; Drasgow 2019 · Schulte 2024 · McCrae &amp; Costa 1983 · Ones 1996 · Uziel 2010<\/div><p><b>والفجوة<\/b> التي تبرز للبيئة المصرية: ندرة الدراسات التي (1) تجمع بين بناء مقياس انفعالي وفحص الأداء التفاضلي للمفردة <b>بحجم أثر<\/b> و<b>الأداء التفاضلي للمفردة غير المنتظم<\/b>؛ (2) تختبر <b>تكافؤ الصورتين الورقية والإلكترونية<\/b> (وهو مقترح بحث «الأداء التفاضلي لنوع الطالب على مقياس الاتزان الانفعالي» نفسه)؛ (3) تفحص <b>أداء العبارات المعكوسة باللغة العربية<\/b>؛ (4) تحسم <b>تلوث أم جوهر<\/b> في علاقة المرغوبية بالذكاء العاطفي بتصميم متعدد المصادر (تقرير الذات + تقدير الأقران).<\/p><div class=\"en\" dir=\"ltr\">DIF<\/div><\/aside>"}]}, "p9": {"key": "p9", "no": 9, "title": "الرؤية التكاملية والمراجعة النقدية والبحوث المقترحة", "en": "Part Nine: The Researcher's Integrative View, Critical Review & Research Agenda", "sections": [{"title": "9.1 رأي الباحث: الموقف الجامع", "en": "", "html": "<aside class=\"box opinion\"><div class=\"bt\">رأي الباحث: الموقف الجامع<\/div><ul><li><b>في المصطلح:<\/b> أميّز بين <b>القياس<\/b> (إجراء)، و<b>الاختبار<\/b> (أداة أداء أقصى بصواب وخطأ)، و<b>المقياس<\/b> (أداة أداء معتاد بلا صواب وخطأ)، و<b>التقييم<\/b> (التقويم: تفسير وتشخيص)، و<b>التقويم<\/b> (التقويم: حكم وقرار وعلاج)؛ والعلاقة هرمية: القياس ← التقييم ← التقويم.<div class=\"en\" dir=\"ltr\">Assessment · Evaluation<\/div><\/li><li><b>في نقل مادة الكتاب إلى المقاييس:<\/b> كل منطق بناء «الاختبار» في الكتاب ينتقل إلى «المقياس» مع تحويل ثلاثة مفاهيم: الصعوبة ← مؤشر التأييد، والمشتتات ← فئات الاستجابة، والتخمين ← أنماط الاستجابة. أما درجات القطع فتنتقل بطرق المجموعات المتضادة والحدّية (منحنى خصائص التشغيل) أكثر من طرق أنجوف وإيبل.<div class=\"en\" dir=\"ltr\">ROC<\/div><\/li><li><b>في خطوات الإعداد:<\/b> أتبنى نموذج المراحل الثلاث (بواتينج وآخرون، 2018) مضافًا إليه خطوتا <b>العدالة (الأداء التفاضلي للمفردة/التكافؤ)<\/b> و<b>ضبط المرغوبية<\/b>، مع مرحلة كيفية في توليد العبارات ومقابلات معرفية قبل التطبيق الواسع.<div class=\"en\" dir=\"ltr\">Boateng et al., 2018 · DIF<\/div><\/li><li><b>في الذاتية:<\/b> لا تُلغى بل تُخفَّض بطبقات متعددة؛ والموضوعية عندي = <b>قرارات موثقة قابلة للتكرار<\/b>. ولا أحذف أثر المرغوبية آليًا، بل أقيسه وأفسره، لأن الأدلة (ماكري وكوستا 1983؛ أونيس 1996؛ أوزيل 2010) تبين أنه قد يحمل مضمونًا حقيقيًا.<div class=\"en\" dir=\"ltr\">McCrae &amp; Costa 1983 · Ones 1996 · Uziel 2010<\/div><\/li><li><b>في المدرسة البنائية:<\/b> صحيحة في وصف التعلم، وأدواتها تحدد «ماذا» نقيس (الفهم والعملية وقابلية التعلم)، والقياس الموضوعي يحدد «كيف» نقيسه بعدالة؛ وأقرب نقاط الالتقاء: التقييم الدينامي والاختبار التشخيصي القائم على التحليل الهرمي.<\/li><li><b>في بحثَي «الأداء التفاضلي لنوع الطالب على مقياس الاتزان الانفعالي» و«المرغوبية الاجتماعية وعلاقتها بالذكاء العاطفي»:<\/b> يقدمان نموذجين محليين قويين: الأول لإدخال <b>العدالة<\/b> في بناء المقاييس، والثاني لكشف <b>الذاتية<\/b> في التقرير الذاتي؛ وتطويرهما الممكن: حجم أثر الأداء التفاضلي للمفردة، والأداء التفاضلي للمفردة غير المنتظم، وتكافؤ الصورتين الورقية والإلكترونية، وتصميم متعدد المصادر يفصل «التلوث» عن «الجوهر».<div class=\"en\" dir=\"ltr\">DIF<\/div><\/li><\/ul><\/aside>"}, {"title": "9.2 استنتاجات تحليلية جديدة", "en": "", "html": "<aside class=\"box critical\"><div class=\"bt\">ملاحظة نقدية<\/div><p>ما يلي <b>فرضيات مقترحة<\/b> مستخلصة من الربط بين المادة والبحثين والأدبيات، <b>وليست نتائج مثبتة<\/b>. لكل فرضية: الأساس، ومنطق الربط، وحدود الثقة، وتصميم يختبرها.<\/p><\/aside><div class=\"tw\"><table><tr><th><div class=\"cp\"><b>#<\/b><\/div><\/th><th><div class=\"cp\"><b>الفرضية<\/b><\/div><\/th><th><div class=\"cp\"><b>الأساس<\/b><\/div><\/th><th><div class=\"cp\"><b>منطق الربط<\/b><\/div><\/th><th><div class=\"cp\"><b>تصميم مقترح لاختبارها<\/b><\/div><\/th><th><div class=\"cp\"><b>درجة الثقة<\/b><\/div><\/th><\/tr><tr><td><div class=\"cp\">1<\/div><\/td><td><div class=\"cp\">المفردات التي أظهرت الأداء التفاضلي للمفردة للنوع في مقياس الاتزان الانفعالي (تحمل الغموض، مواجهة الصعاب، الهدوء أمام سخافات الآخرين) تتشبع بمكوّن <b>مرغوبية مرتبط بأدوار النوع الاجتماعي<\/b><\/div><div class=\"en\" dir=\"ltr\">DIF<\/div><\/td><td><div class=\"cp\">بحث «الأداء التفاضلي لنوع الطالب على مقياس الاتزان الانفعالي» (ص 386) + الثاني (r = 0.43) + أوزيل (2010)<\/div><div class=\"en\" dir=\"ltr\">r) + Uziel<\/div><\/td><td><div class=\"cp\">إذا كانت المرغوبية «ضبطًا اجتماعيًا» فقد تختلف معاييرها بين الذكور والإناث في البيئة المصرية<\/div><\/td><td><div class=\"cp\">تطبيق المقياس مع قائمة باولهس المتوازنة للاستجابة المرغوبة اجتماعيًا على عينة متوازنة النوع، وفحص الأداء التفاضلي للمفردة قبل وبعد ضبط المرغوبية (انحدار لوجستي مع قائمة باولهس المتوازنة للاستجابة المرغوبة اجتماعيًا متغيرًا مشتركًا)<\/div><div class=\"en\" dir=\"ltr\">BIDR · DIF<\/div><\/td><td><div class=\"cp\">فرضية جديدة — منخفضة إلى متوسطة<\/div><\/td><\/tr><tr><td><div class=\"cp\">2<\/div><\/td><td><div class=\"cp\">جزء من ارتباط المرغوبية بالذكاء العاطفي (0.43) <b>تلوث طريقة<\/b> لا علاقة جوهرية<\/div><\/td><td><div class=\"cp\">بحث «المرغوبية الاجتماعية وعلاقتها بالذكاء العاطفي» (ص 421–422: تداخل محتوى العبارات) + بودساكوف (2003، 2012)<\/div><div class=\"en\" dir=\"ltr\">Podsakoff (2003, 2012)<\/div><\/td><td><div class=\"cp\">المتغيران مقيسان بتقرير ذاتي واحد في جلسة واحدة<\/div><\/td><td><div class=\"cp\">تصميم متعدد المصادر: تقرير ذاتي + تقدير زميلين لكل طالب؛ مقارنة الارتباط داخل الطريقة وعبر الطرق (مصفوفة السمات المتعددة-الطرق المتعددة — كامبل وفيسك 1959)<\/div><div class=\"en\" dir=\"ltr\">MTMM — Campbell &amp; Fiske 1959<\/div><\/td><td><div class=\"cp\">استنتاج تفسيري — متوسطة<\/div><\/td><\/tr><tr><td><div class=\"cp\">3<\/div><\/td><td><div class=\"cp\"><b>خداع الذات<\/b> أخطر على صدق مقاييس التكيف من <b>إدارة الانطباع<\/b>، لأنه لا يتأثر بالسرية<\/div><\/td><td><div class=\"cp\">بحث «المرغوبية الاجتماعية وعلاقتها بالذكاء العاطفي» (R² = 0.189 للتكيف) + تعريف باولهس + داوني (2006)<\/div><div class=\"en\" dir=\"ltr\">Paulhus + Downey<\/div><\/td><td><div class=\"cp\">السرية تعالج التزييف الواعي لا اللاواعي<\/div><\/td><td><div class=\"cp\">تجربة: تطبيق سري مقابل مكشوف؛ متوقع أن تتغير إدارة الانطباع دون خداع الذات<\/div><\/td><td><div class=\"cp\">فرضية جديدة — متوسطة<\/div><\/td><\/tr><tr><td><div class=\"cp\">4<\/div><\/td><td><div class=\"cp\">الصورة الإلكترونية لمقياس الاتزان الانفعالي <b>ليست مكافئة<\/b> تمامًا للورقية<\/div><\/td><td><div class=\"cp\">تطبيق بحث «الأداء التفاضلي لنوع الطالب على مقياس الاتزان الانفعالي» بالصورتين معًا (ص 376–377) + مقترحه (ص 388)<\/div><\/td><td><div class=\"cp\">بيئة التطبيق الإلكتروني تغيّر الإحساس بالرقابة والانتباه<\/div><\/td><td><div class=\"cp\">اختبار التكافؤ القياسي متعدد المجموعات (ورقي/إلكتروني) + الأداء التفاضلي للمفردة للطريقة<\/div><div class=\"en\" dir=\"ltr\">DIF<\/div><\/td><td><div class=\"cp\">فرضية جديدة — منخفضة إلى متوسطة<\/div><\/td><\/tr><tr><td><div class=\"cp\">5<\/div><\/td><td><div class=\"cp\">العبارات صياغتها نفي مزدوج («يتقلب مزاجي… بصعوبة») هي الأضعف تشبعًا لأسباب لغوية لا مضمونية<\/div><\/td><td><div class=\"cp\">تشبعات المفردتين 5 (0.310) و6 (0.408) في بحث «الأداء التفاضلي لنوع الطالب على مقياس الاتزان الانفعالي» + قواعد الصياغة في الكتاب (ص 12–21)<\/div><\/td><td><div class=\"cp\">الصعوبة اللغوية «قد تبدو صعوبة في الخاصية» (الكتاب)<\/div><\/td><td><div class=\"cp\">مقابلات معرفية + إعادة صياغة مثبتة ومقارنة التشبع<\/div><\/td><td><div class=\"cp\">استنتاج تفسيري — متوسطة<\/div><\/td><\/tr><tr><td><div class=\"cp\">6<\/div><\/td><td><div class=\"cp\">تقسيم المستويات (منخفض/متوسط/مرتفع) بالمتوسط النظري يعطي أحكامًا مختلفة عن التقسيم المعياري (مئينيات)<\/div><\/td><td><div class=\"cp\">بحث «المرغوبية الاجتماعية وعلاقتها بالذكاء العاطفي» (مقارنة بالمتوسط النظري) + الكتاب (ص 55–76 المعياري والمحكي)<\/div><\/td><td><div class=\"cp\">المتوسط النظري لا يمثل جماعة مرجعية ولا محكًا<\/div><\/td><td><div class=\"cp\">إعادة تحليل البيانات بالمعيارين ونسبة الاتفاق في التصنيف (كابا)<\/div><\/td><td><div class=\"cp\">فرضية منهجية — متوسطة<\/div><\/td><\/tr><\/table><\/div>"}, {"title": "9.3 مراجعة نقدية: أبرز الاعتراضات المحتملة على هذا العمل", "en": "", "html": "<div class=\"tw\"><table><tr><th><div class=\"cp\"><b>الادعاء<\/b><\/div><\/th><th><div class=\"cp\"><b>الأدلة المؤيدة<\/b><\/div><\/th><th><div class=\"cp\"><b>الأدلة المعارضة أو حدودها<\/b><\/div><\/th><th><div class=\"cp\"><b>الحكم المؤقت<\/b><\/div><\/th><\/tr><tr><td><div class=\"cp\">مادة الكتاب تنتقل إلى المقاييس بتحويل ثلاثة مفاهيم<\/div><\/td><td><div class=\"cp\">منطق القياس مشترك؛ نظرية الاستجابة للمفردة تعالج الاختبارات والمقاييس بإطار واحد<\/div><div class=\"en\" dir=\"ltr\">IRT<\/div><\/td><td><div class=\"cp\">بعض أقسام الكتاب (التخمين، أنجوف) خاصة بالأداء الأقصى ولا مقابل دقيق لها<\/div><\/td><td><div class=\"cp\">مقبول مع الإفصاح عن حدود التحويل (وهو ما التزم به هذا البحث)<\/div><\/td><\/tr><tr><td><div class=\"cp\">المرغوبية تهدد صدق المقاييس<\/div><\/td><td><div class=\"cp\">بحث «المرغوبية الاجتماعية وعلاقتها بالذكاء العاطفي»؛ كرومبال 2013؛ باولهس 1991<\/div><div class=\"en\" dir=\"ltr\">Krumpal 2013 · Paulhus 1991<\/div><\/td><td><div class=\"cp\">Ones 1996؛ McCrae &amp; Costa 1983؛ Uziel 2010<\/div><\/td><td><div class=\"cp\">خلافي — يُعرض بوجهيه<\/div><\/td><\/tr><tr><td><div class=\"cp\">الأداء التفاضلي للمفردة في 3 مفردات يثبت تحيزها<\/div><div class=\"en\" dir=\"ltr\">DIF<\/div><\/td><td><div class=\"cp\">دلالة مانتل–هانزل عند 0.05 و0.01<\/div><div class=\"en\" dir=\"ltr\">MH<\/div><\/td><td><div class=\"cp\">لا حجم أثر؛ 19 اختبارًا بلا تصحيح؛ المتوقع صدفةً ≈ 1 مفردة<\/div><\/td><td><div class=\"cp\">دليل أولي يحتاج تأكيدًا<\/div><\/td><\/tr><tr><td><div class=\"cp\">مقياس قائمة باولهس المتوازنة للاستجابة المرغوبة اجتماعيًا العربي صادق بنائيًا<\/div><div class=\"en\" dir=\"ltr\">BIDR<\/div><\/td><td><div class=\"cp\">جذر متوسط مربع خطأ الاقتراب = 0.021؛ النسبة كا²/درجات الحرية = 1.776<\/div><div class=\"en\" dir=\"ltr\">RMSEA · CMIN/DF<\/div><\/td><td><div class=\"cp\">مؤشر المطابقة المقارن = 0.688؛ مؤشر تاكر–لويس = 0.659؛ ثبات البعدين &lt; 0.70<\/div><div class=\"en\" dir=\"ltr\">CFI · TLI<\/div><\/td><td><div class=\"cp\">ضعيف — يحتاج إعادة تحقق<\/div><\/td><\/tr><tr><td><div class=\"cp\">البنائية والقياس الموضوعي متكاملان<\/div><\/td><td><div class=\"cp\">QLEN 2024؛ التقييم الدينامي<\/div><\/td><td><div class=\"cp\">كيرشنر وآخرون 2006 ينتقدان التطبيق التعليمي للبنائية<\/div><div class=\"en\" dir=\"ltr\">Kirschner et al. 2006<\/div><\/td><td><div class=\"cp\">رأي الباحث، مدعوم جزئيًا<\/div><\/td><\/tr><\/table><\/div>"}, {"title": "9.4 أجندة بحث مستقبلية مقترحة (مرتبة بالأهمية والجدوى)", "en": "", "html": "<div class=\"tw\"><table><tr><th><div class=\"cp\"><b>الأولوية<\/b><\/div><\/th><th><div class=\"cp\"><b>السؤال البحثي<\/b><\/div><\/th><th><div class=\"cp\"><b>الجدوى<\/b><\/div><\/th><\/tr><tr><td><div class=\"cp\">1<\/div><\/td><td><div class=\"cp\">هل يتغير الأداء التفاضلي للمفردة للنوع على مقياس الاتزان الانفعالي بعد ضبط المرغوبية الاجتماعية؟<\/div><div class=\"en\" dir=\"ltr\">DIF<\/div><\/td><td><div class=\"cp\">عالية (أدوات متاحة في البحثين)<\/div><\/td><\/tr><tr><td><div class=\"cp\">2<\/div><\/td><td><div class=\"cp\">هل الصورتان الورقية والإلكترونية للمقياس متكافئتان قياسيًا؟<\/div><\/td><td><div class=\"cp\">عالية<\/div><\/td><\/tr><tr><td><div class=\"cp\">3<\/div><\/td><td><div class=\"cp\">هل علاقة المرغوبية بالذكاء العاطفي «تلوث طريقة» أم «جوهر»؟ (تصميم مصفوفة السمات المتعددة-الطرق المتعددة بتقديرات الأقران)<\/div><div class=\"en\" dir=\"ltr\">MTMM<\/div><\/td><td><div class=\"cp\">متوسطة<\/div><\/td><\/tr><tr><td><div class=\"cp\">4<\/div><\/td><td><div class=\"cp\">كيف تعمل العبارات المعكوسة والنفي المزدوج في المقاييس العربية؟<\/div><\/td><td><div class=\"cp\">عالية<\/div><\/td><\/tr><tr><td><div class=\"cp\">5<\/div><\/td><td><div class=\"cp\">الأداء التفاضلي للمفردة غير المنتظم وحجم الأثر (هيئة خدمات الاختبارات التربوية) في المقاييس الانفعالية المصرية<\/div><div class=\"en\" dir=\"ltr\">ETS · DIF<\/div><\/td><td><div class=\"cp\">عالية<\/div><\/td><\/tr><tr><td><div class=\"cp\">6<\/div><\/td><td><div class=\"cp\">نقاط قطع محكية (منحنى خصائص التشغيل) للمقاييس الانفعالية العربية بدل التقسيم بالمتوسط النظري<\/div><div class=\"en\" dir=\"ltr\">ROC<\/div><\/td><td><div class=\"cp\">متوسطة<\/div><\/td><\/tr><tr><td><div class=\"cp\">7<\/div><\/td><td><div class=\"cp\">تكافؤ مقياس مسح البيئة التعلمية البنائية أو مقياس عربي لبيئة التعلم البنائية بين مصر وبيئة أخرى<\/div><div class=\"en\" dir=\"ltr\">CLES<\/div><\/td><td><div class=\"cp\">متوسطة<\/div><\/td><\/tr><\/table><\/div>"}]}, "p10": {"key": "p10", "no": 10, "title": "المعادلات الإحصائية للمقاييس مع أمثلة محلولة", "en": "Statistical Formulas with Worked Examples", "sections": [{"title": "10.1 بيانات المثال الافتراضي", "en": "", "html": "<p>Training Dataset<\/p><p>عشرة مستجيبين أجابوا عن مقياس قصير من خمس عبارات بتدريج ليكرت خماسي (1 = لا تنطبق أبدًا … 5 = تنطبق دائمًا):<\/p><div class=\"tw\"><table><tr><th><div class=\"cp\"><b>المستجيب<\/b><\/div><\/th><th><div class=\"cp\"><b>ع1<\/b><\/div><\/th><th><div class=\"cp\"><b>ع2<\/b><\/div><\/th><th><div class=\"cp\"><b>ع3<\/b><\/div><\/th><th><div class=\"cp\"><b>ع4<\/b><\/div><\/th><th><div class=\"cp\"><b>ع5<\/b><\/div><\/th><th><div class=\"cp\"><b>الدرجة الكلية<\/b><\/div><\/th><\/tr><tr><td><div class=\"cp\">1<\/div><\/td><td><div class=\"cp\">5<\/div><\/td><td><div class=\"cp\">4<\/div><\/td><td><div class=\"cp\">5<\/div><\/td><td><div class=\"cp\">4<\/div><\/td><td><div class=\"cp\">5<\/div><\/td><td><div class=\"cp\">23<\/div><\/td><\/tr><tr><td><div class=\"cp\">2<\/div><\/td><td><div class=\"cp\">4<\/div><\/td><td><div class=\"cp\">4<\/div><\/td><td><div class=\"cp\">4<\/div><\/td><td><div class=\"cp\">3<\/div><\/td><td><div class=\"cp\">4<\/div><\/td><td><div class=\"cp\">19<\/div><\/td><\/tr><tr><td><div class=\"cp\">3<\/div><\/td><td><div class=\"cp\">5<\/div><\/td><td><div class=\"cp\">5<\/div><\/td><td><div class=\"cp\">4<\/div><\/td><td><div class=\"cp\">5<\/div><\/td><td><div class=\"cp\">5<\/div><\/td><td><div class=\"cp\">24<\/div><\/td><\/tr><tr><td><div class=\"cp\">4<\/div><\/td><td><div class=\"cp\">3<\/div><\/td><td><div class=\"cp\">3<\/div><\/td><td><div class=\"cp\">2<\/div><\/td><td><div class=\"cp\">3<\/div><\/td><td><div class=\"cp\">3<\/div><\/td><td><div class=\"cp\">14<\/div><\/td><\/tr><tr><td><div class=\"cp\">5<\/div><\/td><td><div class=\"cp\">2<\/div><\/td><td><div class=\"cp\">3<\/div><\/td><td><div class=\"cp\">2<\/div><\/td><td><div class=\"cp\">2<\/div><\/td><td><div class=\"cp\">1<\/div><\/td><td><div class=\"cp\">10<\/div><\/td><\/tr><tr><td><div class=\"cp\">6<\/div><\/td><td><div class=\"cp\">4<\/div><\/td><td><div class=\"cp\">5<\/div><\/td><td><div class=\"cp\">4<\/div><\/td><td><div class=\"cp\">4<\/div><\/td><td><div class=\"cp\">4<\/div><\/td><td><div class=\"cp\">21<\/div><\/td><\/tr><tr><td><div class=\"cp\">7<\/div><\/td><td><div class=\"cp\">1<\/div><\/td><td><div class=\"cp\">2<\/div><\/td><td><div class=\"cp\">2<\/div><\/td><td><div class=\"cp\">1<\/div><\/td><td><div class=\"cp\">2<\/div><\/td><td><div class=\"cp\">8<\/div><\/td><\/tr><tr><td><div class=\"cp\">8<\/div><\/td><td><div class=\"cp\">3<\/div><\/td><td><div class=\"cp\">2<\/div><\/td><td><div class=\"cp\">3<\/div><\/td><td><div class=\"cp\">3<\/div><\/td><td><div class=\"cp\">2<\/div><\/td><td><div class=\"cp\">13<\/div><\/td><\/tr><tr><td><div class=\"cp\">9<\/div><\/td><td><div class=\"cp\">4<\/div><\/td><td><div class=\"cp\">4<\/div><\/td><td><div class=\"cp\">5<\/div><\/td><td><div class=\"cp\">4<\/div><\/td><td><div class=\"cp\">5<\/div><\/td><td><div class=\"cp\">22<\/div><\/td><\/tr><tr><td><div class=\"cp\">10<\/div><\/td><td><div class=\"cp\">2<\/div><\/td><td><div class=\"cp\">1<\/div><\/td><td><div class=\"cp\">2<\/div><\/td><td><div class=\"cp\">2<\/div><\/td><td><div class=\"cp\">2<\/div><\/td><td><div class=\"cp\">9<\/div><\/td><\/tr><tr><td><div class=\"cp\"><b>المتوسط<\/b><\/div><\/td><td><div class=\"cp\">3.3<\/div><\/td><td><div class=\"cp\">3.3<\/div><\/td><td><div class=\"cp\">3.3<\/div><\/td><td><div class=\"cp\">3.1<\/div><\/td><td><div class=\"cp\">3.3<\/div><\/td><td><div class=\"cp\">16.3<\/div><\/td><\/tr><tr><td><div class=\"cp\"><b>التباين<\/b><\/div><\/td><td><div class=\"cp\">1.789<\/div><\/td><td><div class=\"cp\">1.789<\/div><\/td><td><div class=\"cp\">1.567<\/div><\/td><td><div class=\"cp\">1.433<\/div><\/td><td><div class=\"cp\">2.233<\/div><\/td><td><div class=\"cp\">38.233<\/div><\/td><\/tr><\/table><\/div>"}, {"title": "10.2 المتوسط النظري ومستويات الاستجابة", "en": "", "html": "<p>Theoretical Mean &amp; Response Levels<\/p><p>المتوسط النظري للمقياس = عدد العبارات × متوسط التدريج<\/p><p>مقياس 5 عبارات خماسي: 5 × 3 = 15<\/p><p>طول الفئة لثلاثة مستويات = (أعلى تقدير − أدنى تقدير) ÷ عدد المستويات = (5 − 1) ÷ 3 = 1.33<\/p><p>منخفض: 1.00–2.33 | متوسط: 2.34–3.66 | مرتفع: 3.67–5.00<\/p><ul><li><b>من بحث «المرغوبية الاجتماعية وعلاقتها بالذكاء العاطفي»:<\/b> مقياس الذكاء العاطفي 42 عبارة خماسي ← المتوسط النظري 42 × 3 = <b>126<\/b>، والمتوسط الفعلي <b>146.50<\/b>؛ وقائمة باولهس المتوازنة للاستجابة المرغوبة اجتماعيًا بعد التصحيح الثنائي 26 عبارة ← المتوسط النظري 26 × 0.5 = <b>13<\/b>، والفعلي <b>11.04<\/b> (ص 417–419 من البحث).<div class=\"en\" dir=\"ltr\">BIDR<\/div><\/li><li><b>تنبيه:<\/b> هذا تقسيم اصطلاحي وصفي، لا معيار محكي ولا معياري (انظر 2.8 و2.11).<\/li><\/ul>"}, {"title": "10.3 معامل ارتباط العبارة بالدرجة الكلية المصححة", "en": "", "html": "<p>Corrected Item-Total Correlation<\/p><p>r(i, X−i) = ارتباط بيرسون بين درجة العبارة i ومجموع باقي العبارات (بعد استبعاد العبارة نفسها)<\/p><div class=\"tw\"><table><tr><th><div class=\"cp\"><b>العبارة<\/b><\/div><\/th><th><div class=\"cp\"><b>الارتباط المصحح<\/b><\/div><\/th><th><div class=\"cp\"><b>ألفا عند حذف العبارة<\/b><\/div><\/th><\/tr><tr><td><div class=\"cp\">ع1<\/div><\/td><td><div class=\"cp\">0.950<\/div><\/td><td><div class=\"cp\">0.943<\/div><\/td><\/tr><tr><td><div class=\"cp\">ع2<\/div><\/td><td><div class=\"cp\">0.825<\/div><\/td><td><div class=\"cp\">0.964<\/div><\/td><\/tr><tr><td><div class=\"cp\">ع3<\/div><\/td><td><div class=\"cp\">0.878<\/div><\/td><td><div class=\"cp\">0.955<\/div><\/td><\/tr><tr><td><div class=\"cp\">ع4<\/div><\/td><td><div class=\"cp\">0.911<\/div><\/td><td><div class=\"cp\">0.951<\/div><\/td><\/tr><tr><td><div class=\"cp\">ع5<\/div><\/td><td><div class=\"cp\">0.917<\/div><\/td><td><div class=\"cp\">0.950<\/div><\/td><\/tr><\/table><\/div><ul><li><b>القاعدة المتداولة:<\/b> يُقبل الارتباط المصحح ≥ 0.30.<\/li><li><b>قراءة الجدول:<\/b> حذف العبارة 2 يرفع ألفا من 0.962 إلى 0.964 — زيادة تافهة؛ ولا تُحذف عبارة لهذا السبب وحده إذا كانت تمثل جانبًا من المحتوى (قاعدة الكتاب: المؤشرات لا تحسم وحدها).<\/li><\/ul>"}, {"title": "10.4 التمييز بالمجموعتين الطرفيتين", "en": "", "html": "<p>Extreme Groups Discrimination — t-test<\/p><p>t = (م العليا − م الدنيا) ÷ √(ع²العليا/ن + ع²الدنيا/ن)<\/p><ul><li>رُتّب المستجيبون بالدرجة الكلية، وأُخذ أعلى 3 (24، 23، 22) وأدنى 3 (8، 9، 10) — تقريبًا 27% من 10.<\/li><li>العبارة 1: درجات العليا (5، 5، 4) ← متوسط <b>4.67<\/b>؛ الدنيا (1، 2، 2) ← متوسط <b>1.67<\/b>؛ تباين كل مجموعة <b>0.333<\/b>.<\/li><li>t = (4.67 − 1.67) ÷ √(0.333/3 + 0.333/3) = 3.00 ÷ 0.471 = <b>6.36<\/b> ← تمييز قوي.<\/li><li><b>مقابل معادلة الكتاب<\/b> D = (ع − د)/ن للبنود الثنائية (انظر 2.5.2).<\/li><\/ul>"}, {"title": "10.5 معامل ألفا كرونباخ (معامل ألفا كرونباخ, 1951)", "en": "", "html": "<p>Cronbach's Alpha, 1951<\/p><p>α = [ k ÷ (k − 1) ] × [ 1 − (Σ ع²العبارات ÷ ع²الكلية) ]<\/p><p>α = (5 ÷ 4) × (1 − 8.811 ÷ 38.233) = 1.25 × (1 − 0.2305) = 0.962<\/p><ul><li><b>التفسير:<\/b> α مرتفع جدًا لأن العبارات متشابهة جدًا في المثال الافتراضي؛ وفي الواقع قد يدل α &gt; 0.95 على تكرار العبارات (كلارك وواطسون, 1995).<div class=\"en\" dir=\"ltr\">Clark &amp; Watson, 1995<\/div><\/li><li><b>من بحث «المرغوبية الاجتماعية وعلاقتها بالذكاء العاطفي»:<\/b> α لمقياس الذكاء العاطفي = 0.86، ولـ قائمة باولهس المتوازنة للاستجابة المرغوبة اجتماعيًا = 0.76.<div class=\"en\" dir=\"ltr\">BIDR<\/div><\/li><\/ul>"}, {"title": "10.6 معامل أوميغا ماكدونالد", "en": "", "html": "<p>McDonald's Omega<\/p><p>ω = (Σλ)² ÷ [ (Σλ)² + Σθ ] حيث θ = 1 − λ² (تباين الخطأ للعبارة)<\/p><p>تشبعات معيارية: 0.70، 0.65، 0.80، 0.60، 0.75 ← Σλ = 3.50؛ Σθ = 2.525<\/p><p>ω = 12.25 ÷ (12.25 + 2.525) = 0.829<\/p><ul><li><b>لماذا أوميغا؟<\/b> ألفا تفترض تساوي التشبعات، وأوميغا لا تفترض ذلك (ماكنيش, 2018؛ فلورا, 2020).<div class=\"en\" dir=\"ltr\">Tau-equivalence · McNeish, 2018 · Flora, 2020<\/div><\/li><li><b>متوسط التباين المستخلص:<\/b> متوسط مربعات التشبعات = 0.495 (المحك المتداول ≥ 0.50 للصدق التقاربي — فورنل ولاركر, 1981).<div class=\"en\" dir=\"ltr\">Average Variance Extracted · Fornell &amp; Larcker, 1981<\/div><\/li><\/ul>"}, {"title": "10.7 التجزئة النصفية ومعادلة سبيرمان–براون", "en": "", "html": "<p>Split-Half &amp; Spearman–Brown<\/p><p>r_SB = 2r ÷ (1 + r)<\/p><p>المثال: الفردية (ع1+ع3+ع5) مقابل الزوجية (ع2+ع4): r = 0.896 ← r_SB = 0.945<\/p><p>مثال سريع: r = 0.70 ← r_SB = 1.40 ÷ 1.70 = 0.824<\/p><p>الصيغة العامة لإطالة المقياس n مرة: r_n = n·r ÷ [1 + (n − 1)·r] (n = 2 و r = 0.60 ← 0.75)<\/p>"}, {"title": "10.8 معادلة كودر–ريتشاردسون 20 للعبارات الثنائية", "en": "", "html": "<p>Kuder–Richardson 20<\/p><p>KR-20 = [ k ÷ (k − 1) ] × [ 1 − (Σ p·q ÷ ع²) ]<\/p><p>مثال: 6 عبارات (موافق = 1)، 8 مستجيبين<\/p><p>نسب الموافقة p: 0.875، 0.625، 0.75، 0.50، 0.375، 0.25 ← Σpq = 1.203<\/p><p>تباين الدرجات الكلية (5، 3، 2، 6، 1، 4، 1، 5) = 3.234<\/p><p>KR-20 = 1.2 × (1 − 1.203 ÷ 3.234) = 0.754<\/p>"}, {"title": "10.9 صدق المحتوى: نسبة صدق المحتوى ومؤشر صدق المحتوى ومعامل أيكن", "en": "", "html": "<p>Content Validity Indices · CVR · CVI<\/p><p>CVR (لوشي Lawshe, 1975) = (ن_أساسية − ن/2) ÷ (ن/2)<\/p><p>20 محكمًا قال 18 «أساسية» ← CVR = (18 − 10) ÷ 10 = 0.80<\/p><p>الصيغة المعدلة في بحث «الأداء التفاضلي لنوع الطالب على مقياس الاتزان الانفعالي»: CVR = [ن_كبيرة + ن_متوسطة/2 − ن/2] ÷ (ن/2)<\/p><p>المفردة 1 في البحث: 16 كبيرة + 4 متوسطة ← (16 + 2 − 10) ÷ 10 = 0.80 (ص 378 من البحث)<\/p><p>CVI للمقياس = متوسط قيم CVR للعبارات المحتفظ بها (البحث: 0.839)<\/p><p>I-CVI (لين Lynn, 1986) = عدد من قيّموا العبارة 3 أو 4 (من 4) ÷ عدد المحكمين<\/p><p>معامل V (أيكن Aiken, 1985) = Σ(التقدير − أدنى تقدير) ÷ [ن × (عدد الفئات − 1)]<\/p><p>5 محكمين، تدريج 1–4، تقديرات 4،4،3،4،3 ← V = (3+3+2+3+2) ÷ (5 × 3) = 0.867<\/p>"}, {"title": "10.10 الدرجات المعيارية والمئينية", "en": "", "html": "<p>Standard Scores &amp; Percentiles<\/p><p>z = (س − م) ÷ ع T = 50 + 10z<\/p><p>من بحث «المرغوبية الاجتماعية وعلاقتها بالذكاء العاطفي»: م = 146.50، ع = 15.95 (مقياس الذكاء العاطفي)<\/p><p>طالب درجته 160 ← z = (160 − 146.50) ÷ 15.95 = 0.846 ← T = 58.5<\/p><p>الرتبة المئينية (بافتراض الاعتدال) ≈ 80.1 ← أي أن درجته أعلى من نحو 80% من العينة<\/p>"}, {"title": "10.11 الخطأ المعياري للقياس وفترة الثقة", "en": "", "html": "<p>Standard Error of Measurement<\/p><p>SEM = ع × √(1 − r)<\/p><p>مقياس الذكاء العاطفي: ع = 15.95، α = 0.86 ← SEM = 15.95 × √0.14 = 5.97<\/p><p>فترة الثقة 95% للدرجة الحقيقية = الدرجة الملاحظة ± 1.96 × 5.97 = ± 11.7<\/p><p>فالطالب صاحب الدرجة 160 درجته الحقيقية بين 148.3 و171.7 تقريبًا<\/p><ul><li>هذه هي الترجمة الرقمية لتحذير الكتاب: «الفرد القريب من حد القطع قد يتغير تصنيفه بأثر خطأ القياس» (2.10).<\/li><\/ul>"}, {"title": "10.12 اتفاق المقدّرين: كابا كوهين (معامل كابا كوهين, 1960)", "en": "", "html": "<p>Cohen's Kappa, 1960<\/p><p>κ = (Po − Pe) ÷ (1 − Pe)<\/p><p>مقدّران صنّفا 50 استجابة: اتفقا «نعم» 20 و«لا» 20؛ اختلفا 6 + 4<\/p><p>Po = 40 ÷ 50 = 0.80؛ Pe = (26/50 × 24/50) + (24/50 × 26/50) = 0.499<\/p><p>κ = (0.80 − 0.499) ÷ (1 − 0.499) = 0.601 ← اتفاق متوسط إلى جيد<\/p>"}, {"title": "10.13 اعتدالية التوزيع بنسبة الالتواء إلى خطئه", "en": "", "html": "<p>Skewness z-test<\/p><p>Z = معامل الالتواء ÷ خطؤه المعياري؛ إذا |Z| ≥ 1.96 فالتوزيع غير اعتدالي عند 0.05<\/p><p>من بحث «المرغوبية الاجتماعية وعلاقتها بالذكاء العاطفي»: المرغوبية الكلية 0.16 ÷ 0.09 = 1.78 (غير دال)؛ خداع الذات 0.47 ÷ 0.09 = 5.22 (ملتوٍ)<\/p>"}, {"title": "10.14 حجم أثر الأداء التفاضلي: دلتا مانتل–هانزل (دلتا هيئة الاختبارات)", "en": "", "html": "<p>ETS Delta<\/p><p>Δ_MH = −2.35 × ln(α_MH) α_MH = نسبة الأرجحية المشتركة لمانتل–هانزل<\/p><p>مثال: α_MH = 1.6 ← Δ = −2.35 × 0.470 = −1.10<\/p><p>التصنيف المتداول (هيئة الاختبارات التربوية ETS): A إذا |Δ| &lt; 1؛ B إذا 1 ≤ |Δ| &lt; 1.5؛ C إذا |Δ| ≥ 1.5 مع الدلالة<\/p><ul><li><b>الإشارة:<\/b> القيمة السالبة تعني أن المفردة أصعب على المجموعة المستهدفة (بحسب اصطلاح هيئة خدمات الاختبارات التربوية). وهذا ما لم يُبلّغ عنه بحث «الأداء التفاضلي لنوع الطالب على مقياس الاتزان الانفعالي»، ويُقترح إضافته (انظر 7.1).<div class=\"en\" dir=\"ltr\">ETS<\/div><\/li><\/ul>"}, {"title": "10.15 جدول المحكات المتداولة", "en": "", "html": "<div class=\"tw\"><table><tr><th><div class=\"cp\"><b>المؤشر<\/b><\/div><\/th><th><div class=\"cp\"><b>المحك المتداول<\/b><\/div><\/th><th><div class=\"cp\"><b>المصدر<\/b><\/div><\/th><\/tr><tr><td><div class=\"cp\">ارتباط العبارة المصحح<\/div><\/td><td><div class=\"cp\">≥ 0.30<\/div><\/td><td><div class=\"cp\">نانلي وبيرنشتاين (1994)<\/div><div class=\"en\" dir=\"ltr\">Nunnally &amp; Bernstein, 1994<\/div><\/td><\/tr><tr><td><div class=\"cp\">ألفا / أوميغا<\/div><\/td><td><div class=\"cp\">≥ 0.70 للبحث، ≥ 0.90 للقرارات الفردية<\/div><\/td><td><div class=\"cp\">نانلي — مع نقد لانس وآخرين (لانس وآخرون، 2006)<\/div><div class=\"en\" dir=\"ltr\">Nunnally · Lance et al., 2006<\/div><\/td><\/tr><tr><td><div class=\"cp\">مؤشر كايزر–ماير–أولكن<\/div><div class=\"en\" dir=\"ltr\">KMO<\/div><\/td><td><div class=\"cp\">≥ 0.60 (≥ 0.90 «رائع»)<\/div><\/td><td><div class=\"cp\">كايزر (1974)<\/div><div class=\"en\" dir=\"ltr\">Kaiser, 1974<\/div><\/td><\/tr><tr><td><div class=\"cp\">التشبع<\/div><\/td><td><div class=\"cp\">≥ 0.30 أو 0.40<\/div><\/td><td><div class=\"cp\">الأدبيات المنهجية<\/div><\/td><\/tr><tr><td><div class=\"cp\">مؤشر المطابقة المقارن / مؤشر توكر–لويس<\/div><div class=\"en\" dir=\"ltr\">CFI / TLI<\/div><\/td><td><div class=\"cp\">≥ 0.95 (و0.90 مقبول في الممارسة)<\/div><\/td><td><div class=\"cp\">هو وبنتلر (1999)<\/div><div class=\"en\" dir=\"ltr\">Hu &amp; Bentler, 1999<\/div><\/td><\/tr><tr><td><div class=\"cp\">جذر متوسط مربع خطأ الاقتراب<\/div><div class=\"en\" dir=\"ltr\">RMSEA<\/div><\/td><td><div class=\"cp\">≤ 0.06 (حتى 0.08 مقبول)<\/div><\/td><td><div class=\"cp\">هو وبنتلر (1999)<\/div><div class=\"en\" dir=\"ltr\">Hu &amp; Bentler, 1999<\/div><\/td><\/tr><tr><td><div class=\"cp\">جذر متوسط مربعات البواقي المعياري<\/div><div class=\"en\" dir=\"ltr\">SRMR<\/div><\/td><td><div class=\"cp\">≤ 0.08<\/div><\/td><td><div class=\"cp\">هو وبنتلر (1999)<\/div><div class=\"en\" dir=\"ltr\">Hu &amp; Bentler, 1999<\/div><\/td><\/tr><tr><td><div class=\"cp\">نسبة صدق المحتوى<\/div><div class=\"en\" dir=\"ltr\">CVR<\/div><\/td><td><div class=\"cp\">حسب عدد المحكمين (0.42 لعشرين محكمًا عند 0.05 كما في بحث «الأداء التفاضلي لنوع الطالب على مقياس الاتزان الانفعالي»)<\/div><\/td><td><div class=\"cp\">لوشي؛ أير وسكالي (لوشي, 1975; آير وسكالي, 2014)<\/div><div class=\"en\" dir=\"ltr\">Lawshe, 1975; Ayre &amp; Scally, 2014<\/div><\/td><\/tr><tr><td><div class=\"cp\">مؤشر صدق المحتوى للمفردة / مؤشر صدق المحتوى للمقياس ككل<\/div><div class=\"en\" dir=\"ltr\">I-CVI / S-CVI<\/div><\/td><td><div class=\"cp\">≥ 0.78 / ≥ 0.90<\/div><\/td><td><div class=\"cp\">بوليت وبيك (2006)<\/div><div class=\"en\" dir=\"ltr\">Polit &amp; Beck, 2006<\/div><\/td><\/tr><tr><td><div class=\"cp\">متوسط التباين المستخلص<\/div><div class=\"en\" dir=\"ltr\">AVE<\/div><\/td><td><div class=\"cp\">≥ 0.50<\/div><\/td><td><div class=\"cp\">فورنل ولاركر (1981)<\/div><div class=\"en\" dir=\"ltr\">Fornell &amp; Larcker, 1981<\/div><\/td><\/tr><tr><td><div class=\"cp\">Δمؤشر المطابقة المقارن للتكافؤ<\/div><div class=\"en\" dir=\"ltr\">CFI<\/div><\/td><td><div class=\"cp\">≤ 0.01<\/div><\/td><td><div class=\"cp\">تشيونج ورينسفولد (2002)<\/div><div class=\"en\" dir=\"ltr\">Cheung &amp; Rensvold, 2002<\/div><\/td><\/tr><tr><td><div class=\"cp\">معامل الفصل (راش)<\/div><\/td><td><div class=\"cp\">&gt; 2<\/div><\/td><td><div class=\"cp\">رايت وماسترز (1982)<\/div><div class=\"en\" dir=\"ltr\">Wright &amp; Masters, 1982<\/div><\/td><\/tr><tr><td><div class=\"cp\">مؤشرا المطابقة الداخلية والخارجية (متوسط المربعات)<\/div><div class=\"en\" dir=\"ltr\">Infit / Outfit MNSQ<\/div><\/td><td><div class=\"cp\">0.5 – 1.5<\/div><\/td><td><div class=\"cp\">لينكر (ليناكر)<\/div><div class=\"en\" dir=\"ltr\">Linacre<\/div><\/td><\/tr><tr><td><div class=\"cp\">كابا<\/div><\/td><td><div class=\"cp\">0.41–0.60 متوسط، 0.61–0.80 جيد<\/div><\/td><td><div class=\"cp\">لانديس وكوخ (1977)<\/div><div class=\"en\" dir=\"ltr\">Landis &amp; Koch, 1977<\/div><\/td><\/tr><\/table><\/div>"}]}, "p11": {"key": "p11", "no": 11, "title": "مثال تطبيقي متكامل — بناء مقياس من الصفر", "en": "A Complete Worked Example of Scale Development", "sections": [{"title": "مثال تطبيقي متكامل — بناء مقياس من الصفر", "en": "", "html": "<aside class=\"box made\"><div class=\"bt\">مثال توضيحي<\/div><p>البيانات والنتائج الواردة في هذا الفصل افتراضية، صيغت لتوضيح خطوات البناء والتحليل، ولا تمثل دراسة ميدانية فعلية.<\/p><\/aside>"}, {"title": "11.1 الخطوة 1–2: البناء والتعريف", "en": "", "html": "<p>Construct &amp; Definitions<\/p><ul><li><b>السمة:<\/b> التسويف الأكاديمي لدى طلاب الجامعة.<div class=\"en\" dir=\"ltr\">Academic Procrastination<\/div><\/li><li><b>الغرض:<\/b> أداة بحثية لوصف المستوى والمقارنة بين المجموعات (لا للتشخيص الإكلينيكي).<\/li><li><b>مبرر الحاجة:<\/b> ندرة مقاييس عربية حديثة بُنيت بتحليل عاملي توكيدي وفحص للعدالة بين الجنسين في البيئة المصرية.<\/li><li><b>التعريف المفاهيمي:<\/b> ميل الطالب إلى تأجيل البدء في المهام الأكاديمية أو إتمامها رغم إدراكه لعواقب التأجيل، مع ما يصاحب ذلك من ضعف في إدارة الوقت وانفعالات سلبية.<\/li><li><b>التعريف الإجرائي:<\/b> الدرجة الكلية التي يحصل عليها الطالب على المقياس المكوّن من (12) عبارة في ثلاثة أبعاد، وتدل الدرجة المرتفعة على تسويف أعلى.<\/li><\/ul>"}, {"title": "11.2 الخطوة 3: الأبعاد وجدول المواصفات", "en": "", "html": "<p>Dimensions &amp; Blueprint<\/p><div class=\"tw\"><table><tr><th><div class=\"cp\"><b>البعد<\/b><\/div><\/th><th><div class=\"cp\"><b>تعريفه الإجرائي<\/b><\/div><\/th><th><div class=\"cp\"><b>عدد العبارات في المجمّع الأولي<\/b><\/div><\/th><th><div class=\"cp\"><b>المستهدف في الصورة النهائية<\/b><\/div><\/th><th><div class=\"cp\"><b>موجبة / سالبة<\/b><\/div><\/th><\/tr><tr><td><div class=\"cp\">التأجيل السلوكي<\/div><\/td><td><div class=\"cp\">تأخير البدء في المهام والمذاكرة<\/div><\/td><td><div class=\"cp\">8<\/div><\/td><td><div class=\"cp\">4<\/div><\/td><td><div class=\"cp\">3 / 1<\/div><\/td><\/tr><tr><td><div class=\"cp\">ضعف إدارة الوقت<\/div><\/td><td><div class=\"cp\">سوء تقدير الوقت والتخطيط<\/div><\/td><td><div class=\"cp\">8<\/div><\/td><td><div class=\"cp\">4<\/div><\/td><td><div class=\"cp\">3 / 1<\/div><\/td><\/tr><tr><td><div class=\"cp\">القلق والتجنب<\/div><\/td><td><div class=\"cp\">الانفعالات المصاحبة والهروب من المهمة<\/div><\/td><td><div class=\"cp\">8<\/div><\/td><td><div class=\"cp\">4<\/div><\/td><td><div class=\"cp\">3 / 1<\/div><\/td><\/tr><tr><td><div class=\"cp\"><b>المجموع<\/b><\/div><\/td><td><\/td><td><div class=\"cp\"><b>24<\/b><\/div><\/td><td><div class=\"cp\"><b>12<\/b><\/div><\/td><td><div class=\"cp\"><b>9 / 3<\/b><\/div><\/td><\/tr><\/table><\/div>"}, {"title": "11.3 الخطوة 4–6: توليد العبارات وصياغتها", "en": "", "html": "<p>Item Generation &amp; Wording<\/p><ul><li><b>مصادر استنباطية:<\/b> التعريف والنظرية ومقاييس سابقة (مع الالتزام بحقوق النشر).<\/li><li><b>مصادر استقرائية:<\/b> سؤال مفتوح لـ 30 طالبًا: «صف موقفًا أجّلت فيه مذاكرة مادة وماذا شعرت».<\/li><li><b>صيغة الاستجابة:<\/b> ليكرت خماسي (لا تنطبق أبدًا = 1 … تنطبق دائمًا = 5)؛ العبارات السالبة تُعكس.<\/li><\/ul><div class=\"tw\"><table><tr><th><div class=\"cp\"><b>#<\/b><\/div><\/th><th><div class=\"cp\"><b>العبارة (عينة)<\/b><\/div><\/th><th><div class=\"cp\"><b>البعد<\/b><\/div><\/th><th><div class=\"cp\"><b>الاتجاه<\/b><\/div><\/th><\/tr><tr><td><div class=\"cp\">1<\/div><\/td><td><div class=\"cp\">أؤجل المذاكرة حتى الليلة السابقة للامتحان<\/div><\/td><td><div class=\"cp\">التأجيل السلوكي<\/div><\/td><td><div class=\"cp\">موجبة<\/div><\/td><\/tr><tr><td><div class=\"cp\">2<\/div><\/td><td><div class=\"cp\">أبدأ في تكليفاتي فور استلامها<\/div><\/td><td><div class=\"cp\">التأجيل السلوكي<\/div><\/td><td><div class=\"cp\"><b>سالبة<\/b><\/div><\/td><\/tr><tr><td><div class=\"cp\">3<\/div><\/td><td><div class=\"cp\">أنشغل بالهاتف عندما أجلس للمذاكرة<\/div><\/td><td><div class=\"cp\">التأجيل السلوكي<\/div><\/td><td><div class=\"cp\">موجبة<\/div><\/td><\/tr><tr><td><div class=\"cp\">4<\/div><\/td><td><div class=\"cp\">أترك المهام الصعبة إلى آخر لحظة<\/div><\/td><td><div class=\"cp\">التأجيل السلوكي<\/div><\/td><td><div class=\"cp\">موجبة<\/div><\/td><\/tr><tr><td><div class=\"cp\">5<\/div><\/td><td><div class=\"cp\">أسيء تقدير الوقت الذي تحتاجه المهمة<\/div><\/td><td><div class=\"cp\">إدارة الوقت<\/div><\/td><td><div class=\"cp\">موجبة<\/div><\/td><\/tr><tr><td><div class=\"cp\">6<\/div><\/td><td><div class=\"cp\">أضع جدولًا زمنيًا للمذاكرة وألتزم به<\/div><\/td><td><div class=\"cp\">إدارة الوقت<\/div><\/td><td><div class=\"cp\"><b>سالبة<\/b><\/div><\/td><\/tr><tr><td><div class=\"cp\">7<\/div><\/td><td><div class=\"cp\">أفاجأ بقرب موعد التسليم<\/div><\/td><td><div class=\"cp\">إدارة الوقت<\/div><\/td><td><div class=\"cp\">موجبة<\/div><\/td><\/tr><tr><td><div class=\"cp\">8<\/div><\/td><td><div class=\"cp\">أنجز أكثر من مهمة في وقت واحد فيتعطل الجميع<\/div><\/td><td><div class=\"cp\">إدارة الوقت<\/div><\/td><td><div class=\"cp\">موجبة<\/div><\/td><\/tr><tr><td><div class=\"cp\">9<\/div><\/td><td><div class=\"cp\">أشعر بالضيق عندما أفكر في تكليف لم أبدأه<\/div><\/td><td><div class=\"cp\">القلق والتجنب<\/div><\/td><td><div class=\"cp\">موجبة<\/div><\/td><\/tr><tr><td><div class=\"cp\">10<\/div><\/td><td><div class=\"cp\">أهرب من المذاكرة بأنشطة أخرى<\/div><\/td><td><div class=\"cp\">القلق والتجنب<\/div><\/td><td><div class=\"cp\">موجبة<\/div><\/td><\/tr><tr><td><div class=\"cp\">11<\/div><\/td><td><div class=\"cp\">أواجه المهام المزعجة دون تأخير<\/div><\/td><td><div class=\"cp\">القلق والتجنب<\/div><\/td><td><div class=\"cp\"><b>سالبة<\/b><\/div><\/td><\/tr><tr><td><div class=\"cp\">12<\/div><\/td><td><div class=\"cp\">أتجنب التفكير في المقررات الصعبة<\/div><\/td><td><div class=\"cp\">القلق والتجنب<\/div><\/td><td><div class=\"cp\">موجبة<\/div><\/td><\/tr><\/table><\/div><aside class=\"box convert\"><div class=\"bt\">التطبيق على المقاييس النفسية: قواعد الصياغة المطبقة (من الكتاب ص 11–21)<\/div><p>فكرة واحدة في كل عبارة؛ لا نفي مزدوج؛ لغة طلاب الجامعة؛ لا إيحاء بالإجابة المرغوبة؛ عبارات سالبة محسوبة (3 من 12) لضبط الموافقة المنهجية مع فحص أدائها لاحقًا.<\/p><\/aside>"}, {"title": "11.4 الخطوة 7: التحكيم وصدق المحتوى", "en": "", "html": "<p>Expert Review<\/p><p>عُرضت عبارات المجمّع على <b>10 محكمين<\/b>؛ يوضح الجدول عينة من 12 عبارة. القيمة الحرجة لـ نسبة صدق المحتوى عند 10 محكمين في جدول لوشي <b>0.62<\/b> (وتصير <b>0.80<\/b> بحسب إعادة الحساب عند أير وسكالي)، ونعتمد هنا جدول لوشي.<\/p><div class=\"en\" dir=\"ltr\">CVR<\/div><div class=\"tw\"><table><tr><th><div class=\"cp\"><b>العبارة<\/b><\/div><\/th><th><div class=\"cp\"><b>عدد من قال «أساسية»<\/b><\/div><\/th><th><div class=\"cp\"><b>نسبة صدق المحتوى<\/b><\/div><div class=\"cp\">CVR<\/div><\/th><th><div class=\"cp\"><b>القرار<\/b><\/div><\/th><\/tr><tr><td><div class=\"cp\">1<\/div><\/td><td><div class=\"cp\">10<\/div><\/td><td><div class=\"cp\">1.00<\/div><\/td><td><div class=\"cp\">تُقبل<\/div><\/td><\/tr><tr><td><div class=\"cp\">2<\/div><\/td><td><div class=\"cp\">9<\/div><\/td><td><div class=\"cp\">0.80<\/div><\/td><td><div class=\"cp\">تُقبل<\/div><\/td><\/tr><tr><td><div class=\"cp\">3<\/div><\/td><td><div class=\"cp\">9<\/div><\/td><td><div class=\"cp\">0.80<\/div><\/td><td><div class=\"cp\">تُقبل<\/div><\/td><\/tr><tr><td><div class=\"cp\">4<\/div><\/td><td><div class=\"cp\">8<\/div><\/td><td><div class=\"cp\">0.60<\/div><\/td><td><div class=\"cp\"><b>تُعدّل وتُعاد للتحكيم<\/b><\/div><\/td><\/tr><tr><td><div class=\"cp\">5<\/div><\/td><td><div class=\"cp\">10<\/div><\/td><td><div class=\"cp\">1.00<\/div><\/td><td><div class=\"cp\">تُقبل<\/div><\/td><\/tr><tr><td><div class=\"cp\">6<\/div><\/td><td><div class=\"cp\">6<\/div><\/td><td><div class=\"cp\">0.20<\/div><\/td><td><div class=\"cp\"><b>تُحذف<\/b><\/div><\/td><\/tr><tr><td><div class=\"cp\">7<\/div><\/td><td><div class=\"cp\">9<\/div><\/td><td><div class=\"cp\">0.80<\/div><\/td><td><div class=\"cp\">تُقبل<\/div><\/td><\/tr><tr><td><div class=\"cp\">8<\/div><\/td><td><div class=\"cp\">10<\/div><\/td><td><div class=\"cp\">1.00<\/div><\/td><td><div class=\"cp\">تُقبل<\/div><\/td><\/tr><tr><td><div class=\"cp\">9<\/div><\/td><td><div class=\"cp\">7<\/div><\/td><td><div class=\"cp\">0.40<\/div><\/td><td><div class=\"cp\"><b>تُحذف<\/b><\/div><\/td><\/tr><tr><td><div class=\"cp\">10<\/div><\/td><td><div class=\"cp\">9<\/div><\/td><td><div class=\"cp\">0.80<\/div><\/td><td><div class=\"cp\">تُقبل<\/div><\/td><\/tr><tr><td><div class=\"cp\">11<\/div><\/td><td><div class=\"cp\">8<\/div><\/td><td><div class=\"cp\">0.60<\/div><\/td><td><div class=\"cp\"><b>تُعدّل<\/b><\/div><\/td><\/tr><tr><td><div class=\"cp\">12<\/div><\/td><td><div class=\"cp\">5<\/div><\/td><td><div class=\"cp\">0.00<\/div><\/td><td><div class=\"cp\"><b>تُحذف<\/b><\/div><\/td><\/tr><\/table><\/div><ul><li><b>ملاحظة:<\/b> حذف العبارة 6 (السالبة الوحيدة في بعد إدارة الوقت) يستوجب صياغة عبارة سالبة بديلة للحفاظ على توازن الاتجاه — وهذا ما يقصده الكتاب بأن القرار لا يكون آليًا.<\/li><li><b>المقابلات المعرفية (الخطوة 8):<\/b> طُلب من 8 طلاب التفكير بصوت عالٍ؛ تبيّن أن العبارة 8 «مزدوجة» (تعدد المهام + التعطل) فقُسّمت.<\/li><\/ul>"}, {"title": "11.5 الخطوة 9: الدراسة الاستطلاعية وتحليل العبارات", "en": "", "html": "<p>Pilot &amp; Item Analysis<\/p><p>عينة استطلاعية (ن = 150). عينة من النتائج:<\/p><div class=\"tw\"><table><tr><th><div class=\"cp\"><b>العبارة<\/b><\/div><\/th><th><div class=\"cp\"><b>المتوسط<\/b><\/div><\/th><th><div class=\"cp\"><b>الانحراف<\/b><\/div><\/th><th><div class=\"cp\"><b>الارتباط المصحح<\/b><\/div><\/th><th><div class=\"cp\"><b>t للطرفيتين (27%)<\/b><\/div><\/th><th><div class=\"cp\"><b>ألفا عند الحذف<\/b><\/div><\/th><th><div class=\"cp\"><b>القرار<\/b><\/div><\/th><\/tr><tr><td><div class=\"cp\">1<\/div><\/td><td><div class=\"cp\">3.42<\/div><\/td><td><div class=\"cp\">1.10<\/div><\/td><td><div class=\"cp\">0.61<\/div><\/td><td><div class=\"cp\">9.8<\/div><\/td><td><div class=\"cp\">0.84<\/div><\/td><td><div class=\"cp\">تبقى<\/div><\/td><\/tr><tr><td><div class=\"cp\">2 (معكوسة)<\/div><\/td><td><div class=\"cp\">2.95<\/div><\/td><td><div class=\"cp\">1.21<\/div><\/td><td><div class=\"cp\">0.22<\/div><\/td><td><div class=\"cp\">3.1<\/div><\/td><td><div class=\"cp\">0.87<\/div><\/td><td><div class=\"cp\"><b>تُراجع: ضعيفة<\/b><\/div><\/td><\/tr><tr><td><div class=\"cp\">3<\/div><\/td><td><div class=\"cp\">3.80<\/div><\/td><td><div class=\"cp\">0.98<\/div><\/td><td><div class=\"cp\">0.55<\/div><\/td><td><div class=\"cp\">8.7<\/div><\/td><td><div class=\"cp\">0.85<\/div><\/td><td><div class=\"cp\">تبقى<\/div><\/td><\/tr><tr><td><div class=\"cp\">5<\/div><\/td><td><div class=\"cp\">3.10<\/div><\/td><td><div class=\"cp\">1.05<\/div><\/td><td><div class=\"cp\">0.58<\/div><\/td><td><div class=\"cp\">9.1<\/div><\/td><td><div class=\"cp\">0.84<\/div><\/td><td><div class=\"cp\">تبقى<\/div><\/td><\/tr><tr><td><div class=\"cp\">7<\/div><\/td><td><div class=\"cp\">3.25<\/div><\/td><td><div class=\"cp\">1.12<\/div><\/td><td><div class=\"cp\">0.64<\/div><\/td><td><div class=\"cp\">10.4<\/div><\/td><td><div class=\"cp\">0.84<\/div><\/td><td><div class=\"cp\">تبقى<\/div><\/td><\/tr><tr><td><div class=\"cp\">10<\/div><\/td><td><div class=\"cp\">3.55<\/div><\/td><td><div class=\"cp\">1.03<\/div><\/td><td><div class=\"cp\">0.60<\/div><\/td><td><div class=\"cp\">9.5<\/div><\/td><td><div class=\"cp\">0.84<\/div><\/td><td><div class=\"cp\">تبقى<\/div><\/td><\/tr><\/table><\/div><ul><li><b>قراءة نقدية:<\/b> ضعف العبارة 2 المعكوسة يتسق مع الأدبيات عن مشكلات العبارات المعكوسة (فايترز وباومغارتنر, 2012) — فتُراجع صياغتها قبل الحذف.<div class=\"en\" dir=\"ltr\">Weijters &amp; Baumgartner, 2012<\/div><\/li><\/ul>"}, {"title": "11.6 الخطوة 10: البنية العاملية", "en": "", "html": "<p>Factor Structure<\/p><ul><li><b>عينة الاستكشاف (ن = 300):<\/b> مؤشر كايزر–ماير–أولكن = 0.88؛ اختبار بارتليت دال؛ التحليل الموازي يقترح <b>3 عوامل<\/b> تفسر 58% من التباين؛ التشبعات 0.48–0.79 بلا تشبعات متقاطعة &gt; 0.30.<div class=\"en\" dir=\"ltr\">KMO<\/div><\/li><li><b>عينة التوكيد المستقلة (ن = 400):<\/b> نموذج ثلاثي العوامل: مؤشر المطابقة المقارن = 0.96، مؤشر توكر–لويس = 0.95، جذر متوسط مربع خطأ الاقتراب = 0.051، جذر متوسط مربعات البواقي المعياري = 0.045 ← مطابقة جيدة.<div class=\"en\" dir=\"ltr\">CFI · TLI · RMSEA · SRMR<\/div><\/li><li><b>التكافؤ بين الجنسين:<\/b> شكلي ومتري وقياسي (فرق مؤشر المطابقة المقارن ≤ 0.01) ← يجوز مقارنة متوسطات الذكور والإناث.<div class=\"en\" dir=\"ltr\">ΔCFI<\/div><\/li><\/ul>"}, {"title": "11.7 الخطوة 11: الثبات والصدق الخارجي والعدالة", "en": "", "html": "<p>Reliability, Validity &amp; Fairness<\/p><div class=\"tw\"><table><tr><th><div class=\"cp\"><b>المؤشر<\/b><\/div><\/th><th><div class=\"cp\"><b>التأجيل<\/b><\/div><\/th><th><div class=\"cp\"><b>إدارة الوقت<\/b><\/div><\/th><th><div class=\"cp\"><b>القلق والتجنب<\/b><\/div><\/th><th><div class=\"cp\"><b>الكلي<\/b><\/div><\/th><\/tr><tr><td><div class=\"cp\">ألفا<\/div><\/td><td><div class=\"cp\">0.81<\/div><\/td><td><div class=\"cp\">0.78<\/div><\/td><td><div class=\"cp\">0.80<\/div><\/td><td><div class=\"cp\">0.88<\/div><\/td><\/tr><tr><td><div class=\"cp\">أوميغا<\/div><\/td><td><div class=\"cp\">0.82<\/div><\/td><td><div class=\"cp\">0.79<\/div><\/td><td><div class=\"cp\">0.81<\/div><\/td><td><div class=\"cp\">0.89<\/div><\/td><\/tr><tr><td><div class=\"cp\">إعادة التطبيق بعد أسبوعين (ن = 60)<\/div><\/td><td><div class=\"cp\">0.79<\/div><\/td><td><div class=\"cp\">0.76<\/div><\/td><td><div class=\"cp\">0.77<\/div><\/td><td><div class=\"cp\">0.84<\/div><\/td><\/tr><\/table><\/div><ul><li><b>صدق تقاربي:<\/b> ارتباط سالب مع مقياس لإدارة الذات (r = −0.52).<\/li><li><b>صدق تمييزي:<\/b> ارتباط ضعيف مع المرغوبية الاجتماعية (r = −0.14) ← تلوث محدود.<\/li><li><b>مجموعات متضادة:<\/b> متوسط مرتفعي التحصيل أقل دالًا من منخفضيه.<\/li><li><b>الأداء التفاضلي (الأداء التفاضلي للمفردة):<\/b> مفردة واحدة بفئة B ← رُوجع محتواها ثم أُبقيت بعد التعديل.<div class=\"en\" dir=\"ltr\">DIF<\/div><\/li><\/ul>"}, {"title": "11.8 الخطوة 12: المعايير والدليل", "en": "", "html": "<p>Norms &amp; Manual<\/p><div class=\"tw\"><table><tr><th><div class=\"cp\"><b>الدرجة الخام (12–60)<\/b><\/div><\/th><th><div class=\"cp\"><b>الدرجة التائية<\/b><\/div><\/th><th><div class=\"cp\"><b>المستوى الوصفي<\/b><\/div><\/th><\/tr><tr><td><div class=\"cp\">12–24<\/div><\/td><td><div class=\"cp\">أقل من 40<\/div><\/td><td><div class=\"cp\">منخفض<\/div><\/td><\/tr><tr><td><div class=\"cp\">25–40<\/div><\/td><td><div class=\"cp\">40–60<\/div><\/td><td><div class=\"cp\">متوسط<\/div><\/td><\/tr><tr><td><div class=\"cp\">41–60<\/div><\/td><td><div class=\"cp\">أكثر من 60<\/div><\/td><td><div class=\"cp\">مرتفع<\/div><\/td><\/tr><\/table><\/div><ul><li><b>تنبيه:<\/b> المستويات معيارية (بالنسبة لعينة التقنين)، لا تشخيصًا محكيًا (انظر 2.8).<\/li><li><b>دليل المقياس:<\/b> بالفهرس المقترح في 2.6.<\/li><\/ul><aside class=\"box opinion\"><div class=\"bt\">رأي الباحث: ما الذي يجعل هذا المثال «قويًا»؟<\/div><p>لأنه يجمع ما أوصت به الأدبيات وما تُرك في البحثين: مرحلة كيفية في التوليد، ومقابلات معرفية، وفصل عينة الاستكشاف عن التوكيد، وأوميغا مع ألفا، وفحص المرغوبية كصدق تمييزي، والأداء التفاضلي للمفردة بحجم أثر، وتكافؤ بين الجنسين قبل المقارنة.<\/p><div class=\"en\" dir=\"ltr\">DIF<\/div><\/aside>"}]}, "p12": {"key": "p12", "no": 12, "title": "جداول جامعة — الصدق والثبات، والنظريتان الكلاسيكية والحديثة", "en": "Summary Tables", "sections": [{"title": "12.1 أنواع الصدق", "en": "", "html": "<p>Types of Validity Evidence<\/p><div class=\"tw\"><table><tr><th><div class=\"cp\"><b>نوع الصدق<\/b><\/div><\/th><th><div class=\"cp\"><b>التعريف<\/b><\/div><\/th><th><div class=\"cp\"><b>كيف يُقدَّر<\/b><\/div><\/th><th><div class=\"cp\"><b>المؤشر/المحك<\/b><\/div><\/th><th><div class=\"cp\"><b>العلماء<\/b><\/div><\/th><\/tr><tr><td><div class=\"cp\">الصدق الظاهري<\/div><div class=\"en\" dir=\"ltr\">Face Validity<\/div><\/td><td><div class=\"cp\">ما يبدو للمفحوصين والمستخدمين أن الأداة تقيسه<\/div><\/td><td><div class=\"cp\">آراء المفحوصين والمستخدمين<\/div><\/td><td><div class=\"cp\">حكم كيفي؛ ليس دليلًا كافيًا<\/div><\/td><td><div class=\"cp\">—<\/div><\/td><\/tr><tr><td><div class=\"cp\">صدق المحتوى<\/div><div class=\"en\" dir=\"ltr\">Content Validity<\/div><\/td><td><div class=\"cp\">مدى تمثيل العبارات لمجال السمة كله<\/div><\/td><td><div class=\"cp\">تحكيم خبراء + جدول مواصفات<\/div><\/td><td><div class=\"cp\">نسبة صدق المحتوى، مؤشر صدق المحتوى للمفردة، مؤشر صدق المحتوى للمقياس ككل، معامل V<\/div><div class=\"en\" dir=\"ltr\">CVR · I-CVI · S-CVI<\/div><\/td><td><div class=\"cp\">لوشي؛ لين؛ بوليت وبيك؛ أيكن<\/div><div class=\"en\" dir=\"ltr\">Lawshe; Lynn; Polit &amp; Beck; Aiken<\/div><\/td><\/tr><tr><td><div class=\"cp\">صدق البناء العاملي<\/div><div class=\"en\" dir=\"ltr\">Structural Validity<\/div><\/td><td><div class=\"cp\">مطابقة بنية الأبعاد للنموذج النظري<\/div><\/td><td><div class=\"cp\">تحليل عاملي استكشافي ثم توكيدي<\/div><\/td><td><div class=\"cp\">مؤشر كايزر–ماير–أولكن، التشبعات، مؤشر المطابقة المقارن، مؤشر توكر–لويس، جذر متوسط مربع خطأ الاقتراب، جذر متوسط مربعات البواقي المعياري<\/div><div class=\"en\" dir=\"ltr\">KMO · CFI · TLI · RMSEA · SRMR<\/div><\/td><td><div class=\"cp\">كايزر؛ كاتل؛ هورن؛ هو وبنتلر<\/div><div class=\"en\" dir=\"ltr\">Kaiser; Cattell; Horn; Hu &amp; Bentler<\/div><\/td><\/tr><tr><td><div class=\"cp\">الصدق التقاربي<\/div><div class=\"en\" dir=\"ltr\">Convergent Validity<\/div><\/td><td><div class=\"cp\">ارتباط المقياس بمقاييس لنفس السمة<\/div><\/td><td><div class=\"cp\">ارتباط بمقياس معتمد<\/div><\/td><td><div class=\"cp\">ارتباط مرتفع؛ متوسط التباين المستخلص ≥ 0.50<\/div><div class=\"en\" dir=\"ltr\">AVE<\/div><\/td><td><div class=\"cp\">كامبل وفيسك؛ فورنل ولاركر<\/div><div class=\"en\" dir=\"ltr\">Campbell &amp; Fiske; Fornell &amp; Larcker<\/div><\/td><\/tr><tr><td><div class=\"cp\">الصدق التمييزي<\/div><div class=\"en\" dir=\"ltr\">Discriminant Validity<\/div><\/td><td><div class=\"cp\">ضعف الارتباط بسمات مختلفة نظريًا<\/div><\/td><td><div class=\"cp\">مصفوفة السمات والطرق المتعددة؛ نسبة السمات المتغايرة-الأحادية<\/div><div class=\"en\" dir=\"ltr\">HTMT<\/div><\/td><td><div class=\"cp\">ارتباط منخفض؛ نسبة السمات المتغايرة-الأحادية &lt; 0.85<\/div><div class=\"en\" dir=\"ltr\">HTMT<\/div><\/td><td><div class=\"cp\">كامبل وفيسك (1959)<\/div><div class=\"en\" dir=\"ltr\">Campbell &amp; Fiske, 1959<\/div><\/td><\/tr><tr><td><div class=\"cp\">الصدق المحكي التلازمي<\/div><div class=\"en\" dir=\"ltr\">Concurrent Validity<\/div><\/td><td><div class=\"cp\">ارتباط الدرجة بمحك يقاس في الوقت نفسه<\/div><\/td><td><div class=\"cp\">ارتباط بمحك خارجي<\/div><\/td><td><div class=\"cp\">معامل الارتباط<\/div><\/td><td><div class=\"cp\">—<\/div><\/td><\/tr><tr><td><div class=\"cp\">الصدق التنبؤي<\/div><div class=\"en\" dir=\"ltr\">Predictive Validity<\/div><\/td><td><div class=\"cp\">قدرة الدرجة على التنبؤ بمحك مستقبلي<\/div><\/td><td><div class=\"cp\">ارتباط/انحدار مع محك لاحق<\/div><\/td><td><div class=\"cp\">معامل الصدق<\/div><\/td><td><div class=\"cp\">—<\/div><\/td><\/tr><tr><td><div class=\"cp\">صدق المجموعات المتضادة (المجموعات المعروفة)<\/div><div class=\"en\" dir=\"ltr\">Known-Groups<\/div><\/td><td><div class=\"cp\">تمييز المقياس بين مجموعات معروفة الاختلاف<\/div><\/td><td><div class=\"cp\">اختبار t أو تحليل التباين<\/div><\/td><td><div class=\"cp\">دلالة الفروق وحجم الأثر<\/div><\/td><td><div class=\"cp\">—<\/div><\/td><\/tr><tr><td><div class=\"cp\">الصدق الوظيفي/صدق القرار<\/div><div class=\"en\" dir=\"ltr\">Decision Validity<\/div><\/td><td><div class=\"cp\">دقة القرارات المبنية على الدرجة<\/div><\/td><td><div class=\"cp\">جداول التصنيف، منحنى خصائص التشغيل<\/div><div class=\"en\" dir=\"ltr\">ROC<\/div><\/td><td><div class=\"cp\">الحساسية والنوعية<\/div><\/td><td><div class=\"cp\">الكتاب (ص 75–89)<\/div><\/td><\/tr><tr><td><div class=\"cp\">صدق العواقب<\/div><div class=\"en\" dir=\"ltr\">Consequential Validity<\/div><\/td><td><div class=\"cp\">آثار استخدام الدرجات وقراراتها<\/div><\/td><td><div class=\"cp\">تحليل الآثار المقصودة وغير المقصودة<\/div><\/td><td><div class=\"cp\">حكم مبرر<\/div><\/td><td><div class=\"cp\">ميسيك (1995)<\/div><div class=\"en\" dir=\"ltr\">Messick, 1995<\/div><\/td><\/tr><tr><td><div class=\"cp\">العدالة<\/div><div class=\"en\" dir=\"ltr\">Fairness / DIF / Invariance<\/div><\/td><td><div class=\"cp\">تكافؤ القياس بين المجموعات<\/div><\/td><td><div class=\"cp\">مانتل–هانزل، انحدار لوجستي، تكافؤ عاملي<\/div><\/td><td><div class=\"cp\">فئة A لدى هيئة الاختبارات/B/C؛ Δفرق مؤشر المطابقة المقارن ≤ 0.01<\/div><div class=\"en\" dir=\"ltr\">ETS A/B/C · CFI<\/div><\/td><td><div class=\"cp\">هولاند وثاير؛ زومبو؛ ميريديث<\/div><div class=\"en\" dir=\"ltr\">Holland &amp; Thayer; Zumbo; Meredith<\/div><\/td><\/tr><\/table><\/div><aside class=\"box note\"><div class=\"bt\">ملاحظة: الإطار الموحد للصدق<\/div><p>في المعايير المهنية الحديثة (الجمعية الأمريكية للبحث التربوي والجمعية الأمريكية لعلم النفس والمجلس القومي للقياس في التربية, 2014) لم يعد الصدق «أنواعًا» منفصلة، بل <b>مصادر أدلة<\/b> على صحة تفسير الدرجة: المحتوى، وعمليات الاستجابة، والبنية الداخلية، والعلاقات بمتغيرات أخرى، والعواقب.<\/p><div class=\"en\" dir=\"ltr\">AERA, APA &amp; NCME, 2014<\/div><\/aside>"}, {"title": "12.2 أنواع الثبات", "en": "", "html": "<p>Types of Reliability<\/p><div class=\"tw\"><table><tr><th><div class=\"cp\"><b>نوع الثبات<\/b><\/div><\/th><th><div class=\"cp\"><b>ماذا يقيس<\/b><\/div><\/th><th><div class=\"cp\"><b>المعادلة/الطريقة<\/b><\/div><\/th><th><div class=\"cp\"><b>المحك المتداول<\/b><\/div><\/th><th><div class=\"cp\"><b>متى يُستخدم<\/b><\/div><\/th><\/tr><tr><td><div class=\"cp\">الاتساق الداخلي — ألفا<\/div><div class=\"en\" dir=\"ltr\">Cronbach's Alpha<\/div><\/td><td><div class=\"cp\">تجانس العبارات<\/div><\/td><td><div class=\"cp\">α = [k/(k−1)][1 − Σع²ᵢ/ع²ₓ]<\/div><\/td><td><div class=\"cp\">≥ 0.70<\/div><\/td><td><div class=\"cp\">مقاييس ليكرت أحادية البعد<\/div><\/td><\/tr><tr><td><div class=\"cp\">أوميغا<\/div><div class=\"en\" dir=\"ltr\">McDonald's Omega<\/div><\/td><td><div class=\"cp\">الاتساق مع تشبعات غير متساوية<\/div><\/td><td><div class=\"cp\">ω = (Σλ)²/[(Σλ)² + Σθ]<\/div><\/td><td><div class=\"cp\">≥ 0.70<\/div><\/td><td><div class=\"cp\">الأفضل مع التحليل العاملي التوكيدي<\/div><div class=\"en\" dir=\"ltr\">CFA<\/div><\/td><\/tr><tr><td><div class=\"cp\">كودر–ريتشاردسون 20 (معادلة كودر–ريتشاردسون 20)<\/div><div class=\"en\" dir=\"ltr\">KR-20<\/div><\/td><td><div class=\"cp\">الاتساق للعبارات الثنائية<\/div><\/td><td><div class=\"cp\">معادلة كودر–ريتشاردسون 20 = [k/(k−1)][1 − Σpq/ع²]<\/div><div class=\"en\" dir=\"ltr\">KR-20 = [k/(k−1)][1 − Σpq<\/div><\/td><td><div class=\"cp\">≥ 0.70<\/div><\/td><td><div class=\"cp\">صواب/خطأ، نعم/لا<\/div><\/td><\/tr><tr><td><div class=\"cp\">التجزئة النصفية<\/div><div class=\"en\" dir=\"ltr\">Split-Half<\/div><\/td><td><div class=\"cp\">تكافؤ نصفي المقياس<\/div><\/td><td><div class=\"cp\">سبيرمان–براون 2r/(1+r) أو جتمان<\/div><\/td><td><div class=\"cp\">≥ 0.70<\/div><\/td><td><div class=\"cp\">تطبيق واحد<\/div><\/td><\/tr><tr><td><div class=\"cp\">إعادة التطبيق<\/div><div class=\"en\" dir=\"ltr\">Test–Retest<\/div><\/td><td><div class=\"cp\">استقرار الدرجات عبر الزمن<\/div><\/td><td><div class=\"cp\">ارتباط بيرسون أو معامل الارتباط داخل الفئة<\/div><div class=\"en\" dir=\"ltr\">ICC<\/div><\/td><td><div class=\"cp\">≥ 0.70<\/div><\/td><td><div class=\"cp\">السمات المستقرة<\/div><\/td><\/tr><tr><td><div class=\"cp\">الصور المتكافئة<\/div><div class=\"en\" dir=\"ltr\">Parallel Forms<\/div><\/td><td><div class=\"cp\">تكافؤ صورتين<\/div><\/td><td><div class=\"cp\">ارتباط الصورتين<\/div><\/td><td><div class=\"cp\">≥ 0.80<\/div><\/td><td><div class=\"cp\">عند الحاجة لصورتين<\/div><\/td><\/tr><tr><td><div class=\"cp\">اتفاق المقدّرين (الاتفاق بين المقدّرين)<\/div><div class=\"en\" dir=\"ltr\">Inter-Rater<\/div><\/td><td><div class=\"cp\">اتفاق الملاحظين أو المصححين<\/div><\/td><td><div class=\"cp\">كابا، معامل الارتباط داخل الفئة، ألفا كريبندورف<\/div><div class=\"en\" dir=\"ltr\">ICC<\/div><\/td><td><div class=\"cp\">κ ≥ 0.61 جيد<\/div><\/td><td><div class=\"cp\">مقاييس التقدير والملاحظة<\/div><\/td><\/tr><tr><td><div class=\"cp\">ثبات الأفراد والمفردات<\/div><div class=\"en\" dir=\"ltr\">Rasch Reliability<\/div><\/td><td><div class=\"cp\">دقة تقدير مواقع الأفراد والمفردات<\/div><\/td><td><div class=\"cp\">برنامج وينستبس: الثبات + معامل الفصل<\/div><div class=\"en\" dir=\"ltr\">Winsteps<\/div><\/td><td><div class=\"cp\">فصل &gt; 2<\/div><\/td><td><div class=\"cp\">نموذج راش<\/div><\/td><\/tr><tr><td><div class=\"cp\">اتساق القرار<\/div><div class=\"en\" dir=\"ltr\">Decision Consistency<\/div><\/td><td><div class=\"cp\">استقرار التصنيف حول درجة القطع<\/div><\/td><td><div class=\"cp\">نسبة الاتفاق P وكابا<\/div><\/td><td><div class=\"cp\">حسب أهمية القرار<\/div><\/td><td><div class=\"cp\">الاختبارات المحكية (الكتاب)<\/div><\/td><\/tr><tr><td><div class=\"cp\">الخطأ المعياري للقياس<\/div><div class=\"en\" dir=\"ltr\">SEM<\/div><\/td><td><div class=\"cp\">هامش الخطأ حول الدرجة الفردية<\/div><\/td><td><div class=\"cp\">الخطأ المعياري للقياس = ع√(1 − r)<\/div><div class=\"en\" dir=\"ltr\">SEM<\/div><\/td><td><div class=\"cp\">كلما صغر كان أفضل<\/div><\/td><td><div class=\"cp\">تفسير درجات الأفراد<\/div><\/td><\/tr><\/table><\/div>"}, {"title": "12.3 النظرية الكلاسيكية مقابل نظرية الاستجابة للمفردة", "en": "", "html": "<p>CTT vs IRT<\/p><div class=\"tw\"><table><tr><th><div class=\"cp\"><b>وجه المقارنة<\/b><\/div><\/th><th><div class=\"cp\"><b>النظرية الكلاسيكية<\/b><\/div><div class=\"cp\">Classical Test Theory<\/div><\/th><th><div class=\"cp\"><b>نظرية الاستجابة للمفردة<\/b><\/div><div class=\"cp\">Item Response Theory<\/div><\/th><\/tr><tr><td><div class=\"cp\">النموذج الأساسي<\/div><\/td><td><div class=\"cp\">الدرجة الملاحظة = الحقيقية + الخطأ<\/div><\/td><td><div class=\"cp\">احتمال الاستجابة دالة لمستوى السمة وخصائص المفردة<\/div><\/td><\/tr><tr><td><div class=\"cp\">وحدة التحليل<\/div><\/td><td><div class=\"cp\">الاختبار ككل<\/div><\/td><td><div class=\"cp\">المفردة<\/div><\/td><\/tr><tr><td><div class=\"cp\">خصائص المفردات<\/div><\/td><td><div class=\"cp\">تتوقف على العينة (الصعوبة والتمييز يتغيران بتغيرها)<\/div><\/td><td><div class=\"cp\">ثابتة نسبيًا عبر العينات (عند مطابقة النموذج)<\/div><\/td><\/tr><tr><td><div class=\"cp\">تقدير قدرة الفرد<\/div><\/td><td><div class=\"cp\">يتوقف على الاختبار المستخدم<\/div><\/td><td><div class=\"cp\">مستقل نسبيًا عن المفردات (الموضوعية النوعية في راش)<\/div><\/td><\/tr><tr><td><div class=\"cp\">خطأ القياس<\/div><\/td><td><div class=\"cp\">واحد لجميع الأفراد<\/div><\/td><td><div class=\"cp\">يختلف باختلاف مستوى السمة (دالة المعلومات)<\/div><\/td><\/tr><tr><td><div class=\"cp\">وحدة القياس<\/div><\/td><td><div class=\"cp\">درجات خام رتبية في جوهرها<\/div><\/td><td><div class=\"cp\">لوجيت على متصل فئوي<\/div><\/td><\/tr><tr><td><div class=\"cp\">الافتراضات<\/div><\/td><td><div class=\"cp\">ضعيفة نسبيًا<\/div><\/td><td><div class=\"cp\">أحادية البعد، الاستقلال الموضعي، مطابقة النموذج<\/div><\/td><\/tr><tr><td><div class=\"cp\">حجم العينة<\/div><\/td><td><div class=\"cp\">صغير إلى متوسط يكفي<\/div><\/td><td><div class=\"cp\">أكبر (خصوصًا للنماذج ثنائية وثلاثية المعلم)<\/div><\/td><\/tr><tr><td><div class=\"cp\">تطبيقات مميزة<\/div><\/td><td><div class=\"cp\">ألفا، الارتباط بالكلي، تحليل عاملي<\/div><\/td><td><div class=\"cp\">بنوك الأسئلة، الاختبار التكيفي، الأداء التفاضلي للمفردة، معادلة الاختبارات<\/div><div class=\"en\" dir=\"ltr\">DIF<\/div><\/td><\/tr><tr><td><div class=\"cp\">مثال من بحثي «الأداء التفاضلي لنوع الطالب على مقياس الاتزان الانفعالي» و«المرغوبية الاجتماعية وعلاقتها بالذكاء العاطفي»<\/div><\/td><td><div class=\"cp\">القائمة المتوازنة للاستجابة المرغوبة اجتماعيًا: التحليل العاملي التوكيدي وألفا (بحث «المرغوبية الاجتماعية وعلاقتها بالذكاء العاطفي»)<\/div><div class=\"en\" dir=\"ltr\">BIDR: CFA<\/div><\/td><td><div class=\"cp\">مقياس الاتزان الانفعالي: نموذج سلم التقدير والأداء التفاضلي للمفردة (بحث «الأداء التفاضلي لنوع الطالب على مقياس الاتزان الانفعالي»)<\/div><div class=\"en\" dir=\"ltr\">DIF<\/div><\/td><\/tr><tr><td><div class=\"cp\">النقد كما ورد في بحث «الأداء التفاضلي لنوع الطالب على مقياس الاتزان الانفعالي» (ص 363)<\/div><\/td><td><div class=\"cp\">ضعف الموضوعية، غياب وحدة ثابتة، تساوي الخطأ، افتراض الخطية<\/div><\/td><td><div class=\"cp\">—<\/div><\/td><\/tr><\/table><\/div>"}, {"title": "12.4 نماذج نظرية الاستجابة للمفردة الشائعة", "en": "", "html": "<p>Common IRT Models · IRT<\/p><div class=\"tw\"><table><tr><th><div class=\"cp\"><b>النموذج<\/b><\/div><\/th><th><div class=\"cp\"><b>المعالم<\/b><\/div><\/th><th><div class=\"cp\"><b>نوع الاستجابة<\/b><\/div><\/th><th><div class=\"cp\"><b>ملاحظات<\/b><\/div><\/th><\/tr><tr><td><div class=\"cp\">نموذج راش / أحادي المعلم 1المعلمة<\/div><div class=\"en\" dir=\"ltr\">Rasch · PL<\/div><\/td><td><div class=\"cp\">الصعوبة فقط<\/div><\/td><td><div class=\"cp\">ثنائية<\/div><\/td><td><div class=\"cp\">الموضوعية النوعية<\/div><\/td><\/tr><tr><td><div class=\"cp\">ثنائي المعلم 2المعلمة<\/div><div class=\"en\" dir=\"ltr\">PL<\/div><\/td><td><div class=\"cp\">الصعوبة + التمييز<\/div><\/td><td><div class=\"cp\">ثنائية<\/div><\/td><td><div class=\"cp\">—<\/div><\/td><\/tr><tr><td><div class=\"cp\">ثلاثي المعلم 3المعلمة<\/div><div class=\"en\" dir=\"ltr\">PL<\/div><\/td><td><div class=\"cp\">الصعوبة + التمييز + التخمين<\/div><\/td><td><div class=\"cp\">ثنائية (اختيار من متعدد)<\/div><\/td><td><div class=\"cp\">التخمين — يقابل نقاش الكتاب عن التخمين (ص 31–33)<\/div><\/td><\/tr><tr><td><div class=\"cp\">نموذج سلم التقدير لأندريش<\/div><div class=\"en\" dir=\"ltr\">Andrich Rating Scale Model<\/div><\/td><td><div class=\"cp\">صعوبة المفردة + عتبات مشتركة<\/div><\/td><td><div class=\"cp\">متعددة (ليكرت)<\/div><\/td><td><div class=\"cp\">المستخدم في بحث «الأداء التفاضلي لنوع الطالب على مقياس الاتزان الانفعالي»<\/div><\/td><\/tr><tr><td><div class=\"cp\">نموذج التقدير الجزئي<\/div><div class=\"en\" dir=\"ltr\">Partial Credit Model<\/div><\/td><td><div class=\"cp\">عتبات خاصة بكل مفردة<\/div><\/td><td><div class=\"cp\">متعددة<\/div><\/td><td><div class=\"cp\">—<\/div><\/td><\/tr><tr><td><div class=\"cp\">نموذج الاستجابة المتدرجة<\/div><div class=\"en\" dir=\"ltr\">Graded Response Model<\/div><\/td><td><div class=\"cp\">تمييز + عتبات<\/div><\/td><td><div class=\"cp\">متعددة<\/div><\/td><td><div class=\"cp\">سيميجيما (ساميجيما)<\/div><div class=\"en\" dir=\"ltr\">Samejima<\/div><\/td><\/tr><\/table><\/div>"}]}, "p13": {"key": "p13", "no": 13, "title": "الاتجاهات الحديثة في القياس النفسي", "en": "Contemporary Trends", "sections": [{"title": "13.1 الاختبار التكيفي المحوسب", "en": "", "html": "<p>Computerized Adaptive Testing — CAT<\/p><ul><li><b>الفكرة:<\/b> يختار الحاسوب المفردة التالية بحسب تقدير مستوى المفحوص من إجاباته السابقة، اعتمادًا على بنك مفردات مدرّج بنظرية الاستجابة للمفردة.<\/li><li><b>المزايا:<\/b> عدد مفردات أقل بدقة أعلى، وتقليل الملل والتعب.<\/li><li><b>الشرط:<\/b> بنك مفردات كبير معاير ومتحرر من الأداء التفاضلي — وهو ما يمهد له بحث «الأداء التفاضلي لنوع الطالب على مقياس الاتزان الانفعالي» (التدريج بـ نظرية الاستجابة للمفردة + الأداء التفاضلي للمفردة). ومن أشهر تطبيقاته في الصحة النفسية نظام قياس النتائج المُبلّغ عنها من المريض (نظام قياس النتائج المبلغ عنها من المريض).<div class=\"en\" dir=\"ltr\">PROMIS · IRT + DIF<\/div><\/li><\/ul>"}, {"title": "13.2 المقاييس الإلكترونية والتطبيق عبر الإنترنت", "en": "", "html": "<p>Online &amp; Digital Assessment<\/p><ul><li><b>القضية المنهجية:<\/b> هل الصورة الإلكترونية مكافئة للورقية؟ يلزم <b>فحص التكافؤ القياسي بين الطريقتين<\/b> — وهو أحد البحوث المقترحة في بحث «الأداء التفاضلي لنوع الطالب على مقياس الاتزان الانفعالي» (ص 388).<div class=\"en\" dir=\"ltr\">Mode Invariance<\/div><\/li><li><b>مخاطر:<\/b> الاستجابة المهملة، والعينات غير الممثلة، والخصوصية.<div class=\"en\" dir=\"ltr\">Careless Responding<\/div><\/li><\/ul>"}, {"title": "13.3 القياس اللحظي البيئي", "en": "", "html": "<p>Ecological Momentary Assessment — EMA<\/p><ul><li>قياس الحالة النفسية عدة مرات يوميًا في الحياة الواقعية عبر الهاتف بدل الاستدعاء الماضي؛ يقلل تحيز الذاكرة.<\/li><li>مثال: دراسة أوزييل وشميت-باراد (2023) لإدارة الانطباع على مدى 10 أيام × 3 مرات يوميًا.<div class=\"en\" dir=\"ltr\">Uziel &amp; Schmidt-Barad, 2023<\/div><\/li><\/ul>"}, {"title": "13.4 القياس الشبكي", "en": "", "html": "<p>Network Psychometrics<\/p><ul><li>بدل افتراض سمة كامنة تسبب الأعراض، تُنمذج الأعراض/العبارات شبكةً من التأثيرات المتبادلة؛ يغيّر طريقة فهم «البناء» وصدقه.<\/li><\/ul>"}, {"title": "13.5 نمذجة أساليب الاستجابة", "en": "", "html": "<p>Response-Style Modeling<\/p><ul><li>نماذج شجرية لنظرية الاستجابة للمفردة (شجرة الاستجابة للمفردة) ونماذج مختلطة لفصل السمة عن الموافقة والتطرف؛ امتداد مباشر لموضوع «الحد من الذاتية» (الفصل الرابع).<div class=\"en\" dir=\"ltr\">IRTree<\/div><\/li><\/ul>"}, {"title": "13.6 الذكاء الاصطناعي في بناء المقاييس", "en": "", "html": "<p>AI-Assisted Scale Development<\/p><ul><li>توليد مجمّعات عبارات أولية بالنماذج اللغوية، والتحقق الآلي من صياغة العبارات وتكرارها، والتنبؤ بخصائص العبارات قبل التطبيق.<\/li><li><b>تحفظات:<\/b> لا يغني عن تحكيم الخبراء والمقابلات المعرفية والتحقق التجريبي؛ وأخطار التحيز الثقافي في النماذج المدربة على لغات أخرى.<\/li><\/ul>"}, {"title": "13.7 العلم المفتوح وممارسات القياس المشكوك فيها", "en": "", "html": "<p>Open Science &amp; Questionable Measurement Practices<\/p><ul><li>ينبّه فليك وفريد (2020) إلى ممارسات قياس مشكوك فيها (تعديل المقاييس دون إفصاح، الاكتفاء بألفا)، ويدعو العلم المفتوح إلى <b>التسجيل المسبق<\/b> ونشر البيانات والمفاتيح.<div class=\"en\" dir=\"ltr\">Flake &amp; Fried, 2020<\/div><\/li><li>ويقدم هوسي وهيوز (هسي وهيوز, 2020) دليلًا على «عدم الصدق الخفي» في مقاييس شائعة (انظر 8.2).<div class=\"en\" dir=\"ltr\">Hussey &amp; Hughes, 2020<\/div><\/li><\/ul><aside class=\"box opinion\"><div class=\"bt\">رأي الباحث: رأيي كباحث<\/div><p>أرى أن أقرب هذه الاتجاهات إلى بيئتنا البحثية وأكثرها جدوى الآن: <b>التكافؤ بين الصورتين الورقية والإلكترونية<\/b>، و<b>نمذجة أساليب الاستجابة<\/b> للحد من الذاتية، و<b>بنوك المفردات المعايرة بـ نظرية الاستجابة للمفردة<\/b> تمهيدًا للاختبار التكيفي — وهي امتداد طبيعي للبحوث المحلية في التدريج والأداء التفاضلي.<\/p><div class=\"en\" dir=\"ltr\">IRT<\/div><\/aside>"}]}, "p14": {"key": "p14", "no": 14, "title": "بنك الأسئلة المتوقعة الشامل", "en": "Comprehensive Question Bank", "sections": [{"title": "14.1 المفاهيم (الجزء الأول)", "en": "", "html": "<ul><li><b>عرّف القياس اصطلاحيًا.<\/b> تعيين أعداد للأشياء أو الأحداث وفق قواعد (ستيفنز، 1946)؛ وأضاف نانالي وبرنستين التدريج والتصنيف. ← 1.1<\/li><li><b>ما الفرق بين التقييم والتقويم؟<\/b> التقييم (Assessment) جمع المعلومات وتفسيرها للوصف والتشخيص، والتقويم حكم قيمي في ضوء معايير يتبعه قرار علاج أو تطوير. ← 1.4–1.5<div class=\"en\" dir=\"ltr\">Assessment · Evaluation<\/div><\/li><li><b>هل مقياس وكسلر مقياس أم اختبار؟<\/b> اختبار رغم الاسم؛ لأنه يقيس أداءً أقصى بإجابات صحيحة. ← 1.8<\/li><li><b>ما الأداء الأقصى والأداء المعتاد؟<\/b> تمييز كرونباخ: الأول أفضل ما يستطيعه الفرد (اختبارات)، والثاني ما يفعله عادة (مقاييس). ← 1.3<\/li><li><b>ما معاني كلمة المقياس؟<\/b> مستوى القياس، وأداة القياس، وسلم الدرجات المشتقة. ← 1.2<div class=\"en\" dir=\"ltr\">Scale<\/div><\/li><li><b>ما الفرق بين الاستبيان والمقياس؟<\/b> الاستبيان قد يجمع معلومات متفرقة بلا درجة كلية ولا سمة كامنة؛ المقياس عبارات متجانسة لسمة بدرجة لها صدق وثبات. ← 1.6<\/li><li><b>متى تصبح المقابلة أداة قياس؟<\/b> إذا قُننت أسئلتها ووُضع لها دليل تقدير وحُسب اتفاق المقدّرين. ← 1.6<\/li><\/ul>"}, {"title": "14.2 خطوات الإعداد (الجزء الثالث)", "en": "", "html": "<ul><li><b>اذكر مراحل بناء المقياس عند بواتينج وآخرين.<\/b> تطوير البنود، بناء المقياس، تقويمه — في تسع خطوات. ← 3.1<\/li><li><b>ما الفرق بين التوليد الاستنباطي والاستقرائي للعبارات؟<\/b> الأول من النظرية والمقاييس السابقة، والثاني من مقابلات وأسئلة مفتوحة مع الفئة المستهدفة (هينكن، 1995). ← 3.2<\/li><li><b>كيف تحسب نسبة صدق المحتوى؟<\/b> (ن الأساسية − ن/2) ÷ (ن/2)؛ والقيمة الحرجة تتغير بعدد المحكمين. ← 10.9<\/li><li><b>لماذا لا يكفي محك الجذر الكامن &gt; 1؟<\/b> لأنه يبالغ غالبًا في عدد العوامل؛ والتحليل الموازي (هورن، 1965) أدق. ← 3.2 (الخطوة 10)<\/li><li><b>لماذا نفصل عينة الاستكشاف عن عينة التوكيد؟<\/b> لأن التوكيد على العينة نفسها يرفع المطابقة زيفًا. ← 3.2<\/li><li><b>لماذا تُفضَّل أوميغا على ألفا؟<\/b> لأن ألفا تفترض تساوي التشبعات. ← 10.6<\/li><li><b>ما المقابلات المعرفية؟<\/b> تطبيق العبارات مع التفكير بصوت عالٍ لكشف سوء الفهم (ويليس، 2005). ← 3.2 (الخطوة 8)<\/li><li><b>ما خطوات التكييف الثقافي لمقياس أجنبي؟<\/b> ترجمة أمامية، توليف، ترجمة عكسية، لجنة خبراء، تجريب، توثيق (بيتون وآخرون، 2000)، ثم التحقق من التكافؤ. ← 3.2 (الخطوة 12)<\/li><\/ul>"}, {"title": "14.3 الحد من الذاتية (الجزء الرابع)", "en": "", "html": "<ul><li><b>ما الفرق بين خداع الذات وإدارة الانطباع؟<\/b> الأول لا واعٍ (يصدّق الفرد صورته الإيجابية)، والثاني واعٍ ومقصود (باولهس، 1984). ← 4.1، 7.2<\/li><li><b>هل ضبط المرغوبية إحصائيًا يحسن الصدق دائمًا؟<\/b> لا؛ قد يحذف تباينًا حقيقيًا (ماكري وكوستا 1983؛ أونز وآخرون 1996؛ أوزييل 2010). ← 4.5<\/li><li><b>هل العبارات السالبة حل لمشكلة الموافقة المنهجية؟<\/b> تساعد لكنها قد تخفض الثبات وتخلق عاملًا منهجيًا؛ تُستخدم بحذر وتُفحص. ← 4.3<\/li><li><b>ما تحيز الطريقة المشتركة وكيف تحد منه؟<\/b> تباين مصدره الأداة الواحدة؛ يُحد منه بمصادر متعددة وفصل زمني وعامل طريقة في التحليل العاملي التوكيدي. ← 4.3<div class=\"en\" dir=\"ltr\">CFA<\/div><\/li><li><b>ما الفرق بين الأداء التفاضلي والتحيز؟<\/b> الأداء التفاضلي إشارة إحصائية، والتحيز حكم يحتاج تفسيرًا محتوائيًا. ← 4.3<\/li><li><b>ما التعمية في التصحيح ومن أين جاءت في المادة؟<\/b> إخفاء معلومات المجموعات عن المصححين وخلط الأوراق بترميز مستقل (الكتاب ص 148–149). ← 4.2<\/li><\/ul>"}, {"title": "14.4 المدرسة البنائية (الجزء الخامس)", "en": "", "html": "<ul><li><b>ما الفرق بين البنائية والبنيوية؟<\/b> البنائية نظرية تعلم (بياجيه وفيجوتسكي)، والبنيوية مدرسة تحليل الشعور إلى عناصر (فونت وتيتشنر). ← 5.1<\/li><li><b>ما منطقة النمو القريبة؟<\/b> المسافة بين ما يستطيعه المتعلم وحده وما يستطيعه بمساعدة (فيجوتسكي). ← 5.2<\/li><li><b>ما التقييم الدينامي؟<\/b> اختبار ← تدخل ← إعادة اختبار لقياس قابلية التعلم (فويرشتاين). ← 5.3<\/li><li><b>ما أبعاد مسح بيئة التعلم البنائية؟<\/b> الصلة الشخصية، عدم اليقين، الصوت الناقد، المشاركة في التحكم، تفاوض الطلاب. ← 5.4<\/li><li><b>ما نقد كيرشنر وزملائه للبنائية؟<\/b> التعليم قليل التوجيه أقل فاعلية للمبتدئين بسبب حدود الذاكرة العاملة والحمل المعرفي. ← 5.5<\/li><li><b>ما موقفك من البنائية في القياس؟<\/b> تكاملي: تحدد «ماذا» نقيس، والقياس الموضوعي يحدد «كيف» نقيسه بعدالة. ← 5.5<\/li><\/ul>"}, {"title": "14.5 بحثا «الأداء التفاضلي لنوع الطالب على مقياس الاتزان الانفعالي» و«المرغوبية الاجتماعية وعلاقتها بالذكاء العاطفي» (الجزء السابع)", "en": "", "html": "<ul><li><b>كم عدد مفردات مقياس الاتزان الانفعالي قبل الحذف وبعده؟<\/b> 19 ← 16.<\/li><li><b>ما المفردات المتحيزة ولصالح من؟<\/b> 10 و12 للذكور، و16 للإناث.<\/li><li><b>ما قيم الثبات في بحث «الأداء التفاضلي لنوع الطالب على مقياس الاتزان الانفعالي»؟<\/b> ثبات الأفراد 0.89 (فصل 2.91)، والمفردات 0.98 (فصل 7.07).<\/li><li><b>كيف تحقق البحث من أحادية البعد؟<\/b> تحليل عاملي استكشافي: مؤشر كايزر–ماير–أولكن = 0.934، جذر أول 6.705 (35.29%)، نسبة الجذرين 5.07.<div class=\"en\" dir=\"ltr\">KMO<\/div><\/li><li><b>ما قيمة ارتباط المرغوبية بالذكاء العاطفي؟<\/b> r = 0.427 دال عند 0.01 لدى 755 طالبًا.<\/li><li><b>كم عبارة بقيت في قائمة باولهس المتوازنة للاستجابة المرغوبة اجتماعيًا العربي؟<\/b> 26 (12 خداع ذات + 14 إدارة انطباع) من 40.<div class=\"en\" dir=\"ltr\">BIDR<\/div><\/li><li><b>ما أهم ملاحظة نقدية على بحث «المرغوبية الاجتماعية وعلاقتها بالذكاء العاطفي»؟<\/b> انخفاض مؤشر المطابقة المقارن (0.688) ومؤشر توكر–لويس (0.659) عن المحكات، وعدم حسم «التلوث أم الجوهر».<div class=\"en\" dir=\"ltr\">CFI · TLI<\/div><\/li><li><b>ما أهم ملاحظة نقدية على بحث «الأداء التفاضلي لنوع الطالب على مقياس الاتزان الانفعالي»؟<\/b> غياب حجم أثر الأداء التفاضلي وتصحيح تعدد الاختبارات، وعدم ذكر عدد الذكور والإناث.<\/li><\/ul>"}, {"title": "14.6 المعادلات (الجزء العاشر)", "en": "", "html": "<ul><li><b>احسب الدرجة التائية لطالب درجته 160 في مقياس متوسطه 146.5 وانحرافه 15.95.<\/b> z = 0.846 ← T = 58.5.<\/li><li><b>احسب الخطأ المعياري للقياس إذا كان الانحراف 15.95 والثبات 0.86.<\/b> 5.97.<\/li><li><b>ما معادلة سبيرمان–براون وقيمتها إذا كان ارتباط النصفين 0.70؟<\/b> 2r/(1+r) = 0.824.<\/li><li><b>ما تصنيف هيئة خدمات الاختبارات التربوية لدلتا مانتل–هانزل = −1.10؟<\/b> فئة B (متوسط).<div class=\"en\" dir=\"ltr\">ETS<\/div><\/li><\/ul>"}]}, "apx": {"key": "apx", "no": null, "title": "ملاحق عملية جاهزة", "en": "Practical Appendices", "sections": [{"title": "ملاحق عملية جاهزة", "en": "", "html": "<aside class=\"box note\"><div class=\"bt\">ملاحظة: استخدام الملاحق<\/div><p>نماذج قابلة للنسخ والتعديل لأي مقياس تبنيه. البيانات بين القوسين المعقوفين […] تُستبدل ببيانات مقياسك.<\/p><\/aside>"}, {"title": "الملحق (1): خطاب تحكيم المقياس", "en": "", "html": "<p>Letter to Expert Judges<\/p><p>السيد الأستاذ الدكتور / المحترم<\/p><p>تحية طيبة وبعد،<\/p><p>يقوم الباحث [الاسم] بإعداد دراسة بعنوان «[عنوان الدراسة]» تحت إشراف أ.د.، ويتطلب ذلك بناء مقياس [اسم السمة] لدى [الفئة].<\/p><p>ويقصد الباحث بـ [السمة]: [التعريف الإجرائي]، وتتكون من الأبعاد التالية: [الأبعاد وتعريف كل بعد].<\/p><p>ونظرًا لما تتمتعون به من خبرة علمية، يرجو الباحث التكرم بالحكم على عبارات المقياس من حيث: (1) انتماء العبارة للبعد، (2) أهميتها لقياس السمة، (3) وضوح صياغتها ومناسبتها للفئة، (4) مناسبة بدائل الاستجابة، مع اقتراح ما ترونه من تعديل أو حذف أو إضافة.<\/p><p>وتفضلوا بقبول وافر الاحترام والتقدير.<\/p><p>الباحث: [الاسم] — التاريخ:<\/p>"}, {"title": "الملحق (2): استمارة التحكيم", "en": "", "html": "<p>Expert Judgment Form<\/p><div class=\"tw\"><table><tr><th><div class=\"cp\"><b>#<\/b><\/div><\/th><th><div class=\"cp\"><b>العبارة<\/b><\/div><\/th><th><div class=\"cp\"><b>البعد<\/b><\/div><\/th><th><div class=\"cp\"><b>أساسية<\/b><\/div><\/th><th><div class=\"cp\"><b>مفيدة غير أساسية<\/b><\/div><\/th><th><div class=\"cp\"><b>غير ضرورية<\/b><\/div><\/th><th><div class=\"cp\"><b>الصياغة واضحة؟ (نعم/لا)<\/b><\/div><\/th><th><div class=\"cp\"><b>التعديل المقترح<\/b><\/div><\/th><\/tr><tr><td><div class=\"cp\">1<\/div><\/td><td><div class=\"cp\">[…]<\/div><\/td><td><div class=\"cp\">[…]<\/div><\/td><td><div class=\"cp\">☐<\/div><\/td><td><div class=\"cp\">☐<\/div><\/td><td><div class=\"cp\">☐<\/div><\/td><td><div class=\"cp\">☐<\/div><\/td><td><\/td><\/tr><tr><td><div class=\"cp\">2<\/div><\/td><td><div class=\"cp\">[…]<\/div><\/td><td><div class=\"cp\">[…]<\/div><\/td><td><div class=\"cp\">☐<\/div><\/td><td><div class=\"cp\">☐<\/div><\/td><td><div class=\"cp\">☐<\/div><\/td><td><div class=\"cp\">☐<\/div><\/td><td><\/td><\/tr><tr><td><div class=\"cp\">3<\/div><\/td><td><div class=\"cp\">[…]<\/div><\/td><td><div class=\"cp\">[…]<\/div><\/td><td><div class=\"cp\">☐<\/div><\/td><td><div class=\"cp\">☐<\/div><\/td><td><div class=\"cp\">☐<\/div><\/td><td><div class=\"cp\">☐<\/div><\/td><td><\/td><\/tr><\/table><\/div><ul><li><b>بيانات المحكم:<\/b> الاسم، الدرجة العلمية، التخصص، الجامعة.<\/li><li><b>طريقة الحساب:<\/b> نسبة صدق المحتوى لكل عبارة من عمود «أساسية» (لوشي)، أو مؤشر صدق المحتوى للمفردة بتدريج رباعي للصلة (لين)، ثم مؤشر صدق المحتوى للمقياس (انظر 10.9).<div class=\"en\" dir=\"ltr\">CVR · I-CVI · CVI<\/div><\/li><li><b>بديل الثلاثة بدائل في بحث «الأداء التفاضلي لنوع الطالب على مقياس الاتزان الانفعالي»:<\/b> «صالحة بدرجة كبيرة / متوسطة / ضعيفة» مع خلية للتعديلات (ص 377 من البحث).<\/li><\/ul>"}, {"title": "الملحق (3): صفحة بيانات المستجيب وتعليمات المقياس", "en": "", "html": "<p>Instructions Page<\/p><p><b>عزيزي الطالب / عزيزتي الطالبة:<\/b><\/p><p>بين يديك مجموعة من العبارات التي تصف بعض المواقف والمشاعر. اقرأ كل عبارة بعناية، ثم ضع علامة (✓) تحت البديل الذي ينطبق عليك فعلًا.<\/p><ul><li><b>لا توجد إجابات صحيحة وأخرى خاطئة<\/b>؛ فأفضل إجابة هي التي تعبّر عنك بصدق.<\/li><li>أجب عن جميع العبارات، واختر بديلًا واحدًا فقط لكل عبارة.<\/li><li><b>إجاباتك سرية تمامًا<\/b> ولن تُستخدم إلا لأغراض البحث العلمي، ولا داعي لكتابة اسمك.<\/li><li>لا يوجد وقت محدد، لكن لا تطل التفكير في العبارة الواحدة.<\/li><\/ul><p><b>بيانات أولية:<\/b> النوع ☐ ذكر ☐ أنثى — الفرقة — التخصص ☐ علمي ☐ أدبي — العمر<\/p><p><b>مثال محلول:<\/b><\/p><div class=\"tw\"><table><tr><th><div class=\"cp\"><b>العبارة<\/b><\/div><\/th><th><div class=\"c
